id: type-hints
order: 26
title: Type hints
summary: Write down what a function takes and gives back, so people and tools can read it at once.
minutes: 30
outcomes: [A3, A8]

objectives:
  - id: O1
    text: Read and write type hints for parameters and for the value a function gives back
  - id: O2
    text: Write hints for lists, dictionaries and values that can be None
  - id: O3
    text: Explain that Python does not check hints when it runs, and use them to find a mistake

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: hints
    type: theory
    objective: O1
    title: A note on each value
    body: |
      What does this function take, and what does it give back?

      ```python
      def price_with_tax(price, tax=0.2):
          return price * (1 + tax)
      ```

      With **type hints**, the first line says it:

      ```python
      def price_with_tax(price: float, tax: float = 0.2) -> float:
          return price * (1 + tax)
      ```

      - `price: float`: the parameter `price` should be a float.
      - `tax: float = 0.2`: a hint and a default value.
      - `-> float`: the function gives back a float.
      - `-> None`: the function gives back nothing (it only prints, for
        example).

      A variable can have a hint too: `count: int = 0`.

      ## Notes, not rules

      Python **does not check** hints when the program runs. They are notes
      for people, and for tools: an editor like VS Code reads them, shows
      them when you type a call, and underlines a call that does not fit.
      The docs of most libraries show hints, so you will read them every
      day.
    keys:
      - code: "def area(w: float, h: float) -> float:"
        means: "Two floats in, one float back."
      - code: "def show(text: str) -> None:"
        means: "Takes text, gives back nothing."
      - code: "count: int = 0"
        means: "A variable with a hint."

  # 2. PREDICT ---------------------------------------------------------------
  - id: predict-unchecked
    type: predict
    objective: O3
    title: A hint that does not fit
    item:
      kind: predict
      id: p-unchecked
      prompt: "The hint says `int`, but the call gives text. **What does this program print?**"
      code: |
        def double(n: int) -> int:
            return n * 2

        print(double("ab"))
      explain: >-
        Python does not check hints when it runs. `"ab" * 2` is fine for
        Python: it repeats the text. An editor would underline the call,
        because the hint says `int`.
      misconceptions:
        - answer: "TypeError"
          say: "There is no error. Python ignores the hint when it runs, and `\"ab\" * 2` is valid code."
        - answer: "4"
          say: "The value is the text `\"ab\"`, not a number. The hint does not change the value."

  # 3. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O1
    title: Hints in a real function
    visual: output
    intro: |
      Press **Run**. Then try the changes below, and see what the hints
      change in the run: nothing.
    code: |
      def price_with_tax(price: float, tax: float = 0.2) -> float:
          return price * (1 + tax)

      def show(label: str, amount: float) -> None:
          print(f"{label}: {amount:.2f}")

      show("Tea", price_with_tax(2.5))
      show("Cake", price_with_tax(4, tax=0.1))
    experiments:
      - text: "Run it as it is."
        expr: "err is None and 'Tea: 3.00' in lines"
      - text: "At the end, add `print(price_with_tax.__annotations__)`: the hints, as Python keeps them."
        expr: "err is None and 'return' in out and 'float' in out"
      - text: "Change the hint of `price` to `str`. Does the program run differently?"
        expr: "err is None and getattr(ns.get('price_with_tax'), '__annotations__', {}).get('price') is str"
      - text: "Add the call `show(\"Milk\", price_with_tax(\"1.5\"))`. Which line stops: the `def`, or the multiplication?"
        expr: "err == 'TypeError'"
    investigate:
      - kind: spot
        id: i-gives-text
        prompt: "Which function promises to give back text (a `str`)?"
        code: |
          def count_words(text: str) -> int:
              return len(text.split())

          def shout(text: str) -> str:
              return text.upper() + "!"

          def is_long(text: str) -> bool:
              return count_words(text) > 10
        line: 4
        wrong:
          - line: 1
            say: "This function takes text, but look after the `->`: it gives back an `int`."
          - line: 7
            say: "After the `->` stands `bool`: it gives back `True` or `False`."
        explain: >-
          The hint after `->` is the value that comes back. All three
          functions take text; only `shout` gives text back.
      - kind: mcq
        id: i-wrong-type
        prompt: "`price_with_tax(\"1.5\")` stops with a `TypeError`. What stops the program?"
        options:
          - text: "The multiplication `price * (1 + tax)`: Python cannot multiply text by a float"
            correct: true
            why: "The hint is never checked. The error comes later, from the operation that does not work on text."
          - text: "The hint `price: float`, because the value is text"
            why: "Python does not check hints when it runs. The line with the `def` is fine."
          - text: "The call of `show` at the end of the file"
            why: "`show` is never reached: `price_with_tax` stops first."

  # 4. THEORY ----------------------------------------------------------------
  - id: collections
    type: theory
    objective: O2
    title: Lists, dictionaries and None
    body: |
      ## What is inside

      ```python
      def average(scores: list[int]) -> float:
          return sum(scores) / len(scores)

      def report(prices: dict[str, float]) -> None:
          for name, price in prices.items():
              print(name, price)
      ```

      - `list[int]`: a list of ints.
      - `dict[str, float]`: a dictionary with text keys and float values.
      - `tuple[int, int]`: a tuple of two ints, like `(3, 4)`.

      ## A value or None

      Some functions give back a value, or `None` when there is nothing:

      ```python
      def find(names: list[str], start: str) -> str | None:
          for name in names:
              if name.startswith(start):
                  return name
          return None
      ```

      `str | None` means: text, **or** `None`. The bar `|` is "or". This
      hint warns everyone who calls `find`: check for `None` before you
      use the result as text.
    keys:
      - code: "list[str]"
        means: "A list of texts."
      - code: "dict[str, int]"
        means: "Text keys, int values."
      - code: "-> str | None"
        means: "Gives back text, or `None`."

  # 5. DRILL -----------------------------------------------------------------
  - id: pick
    type: drill
    objective: O2
    title: Pick the hint
    items:
      - kind: mcq
        id: d-none
        objective: O1
        prompt: "`greet(name)` prints a greeting and gives back nothing. Which first line fits?"
        options:
          - text: "`def greet(name: str) -> None:`"
            correct: true
            why: "A function that only prints gives back `None`."
          - text: "`def greet(name: str) -> str:`"
            why: "That promises to give back text. `greet` only prints."
          - text: "`def greet(name) -> print:`"
            why: "`print` is a function, not a type."
      - kind: mcq
        id: d-list
        objective: O2
        prompt: "`mean(values)` gets a list of floats and gives back one float. Which first line fits?"
        options:
          - text: "`def mean(values: list[float]) -> float:`"
            correct: true
            why: "The parameter is a list of floats, the result is one float."
          - text: "`def mean(values: float) -> list[float]:`"
            why: "This is the wrong way around: one float in, a list out."
          - text: "`def mean(values: list) -> list:`"
            why: "The result is one number, not a list."
      - kind: mcq
        id: d-optional
        objective: O2
        prompt: "`lookup(book, name)` gets a dictionary from names to phone numbers (text). It gives back the number, or `None` when the name is not there. Which hint fits the result?"
        options:
          - text: "`-> str | None`"
            correct: true
            why: "Text, or `None`: the bar means \"or\"."
          - text: "`-> str`"
            why: "Then the reader does not know that `None` can come back."
          - text: "`-> dict[str, str]`"
            why: "That is the type of `book`, not of the result."

  # 6. WORKED ----------------------------------------------------------------
  - id: worked
    type: worked
    objective: O2
    title: A price that may not exist
    problem: |
      Write `find_price` with hints: it takes a dictionary of prices and a
      product name, and gives back the price, or `None` for an unknown
      product. Then use it safely.
    lines:
      - goal: Say what goes in and out
        code: "def find_price(prices: dict[str, float], name: str) -> float | None:"
        note: "Names to floats, and one name. The result is a float, or `None`."
      - goal: Compute
        code: "    if name in prices:"
        note: "First check that the key exists."
      - code: "        return prices[name]"
        note: "A float, as the hint promises."
      - code: "    return None"
        note: "The other half of the promise: `None` for an unknown name."
      - goal: Use the result safely
        code: "price = find_price({\"tea\": 2.5}, \"cake\")"
        note: "There is no cake, so `price` is `None`."
      - code: "if price is None:"
        note: "The hint `| None` told us to check this first."
      - code: "    print(\"Unknown product\")"
        note: "Without the check, `price * 2` would stop with a `TypeError`."
    check:
      kind: mcq
      id: w-why-none
      prompt: "What does `-> float | None` tell the person who calls `find_price`?"
      options:
        - text: "The result can be `None`, so check it before you compute with it"
          correct: true
          why: "That is the point of the hint: it shows the case that is easy to forget."
        - text: "Python stops the program if the result is not a float"
          why: "Python does not check hints when it runs."
        - text: "The function always gives back a float"
          why: "The `| None` says that it can also give back `None`."

  # 7. EXERCISE: completion --------------------------------------------------
  - id: ex-annotate
    type: exercise
    fade: completion
    objective: O1
    title: Add the hints
    prompt: |
      The functions work, but their hints are missing. **Replace each
      `___` with the right type.** Read what each function does with its
      values.

      - `full_name` joins two texts.
      - `average` gets a list of ints and divides.
      - `initials` gets a list of names and gives back one text.
    starter: |
      def full_name(first: ___, last: ___) -> ___:
          return first + " " + last

      def average(numbers: ___) -> ___:
          return sum(numbers) / len(numbers)

      def initials(names: list[str]) -> ___:
          result = ""
          for name in names:
              result = result + name[0]
          return result

      print(full_name("Ada", "Lovelace"))
      print(average([2, 4, 9]))
      print(initials(["Ada", "Ben"]))
    solution: |
      def full_name(first: str, last: str) -> str:
          return first + " " + last

      def average(numbers: list[int]) -> float:
          return sum(numbers) / len(numbers)

      def initials(names: list[str]) -> str:
          result = ""
          for name in names:
              result = result + name[0]
          return result

      print(full_name("Ada", "Lovelace"))
      print(average([2, 4, 9]))
      print(initials(["Ada", "Ben"]))
    after: >-
      `average` gives back a float even for a list of ints: `/` always
      makes a float. Hints make you think about such details, and the next
      reader does not have to guess.
    checks:
      - expr: "callable(ns.get('full_name')) and raises(lambda: full_name.__annotations__) is None and full_name.__annotations__ == {'first': str, 'last': str, 'return': str}"
        pass: "`full_name`: two texts in, one text out"
        hint: "Text is `str`, three times."
      - expr: "callable(ns.get('average')) and raises(lambda: average.__annotations__) is None and average.__annotations__.get('numbers') in (list[int], list[float]) and average.__annotations__.get('return') is float"
        pass: "`average`: a list of ints in, a float out"
        hint: "`numbers: list[int]`, and `/` gives a float: `-> float`."
        misconceptions:
          - when: "callable(ns.get('average')) and raises(lambda: average.__annotations__) is None and average.__annotations__.get('return') is int"
            say: "`/` always gives a float, also for `6 / 3` (it is `2.0`). Write `-> float`."
          - when: "callable(ns.get('average')) and raises(lambda: average.__annotations__) is None and average.__annotations__.get('numbers') is int"
            say: "`numbers` is a whole list of ints, not one int: `list[int]`."
      - expr: "callable(ns.get('initials')) and raises(lambda: initials.__annotations__) is None and initials.__annotations__.get('return') is str"
        pass: "`initials` gives back one text"
        hint: "`result` is text that grows. `-> str`."
        misconceptions:
          - when: "callable(ns.get('initials')) and raises(lambda: initials.__annotations__) is None and initials.__annotations__.get('return') == list[str]"
            say: "The names come in as a list, but the result is one text, like `\"AB\"`: `-> str`."
      - expr: "err is None and lines == ['Ada Lovelace', '5.0', 'AB']"
        pass: "The program still prints the same three lines"
        hint: "Change only the hints."
    hints:
      - "Look at the values: `\"Ada\"` is a `str`, `[2, 4, 9]` is a `list[int]`."
      - "`/` always gives a float, so `average` gives back a `float`."
      - "`initials` builds one text, so its result is a `str`."

  # 8. EXERCISE: debug -------------------------------------------------------
  - id: ex-promise
    type: exercise
    fade: debug
    objective: O3
    title: A broken promise
    prompt: |
      The hint says that `parse_age` gives back an `int`. The program
      should print `43`. **Run it**, read the message, and make the
      function keep its promise. Do not change the hints.
    starter: |
      def parse_age(text: str) -> int:
          return text.strip()

      age = parse_age(" 42 ")
      print(age + 1)
    solution: |
      def parse_age(text: str) -> int:
          return int(text.strip())

      age = parse_age(" 42 ")
      print(age + 1)
    after: >-
      Python did not check the hint, so the mistake showed only at
      `age + 1`, one line later. An editor that reads hints would have
      underlined `return text.strip()` at once: `strip()` gives a `str`,
      and the hint promises an `int`.
    checks:
      - expr: "callable(ns.get('parse_age')) and raises(parse_age, ' 7 ') is None and parse_age(' 7 ') == 7 and type(parse_age('3')) is int"
        pass: "`parse_age` gives back an int, as its hint says"
        hint: "Turn the text into a number: `int(text.strip())`."
        misconceptions:
          - when: "callable(ns.get('parse_age')) and raises(parse_age, ' 7 ') is None and parse_age(' 7 ') == '7'"
            say: "`text.strip()` is still text: `'42'`, not `42`. The hint promises an `int`, so give back `int(text.strip())`."
      - expr: "callable(ns.get('parse_age')) and parse_age.__annotations__ == {'text': str, 'return': int}"
        pass: "The hints are as before"
        hint: "Keep `def parse_age(text: str) -> int:`."
      - expr: "err is None and lines == ['43']"
        pass: "It prints `43`"
        hint: "Keep the last two lines as they are."
        misconceptions:
          - when: "err == 'TypeError'"
            say: "`age` is the text `'42'`, and Python cannot add `1` to text. Make `parse_age` give back an `int`."
    hints:
      - "The message is about `age + 1`. What type is `age`?"
      - "`text.strip()` removes the spaces, but the result is still text."
      - "`return int(text.strip())`."

  # 9. EXERCISE: independent -------------------------------------------------
  - id: ex-best
    type: exercise
    fade: independent
    objective: O2
    title: The best player
    prompt: |
      **Write `best_player`, with hints.** It gets a dictionary from names
      to scores (`dict[str, int]`) and gives back the name with the highest
      score, or `None` for an empty dictionary. So its result is
      `str | None`.

      The lines at the end must print:

      ```
      Ben
      None
      ```
    starter: |
      # Write best_player here, with hints.


      print(best_player({"Ana": 7, "Ben": 9, "Cleo": 4}))
      print(best_player({}))
    solution: |
      def best_player(scores: dict[str, int]) -> str | None:
          best = None
          for name, score in scores.items():
              if best is None or score > scores[best]:
                  best = name
          return best


      print(best_player({"Ana": 7, "Ben": 9, "Cleo": 4}))
      print(best_player({}))
    after: >-
      The hint `str | None` is honest: an empty dictionary has no best
      player. Anyone who calls `best_player` now knows to check the result.
    checks:
      - expr: "callable(ns.get('best_player')) and raises(lambda: best_player.__annotations__) is None and best_player.__annotations__.get('scores') == dict[str, int]"
        pass: "The parameter has the hint `dict[str, int]`"
        hint: "`def best_player(scores: dict[str, int]) -> ...:`."
      - expr: "callable(ns.get('best_player')) and raises(lambda: best_player.__annotations__) is None and best_player.__annotations__.get('return') == (str | None)"
        pass: "The result has the hint `str | None`"
        hint: "After the `->`: `str | None`."
        misconceptions:
          - when: "callable(ns.get('best_player')) and raises(lambda: best_player.__annotations__) is None and best_player.__annotations__.get('return') is str"
            say: "For an empty dictionary, the result is `None`. The hint must say so: `-> str | None`."
      - expr: "callable(ns.get('best_player')) and raises(best_player, {'x': 1}) is None and best_player({'a': 1, 'b': 5, 'c': 3}) == 'b' and best_player({'z': 2}) == 'z' and best_player({'a': -4, 'b': -1}) == 'b' and best_player({}) is None"
        pass: "It finds the name with the highest score, and gives `None` for an empty dictionary"
        hint: "Keep the best name so far, starting with `best = None`. Compare each score with `scores[best]`."
        misconceptions:
          - when: "callable(ns.get('best_player')) and raises(best_player, {}) == 'ValueError'"
            say: "`max` of an empty collection raises `ValueError`. Check for an empty dictionary first, or use a loop that starts with `best = None`."
          - when: "callable(ns.get('best_player')) and raises(best_player, {'a': 1, 'b': 5}) is None and best_player({'a': 1, 'b': 5}) == 5"
            say: "That is the highest score. Give back the name of the player instead."
          - when: "callable(ns.get('best_player')) and raises(best_player, {'a': -4, 'b': -1}) is None and best_player({'a': -4, 'b': -1}) is None"
            say: "With only negative scores, there is still a best player. Do not start with a score of 0: start with `best = None`."
      - expr: "err is None and lines == ['Ben', 'None']"
        pass: "It prints `Ben` and `None`"
        hint: "Keep the two lines at the end."
    hints:
      - "Start with `def best_player(scores: dict[str, int]) -> str | None:`."
      - "`best = None`, then a loop over `scores.items()`."
      - "In the loop: `if best is None or score > scores[best]: best = name`. After the loop, `return best`."

  # 10. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O3
    title: Check yourself
    items:
      - kind: mcq
        id: q-arrow
        objective: O1
        prompt: "In `def size(path: str) -> int:`, what does `-> int` say?"
        options:
          - text: "The function gives back an int"
            correct: true
            why: "The hint after the arrow is the type of the result."
          - text: "`path` must be turned into an int"
            why: "`path: str` is the hint of the parameter. The arrow is about the result."
          - text: "The function can only be called with an int"
            why: "The parameter `path` has the hint `str`."
      - kind: mcq
        id: q-run
        objective: O3
        prompt: "A call gives a value of the wrong type for a hint. What does Python do when it runs?"
        options:
          - text: "Nothing special: it runs the code as if there were no hint"
            correct: true
            why: "Hints are not checked at run time. An editor or a tool can check them before."
          - text: "It stops with a `TypeError` at the call"
            why: "Only an operation that does not work on the value raises an error, maybe much later."
          - text: "It turns the value into the right type"
            why: "Python never changes a value because of a hint."
      - kind: mcq
        id: q-dict
        objective: O2
        prompt: "Which hint fits `{\"tea\": 2.5, \"cake\": 4.0}`?"
        options:
          - text: "`dict[str, float]`"
            correct: true
            why: "The keys are texts, the values are floats."
          - text: "`dict[float, str]`"
            why: "The first type is the keys, the second the values."
          - text: "`list[str, float]`"
            why: "It is a dictionary, not a list."
      - kind: mcq
        id: q-none
        objective: O2
        prompt: "Why write `-> int | None` and not only `-> int`?"
        options:
          - text: "It can also give back `None`"
            correct: true
            why: "And the caller must know it. A hint that hides `None` leads to a `TypeError` later, when the result is used as a number."
          - text: "`None` is a kind of int"
            why: "`None` is its own type. The bar `|` means \"or\"."
          - text: "It makes the function faster"
            why: "Hints do not change how fast the code runs."
      - kind: mcq
        id: q-who
        objective: O3
        prompt: "Who uses type hints?"
        options:
          - text: "People, the editor, and the docs"
            correct: true
            why: "People who read the code, the editor, and the docs of a library: hints are notes for all of them. Python itself ignores them when it runs."
          - text: "Only Python, to make the program safe"
            why: "Python does not check hints when it runs."
          - text: "Nobody: they are old and not used today"
            why: "Most modern libraries, also for AI, use hints everywhere."

  # 11. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O3
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-read
    objective: O1
    prompt: "What does `def area(w: float, h: float) -> float:` say?"
    options:
      - text: "Two floats in, one float back"
        correct: true
        why: "The hints after the colons are the parameters, the hint after the arrow is the result."
      - text: "Three floats in"
        why: "There are two parameters. The arrow is about the result."
      - text: "`area` only works with floats"
        why: "Python does not check hints. It is a note."
  - kind: predict
    id: r-ignored
    objective: O3
    code: |
      def half(n: int) -> int:
          return n / 2

      print(half(5))
    explain: >-
      The hint says `int`, but `/` gives a float: `2.5`. Python does not
      check hints when it runs. An editor would point at the broken
      promise.
  - kind: mcq
    id: r-optional
    objective: O2
    prompt: "What does `str | None` mean?"
    options:
      - text: "Text, or `None`"
        correct: true
        why: "The bar `|` means \"or\"."
      - text: "Text that is never empty"
        why: "It says that the value can be `None`, not something about the text."
      - text: "A list of texts"
        why: "A list of texts is `list[str]`."
  - kind: mcq
    id: r-list-hint
    objective: O2
    prompt: "Which hint is a list of ints?"
    options:
      - text: "`list[int]`"
        correct: true
        why: "The type inside the square brackets is the type of the items."
      - text: "`int[list]`"
        why: "The container comes first: `list`, then what is inside."
      - text: "`[int]`"
        why: "That is a list with the type `int` in it, not a hint."
  - kind: mcq
    id: r-none-result
    objective: O1
    prompt: "Which hint fits a function that only prints?"
    options:
      - text: "`-> None`"
        correct: true
        why: "It gives back nothing, and nothing is `None`."
      - text: "`-> print`"
        why: "`print` is a function, not a type."
      - text: "`-> str`"
        why: "Printing text is not the same as giving it back."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-hints-average
    type: exercise
    fade: completion
    objective: O2
    title: Hints for an average
    prompt: |
      **Replace the two `___`** with type hints: the function takes a list
      of floats, and gives back a float, or `None` for an empty list.
    starter: |
      def average(numbers: ___) -> ___:
          if not numbers:
              return None
          return sum(numbers) / len(numbers)


      print(average([2.5, 3.5]))
      print(average([]))
    solution: |
      def average(numbers: list[float]) -> float | None:
          if not numbers:
              return None
          return sum(numbers) / len(numbers)


      print(average([2.5, 3.5]))
      print(average([]))
    after: >-
