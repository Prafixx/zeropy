  - id: x-parse-age
    type: exercise
    fade: debug
    objective: O3
    title: A promise the function does not keep
    prompt: |
      The hint says `parse_age` gives back an `int`, but the program stops
      with a `TypeError`. Python does not check hints: **make the function
      keep its promise.**

      ```text
      42
      ```
    starter: |
      def parse_age(text: str) -> int:
          return text.strip()


      print(parse_age(" 41 ") + 1)
    solution: |
      def parse_age(text: str) -> int:
          return int(text.strip())


      print(parse_age(" 41 ") + 1)
    after: >-
      The hint was right, the body was wrong. Hints tell you what to
      expect; a mismatch between hint and body is often the bug.
    checks:
      - expr: "callable(ns.get('parse_age')) and parse_age(' 7 ') == 7 and isinstance(parse_age('30'), int)"
        pass: "parse_age gives back an int"
        hint: "`return int(text.strip())`."
      - expr: "parse_age.__annotations__.get('return') is int"
        pass: "The hint still says int"
        hint: "Fix the body, not the hint."
      - expr: "err is None and lines == ['42']"
        pass: "It prints 42"
        hint: "Keep the last line."
    hints:
      - "What type does `text.strip()` give back?"
      - "The hint promises an `int`."
      - "`return int(text.strip())`."
