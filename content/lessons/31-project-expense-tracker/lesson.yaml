id: project-expense-tracker
order: 31
title: "Project: expense tracker"
summary: Build a tool that keeps your expenses in a file, survives bad input, and shows totals.
minutes: 60
outcomes: [A1, A6, A8]

objectives:
  - id: O1
    text: Keep the data of a program in a JSON file, and load it safely when the file is missing or broken
  - id: O2
    text: Turn what a user types into a clean value, and refuse bad values with an error
  - id: O3
    text: Compute a summary of a list of dictionaries with comprehensions
  - id: O4
    text: Connect tested functions in a command loop that saves before it ends

steps:
  # 1. USE THE FINISHED TOOL -------------------------------------------------
  - id: play
    type: demo
    visual: none
    sealed: true
    objective: O4
    title: Use the finished tool
    intro: |
      This project builds an **expense tracker**: a small tool that
      remembers what you spend. Press **Play** and type commands: `add`,
      `report` and `quit`.

      Try a wrong amount, like `ten`, and look at the file under the output
      after `quit`. The code is hidden: you will write it yourself.
    files:
      expenses.json: &start |
        [
          {"category": "food", "amount": 12.5},
          {"category": "travel", "amount": 30},
          {"category": "food", "amount": 7.25}
        ]
    code: &tool |
      import json
      from pathlib import Path

      def load_expenses(name):
          path = Path(name)
          if not path.exists():
              return []
          try:
              return json.loads(path.read_text())
          except json.JSONDecodeError:
              print(f"{name} is broken. Starting with no expenses.")
              return []

      def save_expenses(expenses, name):
          Path(name).write_text(json.dumps(expenses, indent=2))

      def parse_amount(text):
          amount = float(text.strip().replace(",", "."))
          if amount <= 0:
              raise ValueError("An amount must be more than 0.")
          return amount

      def totals(expenses):
          categories = {e["category"] for e in expenses}
          return {c: sum(e["amount"] for e in expenses if e["category"] == c) for c in categories}

      assert parse_amount("12.5") == 12.5
      assert parse_amount("7,50") == 7.5
      assert totals([{"category": "food", "amount": 2}, {"category": "food", "amount": 3}]) == {"food": 5}
      assert totals([]) == {}

      expenses = load_expenses("expenses.json")
      print(f"{len(expenses)} expenses loaded.")

      while True:
          command = input("Command (add, report, quit): ").strip().lower()
          if command == "quit":
              save_expenses(expenses, "expenses.json")
              print("Saved.")
              break
          elif command == "add":
              category = input("Category: ").strip().lower()
              try:
                  amount = parse_amount(input("Amount: "))
              except ValueError:
                  print("Not a valid amount.")
                  continue
              expenses.append({"category": category, "amount": amount})
              print(f"Added {amount:.2f} for {category}.")
          elif command == "report":
              sums = totals(expenses)
              for c in sorted(sums):
                  print(f"{c}: {sums[c]:.2f}")
              print(f"Total: {sum(sums.values()):.2f}")
          else:
              print("Unknown command.")
    experiments:
      - text: "Add an expense: type `add`, a category and an amount."
        expr: "any(l.startswith('Added ') for l in lines)"
      - text: "Type an amount that is not a number, like `ten`."
        expr: "'Not a valid amount.' in lines"
      - text: "Type `report`."
        expr: "any(l.startswith('Total: ') for l in lines)"
      - text: "Type `quit`, and look at `expenses.json` under the output."
        expr: "'Saved.' in lines"

  # 2. THE PLAN --------------------------------------------------------------
  - id: plan
    type: theory
    objective: O1
    title: Four functions and a loop
    body: |
      ## The data

      The expenses are a list of dictionaries in `expenses.json`:

      ```
      [{"category": "food", "amount": 12.5}, ...]
      ```

      ## The plan

      Each step adds one function, from the file to the user. The last step
      connects them in a loop of commands.

      Two of the functions, `parse_amount` and `totals`, only work on
      values: no file, no input. They are the easiest to test, so they get
      tests with `assert`.

      In this course each run starts with the same `expenses.json`. On your
      own computer, the file keeps your expenses from one day to the next.
    keys:
      - code: "1  load_expenses(name)"
        means: "The list from the file: `[]` if it is missing or broken."
      - code: "2  save_expenses(expenses, name)"
        means: "Writes the list as JSON."
      - code: "3  parse_amount(text)"
        means: "`\"7,50\"` becomes `7.5`. Bad text raises a `ValueError`."
      - code: "4  totals(expenses)"
        means: "A dictionary: each category and the sum of its amounts."
      - code: "5  The command loop"
        means: "`add`, `report`, `quit`. It saves before it ends."

  # 3. STEP 1 ----------------------------------------------------------------
  - id: m1-load
    type: exercise
    fade: milestone
    carry: true
    objective: O1
    title: "Step 1: load safely"
    prompt: |
      **Write `load_expenses(name)`.** It gives back the list in the JSON
      file.

      - If the file does not exist, it gives back `[]`.
      - If the file is broken (not correct JSON), it prints
        `expenses.json is broken. Starting with no expenses.` (with the
        name of the file) and gives back `[]`.

      Then load `expenses.json` and print a line like `3 expenses loaded.`
      The check runs with the file, without it, and with a broken file.
    files:
      expenses.json: *start
    starter: |
      import json
      from pathlib import Path

    solution: |
      import json
      from pathlib import Path

      def load_expenses(name):
          path = Path(name)
          if not path.exists():
              return []
          try:
              return json.loads(path.read_text())
          except json.JSONDecodeError:
              print(f"{name} is broken. Starting with no expenses.")
              return []

      expenses = load_expenses("expenses.json")
      print(f"{len(expenses)} expenses loaded.")
    after: >-
      A tool that keeps data must work on the first day (no file) and on a
      bad day (a broken file). Both are normal, so neither may stop the
      program.
    cases:
      - {}
      - label: "there is no `expenses.json` yet"
        files: {}
      - label: "`expenses.json` is broken: `[{oops`"
        files:
          expenses.json: "[{oops"
    checks:
      - &c-load
        expr: "callable(ns.get('load_expenses')) and (lambda j, t: load_expenses('expenses.json') == (j.loads(t) if raises(j.loads, t) is None else []))(__import__('json'), start_files.get('expenses.json', '[]')) and load_expenses('nothing.json') == []"
        pass: "`load_expenses` gives the list, or `[]` for a missing or broken file"
        hint: "Check `exists()` first. Then `try:` `json.loads(...)` and `except json.JSONDecodeError:`."
        misconceptions:
          - when: "err == 'FileNotFoundError' or (callable(ns.get('load_expenses')) and raises(load_expenses, 'nothing.json') == 'FileNotFoundError')"
            say: "Without the file, `read_text` fails. Check `path.exists()` first and return `[]`."
          - when: "err == 'JSONDecodeError'"
            say: "A broken file stops the program. Put `json.loads` inside `try` and catch `json.JSONDecodeError`."
      - expr: "err is None and lines[-1:] == [f\"{len(load_expenses('expenses.json'))} expenses loaded.\"]"
        pass: "It prints how many expenses were loaded"
        hint: "`print(f\"{len(expenses)} expenses loaded.\")`."
      - expr: "(lambda j, t: raises(j.loads, t) is None or 'expenses.json is broken. Starting with no expenses.' in lines)(__import__('json'), start_files.get('expenses.json', '[]'))"
        pass: "A broken file gives a clear message"
        hint: "In the except block: `print(f\"{name} is broken. Starting with no expenses.\")`."
    hints:
      - "`if not path.exists(): return []`."
      - "`try: return json.loads(path.read_text())`."
      - "`except json.JSONDecodeError:` print the message and `return []`."

  # 4. STEP 2 ----------------------------------------------------------------
  - id: m2-save
    type: exercise
    fade: milestone
    carry: true
    objective: O1
    title: "Step 2: save"
    prompt: |
      **Write `save_expenses(expenses, name)`.** It writes the list to the
      file as JSON, with `indent=2` so people can read it.

      The check saves a list and loads it again with your `load_expenses`:
      it must be the same list.
    files:
      expenses.json: *start
    solution: |
      import json
      from pathlib import Path

      def load_expenses(name):
          path = Path(name)
          if not path.exists():
              return []
          try:
              return json.loads(path.read_text())
          except json.JSONDecodeError:
              print(f"{name} is broken. Starting with no expenses.")
              return []

      def save_expenses(expenses, name):
          Path(name).write_text(json.dumps(expenses, indent=2))

      expenses = load_expenses("expenses.json")
      print(f"{len(expenses)} expenses loaded.")
    after: >-
      Save and load are a pair. The check does what a good test does: one
      round trip, and the data must come back the same.
    checks:
      - *c-load
      - &c-save
        expr: "callable(ns.get('save_expenses')) and (lambda d: (save_expenses(d, 'check.json') or True) and load_expenses('check.json') == d and '\\n' in open('check.json').read().strip())([{'category': 'food', 'amount': 3.5}, {'category': 'books', 'amount': 20}])"
        pass: "Saved expenses load again the same, and the file is easy to read"
        hint: "`Path(name).write_text(json.dumps(expenses, indent=2))`."
        misconceptions:
          - when: "callable(ns.get('save_expenses')) and (lambda d: (save_expenses(d, 'check.json') or True) and open('check.json').read().startswith(\"[{'\"))([{'a': 1}])"
            say: "The file holds Python text from `str()`. Use `json.dumps`."
    hints:
      - "`json.dumps(expenses, indent=2)` makes the text."
      - "`Path(name).write_text(...)` writes it."
      - "The function is one line inside: `Path(name).write_text(json.dumps(expenses, indent=2))`."

  # 5. STEP 3 ----------------------------------------------------------------
  - id: m3-parse
    type: exercise
    fade: milestone
    carry: true
    objective: O2
    title: "Step 3: a clean amount"
    prompt: |
      People type amounts in many ways: `12.5`, ` 3 `, and in many
      countries `7,50` with a comma. **Write `parse_amount(text)`.**

      - It gives back the amount as a float. A comma counts as the decimal
        point: `parse_amount("7,50")` is `7.5`.
      - It raises a `ValueError` for a text that is not a number, and for
        an amount of 0 or less.

      Add at least two tests with `assert`.
    files:
      expenses.json: *start
    solution: |
      import json
      from pathlib import Path

      def load_expenses(name):
          path = Path(name)
          if not path.exists():
              return []
          try:
              return json.loads(path.read_text())
          except json.JSONDecodeError:
              print(f"{name} is broken. Starting with no expenses.")
              return []

      def save_expenses(expenses, name):
          Path(name).write_text(json.dumps(expenses, indent=2))

      def parse_amount(text):
          amount = float(text.strip().replace(",", "."))
          if amount <= 0:
              raise ValueError("An amount must be more than 0.")
          return amount

      assert parse_amount("12.5") == 12.5
      assert parse_amount("7,50") == 7.5

      expenses = load_expenses("expenses.json")
      print(f"{len(expenses)} expenses loaded.")
    after: >-
      `parse_amount` does not print and does not ask: it only turns a text
      into a value, or refuses it. That is why two `assert` lines can test
      it fully.
    checks:
      - *c-load
      - *c-save
      - &c-parse
        expr: "callable(ns.get('parse_amount')) and parse_amount('12.5') == 12.5 and parse_amount(' 3 ') == 3.0 and parse_amount('7,50') == 7.5 and all(raises(parse_amount, t) == 'ValueError' for t in ['ten', '', '0', '-4', '1,2,3'])"
        pass: "`parse_amount` gives clean amounts, and raises a `ValueError` for bad ones"
        hint: "Replace `,` with `.`, then `float()`. Then raise a `ValueError` if the amount is 0 or less."
        misconceptions:
          - when: "callable(ns.get('parse_amount')) and raises(parse_amount, '7,50') == 'ValueError'"
            say: "`7,50` must work: replace the comma with a point before `float`: `text.replace(\",\", \".\")`."
          - when: "callable(ns.get('parse_amount')) and raises(parse_amount, '0') is None"
            say: "An amount of 0 or less must raise an error. Add `if amount <= 0: raise ValueError(...)`."
          - when: "callable(ns.get('parse_amount')) and raises(parse_amount, 'ten') is None"
            say: "A bad text must raise a `ValueError`. Do not catch it inside `parse_amount`: let `float` raise it."
      - expr: "err is None and src.count('assert') >= 2"
        pass: "There are tests for `parse_amount`, and they pass"
        hint: "Add `assert parse_amount(\"7,50\") == 7.5`."
    hints:
      - "`text.strip().replace(\",\", \".\")` cleans the text."
      - "`float(...)` raises a `ValueError` by itself for a bad text."
      - "`if amount <= 0: raise ValueError(\"An amount must be more than 0.\")`, then `return amount`."

  # 6. STEP 4 ----------------------------------------------------------------
  - id: m4-totals
    type: exercise
    fade: milestone
    carry: true
    objective: O3
    title: "Step 4: totals"
    prompt: |
      **Write `totals(expenses)`.** It gives back a dictionary: each
      category and the sum of its amounts.

      `totals` of the three expenses in the file gives
      `{"food": 19.75, "travel": 30}`. An empty list gives `{}`.

      Use comprehensions. Add at least one more `assert`.
    files:
      expenses.json: *start
    solution: |
      import json
      from pathlib import Path

      def load_expenses(name):
          path = Path(name)
          if not path.exists():
              return []
          try:
              return json.loads(path.read_text())
          except json.JSONDecodeError:
              print(f"{name} is broken. Starting with no expenses.")
              return []

      def save_expenses(expenses, name):
          Path(name).write_text(json.dumps(expenses, indent=2))

      def parse_amount(text):
          amount = float(text.strip().replace(",", "."))
          if amount <= 0:
              raise ValueError("An amount must be more than 0.")
          return amount

      def totals(expenses):
          categories = {e["category"] for e in expenses}
          return {c: sum(e["amount"] for e in expenses if e["category"] == c) for c in categories}

      assert parse_amount("12.5") == 12.5
      assert parse_amount("7,50") == 7.5
      assert totals([{"category": "food", "amount": 2}, {"category": "food", "amount": 3}]) == {"food": 5}
      assert totals([]) == {}

      expenses = load_expenses("expenses.json")
      print(f"{len(expenses)} expenses loaded.")
    after: >-
      A set comprehension finds each category one time, and a dictionary
      comprehension sums the amounts of each one. Lesson 29 had the same
      idea for a CSV table.
    checks:
      - *c-load
      - *c-save
      - *c-parse
      - &c-totals
        expr: "callable(ns.get('totals')) and (lambda E: totals(E) == {'food': 5.5, 'books': 20, 'fun': 1.25})([{'category': 'food', 'amount': 2}, {'category': 'books', 'amount': 20}, {'category': 'food', 'amount': 3.5}, {'category': 'fun', 'amount': 1.25}]) and totals([]) == {} and totals([{'category': 'x', 'amount': 4}]) == {'x': 4}"
        pass: "`totals` gives the sum of each category"
        hint: "First the categories: `{e[\"category\"] for e in expenses}`. Then for each one, the sum of its amounts."
        misconceptions:
          - when: "callable(ns.get('totals')) and isinstance(totals([{'category': 'a', 'amount': 1}]), list)"
            say: "`totals` gives back a list. It must give a dictionary: `{c: ... for c in categories}`."
      - expr: "err is None and src.count('assert') >= 3"
        pass: "There are tests for `parse_amount` and `totals`, and they pass"
        hint: "Add `assert totals([]) == {}`."
    hints:
      - "`categories = {e[\"category\"] for e in expenses}`."
      - "For one category `c`: `sum(e[\"amount\"] for e in expenses if e[\"category\"] == c)`."
      - "Put it in a dictionary comprehension: `{c: sum(...) for c in categories}`."

  # 7. STEP 5 ----------------------------------------------------------------
  - id: m5-loop
    type: exercise
    fade: milestone
    carry: true
    objective: O4
    title: "Step 5: the commands"
    prompt: |
      **Add the command loop** under the line that prints how many
      expenses were loaded. Repeat: ask
      `input("Command (add, report, quit): ")`, clean the answer
      (`strip`, `lower`), then:

      - `add`: ask `input("Category: ")` (clean it the same way) and
        `input("Amount: ")`. Use `parse_amount`; for a bad amount, print
        `Not a valid amount.` and add nothing. Else add the expense and
        print a line like `Added 4.50 for food.`
      - `report`: print each category in alphabetical order, like
        `food: 19.75`, then `Total: 49.75`.
      - `quit`: save to `expenses.json`, print `Saved.` and stop.
      - Anything else: print `Unknown command.`
    files:
      expenses.json: *start
    solution: *tool
    after: >-
      This is the complete tool. Each command is only a few lines, because
      the work is in tested functions. The file is saved only at `quit`;
      a real tool could also save after each `add`.
    cases:
      - {}
      - label: "the user types `report`, then `quit`"
        stdin: ["report", "quit"]
      - label: "the file has four categories; the user types `report`, then `quit`"
        files:
          expenses.json: '[{"category": "travel", "amount": 5}, {"category": "food", "amount": 1}, {"category": "rent", "amount": 9.5}, {"category": "books", "amount": 2.25}, {"category": "food", "amount": 3}]'
        stdin: ["report", "quit"]
      - label: "the user adds `Food` with `4,50`, asks for a report, and quits"
        stdin: ["add", "Food", "4,50", "report", "quit"]
      - label: "the user adds `books` with the amount `abc`, and quits"
        stdin: ["add", "books", "abc", "quit"]
      - label: "there is no file; the user adds `travel` with `30`, and quits"
        files: {}
        stdin: ["add", "travel", "30", "quit"]
      - label: "the user types `dance`, then `QUIT`"
        stdin: ["dance", "QUIT"]
    checks:
      - *c-parse
      - *c-totals
      - expr: "err is None and asked == len(inputs)"
        pass: "The tool reads commands until `quit`, and asks for nothing more"
        hint: "Use `while True:` and `break` after `quit`."
        misconceptions:
          - when: "err == 'EOFError' or (err is None and asked > len(inputs))"
            say: "The tool does not stop. After `quit`, end the loop with `break`."
          - when: "err == 'ValueError'"
            say: "A bad amount stops the tool. Put the call of `parse_amount` inside `try` and catch `ValueError`."
          - when: "err in ('NameError', 'UnboundLocalError') and 'Not a valid amount.' in lines"
            say: "After `Not a valid amount.`, the rest of `add` still runs. Use `continue` to go back to the start of the loop."
      - expr: "lines[:1] == [f\"{len(__import__('json').loads(start_files['expenses.json'])) if 'expenses.json' in start_files else 0} expenses loaded.\"]"
        pass: "It starts by saying how many expenses were loaded"
        hint: "Keep the line from step 1 before the loop."
      - expr: "[i.strip().lower() for i in inputs][-1:] != ['quit'] or (lines[-1:] == ['Saved.'] and 'expenses.json' in files)"
        pass: "`quit` saves the file and prints `Saved.`"
        hint: "For `quit`: `save_expenses(expenses, \"expenses.json\")`, `print(\"Saved.\")`, `break`."
      - expr: "inputs != ['report', 'quit'] or (lambda E: (lambda want: [l for l in lines if l in want] == sorted(want) and len(want) == len(totals(E)))({f'{c}: {t:.2f}' for c, t in totals(E).items()}) and f'Total: {sum(totals(E).values()):.2f}' in lines)(__import__('json').loads(start_files['expenses.json']))"
        pass: "`report` shows each category in order, and the total"
        hint: "`for c in sorted(sums):` print `f\"{c}: {sums[c]:.2f}\"`, then the total."
      - expr: "inputs != ['add', 'Food', '4,50', 'report', 'quit'] or (__import__('json').loads(files['expenses.json']) == __import__('json').loads(start_files['expenses.json']) + [{'category': 'food', 'amount': 4.5}] and 'food: 24.25' in lines)"
        pass: "`add` cleans the category and the amount, and the new expense is saved"
        hint: "Clean the category with `.strip().lower()`, and add `{\"category\": category, \"amount\": amount}` to the list."
        misconceptions:
          - when: "inputs == ['add', 'Food', '4,50', 'report', 'quit'] and 'Food' in files.get('expenses.json', '')"
            say: "The category is saved as `Food`. Clean it: `input(\"Category: \").strip().lower()`."
      - expr: "inputs != ['add', 'books', 'abc', 'quit'] or ('Not a valid amount.' in lines and __import__('json').loads(files['expenses.json']) == __import__('json').loads(start_files['expenses.json']))"
        pass: "A bad amount says `Not a valid amount.` and adds nothing"
        hint: "`except ValueError:` print the message, then `continue`."
      - expr: "inputs != ['add', 'travel', '30', 'quit'] or __import__('json').loads(files['expenses.json']) == [{'category': 'travel', 'amount': 30.0}]"
        pass: "Without a file, the tool starts empty and makes the file"
        hint: "`load_expenses` gives `[]` without a file; `quit` saves the list."
      - expr: "inputs != ['dance', 'QUIT'] or ('Unknown command.' in lines and lines[-1] == 'Saved.')"
        pass: "An unknown command says so, and `QUIT` works in capital letters"
        hint: "Clean the command with `.strip().lower()`, and print `Unknown command.` in the last `else`."
      - expr: "called('load_expenses') and called('save_expenses') and called('parse_amount') and called('totals')"
        pass: "The loop uses your four functions"
        hint: "Call the functions instead of writing their work again."
    hints:
      - "`while True:` then `command = input(\"Command (add, report, quit): \").strip().lower()`."
      - "For `add`: `try: amount = parse_amount(input(\"Amount: \"))` and `except ValueError: print(\"Not a valid amount.\")` and `continue`."
      - "For `report`: `sums = totals(expenses)`, then `for c in sorted(sums):` and the total `sum(sums.values())`."

  # 8. LOOK BACK -------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O1
    title: Look back at your work
    items:
      - kind: mcq
        id: q-where-try
        objective: O2
        prompt: "Why is the `try` in the loop, around the call of `parse_amount`, and not inside `parse_amount`?"
        options:
          - text: "`parse_amount` only refuses a bad value. The loop decides what to do: tell the user and go on"
            correct: true
            why: "Functions raise, the caller catches. A test can then check that `parse_amount` raises."
          - text: "Because `try` is not allowed inside a function"
            why: "It is allowed, as in `load_expenses`."
          - text: "It makes no difference"
            why: "Inside, the error would be hidden, and the loop could not tell the user."
      - kind: mcq
        id: q-broken
        objective: O1
        prompt: "`expenses.json` is broken. What does the tool do, and why?"
        options:
          - text: "It prints a message and starts with an empty list, so the user can go on"
            correct: true
            why: "A broken file must not stop the tool. The message tells the user what happened."
          - text: "It stops with a `JSONDecodeError`"
            why: "`load_expenses` catches that error."
          - text: "It deletes the file"
            why: "It does not touch the file until `quit`."
      - kind: predict
        id: q-comma
        objective: O2
        code: |
          text = " 7,50 "
          print(float(text.strip().replace(",", ".")))
        explain: "`strip` takes away the spaces, `replace` turns the comma into a point, and `float` reads `7.50`."
      - kind: predict
        id: q-totals
        objective: O3
        code: |
          expenses = [{"category": "a", "amount": 2}, {"category": "b", "amount": 1}, {"category": "a", "amount": 5}]
          cats = {e["category"] for e in expenses}
          print(sorted(cats))
          print(sum(e["amount"] for e in expenses if e["category"] == "a"))
        explain: "The set has each category one time. The sum adds only the amounts of category `a`: 2 + 5."
      - kind: mcq
        id: q-save
        objective: O4
        prompt: "The tool saves only at `quit`. What happens if the browser tab closes in the middle?"
        options:
          - text: "The expenses added since the start are lost"
            correct: true
            why: "To keep each one, save after every `add` too."
