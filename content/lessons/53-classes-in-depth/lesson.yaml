id: classes-in-depth
order: 53
title: Classes in depth
summary: Values that all objects share, a look inside objects with __dict__ and getattr, names with underscores, and the order of parents.
minutes: 40
outcomes: [A1, A8]

objectives:
  - id: O1
    text: Tell a class attribute (shared by all objects) from an instance attribute (one object), also when one hides the other
  - id: O2
    text: Look inside objects and classes - __dict__, hasattr, getattr, isinstance, __name__, __bases__
  - id: O3
    text: Use _name for "inside use" and know what __name (name mangling) does and does not protect
  - id: O4
    text: Follow the method resolution order (MRO) of a class with more than one parent

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: shared
    type: theory
    objective: O1
    title: One value for all objects
    body: |
      An attribute that you write **in the class**, outside the methods, is
      a **class attribute**. All objects share it:

      ```python
      class Dog:
          legs = 4                    # class attribute: shared

          def __init__(self, name):
              self.name = name        # instance attribute: one per dog

      a = Dog("Rex")
      b = Dog("Bo")
      print(a.legs, b.legs, Dog.legs)    # 4 4 4
      ```

      To read `a.legs`, Python looks first in the object, then in its class.

      **Careful when you write.** `a.legs = 3` does not change the class: it
      gives `a` its own attribute `legs`, which **hides** the class
      attribute, for `a` only. To change the shared value, write to the
      class: `Dog.legs = 3`.
    keys:
      - code: "legs = 4"
        means: "In the class: one value for all objects."
      - code: "self.name = name"
        means: "In `__init__`: one value for each object."
      - code: "Dog.legs = 3"
        means: "Change the shared value. `a.legs = 3` changes only `a`."

  # 2. PREDICT ---------------------------------------------------------------
  - id: predict-hide
    type: predict
    objective: O1
    title: Who has three legs?
    item:
      kind: predict
      id: p-hide
      prompt: "**Type every line that this program prints.**"
      code: |
        class Dog:
            legs = 4

            def __init__(self, name):
                self.name = name

        a = Dog("Rex")
        b = Dog("Bo")
        a.legs = 3
        print(a.legs)
        print(b.legs)
        print(Dog.legs)
      explain: >-
        `a.legs = 3` gave `a` its own attribute. `b` and the class still have
        the shared value 4.
      misconceptions:
        - answer: "3\n3\n3"
          say: "`a.legs = 3` writes into the object `a`, not into the class. `b` still reads the class: 4."

  # 3. EXERCISE: debug -------------------------------------------------------
  - id: ex-counter
    type: exercise
    fade: debug
    objective: O1
    title: A counter that stays at zero
    prompt: |
      Each new `Ticket` should get the next number, and the class should
      count how many tickets were made. The program should print `1 2 3`
      and `3`.

      **Run it.** The numbers are wrong. Find out why, and fix it.
    starter: |
      class Ticket:
          made = 0

          def __init__(self):
              self.made += 1
              self.number = self.made

      a = Ticket()
      b = Ticket()
      c = Ticket()
      print(a.number, b.number, c.number)
      print(Ticket.made)
    solution: |
      class Ticket:
          made = 0

          def __init__(self):
              Ticket.made += 1
              self.number = Ticket.made

      a = Ticket()
      b = Ticket()
      c = Ticket()
      print(a.number, b.number, c.number)
      print(Ticket.made)
    after: >-
      `self.made += 1` reads the class value (0), adds 1, and writes the
      result into the **object**. So each ticket got its own `made`, equal
      to 1, and the class kept 0. Writing to `Ticket.made` changes the shared
      value.
    checks:
      - expr: "err is None and lines == ['1 2 3', '3']"
        pass: "It prints `1 2 3` and `3`"
        hint: "The count must grow in the class, not in each ticket."
        misconceptions:
          - when: "err is None and lines == ['1 1 1', '0']"
            say: "`self.made += 1` makes a new attribute in each ticket. Write `Ticket.made += 1`."
      - expr: "isinstance(ns.get('Ticket'), type) and (lambda before: Ticket().number == before + 1 and Ticket.made == before + 1)(Ticket.made)"
        pass: "A new ticket gets the next number, and the class counts it"
        hint: "`Ticket.made += 1`, then `self.number = Ticket.made`."
    hints:
      - "Look at `self.made += 1`. Where does the new value go: into the class, or into the object?"
      - "Into the object. The class value stays 0."
      - "Write `Ticket.made += 1` and `self.number = Ticket.made`."

  # 4. THEORY ----------------------------------------------------------------
  - id: inside
    type: theory
    objective: O2
    title: A look inside
    body: |
      Python can tell you what an object has. This is called
      **introspection**:

      ```python
      rex = Dog("Rex")
      rex.__dict__              # {'name': 'Rex'}: the attributes of the object
      Dog.__name__              # 'Dog'
      Dog.__module__            # '__main__': the module of the class
      Puppy.__bases__           # (<class 'Dog'>,): the direct parents
      isinstance(rex, Dog)      # True, also for an object of a child class
      ```

      Attributes by their name, as text:

      ```python
      hasattr(rex, "name")              # True
      getattr(rex, "name")              # 'Rex', like rex.name
      getattr(rex, "age", 0)            # 0: not there, so the default
      setattr(rex, "age", 3)            # like rex.age = 3
      ```

      `getattr` helps when the name is in a variable, for example from a
      file or a list.
    keys:
      - code: "obj.__dict__"
        means: "The attributes of this object, as a dictionary."
      - code: 'getattr(o, "x", 0)'
        means: "The attribute named in the text, or the default 0."
      - code: "isinstance(o, Dog)"
        means: "Is it a Dog, or of a child class of Dog?"

  # 5. DEMO -----------------------------------------------------------------
  - id: look
    type: demo
    objective: O2
    title: Ask the object
    intro: |
      Press **Run**, and read what each line tells about `rex` and its
      class.
    code: |
      class Dog:
          legs = 4

          def __init__(self, name):
              self.name = name

      class Puppy(Dog):
          pass

      rex = Puppy("Rex")
      print(rex.__dict__)
      print(type(rex).__name__, Puppy.__bases__)
      print(isinstance(rex, Dog), hasattr(rex, "legs"))
      for field in ["name", "legs", "age"]:
          print(field, getattr(rex, field, "-"))
    experiments:
      - text: "Run it as it is."
        expr: "err is None and lines[0] == \"{'name': 'Rex'}\""
      - text: "Add `rex.age = 1` before the prints. What changes in `__dict__`?"
        expr: "err is None and 'age' in lines[0]"
      - text: "Print `Dog.__dict__['legs']`: the class has its own dictionary."
        expr: "err is None and \"__dict__['legs']\" in src"
    investigate:
      - kind: mcq
        id: i-legs-dict
        prompt: "`rex.__dict__` is `{'name': 'Rex'}`. Why is `legs` not in it, while `rex.legs` is 4?"
        options:
          - text: "`legs` is in the class, not in the object; Python finds it there"
            correct: true
            why: "The object's dictionary has only its own attributes. The search goes on in the class, then in the parents."
          - text: "`__dict__` shows only text values"
            why: "It shows every attribute of the object, of any type."
          - text: "`legs` was deleted"
            why: "It is in the class `Dog`: `Dog.__dict__` has it."
      - kind: mcq
        id: i-isinstance
        prompt: "Why is `isinstance(rex, Dog)` `True`, when `rex` is a `Puppy`?"
        options:
          - text: "A Puppy is a Dog: `isinstance` counts the child classes too"
            correct: true
            why: "`type(rex) is Dog` would be `False`: the type is exactly `Puppy`."
          - text: "Because both have the attribute `legs`"
            why: "`isinstance` looks at the classes, not at the attributes."
          - text: "It is a mistake of Python"
            why: "It is how inheritance works: a child is also its parent."

  # 6. EXERCISE: completion --------------------------------------------------
  - id: ex-describe
    type: exercise
    fade: completion
    objective: O2
    title: Describe any object
    prompt: |
      **Complete `describe(obj, fields)`.** For each name in the list
      `fields`, it gives a line `name: value`, with the value of that
      attribute, or `?` when the object does not have it.

      ```text
      name: Rex
      age: ?
      ```
    starter: |
      class Dog:
          def __init__(self, name):
              self.name = name


      def describe(obj, fields):
          lines = []
          for field in fields:
              value = ___
              lines.append(f"{field}: {value}")
          return lines


      for line in describe(Dog("Rex"), ["name", "age"]):
          print(line)
    solution: |
      class Dog:
          def __init__(self, name):
              self.name = name


      def describe(obj, fields):
          lines = []
          for field in fields:
              value = getattr(obj, field, "?")
              lines.append(f"{field}: {value}")
          return lines


      for line in describe(Dog("Rex"), ["name", "age"]):
          print(line)
    after: >-
      One function for any object and any list of names. That is what
      `getattr` is for: the name of the attribute is a value in a variable.
    checks:
      - expr: "err is None and lines == ['name: Rex', 'age: ?']"
        pass: "It prints `name: Rex` and `age: ?`"
        hint: "`getattr(obj, field, \"?\")`."
        misconceptions:
          - when: "err == 'AttributeError'"
            say: "`obj.field` looks for an attribute called `field`. Use `getattr(obj, field, \"?\")`: the name is the value of the variable."
      - expr: "callable(ns.get('describe')) and (lambda o: describe(o, ['x', 'y']) == ['x: 1', 'y: ?'])(type('T', (), {'x': 1})())"
        pass: "It works for any object and any names"
        hint: "Give `getattr` a default: the third value."
    hints:
      - "The name of the attribute is in the variable `field`, as text."
      - "`getattr(obj, field)` reads it. What if it is not there?"
      - "`getattr(obj, field, \"?\")`: the third value is the default."

  # 7. THEORY ----------------------------------------------------------------
  - id: underscores
    type: theory
    objective: O3
    title: Names with underscores
    body: |
      Python has no truly private attributes. It has two conventions:

      - **`_balance`** (one underscore): "for inside use". Other code *can*
        read it, but should not. Nothing stops it.
      - **`__pin`** (two underscores at the start): Python changes the name
        to `_Account__pin` inside the class. This is **name mangling**. It
        avoids clashes with an attribute of the same name in a child class.

      ```python
      class Account:
          def __init__(self):
              self._balance = 0      # inside use, please
              self.__pin = "1234"    # stored as _Account__pin

      acc = Account()
      acc._balance                  # works (but should not be used)
      acc.__pin                     # AttributeError
      acc._Account__pin             # '1234': mangling is not a lock
      ```

      So `__pin` is not a secret: it is only a name with the class in front.
      Never keep a password in a program and think `__` protects it.

      Names with two underscores at the start **and** the end, like
      `__init__` or `__dict__`, are Python's own: no mangling for them.
    keys:
      - code: "self._name"
        means: "For inside use. A convention, not a rule."
      - code: "self.__name"
        means: "Stored as `_Class__name`. Not a lock."
      - code: "__init__"
        means: "Two underscores on both sides: Python's own names."

  # 8. THEORY ----------------------------------------------------------------
  - id: mro
    type: theory
    objective: O4
    title: More than one parent
    body: |
      A class can have more than one parent:

      ```python
      class Swimmer:
          def move(self):
              return "swim"

      class Flyer:
          def move(self):
              return "fly"

      class Duck(Swimmer, Flyer):
          pass

      Duck().move()      # 'swim'
      ```

      Both parents have `move`. Python looks in a fixed order, the **method
      resolution order (MRO)**: first the class itself, then the parents
      **from left to right**, then their parents, and `object` last:

      ```python
      [c.__name__ for c in Duck.__mro__]
      # ['Duck', 'Swimmer', 'Flyer', 'object']
      ```

      When two parents share one grandparent (a **diamond**), the
      grandparent comes after both parents. `super()` follows the same
      order: it calls the next class in the MRO, not always the parent.

      Keep it simple: one parent is usually enough. More parents are for
      small "extra skills" classes.
    keys:
      - code: "class Duck(Swimmer, Flyer):"
        means: "Two parents: Swimmer first."
      - code: "Duck.__mro__"
        means: "The order Python searches: Duck, Swimmer, Flyer, object."
      - code: "super()"
        means: "The next class in the MRO."

  # 9. EXERCISE: independent -------------------------------------------------
  - id: ex-public
    type: exercise
    fade: independent
    objective: O3
    title: Only the public attributes
    prompt: |
      **Write `public(obj)`.** It gives back a dictionary with the
      attributes of the object (from its `__dict__`) whose names do **not**
      start with `_`.

      For the account below, `print(public(acc))` prints:

      ```text
      {'owner': 'Ana'}
      ```
    starter: |
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self._balance = 0
              self.__pin = "1234"


      # Write public here.


      acc = Account("Ana")
      print(public(acc))
    solution: |
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self._balance = 0
              self.__pin = "1234"


      def public(obj):
          found = {}
          for name, value in obj.__dict__.items():
              if not name.startswith("_"):
                  found[name] = value
          return found


      acc = Account("Ana")
      print(public(acc))
    after: >-
      Look at `acc.__dict__` too: you see `_Account__pin`. The mangled name
      starts with `_`, so `public` leaves it out, like `_balance`.
    checks:
      - expr: "err is None and lines[-1:] == [\"{'owner': 'Ana'}\"]"
        pass: "It prints `{'owner': 'Ana'}`"
        hint: "A loop over `obj.__dict__.items()`, and keep the names without `_` at the start."
        misconceptions:
          - when: "err is None and '_Account__pin' in out"
            say: "The mangled name `_Account__pin` starts with `_` too. Leave out every name that starts with `_`."
      - expr: "callable(ns.get('public')) and (lambda o: (setattr(o, 'a', 1), setattr(o, 'b', [2]), setattr(o, '_c', 3), public(o))[-1] == {'a': 1, 'b': [2]})(type('T', (), {})())"
        pass: "It works for any object"
        hint: "Use `obj.__dict__`, not the names of the account."
      - expr: "callable(ns.get('public')) and (lambda o: (setattr(o, 'x', 1), public(o))[-1] == {'x': 1} and o.__dict__ == {'x': 1})(type('T', (), {})())"
        pass: "It gives a new dictionary, and leaves the object as it is"
        hint: "Build a new dictionary. Do not delete from `obj.__dict__`."
    hints:
      - "`obj.__dict__` is a dictionary: name to value."
      - "`for name, value in obj.__dict__.items():` and `if not name.startswith(\"_\"):`."
      - "Put each kept pair into a new dictionary, and give it back."

  # 10. QUIZ ----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O4
    title: Check yourself
    items:
      - kind: predict
        id: q-mro
        objective: O4
        code: |
          class A:
              def hello(self):
                  return "A"

          class B:
              def hello(self):
                  return "B"

          class C(B, A):
              pass

          print(C().hello())
          print([k.__name__ for k in C.__mro__])
        explain: "The parents are searched from left to right: B first. `object` is always last."
      - kind: predict
        id: q-shared-list
        objective: O1
        code: |
          class Team:
              members = []

              def __init__(self, name):
                  self.name = name

              def add(self, person):
                  self.members.append(person)

          red = Team("red")
          blue = Team("blue")
          red.add("Ana")
          print(blue.members)
        explain: >-
          `members` is a class attribute, so both teams share one list.
          `append` changes that list (it does not write a new attribute).
          Make the list in `__init__`: `self.members = []`.
        misconceptions:
          - answer: "[]"
            say: "Both teams share the one list of the class. `append` changes it in place, so blue sees Ana too."
      - kind: mcq
        id: q-mangle
        objective: O3
        prompt: "In `class Safe:`, `__init__` sets `self.__code = 42`. How is it stored?"
        options:
          - text: "As `_Safe__code`"
            correct: true
            why: "Name mangling: an underscore and the class name in front."
          - text: "As `__code`, but hidden"
            why: "Nothing is hidden: look at `__dict__`."
          - text: "Encrypted"
            why: "Python does not encrypt it. `obj._Safe__code` gives 42."
      - kind: mcq
        id: q-hasattr
        objective: O2
        prompt: "`hasattr(rex, \"legs\")` is `True`, but `\"legs\" in rex.__dict__` is `False`. How?"
        options:
          - text: "`legs` is a class attribute: `hasattr` looks in the class too"
            correct: true
            why: "`__dict__` has only the object's own attributes."
          - text: "`hasattr` is wrong"
            why: "`rex.legs` works, so `hasattr` is right."
          - text: "`__dict__` is always empty"
            why: "It holds the instance attributes, like `name`."
      - kind: mcq
        id: q-bases
        objective: O2
        prompt: "`class Duck(Swimmer, Flyer):`. What is `Duck.__bases__`?"
        options:
          - text: "`(Swimmer, Flyer)`, the direct parents"
            correct: true
            why: "`__mro__` would also have `Duck` and `object`."
          - text: "`(Duck, Swimmer, Flyer, object)`"
            why: "That is the MRO. `__bases__` has only the direct parents."
          - text: "`object`"
            why: "`object` is a parent only of classes without other parents."

  # 11. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-class-attr
    objective: O1
    prompt: "Where do you write an attribute that all objects of a class share?"
    options:
      - text: "In the class, outside the methods"
        correct: true
        why: "Like `legs = 4` under `class Dog:`."
      - text: "In `__init__`, with `self.`"
        why: "That gives each object its own value."
      - text: "In a global variable"
        why: "A class attribute belongs to the class."
  - kind: mcq
    id: r-self-plus
    objective: O1
    prompt: "A class has `count = 0`. A method does `self.count += 1`. What happens?"
    options:
      - text: "The object gets its own `count`; the class keeps 0"
        correct: true
        why: "Write `ClassName.count += 1` to change the shared value."
      - text: "The class count grows"
        why: "`self.count = ...` writes into the object."
      - text: "An error"
        why: "It works, but it does not do what you wanted."
  - kind: mcq
    id: r-getattr
    objective: O2
    prompt: "What does `getattr(obj, \"color\", \"none\")` give when `obj` has no `color`?"
    options:
      - text: "`\"none\"`"
        correct: true
        why: "The third value is the default."
      - text: "An `AttributeError`"
        why: "Only without a default."
      - text: "`None`"
        why: "The default is the text `\"none\"`."
  - kind: mcq
    id: r-underscore
    objective: O3
    prompt: "What does one underscore at the start, like `_cache`, mean?"
    options:
      - text: "\"For inside use\": a convention, nothing stops other code"
        correct: true
        why: "Two underscores change the name; one underscore only tells."
      - text: "The attribute is private: no other code can read it"
        why: "Python has no truly private attributes."
      - text: "The attribute is a class attribute"
        why: "Underscores say nothing about class or instance."
  - kind: mcq
    id: r-mro-order
    objective: O4
    prompt: "In `class C(A, B):`, where does Python look first for a method?"
    options:
      - text: "In `C`, then `A`, then `B`, then `object`"
        correct: true
        why: "The class itself first, then the parents from left to right."
      - text: "In `B`, the last parent"
        why: "The parents are searched from left to right."
      - text: "In `object`"
        why: "`object` comes last."

  - kind: mcq
    id: r-pillars
    objective: O2
    prompt: "A `Library` hides how it keeps its books, and you only call `add` and `borrow`. Which idea of object-oriented programming is that?"
    options:
      - text: "Encapsulation: the data and its rules stay inside, behind methods"
        correct: true
        why: "The other three ideas: abstraction (show only what matters), inheritance (reuse a class), polymorphism (one call, many classes)."
      - text: "Inheritance"
        why: "Inheritance is a class built on another class."
      - text: "Polymorphism"
        why: "Polymorphism is the same method call on objects of different classes."
  - kind: mcq
    id: r-polymorphism
    objective: O2
    prompt: "`for shape in [Circle(1), Square(2)]: print(shape.area())` works for both. What is this called?"
    options:
      - text: "Polymorphism: each class gives its own `area`, and the loop does not care which class it is"
        correct: true
        why: "Code that only needs \"something with `area()`\" works for any such class."
      - text: "Encapsulation"
        why: "Encapsulation is about keeping data behind methods."
      - text: "Abstraction"
        why: "Close, but the name for one call with many classes is polymorphism."
  - kind: predict
    id: r-shadow
    objective: O1
    code: |
      class Dog:
          sound = "woof"

      a = Dog()
      b = Dog()
      a.sound = "grr"
      print(a.sound, b.sound, Dog.sound)
    explain: "`a.sound = ...` makes a new instance attribute on `a`. It hides the class attribute for `a` only; `b` and the class still have `woof`."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-ticket-count
    type: exercise
    fade: completion
    objective: O1
    title: Numbered tickets
    prompt: |
      **Replace the two `___`**: the class counts all tickets, and each
      ticket gets the next number.

      ```text
      1 2 3
      3
      ```
    starter: |
      class Ticket:
          count = 0

          def __init__(self):
              ___ = Ticket.count + 1
              self.number = ___


      a, b, c = Ticket(), Ticket(), Ticket()
      print(a.number, b.number, c.number)
      print(Ticket.count)
    solution: |
      class Ticket:
          count = 0

          def __init__(self):
              Ticket.count = Ticket.count + 1
              self.number = Ticket.count


      a, b, c = Ticket(), Ticket(), Ticket()
      print(a.number, b.number, c.number)
      print(Ticket.count)
    after: >-
      `Ticket.count` belongs to the class, so all tickets share it.
      `self.count = ...` would make a new attribute in one ticket, and the
      class would stay at 0.
    checks:
      - expr: "err is None and lines == ['1 2 3', '3']"
        pass: "Tickets get 1, 2, 3, and the class counts 3"
        hint: "`Ticket.count = Ticket.count + 1` and `self.number = Ticket.count`."
        misconceptions:
          - when: "err is None and lines == ['1 1 1', '0']"
            say: "`self.count` made a count in each ticket. Change the class attribute: `Ticket.count`."
      - expr: "a.number != b.number and Ticket.count >= 3"
        pass: "Each ticket has its own number"
        hint: "`self.number` is per ticket, `Ticket.count` is shared."
    hints:
      - "A class attribute is written with the class name."
      - "`Ticket.count = Ticket.count + 1`."
      - "`self.number = Ticket.count`."
  - id: x-has-all
    type: exercise
    fade: independent
    objective: O2
    title: Has it got everything?
    prompt: |
      **Write `has_all(obj, names)`**: `True` when the object has every
      attribute in the list `names`, else `False`. Use `hasattr`.

      ```text
      True
      False
      ```
    starter: |
      class Book:
          def __init__(self):
              self.title = "Dune"
              self.pages = 412


      # Your function here.


      print(has_all(Book(), ["title", "pages"]))
      print(has_all(Book(), ["title", "author"]))
    solution: |
      class Book:
          def __init__(self):
              self.title = "Dune"
              self.pages = 412


      def has_all(obj, names):
          for name in names:
              if not hasattr(obj, name):
                  return False
          return True


      print(has_all(Book(), ["title", "pages"]))
      print(has_all(Book(), ["title", "author"]))
    after: >-
      `hasattr` asks without the risk of an AttributeError. The same works
      for any object: a book, a list, a module.
    checks:
      - expr: "callable(ns.get('has_all')) and has_all(Book(), ['title']) is True and has_all(Book(), []) is True and has_all(Book(), ['author']) is False"
        pass: "True only when all attributes are there"
        hint: "Ask `hasattr(obj, name)` for each name."
      - expr: "callable(ns.get('has_all')) and has_all([], ['append', 'sort']) is True and has_all('text', ['append']) is False"
        pass: "It works for any object"
        hint: "Use `hasattr`, not a test of the class."
      - expr: "'hasattr(' in src"
        pass: "It uses hasattr"
        hint: "`hasattr(obj, name)`."
    hints:
      - "Loop over `names`."
      - "`hasattr(obj, name)` is True or False."
      - "Return False at the first missing one, True after the loop."
  - id: x-shadow
    type: exercise
    fade: debug
    objective: O1
    title: A count that stays at 0
    prompt: |
      `Ticket.made` should count all tickets ever made. It stays at 0.
      **Find the bug and fix it.**

      ```text
      3
      ```
    starter: |
      class Ticket:
          made = 0

          def __init__(self, seat):
              self.seat = seat
              self.made = self.made + 1


      for seat in ["A1", "A2", "B7"]:
          Ticket(seat)
      print(Ticket.made)
    solution: |
      class Ticket:
          made = 0

          def __init__(self, seat):
              self.seat = seat
              Ticket.made = Ticket.made + 1


      for seat in ["A1", "A2", "B7"]:
          Ticket(seat)
      print(Ticket.made)
    after: >-
      `self.made = ...` made a new instance attribute that hid the class
      attribute. Reading through `self` finds the class attribute, but
      writing through `self` always writes to the object.
    checks:
      - expr: "err is None and lines == ['3']"
        pass: "It counts all tickets"
        hint: "Write the count to the class: `Ticket.made = Ticket.made + 1`."
      - expr: "callable(ns.get('Ticket')) and (lambda before: (Ticket('Z9'), Ticket.made - before)[1])(Ticket.made) == 1 and 'made' not in vars(Ticket('Z8'))"
        pass: "Each new ticket adds 1 to the class, and no ticket has its own `made`"
        hint: "`self.made = ...` gives the object its own attribute."
    hints:
      - "Where does `self.made = ...` write: in the object or in the class?"
      - "In the object: a new attribute that hides `Ticket.made`."
      - "Write `Ticket.made = Ticket.made + 1`."
