        pass: "The lamp switches on, then off"
        hint: "Every method needs `self` as its first parameter."
      - expr: "callable(ns.get('Lamp')) and (lambda l: (l.switch(), l.on)[1])(Lamp()) is True"
        pass: "switch changes the lamp"
        hint: "`def switch(self):`."
