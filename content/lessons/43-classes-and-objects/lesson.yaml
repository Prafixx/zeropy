id: classes-and-objects
order: 43
title: Classes and objects
summary: Write your own kind of value. A class is the plan; each object made from it keeps its own data, and its methods work on it.
minutes: 35
outcomes: [A8, A9]

objectives:
  - id: O1
    text: Say what a class and an object are - a plan, and the things made from it, each with its own attributes
  - id: O2
    text: Write a class with __init__, and make objects from it
  - id: O3
    text: Read and change the attributes of an object with a dot
  - id: O4
    text: Write methods that use self, and call them on an object
  - id: O5
    text: Read the usual errors of classes - a missing self, a wrong __init__, a missing attribute

steps:
  # 1. HOOK ------------------------------------------------------------------
  - id: see
    type: hook
    objective: O1
    title: One plan, many dogs
    question: Two dogs come from one class. Why does a birthday change only one of them?
    code: |
      class Dog:
          def __init__(self, name, age):
              self.name = name
              self.age = age

          def birthday(self):
              self.age = self.age + 1

      rex = Dog("Rex", 3)
      ada = Dog("Ada", 5)
      rex.age = 4
      rex.birthday()
    beats:
      - beat: plan
        line: 1
        caption: "`class Dog:` is a **plan** for dogs. It makes no dog yet: the picture is empty."
      - beat: make
        line: 9
        caption: "`Dog(\"Rex\", 3)` makes an **object** from the plan. `__init__` gives it two **attributes**, `name` and `age`. The label `rex` goes on it."
      - beat: second
        line: 10
        caption: "A second object, from the same plan, with its **own** values."
      - beat: change
        line: 11
        caption: "`rex.age = 4` changes one attribute of one object. Ada stays 5."
      - beat: method
        line: 12
        caption: "`rex.birthday()` calls a **method**. Inside it, `self` is one more name for the object before the dot: Rex."
      - beat: older
        line: 7
        caption: "`self.age = self.age + 1` changes Rex, through the name `self`."
      - beat: done
        line: 12
        caption: "The call ends, and `self` goes away. Rex is 5 now. Ada never changed."

  # 2. THEORY ----------------------------------------------------------------
  - id: class
    type: theory
    objective: O2
    title: A class is a plan
    body: |
      A **class** is your own kind of value. Its objects carry their data
      in **attributes**, and its **methods** are functions that work on
      them.

      ```python
      class Dog:
          def __init__(self, name, age):
              self.name = name
              self.age = age

          def describe(self):
              return f"{self.name} is {self.age}"

      rex = Dog("Rex", 3)
      print(rex.name)        # Rex
      print(rex.describe())  # Rex is 3
      ```

      - `Dog("Rex", 3)` makes a new object. Python then runs `__init__`
        with the new object as `self`, and `"Rex"` and `3` as the other
        values.
      - `self.name = name` gives the object an attribute. Without `self.`,
        `name` is only a name inside the function, and it is gone at the
        end of the call.
      - `rex.describe()` calls the method. Python gives `rex` to it as
        `self`, so a method always has `self` first, but you never pass it.

      Class names start with a capital letter: `Dog`, `Book`, `BankAccount`.
    keys:
      - code: "__init__"
        means: "Runs when an object is made. Two underscores on each side."
      - code: "self"
        means: "The object itself, inside its methods."
      - code: "rex.age"
        means: "An attribute: read it, or change it with `=`."

  # 3. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O3
    title: Make objects, change them
    intro: |
      Press **Run** and watch the objects. Then change the program in the
      ways below.
    code: |
      class Dog:
          def __init__(self, name, age):
              self.name = name
              self.age = age

          def birthday(self):
              self.age = self.age + 1

      rex = Dog("Rex", 3)
      ada = Dog("Ada", 5)
      ada.birthday()
      print(rex.name, rex.age)
      print(ada.name, ada.age)
    experiments:
      - text: "Run it. Which dog had a birthday?"
        expr: "err is None and 'Ada 6' in lines"
      - text: "Add a third dog, `bo = Dog(\"Bo\", 1)`, and print its name."
        expr: "err is None and any(getattr(v, 'name', None) == 'Bo' for v in ns.values()) and 'Bo' in out"
      - text: "Give Rex a new attribute: `rex.color = \"brown\"`. Watch his tray. Does Ada get it too?"
        expr: "err is None and getattr(ns.get('rex'), 'color', None) is not None and not hasattr(ns.get('ada'), 'color')"
      - text: "Add `print(ada.color)` at the end. What does Python say?"
        expr: "err == 'AttributeError'"
    investigate:
      - kind: spot
        id: i-birthday
        prompt: "Which line makes Ada one year older?"
        code: |
          class Dog:
              def __init__(self, name, age):
                  self.name = name
                  self.age = age

              def birthday(self):
                  self.age = self.age + 1

          rex = Dog("Rex", 3)
          ada = Dog("Ada", 5)
          ada.birthday()
          print(rex.name, rex.age)
          print(ada.name, ada.age)
        line: 11
        wrong:
          - line: 7
            say: "This line is inside the method. It only runs when something calls `birthday()`. Which line calls it?"
          - line: 10
            say: "This line makes Ada, with the age 5."
        explain: >-
          `ada.birthday()` runs the method with `self` as `ada`, so only her
          `age` changes.
      - kind: predict
        id: i-two-dogs
        prompt: "**What does this program print?**"
        code: |
          class Dog:
              def __init__(self, name, age):
                  self.name = name
                  self.age = age

              def birthday(self):
                  self.age = self.age + 1

          rex = Dog("Rex", 3)
          ada = Dog("Ada", 5)
          ada.birthday()
          print(rex.name, rex.age)
          print(ada.name, ada.age)
        explain: >-
          Each object has its own attributes. `ada.birthday()` changes only
          the age of `ada`; `rex` keeps 3.

  # 4. PREDICT ---------------------------------------------------------------
  - id: predict-shared
    type: predict
    objective: O3
    title: One object, two names
    item:
      kind: predict
      id: p-shared
      prompt: "**What does this program print?**"
      code: |
        class Box:
            def __init__(self, size):
                self.size = size

        a = Box(2)
        b = a
        b.size = 9
        print(a.size)
      explain: >-
        `b = a` puts a second name on the same object, like with lists. So
        `b.size = 9` changes that one object, and `a.size` is 9 too.
      misconceptions:
        - answer: "2"
          say: "`b = a` did not copy the object. Both names point at one box, and its size changed."
        - answer: "b.size"
          say: "`print(a.size)` prints the value of the attribute, a number."

  # 5. EXERCISE: completion --------------------------------------------------
  - id: ex-book
    type: exercise
    fade: completion
    objective: O2
    title: A class for books
    prompt: |
      **Replace the three `___`**, so that every book keeps its title and
      its number of pages, and `is_long()` is `True` for more than 300
      pages.
    starter: |
      class Book:
          def __init__(self, title, pages):
              self.title = ___
              self.pages = ___

          def is_long(self):
              return ___

      short = Book("Small Gods", 288)
      thick = Book("Middlemarch", 880)
      print(short.title, short.is_long())
      print(thick.title, thick.is_long())
    solution: |
      class Book:
          def __init__(self, title, pages):
              self.title = title
              self.pages = pages

          def is_long(self):
              return self.pages > 300

      short = Book("Small Gods", 288)
      thick = Book("Middlemarch", 880)
      print(short.title, short.is_long())
      print(thick.title, thick.is_long())
    after: >-
      `__init__` stores the values in the object, and the method reads them
      back through `self`. Each book answers for its own pages.
    checks:
      - expr: "callable(ns.get('Book')) and (lambda b: b.title == 'Atlas' and b.pages == 120)(Book('Atlas', 120))"
        pass: "A new book keeps its title and its pages"
        hint: "In `__init__`: `self.title = title` and `self.pages = pages`."
        misconceptions:
          - when: "callable(ns.get('Book')) and getattr(Book('Atlas', 120), 'title', None) == 'Small Gods'"
            say: "Every book gets the same title. Use the parameter: `self.title = title`."
      - expr: "callable(ns.get('Book')) and Book('A', 301).is_long() is True and Book('B', 300).is_long() is False and Book('C', 50).is_long() is False"
        pass: "`is_long()` is `True` only for more than 300 pages"
        hint: "`return self.pages > 300`."
        misconceptions:
          - when: "err == 'NameError' or (callable(ns.get('Book')) and raises(Book('A', 301).is_long) == 'NameError')"
            say: "Inside a method, reach the attribute through the object: `self.pages`, not `pages`."
          - when: "callable(ns.get('Book')) and raises(Book('A', 300).is_long) is None and Book('A', 300).is_long() is True"
            say: "300 pages is not more than 300. Use `>`, not `>=`."
      - expr: "err is None and lines == ['Small Gods False', 'Middlemarch True']"
        pass: "It prints both books"
        hint: "Keep the four lines at the end."
    hints:
      - "The first two `___` are the parameters of `__init__`: `title` and `pages`."
      - "In `is_long`, the pages are `self.pages`."
      - "`return self.pages > 300` gives `True` or `False`."

  # 6. THEORY ----------------------------------------------------------------
  - id: errors
    type: theory
    objective: O5
    title: Three errors of classes
    body: |
      | Message | What happened |
      | --- | --- |
      | `takes 0 positional arguments but 1 was given` | A method has no `self`. Python always passes the object first. |
      | `Dog() takes no arguments` | Python found no `__init__`: check the name, two underscores on each side. |
      | `'Dog' object has no attribute 'age'` | The object has no such attribute: a typo, or `__init__` did not set it with `self.`. |

      Inside a method, the attributes are always `self.something`. A plain
      `age` is a different name, local to the call.
    keys:
      - code: "def birthday(self):"
        means: "A method always has `self` first."
      - code: "def __init__(self, ...):"
        means: "Two underscores before and after `init`."
      - code: "self.age = age"
        means: "Stores the value in the object. `age = age` would not."

  # 7. EXERCISE: debug -------------------------------------------------------
  - id: ex-counter
    type: exercise
    fade: debug
    objective: O5
    title: A counter that does not count
    prompt: |
      This counter should count clicks: it should print `3`. **Run it**,
      read the message, and fix the class. There are two bugs.
    starter: |
      class Counter:
          def __init__(self):
              self.count = 0

          def click():
              count = count + 1

      counter = Counter()
      counter.click()
      counter.click()
      counter.click()
      print(counter.count)
    solution: |
      class Counter:
          def __init__(self):
              self.count = 0

          def click(self):
              self.count = self.count + 1

      counter = Counter()
      counter.click()
      counter.click()
      counter.click()
      print(counter.count)
    after: >-
      `self` is the way into the object. Without it, a method can neither
      receive the object nor change its attributes.
    checks:
      - expr: "err is None and lines == ['3']"
        pass: "It counts three clicks"
        hint: "`click` needs `self`, and it must change `self.count`."
        misconceptions:
          - when: "err == 'TypeError'"
            say: "`click()` takes no values, but Python passes the object as the first one. Write `def click(self):`."
          - when: "err == 'UnboundLocalError'"
            say: "`count` inside `click` is a new local name, not the attribute. Write `self.count = self.count + 1`."
          - when: "err is None and lines == ['0']"
            say: "The count stays 0: the method changes a local name. Change the attribute: `self.count`."
      - expr: "callable(ns.get('Counter')) and (lambda c: (c.click(), c.click(), c.count)[2] == 2)(Counter()) and (lambda a, b: (a.click(), a.count == 1 and b.count == 0)[1])(Counter(), Counter())"
        pass: "Each counter counts its own clicks"
        hint: "Keep `self.count = 0` in `__init__`, so every counter starts at 0."
    hints:
      - "Run it: the first message is about `click()` and how many values it takes."
      - "Write `def click(self):`. Then run again and read the next message."
      - "Inside the method, the count is `self.count`: `self.count = self.count + 1`."

  # 8. EXERCISE: independent -------------------------------------------------
  - id: ex-player
    type: exercise
    fade: independent
    objective: O4
    title: Players with points
    prompt: |
      **Write a class `Player`.**

      - `Player("Ana")` makes a player with the name `"Ana"` and `score`
        0.
      - `add_points(points)` adds points to the score of this player.
      - `summary()` gives back a text like `Ana: 12 points`.

      Then make two players, give them points, and print both summaries.
    starter: |
      # Write the class Player here.


      ana = Player("Ana")
      ben = Player("Ben")
      ana.add_points(5)
      ana.add_points(7)
      ben.add_points(3)
      print(ana.summary())
      print(ben.summary())
    solution: |
      class Player:
          def __init__(self, name):
              self.name = name
              self.score = 0

          def add_points(self, points):
              self.score = self.score + points

          def summary(self):
              return f"{self.name}: {self.score} points"

      ana = Player("Ana")
      ben = Player("Ben")
      ana.add_points(5)
      ana.add_points(7)
      ben.add_points(3)
      print(ana.summary())
      print(ben.summary())
    after: >-
      Each player carries its own name and score, and the methods are the
      only code that needs to know how. The program at the end reads like a
      story.
    checks:
      - expr: "callable(ns.get('Player')) and (lambda p: p.name == 'Zoe' and p.score == 0)(Player('Zoe'))"
        pass: "A new player has its name and a score of 0"
        hint: "`__init__(self, name)`: `self.name = name` and `self.score = 0`."
        misconceptions:
          - when: "isinstance(ns.get('Player'), type) and '__init__' not in vars(ns['Player'])"
            say: "Python found no `__init__`. Check its name: two underscores before and after `init`."
      - expr: "callable(ns.get('Player')) and (lambda p, q: (p.add_points(4), p.add_points(10), q.add_points(1), p.score == 14 and q.score == 1)[3])(Player('Zoe'), Player('Yan'))"
        pass: "`add_points` adds to the score of this player only"
        hint: "`self.score = self.score + points`."
        misconceptions:
          - when: "callable(ns.get('Player')) and (lambda p: (p.add_points(4), p.add_points(10), p.score)[2] == 10)(Player('Zoe'))"
            say: "The score is replaced, not added to. Use `self.score = self.score + points`."
      - expr: "callable(ns.get('Player')) and (lambda p: (p.add_points(8), p.summary())[1] == 'Zoe: 8 points')(Player('Zoe')) and Player('Yan').summary() == 'Yan: 0 points'"
        pass: "`summary()` gives back a text like `Ana: 12 points`"
        hint: "`return f\"{self.name}: {self.score} points\"`."
        misconceptions:
          - when: "callable(ns.get('Player')) and raises(Player('Zoe').summary) is None and Player('Zoe').summary() is None"
            say: "`summary` prints, but it must give the text back with `return`. The program prints it."
      - expr: "err is None and lines == ['Ana: 12 points', 'Ben: 3 points']"
        pass: "The program prints both summaries"
        hint: "Keep the lines at the end, after your class."
    hints:
      - "Start with `class Player:` and `def __init__(self, name):` with two attributes."
      - "`def add_points(self, points):` changes `self.score`."
      - "`def summary(self):` with `return f\"{self.name}: {self.score} points\"`."

  # PUZZLE: put the lines in order (Parsons) ----------------------------
  - id: order
    type: drill
    objective: O2
    title: Put the lines in order
    items:
      - kind: order
        id: o-dog
        objective: O2
        code: |
          class Dog:
              def __init__(self, name):
                  self.name = name
              def bark(self):
                  print(self.name, "says woof")
          rex = Dog("Rex")
          rex.bark()
        explain: >-
          First the class with its methods, indented inside it. Then make an
          object, and only then call a method on it. `__init__` stores the name
          in `self.name`, so `bark` can use it.

  # 9. QUIZ ------------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O4
    title: Check yourself
    items:
      - kind: blanks
        id: q-fill-class
        objective: O2
        prompt: "**Fill in the blanks** so the program prints `Rex says woof`."
        code: |
          class Dog:
              def [?__init__?](self, name):
                  [?self.name?] = name

              def speak(self):
                  return f"{self.name} says woof"


          print(Dog("Rex").speak())
        explain: "`__init__` runs when an object is made. `self.name = name` keeps the name in the object, so `speak` can read it."
        misconceptions:
          - blank: 2
            answer: "name"
            say: "`name = name` only changes a local name. Keep it in the object: `self.name`."
      - kind: mcq
        id: q-plan
        objective: O1
        prompt: "What does `class Dog:` with its methods make, when Python runs it?"
        options:
          - text: "A plan for dogs. No dog yet: `Dog(...)` makes one"
            correct: true
            why: "The class is the plan, and each call `Dog(...)` makes a new object."
          - text: "One dog called Dog"
            why: "The class is not an object of itself. Objects come from `Dog(...)`."
          - text: "A list of all dogs"
            why: "A class does not keep its objects. You keep them in variables or lists."
      - kind: mcq
        id: q-self
        objective: O4
        prompt: "`rex.birthday()` runs. What is `self` inside `birthday`?"
        options:
          - text: "The object `rex`"
            correct: true
            why: "Python passes the object before the dot as `self`."
          - text: "The class `Dog`"
            why: "`self` is one object, not the plan."
          - text: "A copy of `rex`"
            why: "It is the same object. A change through `self` changes `rex`."
      - kind: mcq
        id: q-init
        objective: O2
        prompt: "When does `__init__` run?"
        options:
          - text: "Each time an object is made, for example by `Dog(\"Rex\", 3)`"
            correct: true
            why: "It gives the new object its first attributes."
          - text: "Once, when Python reads the class"
            why: "Reading the class only makes the plan."
          - text: "Only when you call `rex.__init__()`"
            why: "You never call it yourself. Python calls it for you."
      - kind: mcq
        id: q-attr
        objective: O3
        prompt: "`a = Dog(\"Ada\", 5)` and `b = Dog(\"Bo\", 1)`. Then `b.age = 2`. What is `a.age`?"
        options:
          - text: "5"
            correct: true
            why: "Two objects, each with its own attributes."
          - text: "2"
            why: "That would be true for one object with two names. Here are two objects."
          - text: "An AttributeError"
            why: "`a` has `age`: `__init__` gave it."
      - kind: mcq
        id: q-no-self
        objective: O5
        prompt: "In a method, you write `count = count + 1` instead of `self.count = self.count + 1`. What happens?"
        options:
          - text: "An error: `count` is a new local name without a value"
            correct: true
            why: "Without `self.`, Python does not look at the object."
          - text: "It works the same"
            why: "Only `self.count` is the attribute."
          - text: "Python adds `self.` for you"
            why: "Python never adds it. You write it."

  # 10. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O2
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-make
    objective: O2
    prompt: "Which line makes a new `Book` object?"
    options:
      - text: "`b = Book(\"Atlas\", 120)`"
        correct: true
        why: "Calling the class makes an object and runs `__init__`."
      - text: "`b = Book`"
        why: "That gives the class a second name. It makes no object."
      - text: "`class b(Book):`"
        why: "That starts a new class."
  - kind: mcq
    id: r-attr
    objective: O3
    prompt: "How do you read the attribute `title` of the object `b`?"
    options:
      - text: "`b.title`"
        correct: true
        why: "A dot, then the name of the attribute."
      - text: "`b[\"title\"]`"
        why: "That is for dictionaries. Objects use a dot."
      - text: "`title(b)`"
        why: "That calls a function `title`."
  - kind: mcq
    id: r-self-first
    objective: O4
    prompt: "Which line starts a correct method?"
    options:
      - text: "`def summary(self):`"
        correct: true
        why: "A method gets the object as its first value."
      - text: "`def summary():`"
        why: "Without `self`, calling it on an object gives a TypeError."
      - text: "`def self.summary():`"
        why: "That is not Python. `self` goes in the parentheses."
  - kind: mcq
    id: r-no-args
    objective: O5
    prompt: "`Dog(\"Rex\", 3)` says `TypeError: Dog() takes no arguments`. What is wrong?"
    options:
      - text: "The class has no `__init__`, maybe because of a typo in its name"
        correct: true
        why: "`__init__` has two underscores on each side."
      - text: "Rex is too old"
        why: "Python does not check the values. It found no `__init__`."
      - text: "Objects cannot get values"
        why: "They get them through `__init__`."
  - kind: mcq
    id: r-two-objects
    objective: O1
    prompt: "Two objects come from the same class. Do they share their attributes?"
    options:
      - text: "No. Each object has its own"
        correct: true
        why: "The class is the shared plan. The values belong to each object."
      - text: "Yes, always"
        why: "Each call of the class makes a new object with its own attributes."
      - text: "Only the first attribute"
        why: "No attribute is shared."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-rectangle
    type: exercise
    fade: completion
    objective: O4
    title: A class for rectangles
    prompt: |
      **Replace the three `___`**: keep the width and the height in the
      object, and give back the area in the method.

      ```text
      12
      50
      ```
    starter: |
      class Rectangle:
          def __init__(self, width, height):
              ___ = width
              ___ = height

          def area(self):
              return ___


      print(Rectangle(3, 4).area())
      print(Rectangle(5, 10).area())
    solution: |
      class Rectangle:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          def area(self):
              return self.width * self.height


      print(Rectangle(3, 4).area())
      print(Rectangle(5, 10).area())
    after: >-
      `self.width = width` keeps the value in the object, so another method
      can read it later with `self.width`.
    checks:
      - expr: "callable(ns.get('Rectangle')) and Rectangle(2, 7).width == 2 and Rectangle(2, 7).height == 7"
        pass: "Each rectangle keeps its width and height"
        hint: "`self.width = width` and `self.height = height`."
      - expr: "callable(ns.get('Rectangle')) and Rectangle(2, 7).area() == 14 and Rectangle(0, 3).area() == 0"
        pass: "area gives width times height"
        hint: "`return self.width * self.height`."
      - expr: "lines == ['12', '50']"
        pass: "It prints 12 and 50"
        hint: "Keep the prints."
    hints:
      - "Attributes are written with `self.`."
      - "`self.width = width`."
      - "In `area`: `return self.width * self.height`."
  - id: x-lamp
    type: exercise
    fade: debug
    objective: O5
    title: A lamp that will not switch
    prompt: |
      The program stops with a `TypeError` about positional arguments.
      **Fix the class**:

      ```text
      True
      False
      ```
    starter: |
      class Lamp:
          def __init__(self):
              self.on = False

          def switch():
              self.on = not self.on


      lamp = Lamp()
      lamp.switch()
      print(lamp.on)
      lamp.switch()
      print(lamp.on)
    solution: |
      class Lamp:
          def __init__(self):
              self.on = False

          def switch(self):
              self.on = not self.on


      lamp = Lamp()
      lamp.switch()
      print(lamp.on)
      lamp.switch()
      print(lamp.on)
    after: >-
      `lamp.switch()` gives the object to the method as the first argument.
      Without `self` in the `def`, there is no place for it: "takes 0
      positional arguments but 1 was given".
