id: command-line-tools
order: 41
title: Command-line tools
summary: Write programs that take their input from the command line, like real tools - sys.argv, argparse with options and help, exit codes, and logging instead of print.
minutes: 45
outcomes: [A1, A4]

objectives:
  - id: O1
    text: Read the words after the program name with sys.argv
  - id: O2
    text: Build a command line with argparse - arguments, options, flags, types and help
  - id: O3
    text: End a program with an exit code that tells other programs if it worked
  - id: O4
    text: Report what a program does with logging, at the right level

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: argv
    type: theory
    objective: O1
    title: Words after the program name
    body: |
      Many tools take their input from the command line, not from
      `input()`:

      ```text
      python main.py report.csv --top 3
      ```

      Python puts the words in the list `sys.argv`:

      ```python
      import sys

      sys.argv          # ['main.py', 'report.csv', '--top', '3']
      sys.argv[0]       # 'main.py': the program itself
      sys.argv[1:]      # the words for your program
      ```

      Every word is a **text**: `'3'`, not `3`. A space separates words;
      quotes keep a text with spaces together: `python main.py "New York"`
      gives one word.

      Why not `input()`? A tool with words can run without a person: from
      a script, from a scheduled task, from another program, a thousand
      times. That is how developers use tools like `git`, `pip` and `pytest`.

      In this course, the field `> python main.py` above the output is your
      command line: type the words there, then press **Run**.
    keys:
      - code: "sys.argv"
        means: "The program name, then each word, as texts."
      - code: "sys.argv[1:]"
        means: "Only the words after the program name."
      - code: "\"New York\""
        means: "Quotes: one word with a space."

  # 2. DEMO ------------------------------------------------------------------
  - id: argv-demo
    type: demo
    visual: none
    objective: O1
    title: Your first command line
    argv: ["Ada"]
    intro: |
      Press **Run**. Then change the words in the field `> python main.py`
      and run again.
    code: |
      import sys

      print("Program:", sys.argv[0])
      print("Words:", sys.argv[1:])

      name = sys.argv[1] if len(sys.argv) > 1 else "world"
      print(f"Hello, {name}!")
    experiments:
      - text: "Run it as it is."
        expr: "err is None and lines[-1:] == ['Hello, Ada!']"
      - text: "Type two names, like `Ada Grace`. Which one is greeted?"
        expr: "len(argv) >= 2"
      - text: "Now put the two names in quotes: `\"Ada Grace\"`."
        expr: "any(' ' in word for word in argv)"
      - text: "Empty the field and run."
        expr: "argv == [] and lines[-1:] == ['Hello, world!']"
    investigate:
      - kind: mcq
        id: i-type
        prompt: "The command is `python main.py 5`. What is `sys.argv[1]`?"
        options:
          - text: "`'5'`, a text"
            correct: true
            why: "Every word is a text. Use `int(sys.argv[1])` for a number."
          - text: "`5`, a number"
            why: "The command line has only texts."
          - text: "`'main.py'`"
            why: "That is `sys.argv[0]`."
      - kind: mcq
        id: i-empty
        prompt: "Without any words, why does the program not stop with an `IndexError`?"
        options:
          - text: "It checks `len(sys.argv) > 1` before it reads `sys.argv[1]`"
            correct: true
            why: "With no words, `sys.argv` is only `['main.py']`."
          - text: "`sys.argv` always has two items"
            why: "It has one item for the program, plus one for each word."
          - text: "Python fills in `world` by itself"
            why: "The program does, in the `else`."

  # 3. EXERCISE: completion --------------------------------------------------
  - id: ex-sum
    type: exercise
    fade: completion
    objective: O1
    title: Add the numbers of the command
    prompt: |
      `python main.py 3 4 5` should print `12`. **Replace the two `___`**:
      turn each word after the program name into a whole number.

      ```text
      12
      ```
    starter: |
      import sys

      numbers = [___ for word in ___]
      print(sum(numbers))
    solution: |
      import sys

      numbers = [int(word) for word in sys.argv[1:]]
      print(sum(numbers))
    after: >-
      `sys.argv[1:]` skips the name of the program, and `int` turns each
      text into a number. With no words, the list is empty and the sum is 0.
    cases:
      - argv: ["3", "4", "5"]
      - label: "the command is `python main.py 10`"
        argv: ["10"]
      - label: "the command is `python main.py -2 2`"
        argv: ["-2", "2"]
      - label: "the command is `python main.py` without words"
        argv: []
    checks:
      - expr: "err is None and lines == [str(sum(int(word) for word in argv))]"
        pass: "It prints the sum of the words"
        hint: "`int(word) for word in sys.argv[1:]`."
        misconceptions:
          - when: "err == 'ValueError' and 'main.py' in out"
            say: "`sys.argv[0]` is the name of the program, `'main.py'`, and it is not a number. Use `sys.argv[1:]`."
          - when: "err == 'TypeError'"
            say: "The words are texts. Turn each one into a number with `int(word)`."
      - expr: "'sys.argv' in src"
        pass: "It reads the words from `sys.argv`"
        hint: "The words are in `sys.argv`."
    hints:
      - "The words are in `sys.argv`, but the first item is the program name."
      - "`sys.argv[1:]` is the list without it."
      - "`[int(word) for word in sys.argv[1:]]`."

  # 4. THEORY ----------------------------------------------------------------
  - id: argparse
    type: theory
    objective: O2
    title: argparse and exit codes
    body: |
      With more than one or two words, `sys.argv` gets hard: which word is
      which, what if one is missing, what does `--top` mean? The standard
      module **argparse** does it for you:

      ```python
      import argparse

      parser = argparse.ArgumentParser(description="Show the top words.")
      parser.add_argument("file")                              # needed
      parser.add_argument("--top", type=int, default=10)       # an option
      parser.add_argument("-i", "--ignore-case", action="store_true")  # a flag
      args = parser.parse_args()

      args.file, args.top, args.ignore_case    # 'a.txt', 3, True
      ```

      argparse also writes the **help** for `-h`, and for a missing or wrong
      word it prints the usage and an error, and stops the program.

      ## Exit codes

      Every program ends with a number, its **exit code**: `0` means "it
      worked", anything else means a problem. Scripts and other programs
      read it; you saw it in the terminal lessons. argparse uses `2` for
      wrong words. Your program sets it with `sys.exit`:

      ```python
      sys.exit(0)                            # worked
      sys.exit(1)                            # a problem
      sys.exit("No such file: a.txt")        # print the text, exit code 1
      ```

      In this course, a code that is not 0 shows next to **Output**.
    keys:
      - code: "add_argument(\"file\")"
        means: "A word that must be there."
      - code: "\"--top\", type=int"
        means: "An option with a value; argparse checks that it is an `int`."
      - code: "action=\"store_true\""
        means: "A flag: `True` if it is there."
      - code: "sys.exit(\"message\")"
        means: "Print the message, end with exit code 1."

  # 5. DEMO ------------------------------------------------------------------
  - id: argparse-demo
    type: demo
    visual: none
    objective: O2
    title: A tool with options and help
    argv: ["Ada", "--times", "2"]
    intro: |
      This tool greets someone. Press **Run**, then try the command line:
      `-h`, no name at all, `--shout`, and `--times two`.
    code: |
      import argparse

      parser = argparse.ArgumentParser(description="Say hello.")
      parser.add_argument("name", help="who to greet")
      parser.add_argument("--times", type=int, default=1, help="how many times")
      parser.add_argument("--shout", action="store_true", help="in capital letters")
      args = parser.parse_args()

      text = f"Hello, {args.name}!"
      if args.shout:
          text = text.upper()
      for _ in range(args.times):
          print(text)
    experiments:
      - text: "Type `-h` as the only word. argparse writes the help."
        expr: "'usage:' in out and 'how many times' in out and exit_code == 0"
      - text: "Empty the field: the name is missing."
        expr: "'required: name' in out and exit_code == 2"
      - text: "Add the flag `--shout`."
        expr: "any(line.isupper() and 'HELLO' in line for line in lines)"
      - text: "Try `Ada --times two`."
        expr: "'invalid int value' in out and exit_code == 2"
    investigate:
      - kind: mcq
        id: i-exit
        prompt: "For a missing name, argparse ends the program with exit code 2. Who reads that number?"
        options:
          - text: "A script or program that started the tool, to know that it went wrong"
            correct: true
            why: "Exit code 0 is success; anything else tells the caller to stop or try again."
          - text: "Nobody: it is only for Python"
            why: "Every program gives one, and terminals and scripts use it."
          - text: "The user must type it"
            why: "The program gives it when it ends."

  # 6. EXERCISE: independent -------------------------------------------------
  - id: ex-search
    type: exercise
    fade: independent
    objective: O2
    title: A search tool
    prompt: |
      **Write a tool with argparse**: `python main.py WORD FILE` prints each
      line of the file that has the word in it.

      - `-i` (or `--ignore-case`): capitals do not matter.
      - `--count`: print only how many lines were found.
      - A file that does not exist: end with
        `sys.exit(f"No such file: {args.file}")`.

      ```text
      > python main.py tea notes.txt
      Buy green tea and milk.
      steam the rice
      ```
    files:
      notes.txt: |
        Tea at five.
        Buy green tea and milk.
        Call Tom.
        TEA PARTY on Sunday
        steam the rice
    starter: |
      import argparse
      import sys
      from pathlib import Path

      # Your tool here.
    solution: |
      import argparse
      import sys
      from pathlib import Path

      parser = argparse.ArgumentParser(description="Show the lines of a file that have a word.")
      parser.add_argument("word")
      parser.add_argument("file")
      parser.add_argument("-i", "--ignore-case", action="store_true")
      parser.add_argument("--count", action="store_true")
      args = parser.parse_args()

      path = Path(args.file)
      if not path.exists():
          sys.exit(f"No such file: {args.file}")

      found = []
      for line in path.read_text().splitlines():
          if args.ignore_case:
              hit = args.word.lower() in line.lower()
          else:
              hit = args.word in line
          if hit:
              found.append(line)

      if args.count:
          print(len(found))
      else:
          for line in found:
              print(line)
    after: >-
      You wrote a small `grep`, the search tool of Linux. With argparse, the
      help, the missing word and a bad option are handled before your own
      code even starts.
    cases:
      - argv: ["tea", "notes.txt"]
      - label: "the command is `python main.py TEA notes.txt -i`"
        argv: ["TEA", "notes.txt", "-i"]
      - label: "the command is `python main.py tea notes.txt --count`"
        argv: ["tea", "notes.txt", "--count"]
      - label: "the command is `python main.py tea missing.txt`"
        argv: ["tea", "missing.txt"]
      - label: "the command is `python main.py tea` (no file)"
        argv: ["tea"]
    checks:
      - expr: "argv != ['tea', 'notes.txt'] or (err is None and lines == ['Buy green tea and milk.', 'steam the rice'])"
        pass: "It prints the lines that have the word"
        hint: "Loop over the lines and keep those with `args.word in line`."
        misconceptions:
          - when: "'Tea at five.' in lines and argv == ['tea', 'notes.txt']"
            say: "Without `-i`, capitals matter: `Tea` is not `tea`."
      - expr: "argv != ['TEA', 'notes.txt', '-i'] or lines == ['Tea at five.', 'Buy green tea and milk.', 'TEA PARTY on Sunday', 'steam the rice']"
        pass: "With `-i`, capitals do not matter"
        hint: "`parser.add_argument(\"-i\", \"--ignore-case\", action=\"store_true\")`, then compare `.lower()` of both."
        misconceptions:
          - when: "argv == ['TEA', 'notes.txt', '-i'] and exit_code == 2"
            say: "argparse does not know `-i` yet. Add it with `action=\"store_true\"`."
      - expr: "argv != ['tea', 'notes.txt', '--count'] or lines == ['2']"
        pass: "With `--count`, it prints only the number"
        hint: "`if args.count: print(len(found))`."
      - expr: "argv != ['tea', 'missing.txt'] or (exit_code == 1 and lines[-1:] == ['No such file: missing.txt'])"
        pass: "A missing file gives a message and exit code 1"
        hint: "`if not path.exists(): sys.exit(f\"No such file: {args.file}\")`."
        misconceptions:
          - when: "argv == ['tea', 'missing.txt'] and err == 'FileNotFoundError'"
            say: "The file does not exist, and `read_text` fails. Check `path.exists()` first."
          - when: "argv == ['tea', 'missing.txt'] and exit_code == 0"
            say: "The tool says it worked (exit code 0). End with `sys.exit(f\"No such file: {args.file}\")`: that prints the text and gives exit code 1."
      - expr: "argv != ['tea'] or exit_code == 2"
        pass: "A missing file name is refused by argparse"
        hint: "Make `file` an argument that is needed: `parser.add_argument(\"file\")`."
      - expr: "'argparse' in src and called('parse_args')"
        pass: "It uses argparse"
        hint: "`args = parser.parse_args()`."
    hints:
      - "Two arguments that are needed: `add_argument(\"word\")` and `add_argument(\"file\")`; two flags with `action=\"store_true\"`."
      - "Check the file before you read it, with `sys.exit(...)` when it is missing."
      - "Collect the found lines in a list; at the end print the list, or its `len` for `--count`."

  # 7. EXERCISE: debug -------------------------------------------------------
  - id: ex-exit
    type: exercise
    fade: debug
    objective: O3
    title: A check that says OK too often
    prompt: |
      This tool checks a text file: lines must be at most 40 characters.
      A script runs it for many files and stops when a file has problems,
      using the **exit code**. But the script never stops.

      **Find the bug and fix it**: with problems, the exit code must be 1;
      without problems, 0.

      ```text
      > python main.py poem.txt
      line 2: too long (44 > 40)
      1 problem
      ```
    files:
      poem.txt: |
        Roses are red.
        Violets are blue, and this line is too long.
        Short again.
      short.txt: |
        All good.
        Still good.
    starter: |
      import sys
      from pathlib import Path


      def problems(text):
          return [
              f"line {number}: too long ({len(line)} > 40)"
              for number, line in enumerate(text.splitlines(), start=1)
              if len(line) > 40
          ]


      found = problems(Path(sys.argv[1]).read_text())
      for problem in found:
          print(problem)
      if found:
          print(f"{len(found)} problem" + ("s" if len(found) > 1 else ""))
          sys.exit(0)
      print("OK")
    solution: |
      import sys
      from pathlib import Path


      def problems(text):
          return [
              f"line {number}: too long ({len(line)} > 40)"
              for number, line in enumerate(text.splitlines(), start=1)
              if len(line) > 40
          ]


      found = problems(Path(sys.argv[1]).read_text())
      for problem in found:
          print(problem)
      if found:
          print(f"{len(found)} problem" + ("s" if len(found) > 1 else ""))
          sys.exit(1)
      print("OK")
    after: >-
      To a person, the output looked right. To a script, only the exit code
      counts, and 0 said "all good". Tools like pytest, git and pip do the
      same: they end with 0 only when everything worked.
    cases:
      - argv: ["poem.txt"]
      - label: "the command is `python main.py short.txt`"
        argv: ["short.txt"]
    checks:
      - expr: "argv != ['poem.txt'] or (exit_code == 1 and lines == ['line 2: too long (44 > 40)', '1 problem'])"
        pass: "With problems, it ends with exit code 1"
        hint: "`sys.exit(1)` after the problems."
        misconceptions:
          - when: "argv == ['poem.txt'] and exit_code == 0"
            say: "The output shows a problem, but the exit code is 0, which means \"it worked\". Use `sys.exit(1)`."
      - expr: "argv != ['short.txt'] or (exit_code == 0 and lines == ['OK'])"
        pass: "Without problems, it prints OK and ends with exit code 0"
        hint: "Change only the exit code of the problems."
    hints:
      - "Read the task again: what number means a problem?"
      - "`sys.exit(0)` means it worked."
      - "Change it to `sys.exit(1)`."

  # 8. THEORY ----------------------------------------------------------------
  - id: logging
    type: theory
    objective: O4
    title: logging instead of print
    body: |
      `print` is for the result of the tool. Messages about the work - what
      it does, what it skips, what went wrong - belong in the **log**. The
      standard module `logging` gives each message a **level**:

      | Level | For |
      | --- | --- |
      | `DEBUG` | details to find a bug |
      | `INFO` | what the program does |
      | `WARNING` | something odd; the program goes on |
      | `ERROR` | something failed |

      ```python
      import logging

      logging.basicConfig(level=logging.WARNING, format="%(levelname)s: %(message)s")
      log = logging.getLogger("prices")

      log.debug("read 3 lines")           # hidden: below WARNING
      log.warning("skipped 'abc'")        # WARNING: skipped 'abc'
      ```

      One line, `basicConfig`, decides what is shown: a `--verbose` flag can
      set the level to `DEBUG`, and `filename="tool.log"` writes the log to a
      file. Log messages go to **stderr**, not to the normal output, so a
      result like `print(total)` stays clean for other programs.
    keys:
      - code: "logging.basicConfig(level=...)"
        means: "Show this level and the levels above it."
      - code: "log = logging.getLogger(\"name\")"
        means: "A logger for one part of the program."
      - code: "log.warning(\"...\")"
        means: "A message at the level WARNING."
      - code: "filename=\"tool.log\""
        means: "Write the log to a file instead."

  # 9. EXERCISE: completion --------------------------------------------------
  - id: ex-logging
    type: exercise
    fade: completion
    objective: O4
    title: A quiet tool with a --verbose flag
    prompt: |
      The tool adds the numbers of the command line and skips words that
      are not numbers. **Replace the two `___`**:

      - Normally, only warnings show. With `-v`, the debug messages too.
      - A skipped word is a **warning**.

      ```text
      > python main.py 3 x 4.5
      WARNING: skipped 'x': not a number
      Total: 7.5
      ```
    starter: |
      import argparse
      import logging

      parser = argparse.ArgumentParser(description="Add numbers.")
      parser.add_argument("numbers", nargs="*")
      parser.add_argument("-v", "--verbose", action="store_true")
      args = parser.parse_args()

      logging.basicConfig(level=___, format="%(levelname)s: %(message)s")
      log = logging.getLogger("total")

      total = 0
      for text in args.numbers:
          try:
              total = total + float(text)
              log.debug(f"added {text}")
          except ValueError:
              log.___(f"skipped {text!r}: not a number")
      print(f"Total: {total:g}")
    solution: |
      import argparse
      import logging

      parser = argparse.ArgumentParser(description="Add numbers.")
      parser.add_argument("numbers", nargs="*")
      parser.add_argument("-v", "--verbose", action="store_true")
      args = parser.parse_args()

      logging.basicConfig(level=logging.DEBUG if args.verbose else logging.WARNING, format="%(levelname)s: %(message)s")
      log = logging.getLogger("total")

      total = 0
      for text in args.numbers:
          try:
              total = total + float(text)
              log.debug(f"added {text}")
          except ValueError:
              log.warning(f"skipped {text!r}: not a number")
      print(f"Total: {total:g}")
    after: >-
      The same code is quiet for daily use and talkative when you look for
      a bug. That is why tools have `-v`: the debug lines stay in the code,
      and one flag shows them.
    cases:
      - argv: ["3", "x", "4.5"]
      - label: "the command is `python main.py -v 3 4`"
        argv: ["-v", "3", "4"]
      - label: "the command is `python main.py 1 2`"
        argv: ["1", "2"]
    checks:
      - expr: "argv != ['3', 'x', '4.5'] or lines == [\"WARNING: skipped 'x': not a number\", 'Total: 7.5']"
        pass: "A word that is not a number gives a warning"
        hint: "`log.warning(...)` in the `except`."
        misconceptions:
          - when: "err == 'NameError'"
            say: "A `___` is still in the code. Replace both."
      - expr: "argv != ['-v', '3', '4'] or lines == ['DEBUG: added 3', 'DEBUG: added 4', 'Total: 7']"
        pass: "With `-v`, the debug messages show"
        hint: "`level=logging.DEBUG if args.verbose else logging.WARNING`."
      - expr: "argv != ['1', '2'] or lines == ['Total: 3']"
        pass: "Without `-v` and without problems, only the result shows"
        hint: "The normal level is `logging.WARNING`: debug messages stay hidden."
        misconceptions:
          - when: "argv == ['1', '2'] and any(line.startswith('DEBUG') for line in lines)"
            say: "The debug messages always show. Use `logging.DEBUG` only when `args.verbose` is `True`."
    hints:
      - "The level depends on `args.verbose`."
      - "`logging.DEBUG if args.verbose else logging.WARNING`."
      - "The method for a warning is `log.warning(...)`."

  # 10. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O1
    title: Check what you know
    items:
      - kind: mcq
        id: q-argv
        objective: O1
        prompt: "The command is `python main.py copy \"my file.txt\"`. What is `sys.argv`?"
        options:
          - text: "`['main.py', 'copy', 'my file.txt']`"
            correct: true
            why: "Quotes keep the words with a space together."
          - text: "`['main.py', 'copy', 'my', 'file.txt']`"
            why: "Without quotes it would be that."
          - text: "`['copy', 'my file.txt']`"
            why: "The first item is the program name."
      - kind: mcq
        id: q-type-int
        objective: O2
        prompt: "Why write `add_argument(\"--top\", type=int)` and not read the text yourself?"
        options:
          - text: "argparse turns it into an `int`, and refuses `--top ten` with a clear message and exit code 2"
            correct: true
            why: "The check is done before your code runs."
          - text: "Because `int()` does not work on texts from the command line"
            why: "It works, but then you must write the error handling yourself."
          - text: "It makes the program faster"
            why: "It is about checking and clear messages."
      - kind: mcq
        id: q-exit-zero
        objective: O3
        prompt: "What does exit code 0 tell a script?"
        options:
          - text: "The program worked"
            correct: true
            why: "Any other number means a problem."
          - text: "The program found nothing"
            why: "0 means success, even when nothing was found."
          - text: "The program had 0 errors to print"
            why: "It is about success, not about printed text."
      - kind: mcq
        id: q-level
        objective: O4
        prompt: "The level is `logging.WARNING`. Which messages show?"
        options:
          - text: "WARNING and ERROR"
            correct: true
            why: "A level shows itself and the levels above it."
          - text: "Only WARNING"
            why: "Higher levels show too."
          - text: "All of them"
            why: "DEBUG and INFO are below WARNING."
      - kind: mcq
        id: q-stderr
        objective: O4
        prompt: "Why do log messages go to stderr and not to the normal output?"
        options:
          - text: "So the result of the tool stays clean for other programs that read it"
            correct: true
            why: "`python main.py > result.txt` saves only the result; the log still shows on the screen."
          - text: "Because stderr is faster"
            why: "It is about keeping two kinds of text apart."
          - text: "Because log messages are always errors"
            why: "INFO and DEBUG are not errors."

  # 11. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 6

review:
  - kind: mcq
    id: r-argv0
    objective: O1
    prompt: "What is `sys.argv[0]`?"
    options:
      - text: "The name of the program, like `main.py`"
        correct: true
        why: "The words for your program start at index 1."
      - text: "The first word after the program name"
        why: "That is `sys.argv[1]`."
      - text: "The number of words"
        why: "That is `len(sys.argv) - 1`."
  - kind: mcq
    id: r-flag
    objective: O2
    prompt: "Which line makes a flag `--dry-run` that is `True` when it is there?"
    options:
      - text: "`parser.add_argument(\"--dry-run\", action=\"store_true\")`"
        correct: true
        why: "argparse makes the name `args.dry_run`, with `_`."
      - text: "`parser.add_argument(\"--dry-run\", type=bool)`"
        why: "That needs a value after it, and any text but `\"\"` is True."
      - text: "`parser.add_argument(\"dry-run\")`"
        why: "Without `--`, it is a word that must be there."
  - kind: mcq
    id: r-help
    objective: O2
    prompt: "Where does the text for `python main.py -h` come from?"
    options:
      - text: "argparse writes it, from the arguments and their `help=`"
        correct: true
        why: "You get help for free."
      - text: "You must write it with `print`"
        why: "argparse does it."
      - text: "Python has a help text for every program"
        why: "Only for programs that use argparse."
  - kind: mcq
    id: r-exit-text
    objective: O3
    prompt: "What does `sys.exit(\"No such file\")` do?"
    options:
      - text: "It prints the text (to stderr) and ends with exit code 1"
        correct: true
        why: "A text in `sys.exit` means a problem."
      - text: "It ends with exit code 0 and prints nothing"
        why: "That is `sys.exit()` or `sys.exit(0)`."
      - text: "It raises an error that the user sees as a traceback"
        why: "`SystemExit` ends the program without a traceback."
  - kind: mcq
    id: r-debug-level
    objective: O4
    prompt: "A tool has `log.debug(...)` lines, and they do not show. Why?"
    options:
      - text: "The level of the log is above DEBUG, like WARNING"
        correct: true
        why: "Set `level=logging.DEBUG` (for example with a `--verbose` flag) to see them."
      - text: "`debug` messages are never shown"
        why: "They show at the level DEBUG."
      - text: "Logs only work in files"
        why: "By default they go to stderr, on the screen."
  - kind: mcq
    id: r-why-cli
    objective: O1
    prompt: "Why do developers give tools command-line words instead of `input()` questions?"
    options:
      - text: "A script, a scheduled task or another program can run the tool without a person"
        correct: true
        why: "That is how tools are put together into bigger jobs."
      - text: "`input()` does not work outside the browser"
        why: "It works, but someone must type."
      - text: "Command lines are faster to type"
        why: "The point is to run without a person at all."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-usage
    type: exercise
    fade: completion
    objective: O3
    title: A usage line without argparse
    prompt: |
      A tiny tool: `python main.py NAME` greets the name. Without a name it
      must print `Usage: python main.py NAME` and end with exit code 2.
      **Replace the two `___`**.
    starter: |
      import sys

      if len(sys.argv) < ___:
          print("Usage: python main.py NAME")
          sys.exit(___)

      print(f"Hello, {sys.argv[1]}!")
    solution: |
      import sys

      if len(sys.argv) < 2:
          print("Usage: python main.py NAME")
          sys.exit(2)

      print(f"Hello, {sys.argv[1]}!")
    after: >-
      `sys.argv` has the program name, so a name makes it 2 items long. Exit
      code 2 is the usual code for wrong words, the same as argparse.
    cases:
      - argv: ["Ada"]
      - label: "the command is `python main.py` without a name"
        argv: []
    checks:
      - expr: "argv != ['Ada'] or (exit_code == 0 and lines == ['Hello, Ada!'])"
        pass: "With a name, it greets"
        hint: "With a name, `len(sys.argv)` is 2."
      - expr: "argv != [] or (exit_code == 2 and lines == ['Usage: python main.py NAME'])"
        pass: "Without a name, it shows the usage and ends with exit code 2"
        hint: "`if len(sys.argv) < 2:` and `sys.exit(2)`."
        misconceptions:
          - when: "argv == [] and err == 'IndexError'"
            say: "Without a name, `sys.argv[1]` does not exist. The check must stop the program first."
    hints:
      - "How long is `sys.argv` with one name?"
      - "The program name plus the name: 2."
      - "`len(sys.argv) < 2` and `sys.exit(2)`."
  - id: x-choices
    type: exercise
    fade: independent
    objective: O2
    title: Convert temperatures
    prompt: |
      **Write a tool with argparse**: `python main.py 20 --to f` converts
      20 °C to Fahrenheit, `--to k` to Kelvin. The value is a `float`;
      `--to` takes only `f` or `k` (`choices=["f", "k"]`), and `f` is the
      default. Print the result with two decimals.

      ```text
      > python main.py 20 --to f
      68.00
      ```
    starter: |
      import argparse

      # Your tool here.
    solution: |
      import argparse

      parser = argparse.ArgumentParser(description="Convert from Celsius.")
      parser.add_argument("celsius", type=float)
      parser.add_argument("--to", choices=["f", "k"], default="f")
      args = parser.parse_args()

      if args.to == "f":
          result = args.celsius * 9 / 5 + 32
      else:
          result = args.celsius + 273.15
      print(f"{result:.2f}")
    after: >-
      `choices` and `type` move the checks into argparse: a wrong unit or a
      word that is not a number never reaches your code.
    cases:
      - argv: ["20", "--to", "f"]
      - label: "the command is `python main.py -40`"
        argv: ["-40"]
      - label: "the command is `python main.py 0 --to k`"
        argv: ["0", "--to", "k"]
      - label: "the command is `python main.py 20 --to x`"
        argv: ["20", "--to", "x"]
      - label: "the command is `python main.py warm`"
        argv: ["warm"]
    checks:
      - expr: "argv not in (['20', '--to', 'f'], ['-40']) or lines == [{'20': '68.00', '-40': '-40.00'}[argv[0]]]"
        pass: "It converts to Fahrenheit, also as the default"
        hint: "`args.celsius * 9 / 5 + 32`, with `f\"{result:.2f}\"`."
      - expr: "argv != ['0', '--to', 'k'] or lines == ['273.15']"
        pass: "`--to k` converts to Kelvin"
        hint: "`args.celsius + 273.15`."
      - expr: "argv not in (['20', '--to', 'x'], ['warm']) or exit_code == 2"
        pass: "A wrong unit or a word that is not a number is refused, with exit code 2"
        hint: "`type=float` for the value, `choices=[\"f\", \"k\"]` for `--to`."
    hints:
      - "`parser.add_argument(\"celsius\", type=float)`."
      - "`parser.add_argument(\"--to\", choices=[\"f\", \"k\"], default=\"f\")`."
      - "Compute with an `if`, then `print(f\"{result:.2f}\")`."
