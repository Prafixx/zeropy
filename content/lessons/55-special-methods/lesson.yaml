id: special-methods
order: 55
title: Properties and special methods
summary: Make your classes feel like Python's own types. Attributes that check themselves, other ways to make objects, and objects that work with +, ==, len(), for and sorted().
minutes: 45
outcomes: [A1, A8]

objectives:
  - id: O1
    text: Write a property - an attribute that is computed, or checked when it is set
  - id: O2
    text: Write a classmethod that makes objects another way, and a staticmethod
  - id: O3
    text: Make objects readable and comparable with __repr__, __eq__ and __lt__, so == and sorted() work
  - id: O4
    text: Make objects work with +, len(), in and for, with __add__, __len__, __contains__ and __iter__

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: property
    type: theory
    objective: O1
    title: An attribute that checks itself
    body: |
      With a plain attribute, anyone can write `t.celsius = -500`, and the
      object is wrong. A **property** looks like an attribute, but runs a
      method:

      ```python
      class Temperature:
          def __init__(self, celsius):
              self.celsius = celsius          # runs the setter below

          @property
          def celsius(self):                  # read: t.celsius
              return self._celsius

          @celsius.setter
          def celsius(self, value):           # write: t.celsius = ...
              if value < -273.15:
                  raise ValueError("Below absolute zero.")
              self._celsius = value

          @property
          def fahrenheit(self):               # computed, read-only
              return self._celsius * 9 / 5 + 32
      ```

      The value is kept in `self._celsius` (a leading `_` means "inside
      use"). The code that uses the class does not change: it still writes
      `t.celsius = 25` and reads `t.fahrenheit`. A property without a setter
      is read-only: `t.fahrenheit = 3` raises an AttributeError.
    keys:
      - code: "@property"
        means: "A method that is read like an attribute."
      - code: "@celsius.setter"
        means: "The method that runs on t.celsius = value."
      - code: "self._celsius"
        means: "Where the value is really kept."

  # 2. EXERCISE: completion --------------------------------------------------
  - id: ex-age
    type: exercise
    fade: completion
    objective: O1
    title: An age that cannot be wrong
    prompt: |
      **Replace the two `___`**: the setter refuses an age below 0 or above
      150 with a `ValueError`, **before** it keeps the value.

      ```text
      30
      age must be from 0 to 150
      30
      ```
    starter: |
      class Person:
          def __init__(self, name, age):
              self.name = name
              self.age = age

          @property
          def age(self):
              return self._age

          @age.___
          def age(self, value):
              if not 0 <= value <= 150:
                  ___
              self._age = value


      p = Person("Ana", 30)
      print(p.age)
      try:
          p.age = 200
      except ValueError as error:
          print(error)
      print(p.age)
    solution: |
      class Person:
          def __init__(self, name, age):
              self.name = name
              self.age = age

          @property
          def age(self):
              return self._age

          @age.setter
          def age(self, value):
              if not 0 <= value <= 150:
                  raise ValueError("age must be from 0 to 150")
              self._age = value


      p = Person("Ana", 30)
      print(p.age)
      try:
          p.age = 200
      except ValueError as error:
          print(error)
      print(p.age)
    after: >-
      `__init__` writes `self.age = age`, so even a new object goes through
      the check: `Person("Bo", -1)` is refused too.
    checks:
      - expr: "callable(ns.get('Person')) and Person('a', 0).age == 0 and Person('b', 150).age == 150 and raises(Person, 'c', -1) == 'ValueError' and raises(Person, 'd', 151) == 'ValueError'"
        pass: "Ages from 0 to 150 pass, others are refused, also in __init__"
        hint: "`@age.setter`, and `raise ValueError(...)` in the `if`."
      - expr: "callable(ns.get('Person')) and (lambda p: (raises(setattr, p, 'age', 999), p.age))(Person('e', 40)) == ('ValueError', 40)"
        pass: "A refused age does not change the old one"
        hint: "Raise the error before `self._age = value`."
      - expr: "err is None and lines == ['30', 'age must be from 0 to 150', '30']"
        pass: "It prints 30, the message, and 30"
        hint: "`raise ValueError(\"age must be from 0 to 150\")`."
    hints:
      - "The setter is made with the name of the property: `@age.setter`."
      - "A refused value raises an error."
      - "`raise ValueError(\"age must be from 0 to 150\")`."

  # 3. THEORY ----------------------------------------------------------------
  - id: classmethod
    type: theory
    objective: O2
    title: Other ways to make an object
    body: |
      Sometimes the data comes in another form, like the text
      `"2026-11-23"`. A **classmethod** gets the **class** itself (called
      `cls`) instead of an object, and can make a new object from anything:

      ```python
      class Date:
          def __init__(self, year, month, day):
              self.year, self.month, self.day = year, month, day

          @classmethod
          def from_text(cls, text):
              year, month, day = text.split("-")
              return cls(int(year), int(month), int(day))

          @staticmethod
          def is_leap(year):
              return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      d = Date.from_text("2026-11-23")
      Date.is_leap(2024)        # True
      ```

      A **staticmethod** gets neither the object nor the class: it is a
      plain function that belongs to the class by its topic. Python has
      classmethods of its own: `dict.fromkeys(["a", "b"], 0)` makes the dict
      `{"a": 0, "b": 0}`.
    keys:
      - code: "@classmethod  def f(cls, ...)"
        means: "Gets the class: often makes a new object."
      - code: "cls(...)"
        means: "Make an object of this class."
      - code: "@staticmethod"
        means: "A plain function that lives in the class."

  # 4. EXERCISE: independent -------------------------------------------------
  - id: ex-from-text
    type: exercise
    fade: independent
    objective: O2
    title: A product from a line of text
    prompt: |
      **Add a classmethod `from_line(cls, line)`** to `Product`: it makes a
      product from a line like `"tea;2.50"`, with the price as a float.

      ```text
      tea 2.5
      ```
    starter: |
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.price = price

          # Your classmethod here.


      tea = Product.from_line("tea;2.50")
      print(tea.name, tea.price)
    solution: |
      class Product:
          def __init__(self, name, price):
              self.name = name
              self.price = price

          @classmethod
          def from_line(cls, line):
              name, price = line.split(";")
              return cls(name.strip(), float(price))


      tea = Product.from_line("tea;2.50")
      print(tea.name, tea.price)
    after: >-
      `cls(...)` instead of `Product(...)` means a child class, like
      `Snack(Product)`, gets a `Snack` back from the same method.
    checks:
      - expr: "callable(ns.get('Product')) and (lambda p: (p.name, p.price))(Product.from_line('cake;4.75')) == ('cake', 4.75)"
        pass: "from_line makes a product with name and price"
        hint: "`name, price = line.split(\";\")`, then `return cls(name, float(price))`."
      - expr: "callable(ns.get('Product')) and isinstance(Product.__dict__.get('from_line'), classmethod)"
        pass: "It is a classmethod"
        hint: "Put `@classmethod` above it, with `cls` as the first parameter."
      - expr: "callable(ns.get('Product')) and type((type('Snack', (Product,), {})).from_line('chips;1.5')).__name__ == 'Snack'"
        pass: "It makes the right class, also for a child class"
        hint: "Return `cls(...)`, not `Product(...)`."
      - expr: "lines == ['tea 2.5']"
        pass: "It prints tea 2.5"
        hint: "Keep the last lines."
    hints:
      - "`@classmethod` and `def from_line(cls, line):`."
      - "Split the line at `;`, and turn the price into a float."
      - "`return cls(name, float(price))`."

  # 5. THEORY ----------------------------------------------------------------
  - id: dunders
    type: theory
    objective: O3
    title: Special methods
    body: |
      Python calls methods with **two underscores** on each side ("dunder"
      methods) for its own tools. Write them, and your objects work like
      Python's types:

      | You write | Python calls |
      |---|---|
      | `print([m])`, `repr(m)` | `m.__repr__()` |
      | `a == b` | `a.__eq__(b)` |
      | `a < b`, `sorted(...)`, `max(...)` | `a.__lt__(b)` |
      | `a + b` | `a.__add__(b)` |
      | `len(a)` | `a.__len__()` |
      | `x in a` | `a.__contains__(x)` |
      | `for x in a:` | `a.__iter__()` |

      ```python
      class Money:
          def __init__(self, cents):
              self.cents = cents

          def __repr__(self):
              return f"Money({self.cents})"

          def __add__(self, other):
              return Money(self.cents + other.cents)

          def __eq__(self, other):
              return isinstance(other, Money) and self.cents == other.cents
      ```

      `Money(150) + Money(250)` is `Money(400)`. Without `__eq__`, `==`
      only asks "the same object?". Without `__lt__`, `sorted()` stops with
      "'<' not supported". `functools.total_ordering` adds `<=`, `>` and
      `>=` from `__eq__` and `__lt__`.
    keys:
      - code: "__repr__"
        means: "How the object looks in lists, and with `repr()`."
      - code: "__eq__ / __lt__"
        means: "== and <, so sorted() works."
      - code: "__add__ / __len__ / __iter__"
        means: "+, len() and for."

  # 6. EXERCISE: completion --------------------------------------------------
  - id: ex-money
    type: exercise
    fade: completion
    objective: O4
    title: Money that adds up
    prompt: |
      **Replace the three `___`**: `+` gives a new `Money`, `==` compares
      the cents, and lists show `Money(400)`.

      ```text
      Money(400)
      True
      [Money(100), Money(25)]
      ```
    starter: |
      class Money:
          def __init__(self, cents):
              self.cents = cents

          def __repr__(self):
              return ___

          def __add__(self, other):
              return ___

          def __eq__(self, other):
              return isinstance(other, Money) and ___


      print(Money(150) + Money(250))
      print(Money(99) == Money(99))
      print([Money(100), Money(25)])
    solution: |
      class Money:
          def __init__(self, cents):
              self.cents = cents

          def __repr__(self):
              return f"Money({self.cents})"

          def __add__(self, other):
              return Money(self.cents + other.cents)

          def __eq__(self, other):
              return isinstance(other, Money) and self.cents == other.cents


      print(Money(150) + Money(250))
      print(Money(99) == Money(99))
      print([Money(100), Money(25)])
    after: >-
      `__add__` gives a **new** object and leaves both old ones as they are,
      like `+` on numbers does.
    checks:
      - expr: "callable(ns.get('Money')) and repr(Money(7)) == 'Money(7)'"
        pass: "__repr__ shows Money(7)"
        hint: "`return f\"Money({self.cents})\"`."
      - expr: "callable(ns.get('Money')) and (lambda a, b: (a + b).cents == 30 and a.cents == 10 and b.cents == 20)(Money(10), Money(20))"
        pass: "+ gives a new Money, and the old ones stay"
        hint: "`return Money(self.cents + other.cents)`."
      - expr: "callable(ns.get('Money')) and Money(5) == Money(5) and not (Money(5) == Money(6)) and not (Money(5) == 5)"
        pass: "== compares the cents of two Money objects"
        hint: "`self.cents == other.cents`."
      - expr: "err is None and lines == ['Money(400)', 'True', '[Money(100), Money(25)]']"
        pass: "It prints the three lines"
        hint: "Keep the prints."
    hints:
      - "`__repr__` returns a text that looks like the call that makes it."
      - "`__add__` makes a new object: `Money(self.cents + other.cents)`."
      - "`__eq__`: `self.cents == other.cents`."

  # 7. EXERCISE: debug -------------------------------------------------------
  - id: ex-sort
    type: exercise
    fade: debug
    objective: O3
    title: Players that cannot be sorted
    prompt: |
      `sorted(players)` stops with `TypeError: '<' not supported between
      instances of 'Player' and 'Player'`. **Teach `Player` to compare**: a
      player with fewer points comes first.

      ```text
      ['Bo', 'Cy', 'Ana']
      Ana
      ```
    starter: |
      class Player:
          def __init__(self, name, points):
              self.name = name
              self.points = points


      players = [Player("Ana", 30), Player("Bo", 10), Player("Cy", 20)]
      print([p.name for p in sorted(players)])
      print(max(players).name)
    solution: |
      class Player:
          def __init__(self, name, points):
              self.name = name
              self.points = points

          def __lt__(self, other):
              return self.points < other.points


      players = [Player("Ana", 30), Player("Bo", 10), Player("Cy", 20)]
      print([p.name for p in sorted(players)])
      print(max(players).name)
    after: >-
      `sorted`, `min` and `max` only need `<`. Another way, without a change
      to the class: `sorted(players, key=lambda p: p.points)`.
    checks:
      - expr: "err is None and lines == [\"['Bo', 'Cy', 'Ana']\", 'Ana']"
        pass: "sorted and max work"
        hint: "Add `def __lt__(self, other): return self.points < other.points`."
      - expr: "callable(ns.get('Player')) and Player('a', 1) < Player('b', 2) and not (Player('a', 3) < Player('b', 2))"
        pass: "< compares the points"
        hint: "`__lt__` gives True when self has fewer points."
    hints:
      - "Read the message: which operator is missing?"
      - "`<` calls the special method `__lt__`."
      - "`def __lt__(self, other): return self.points < other.points`."

  # 8. EXERCISE: independent -------------------------------------------------
  - id: ex-playlist
    type: exercise
    fade: independent
    objective: O4
    title: A playlist like a list
    prompt: |
      **Write the class `Playlist`**: it keeps a list of song names, with a
      method `add(song)`. Then make `len()`, `in` and `for` work on it.

      ```text
      2
      True
      Rain
      Sun
      ```
    starter: |
      # Your class here.


      songs = Playlist()
      songs.add("Rain")
      songs.add("Sun")
      print(len(songs))
      print("Sun" in songs)
      for song in songs:
          print(song)
    solution: |
      class Playlist:
          def __init__(self):
              self.songs = []

          def add(self, song):
              self.songs.append(song)

          def __len__(self):
              return len(self.songs)

          def __contains__(self, song):
              return song in self.songs

          def __iter__(self):
              return iter(self.songs)


      songs = Playlist()
      songs.add("Rain")
      songs.add("Sun")
      print(len(songs))
      print("Sun" in songs)
      for song in songs:
          print(song)
    after: >-
      `__iter__` hands the loop an iterator; `iter(self.songs)` borrows the
      one of the list, as in the lesson "Iterators and generators".
    checks:
      - expr: "callable(ns.get('Playlist')) and (lambda p: (p.add('x'), p.add('y'), len(p))[2])(Playlist()) == 2 and len(Playlist()) == 0"
        pass: "len() works"
        hint: "`def __len__(self): return len(self.songs)`."
      - expr: "callable(ns.get('Playlist')) and (lambda p: (p.add('x'), 'x' in p, 'z' in p)[1:])(Playlist()) == (True, False)"
        pass: "in works"
        hint: "`def __contains__(self, song): return song in self.songs`."
      - expr: "callable(ns.get('Playlist')) and (lambda p: (p.add('a'), p.add('b'), list(p))[2])(Playlist()) == ['a', 'b']"
        pass: "for works, in order"
        hint: "`def __iter__(self): return iter(self.songs)`."
      - expr: "callable(ns.get('Playlist')) and Playlist().__dict__ != Playlist.__dict__ and (lambda a, b: (a.add('x'), len(b))[1])(Playlist(), Playlist()) == 0"
        pass: "Each playlist has its own songs"
        hint: "Make the list in `__init__`: `self.songs = []`."
      - expr: "err is None and lines == ['2', 'True', 'Rain', 'Sun']"
        pass: "It prints 2, True and both songs"
        hint: "Keep the lines at the end."
    hints:
      - "Keep the songs in `self.songs = []`, made in `__init__`."
      - "`__len__` and `__contains__` ask the list."
      - "`def __iter__(self): return iter(self.songs)`."

  # 9. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O3
    title: Check yourself
    items:
      - kind: mcq
        id: q-readonly
        objective: O1
        prompt: "A class has `@property def fahrenheit(self)` and no setter. What does `t.fahrenheit = 50` do?"
        options:
          - text: "An AttributeError"
            correct: true
            why: "The property has no setter: a property without a setter is read-only."
          - text: "It changes celsius too"
            why: "Only a setter could do that."
          - text: "It makes a new attribute"
            why: "The property is in the way: Python refuses."
      - kind: predict
        id: q-repr
        objective: O3
        code: |
          class Box:
              def __init__(self, n):
                  self.n = n

              def __repr__(self):
                  return f"Box({self.n})"


          print([Box(1), Box(2)])
          print(Box(1) == Box(1))
        explain: "`__repr__` shows each box. Without `__eq__`, `==` asks if they are the same object: two new boxes are not."
      - kind: mcq
        id: q-cls
        objective: O2
        prompt: "What does a classmethod get as its first argument?"
        options:
          - text: "The class itself, called cls"
            correct: true
            why: "So it can make objects: `cls(...)`."
          - text: "The object, called self"
            why: "That is a normal method."
          - text: "Nothing"
            why: "That is a staticmethod."
      - kind: mcq
        id: q-sorted
        objective: O3
        prompt: "Which special method does `sorted()` need on your objects?"
        options:
          - text: "`__lt__`, for <"
            correct: true
            why: "Or give sorted a `key=` instead."
          - text: "`__len__`, for len"
            why: "That is for len()."
          - text: "`__repr__`, for text"
            why: "That is for showing the object."

  # 10. REVIEW --------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-property
    objective: O1
    prompt: "What is a property?"
    options:
      - text: "A method used like an attribute"
        correct: true
        why: "For example to check a value. `@property` for reading, `@name.setter` for writing."
      - text: "A private attribute"
        why: "A leading `_` marks inside use."
      - text: "An attribute of the class itself"
        why: "That is a class attribute."
  - kind: mcq
    id: r-underscore
    objective: O1
    prompt: "Why does the setter keep the value in `self._age`, not `self.age`?"
    options:
      - text: "`self.age = ...` would call the setter again"
        correct: true
        why: "It would repeat forever. The property has the name `age`; the stored value needs another name."
      - text: "Underscores are faster to read"
        why: "It is about the name, not speed."
      - text: "Python forbids `self.age` in a class"
        why: "Python allows it. The problem is the endless loop."
  - kind: mcq
    id: r-static
    objective: O2
    prompt: "When is a staticmethod a good choice?"
    options:
      - text: "For a helper that needs no `self`"
        correct: true
        why: "It belongs to the class's topic, but needs neither the object nor the class, like `Date.is_leap(2024)`."
      - text: "For every method of a class"
        why: "Most methods need self."
      - text: "To make objects from a text"
        why: "That is a classmethod."
  - kind: mcq
    id: r-add
    objective: O4
    prompt: "What does Python call for `a + b`, when a is your object?"
    options:
      - text: "`a.__add__(b)`"
        correct: true
        why: "Special methods connect your class to Python's operators."
      - text: "`a.add(b)` itself"
        why: "Only the dunder name is used."
      - text: "`sum([a, b])`"
        why: "`sum` is a function, not what `a + b` calls. It also starts from 0, so it needs more than `__add__`."
  - kind: mcq
    id: r-eq
    objective: O3
    prompt: "Without `__eq__`, what does `Money(5) == Money(5)` give?"
    options:
      - text: "False"
        correct: true
        why: "Without `__eq__`, == asks if they are the same object, and two new objects are different objects."
      - text: "True"
        why: "Only with an `__eq__` that compares the values."
      - text: "An error"
        why: "It works, but compares identity."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-rect-area
    type: exercise
    fade: completion
    objective: O1
    title: An area that is always right
    prompt: |
      **Replace the two `___`**: `area` is a read-only property, computed
      from width and height each time it is read.

      ```text
      12
      20
      ```
    starter: |
      class Rect:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          ___
          def area(self):
              return ___


      r = Rect(3, 4)
      print(r.area)
      r.width = 5
      print(r.area)
    solution: |
      class Rect:
          def __init__(self, width, height):
              self.width = width
              self.height = height

          @property
          def area(self):
              return self.width * self.height


      r = Rect(3, 4)
      print(r.area)
      r.width = 5
      print(r.area)
    after: >-
      A computed property can never be out of date: it is worked out from
      the other attributes every time.
    checks:
      - expr: "callable(ns.get('Rect')) and isinstance(Rect.__dict__.get('area'), property) and Rect(2, 9).area == 18"
        pass: "area is a property: width times height"
        hint: "`@property` and `return self.width * self.height`."
      - expr: "lines == ['12', '20']"
        pass: "It follows the change of width"
        hint: "Keep the lines at the end."
    hints:
      - "A decorator makes a method readable like an attribute."
      - "`@property`."
      - "`return self.width * self.height`."
  - id: x-vector
    type: exercise
    fade: independent
    objective: O4
    title: Vectors that add
    prompt: |
      **Write the class `Vector`** with `x` and `y`. `v + w` gives a new
      vector, `==` compares both parts, and `repr` shows `Vector(4, 6)`.

      ```text
      Vector(4, 6)
      True
      ```
    starter: |
      # Your class here.


      print(Vector(1, 2) + Vector(3, 4))
      print(Vector(1, 2) == Vector(1, 2))
    solution: |
      class Vector:
          def __init__(self, x, y):
              self.x = x
              self.y = y

          def __repr__(self):
              return f"Vector({self.x}, {self.y})"

          def __add__(self, other):
              return Vector(self.x + other.x, self.y + other.y)

          def __eq__(self, other):
              return isinstance(other, Vector) and (self.x, self.y) == (other.x, other.y)


      print(Vector(1, 2) + Vector(3, 4))
      print(Vector(1, 2) == Vector(1, 2))
    after: >-
      Three special methods, and vectors work with `+`, `==` and print. Many
      libraries (numpy too) are built this way.
    checks:
      - expr: "callable(ns.get('Vector')) and repr(Vector(-1, 0)) == 'Vector(-1, 0)'"
        pass: "repr shows Vector(x, y)"
        hint: "`__repr__` returns `f\"Vector({self.x}, {self.y})\"`."
      - expr: "callable(ns.get('Vector')) and Vector(1, 1) + Vector(2, 5) == Vector(3, 6) and not (Vector(1, 2) == Vector(2, 1))"
