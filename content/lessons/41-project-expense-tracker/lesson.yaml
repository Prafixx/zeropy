      - text: "Ask the user to make the file"
        why: "The program can make it itself."
  - kind: predict
    id: r-raise
    objective: O2
    code: |
      def positive(n):
          if n <= 0:
              raise ValueError("must be positive")
          return n

      try:
          positive(-1)
      except ValueError as error:
          print("Refused:", error)
    explain: "The function raises, and the caller catches the error and prints its message."
  - kind: predict
    id: r-dictcomp
    objective: O3
    code: |
      words = ["a", "bb", "a"]
      print({w: words.count(w) for w in set(words)} == {"a": 2, "bb": 1})
    explain: "The dictionary comprehension counts each word. The result is equal to the dictionary on the right."
  - kind: diagnose
    id: r-broken
    objective: O1
    mode: predict
    code: |
      import json

      print(json.loads("[1, 2,"))
    explain: "The JSON text stops in the middle, so `json` cannot read it."
  - kind: mcq
    id: r-pure
    objective: O4
    prompt: "Which functions of the tool were the easiest to test with `assert`?"
    options:
      - text: "`parse_amount` and `totals`"
        correct: true
        why: "No file and no input, so a test needs only one line."
      - text: "The command loop with `input`"
        why: "The loop needs input from a user. It is the hardest to test."
      - text: "`save_expenses`, because it writes a file"
