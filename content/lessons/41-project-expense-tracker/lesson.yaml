review:
  - kind: mcq
    id: r-missing
    objective: O1
    prompt: "What should a program do when its data file does not exist yet?"
    options:
      - text: "Start with empty data"
        correct: true
        why: "And make the file at the first save. On the first run there is never a file."
      - text: "Stop with a clear error message"
