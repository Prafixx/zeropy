  - kind: mcq
    id: r-continue
    objective: O4
    prompt: "In the `add` command, what does `continue` do after `Not a valid amount.`?"
    options:
      - text: "It goes back to the start of the loop"
        correct: true
        why: "So nothing is added: the lines after it, the append and the message, are skipped."
      - text: "It ends the loop and the program"
        why: "That is `break`."
      - text: "It adds the expense anyway"
        why: "`continue` skips the rest of this round."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: c-statement
    type: exercise
    fade: challenge
    objective: O1
    title: "Challenge: a bank statement"
    prompt: |
      `statement.csv` (see the files) has the columns `date`, `text`,
      `amount` and `category`. Some rows are broken: the amount is not a
      number. **Write a program** that:

      - reads the file with `csv.DictReader`,
      - adds up the amounts per category, and skips the broken rows,
      - prints the categories with the **biggest total first**, with 2
        decimals, then the total, then how many rows were skipped.

      ```text
      rent: 650.00
      food: 72.40
      travel: 18.00
      Total: 740.40
      Skipped: 1
      ```
    files:
      statement.csv: |
        date,text,amount,category
        2026-11-01,Flat,650,rent
        2026-11-02,Market,23.40,food
        2026-11-03,Bus,2.50,travel
        2026-11-03,Lunch,abc,food
        2026-11-05,Shop,49,food
        2026-11-07,Train,15.50,travel
    starter: |
      import csv

      # Write the whole program yourself.
    solution: |
      import csv

      totals = {}
      skipped = 0
      with open("statement.csv", newline="") as f:
          for row in csv.DictReader(f):
              try:
                  amount = float(row["amount"])
              except ValueError:
                  skipped = skipped + 1
                  continue
              category = row["category"]
              totals[category] = totals.get(category, 0) + amount
      for category in sorted(totals, key=totals.get, reverse=True):
          print(f"{category}: {totals[category]:.2f}")
      print(f"Total: {sum(totals.values()):.2f}")
      print(f"Skipped: {skipped}")
    after: >-
      Read, check, collect, sort, report: a real data job in 15 lines. One
      bad row does not stop the program, and it is counted, not hidden.
    cases:
      - {}
      - label: "the statement is different"
        files:
          statement.csv: "date,text,amount,category\n2026-12-01,A,10,b\n2026-12-02,B,x,b\n2026-12-03,C,,c\n2026-12-04,D,5.5,c\n2026-12-05,E,20,a\n"
    checks:
      - expr: "err is None and lines[:-2] == [f'{c}: {t:.2f}' for c, t in sorted({c: sum(float(r.split(',')[2]) for r in files['statement.csv'].splitlines()[1:] if r.split(',')[3] == c and r.split(',')[2].replace('.', '', 1).isdigit()) for c in {r.split(',')[3] for r in files['statement.csv'].splitlines()[1:] if r.split(',')[2].replace('.', '', 1).isdigit()}}.items(), key=lambda p: -p[1])]"
        pass: "One line per category, biggest total first, with 2 decimals"
        hint: "Add up in a dictionary, then loop over `sorted(totals, key=totals.get, reverse=True)`."
        misconceptions:
          - when: "err == 'ValueError'"
            say: "A broken amount stops the program. Put `float(...)` in `try:`, and skip the row in `except ValueError:`."
      - expr: "len(lines) >= 2 and lines[-2] == f\"Total: {sum(float(r.split(',')[2]) for r in files['statement.csv'].splitlines()[1:] if r.split(',')[2].replace('.', '', 1).isdigit()):.2f}\""
        pass: "The total of the good rows"
        hint: "`sum(totals.values())`, with 2 decimals."
      - expr: "lines[-1:] == [f\"Skipped: {sum(1 for r in files['statement.csv'].splitlines()[1:] if not r.split(',')[2].replace('.', '', 1).isdigit())}\"]"
        pass: "It counts the skipped rows"
        hint: "Add 1 to a counter in the `except` block."
      - expr: "'DictReader' in src and syntax('Try') >= 1"
        pass: "It uses csv.DictReader and try/except"
        hint: "`for row in csv.DictReader(f):` and `try: float(row[\"amount\"])`."
    hints:
      - "`with open(\"statement.csv\", newline=\"\") as f:` and `for row in csv.DictReader(f):`."
      - "`try: amount = float(row[\"amount\"])`, `except ValueError:` count it and `continue`."
      - "`totals[c] = totals.get(c, 0) + amount`; sort with `key=totals.get, reverse=True`."
  - id: c-log
    type: exercise
    fade: challenge
    objective: O2
    title: "Challenge: a log summary"
    prompt: |
      `app.log` (see the files) has lines like
      `2026-11-23 10:15:02 ERROR disk full`. Some lines are noise. **Write a
      program** that:

      - finds the lines with a date, a time and a level (`ERROR`,
        `WARNING` or `INFO`), with a regular expression,
      - counts each level, and notes the time of the first `ERROR`
        (`None` when there is none),
      - saves this in `summary.json`, and prints the file.

      ```text
      {"ERROR": 2, "WARNING": 1, "INFO": 3, "first_error": "10:15:02"}
      ```
    files:
      app.log: |
        2026-11-23 09:00:00 INFO start
        2026-11-23 09:30:12 INFO user Ana logged in
        2026-11-23 10:01:44 WARNING disk 90% full
        -- noise --
        2026-11-23 10:15:02 ERROR disk full
        2026-11-23 10:15:09 ERROR cannot save
        2026-11-23 11:00:00 INFO stop
    starter: |
      import json
      import re

      # Write the whole program yourself.
    solution: |
      import json
      import re
      from pathlib import Path

      pattern = re.compile(r"\d{4}-\d{2}-\d{2} (\d{2}:\d{2}:\d{2}) (ERROR|WARNING|INFO) ")
      summary = {"ERROR": 0, "WARNING": 0, "INFO": 0, "first_error": None}
      for line in Path("app.log").read_text().splitlines():
          match = pattern.match(line)
          if not match:
              continue
          time, level = match.groups()
          summary[level] = summary[level] + 1
          if level == "ERROR" and summary["first_error"] is None:
              summary["first_error"] = time
      Path("summary.json").write_text(json.dumps(summary))
      print(Path("summary.json").read_text())
    after: >-
      A regex picks the parts, a dictionary counts, JSON keeps the result for
      the next program. Lines that do not fit are skipped, not guessed.
    cases:
      - {}
      - label: "the log has no errors"
        files:
          app.log: "2026-01-01 08:00:00 INFO hi\nERROR without a date\n2026-01-01 08:00:01 WARNING low\n"
    checks:
      - expr: "err is None and 'summary.json' in files"
        pass: "It writes summary.json"
        hint: "`Path(\"summary.json\").write_text(json.dumps(summary))`."
      - expr: "'summary.json' in files and {k: v for k, v in __import__('json').loads(files['summary.json']).items() if k != 'first_error'} == {lv: len(__import__('re').findall(r'^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2} ' + lv + ' ', files['app.log'], __import__('re').M)) for lv in ('ERROR', 'WARNING', 'INFO')}"
        pass: "The levels are counted, only on real log lines"
        hint: "Match a date, a time and the level at the start of the line."
        misconceptions:
          - when: "'summary.json' in files and __import__('json').loads(files['summary.json']).get('ERROR') == files['app.log'].count('ERROR') and files['app.log'].count('ERROR') != len(__import__('re').findall(r'^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2} ERROR ', files['app.log'], __import__('re').M))"
            say: "A line like \"ERROR without a date\" is counted. Count only lines that match the whole pattern."
      - expr: "'summary.json' in files and __import__('json').loads(files['summary.json']).get('first_error', 'missing') == (__import__('re').search(r'^\\d{4}-\\d{2}-\\d{2} (\\d{2}:\\d{2}:\\d{2}) ERROR ', files['app.log'], __import__('re').M).group(1) if __import__('re').search(r'^\\d{4}-\\d{2}-\\d{2} (\\d{2}:\\d{2}:\\d{2}) ERROR ', files['app.log'], __import__('re').M) else None)"
        pass: "first_error is the time of the first error, or null"
        hint: "Note the time only when it is the first ERROR."
      - expr: "lines[-1:] == [files.get('summary.json', '').strip()]"
        pass: "It prints the file"
        hint: "Print the text of summary.json at the end."
    hints:
      - "A pattern with two groups: `(\\d{2}:\\d{2}:\\d{2}) (ERROR|WARNING|INFO)`, after the date."
      - "Start the summary with zeros and `\"first_error\": None`."
      - "For each match: add 1, and note the time of the first ERROR."

# Challenges of the module: spec only, hidden checks.
  - id: c-grades-report
    type: exercise
    fade: challenge
    objective: O3
    title: "Challenge: a report of grades"
    prompt: |
      `scores.csv` (see the files) has the columns `name`, `subject` and
      `score`. Some scores are missing (`n/a`). **Write a program** that
      writes `report.json` and prints it:

      - `"averages"`: each student with the average of their scores,
        rounded to 1 decimal,
      - `"best"`: each subject with the student who has the highest score
        (on a tie, the name that comes first from A to Z),
      - `"skipped"`: how many rows had no number.

      Write the JSON with `sort_keys=True`, so the keys are sorted.

      ```text
      {"averages": {"Ana": 85.0, "Bo": 70.5, "Cy": 90.0}, "best": {"art": "Cy", "math": "Ana"}, "skipped": 1}
      ```
    files:
      scores.csv: |
        name,subject,score
        Ana,math,92
        Bo,math,81
        Ana,art,78
        Bo,art,60
        Cy,art,90
        Cy,math,n/a
    starter: |
      import csv
      import json

      # Write the whole program yourself.
    solution: |
      import csv
      import json
      from pathlib import Path

      scores = {}
      best = {}
      skipped = 0
      with open("scores.csv", newline="") as f:
          for row in csv.DictReader(f):
              try:
                  score = float(row["score"])
              except ValueError:
                  skipped += 1
                  continue
              name, subject = row["name"], row["subject"]
              scores.setdefault(name, []).append(score)
              top = best.get(subject)
              if top is None or score > top[0] or (score == top[0] and name < top[1]):
                  best[subject] = (score, name)

      report = {
          "averages": {name: round(sum(s) / len(s), 1) for name, s in scores.items()},
          "best": {subject: name for subject, (score, name) in best.items()},
          "skipped": skipped,
      }
      Path("report.json").write_text(json.dumps(report, sort_keys=True))
      print(Path("report.json").read_text())
    after: >-
      One pass over the file collects everything: a list of scores per
      student, and the best (score, name) per subject. JSON with sorted keys
      gives the same file on every run, which makes it easy to compare.
    cases:
      - {}
      - label: "the scores are different, with a tie"
        files:
          scores.csv: "name,subject,score\nZoe,bio,70\nAl,bio,70\nZoe,chem,55.5\nAl,chem,\nMo,bio,abc\n"
    checks:
      - expr: "err is None and 'report.json' in files"
        pass: "It writes report.json"
        hint: "`Path(\"report.json\").write_text(json.dumps(report, sort_keys=True))`."
      - expr: |-
          'report.json' in files and (lambda rows: (lambda good: __import__('json').loads(files['report.json']).get('averages') == {n: round(sum(v for m, _, v in good if m == n) / len([1 for m, _, v in good if m == n]), 1) for n in {g[0] for g in good}})([(n, s, float(v)) for n, s, v in rows if v.replace('.', '', 1).isdigit()]))([r.split(',') for r in files['scores.csv'].splitlines()[1:]])
        pass: "The average of each student, rounded to 1 decimal"
        hint: "Collect the scores of each student in a list, then `round(sum(s) / len(s), 1)`."
        misconceptions:
          - when: "err == 'ValueError'"
            say: "A score that is not a number stops the program. Put `float(...)` in `try`, and skip the row in `except ValueError:`."
      - expr: |-
          'report.json' in files and (lambda rows: (lambda good: __import__('json').loads(files['report.json']).get('best') == {s: min((-v, n) for n, t, v in good if t == s)[1] for s in {g[1] for g in good}})([(n, s, float(v)) for n, s, v in rows if v.replace('.', '', 1).isdigit()]))([r.split(',') for r in files['scores.csv'].splitlines()[1:]])
        pass: "The best student of each subject, A to Z on a tie"
        hint: "Keep `(score, name)` per subject; replace it for a higher score, or the same score and an earlier name."
      - expr: "'report.json' in files and __import__('json').loads(files['report.json']).get('skipped') == sum(1 for r in files['scores.csv'].splitlines()[1:] if not r.split(',')[2].replace('.', '', 1).isdigit())"
        pass: "It counts the rows without a number"
        hint: "Add 1 in the `except`."
      - expr: "lines[-1:] == [files.get('report.json', '').strip()] and files.get('report.json', '').startswith('{\"averages\"')"
        pass: "It prints the file, with sorted keys"
        hint: "`json.dumps(report, sort_keys=True)`, then print the text of the file."
    hints:
      - "`csv.DictReader`; `try: float(row[\"score\"])`, `except ValueError:` count and `continue`."
      - "A dictionary of lists for the averages; a dictionary of `(score, name)` for the best."
      - "Build the report dictionary, write it with `sort_keys=True`, then print the file."
