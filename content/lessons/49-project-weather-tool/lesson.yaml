    code: &tool |
      import requests

      GEO_URL = "https://geocoding-api.open-meteo.com/v1/search"
      FORECAST_URL = "https://api.open-meteo.com/v1/forecast"
      DAILY = "temperature_2m_max,temperature_2m_min,precipitation_sum"

      def get_json(url, params):
          try:
              response = requests.get(url, params=params, timeout=10)
          except requests.RequestException:
              print("No answer from the server.")
              return None
          if response.status_code != 200:
              print(f"The server says {response.status_code}.")
              return None
          return response.json()

      def find_place(name):
          data = get_json(GEO_URL, {"name": name, "count": 1})
          if data is None:
              return None
          results = data.get("results", [])
          if not results:
              print(f"No place called {name}.")
              return None
          return results[0]

      def get_forecast(place):
          params = {
              "latitude": place["latitude"],
              "longitude": place["longitude"],
              "daily": DAILY,
              "timezone": "auto",
          }
          data = get_json(FORECAST_URL, params)
          if data is None:
              return None
          daily = data["daily"]
          days = []
          columns = zip(
              daily["time"],
              daily["temperature_2m_min"],
              daily["temperature_2m_max"],
              daily["precipitation_sum"],
          )
          for date, low, high, rain in columns:
              days.append({"date": date, "low": low, "high": high, "rain": rain})
          return days

      def format_day(day):
          low, high = day["low"], day["high"]
          return f"{day['date']}: {low} to {high} °C, rain {day['rain']} mm"

      def parse_days(text):
          days = int(text.strip())
          if not 1 <= days <= 7:
              raise ValueError("Days must be from 1 to 7.")
          return days

      assert parse_days(" 3 ") == 3
      assert format_day(
          {"date": "2026-01-01", "low": -2, "high": 1.5, "rain": 0}
      ) == "2026-01-01: -2 to 1.5 °C, rain 0 mm"

      name = input("Place: ").strip()
      place = find_place(name)
      if place is not None:
          while True:
              try:
                  days = parse_days(input("Days (1-7): "))
                  break
              except ValueError:
                  print("Type a number from 1 to 7.")
          forecast = get_forecast(place)
          if forecast is not None:
              print(f"{place['name']}, {place['country']}")
              for day in forecast[:days]:
                  print(format_day(day))
    experiments:
      - text: "Look for `Oslo`, for 3 days."
        expr: "'Oslo, Norway' in lines"
      - text: "Look for a place that does not exist."
        expr: "any(l.startswith('No place called') for l in lines)"
      - text: "Look for `Lima`, and type `ten` for the days. Then a number."
        expr: "'Type a number from 1 to 7.' in lines and 'Lima, Peru' in lines"

  # 2. THE PLAN --------------------------------------------------------------
  - id: plan
    type: theory
    objective: O1
    title: Two APIs, five functions
    body: |
      ## Two requests

      The forecast API of Open-Meteo wants a **latitude and a longitude**,
      not a name. So the tool asks two APIs, one after the other:

      1. The geocoding API: `Oslo` → latitude 59.91, longitude 10.75.
      2. The forecast API: latitude and longitude → the next 7 days.

      ## The answer of the forecast API

      It gives **columns**: one list for each value, in the same order.

      ```
      "daily": {
        "time": ["2026-11-13", "2026-11-14", ...],
        "temperature_2m_max": [5.8, 4.9, ...],
        "temperature_2m_min": [0.5, -0.3, ...],
        "precipitation_sum": [0.1, 0.0, ...]
      }
      ```

      Place `i` of each list is day `i`. The tool turns the columns into
      one dictionary for each day, because that is easier to use.

      ## The plan

      `get_json` is your function from lesson [[#web-apis]]: it is in the code
      already. Each step adds one function. The last step connects them.
    keys:
      - code: "1  find_place(name)"
        means: "The first result of the geocoding API, or `None`."
      - code: "2  get_forecast(place)"
        means: "A list of days: `{\"date\", \"low\", \"high\", \"rain\"}`."
      - code: "3  format_day(day)"
        means: "One line of text for one day."
      - code: "4  parse_days(text)"
        means: "`\"3\"` becomes `3`. Bad text raises `ValueError`."
      - code: "5  The tool"
        means: "Ask, find, ask again if needed, show."

