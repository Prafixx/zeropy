    prompt: |
      **Write `get_forecast(place)`.** Use `get_json` with `FORECAST_URL`
      and these parameters: `latitude` and `longitude` of the place,
      `daily` (it is `DAILY`), and `timezone` `"auto"`.

      Turn the columns of `data["daily"]` into a list with one dictionary
      for each day:

      ```
      {"date": "2026-11-13", "low": 0.5,
       "high": 5.8, "rain": 0.1}
      ```

      `low` is from `temperature_2m_min`, `high` from `temperature_2m_max`,
      `rain` from `precipitation_sum`. If `get_json` gives `None`, give
      back `None`.
    web: *web
    solution: &s2 |
      import requests

      GEO_URL = "https://geocoding-api.open-meteo.com/v1/search"
      FORECAST_URL = "https://api.open-meteo.com/v1/forecast"
      DAILY = "temperature_2m_max,temperature_2m_min,precipitation_sum"

      def get_json(url, params):
          try:
              response = requests.get(url, params=params, timeout=10)
          except requests.RequestException:
              print("No answer from the server.")
              return None
          if response.status_code != 200:
              print(f"The server says {response.status_code}.")
              return None
          return response.json()

      def find_place(name):
          data = get_json(GEO_URL, {"name": name, "count": 1})
          if data is None:
              return None
          results = data.get("results", [])
          if not results:
              print(f"No place called {name}.")
              return None
          return results[0]

      def get_forecast(place):
          params = {
              "latitude": place["latitude"],
              "longitude": place["longitude"],
              "daily": DAILY,
              "timezone": "auto",
          }
          data = get_json(FORECAST_URL, params)
          if data is None:
              return None
          daily = data["daily"]
          days = []
          columns = zip(
              daily["time"],
              daily["temperature_2m_min"],
              daily["temperature_2m_max"],
              daily["precipitation_sum"],
          )
          for date, low, high, rain in columns:
              days.append({"date": date, "low": low, "high": high, "rain": rain})
          return days

      place = find_place("Oslo")
      if place is not None:
          print(place["name"], place["country"])
      print(find_place("Xqzwvbn"))
    after: >-
      Columns are good for sending data, rows are good for using it. The
      index `i` walks all lists at once, so each day gets its own values.
