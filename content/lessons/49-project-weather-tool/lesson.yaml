    id: r-rows
    objective: O2
    prompt: "Columns `{\"day\": [\"Mon\", \"Tue\"], \"temp\": [4, 6]}`. Which loop makes rows?"
    options:
      - text: "`for day, temp in zip(data[\"day\"], data[\"temp\"]):`"
        correct: true
        why: "`zip` walks the columns side by side: one row in each round."
      - text: "`for day in data:`"
        why: "That loops over the keys `day` and `temp`."
      - text: "`for temp in data[\"temp\"]:` alone"
        why: "Then you have the temperatures, but not their days."
  - kind: mcq
    id: r-ask-again
    objective: O4
    prompt: "How does a program ask again until an answer is good?"
    options:
      - text: "`while True:` with `try:`, `break` after the good answer, and `except ValueError:` with a message"
        correct: true
        why: "The loop ends only with `break`, so a bad answer asks again."
      - text: "One `if` after the `input()`"
        why: "An `if` asks only once."
      - text: "`try:` without a loop"
        why: "Then a bad answer gets a message, but no new question."
  - kind: mcq
    id: r-slice
    objective: O4
    prompt: "`forecast` has 7 days. Which code shows only the first 3?"
    options:
      - text: "`for day in forecast[:3]:`"
        correct: true
        why: "`[:3]` gives places 0, 1 and 2."
      - text: "`for day in forecast[3]:`"
        why: "`forecast[3]` is one day, the fourth."
      - text: "`for day in forecast[1:3]:`"
        why: "That gives places 1 and 2: two days, without the first."
