id: project-weather-tool
order: 49
title: "Project: weather tool"
summary: Build a tool that finds any place on Earth and shows its weather for the next days, with two web APIs, and ship it as a real project.
minutes: 70
outcomes: [A7, A5, A8, A10]

objectives:
  - id: O1
    text: Find a place with one API, and use its result in the request to a second API
  - id: O2
    text: Turn the columns of an API answer into one dictionary for each day
  - id: O3
    text: Format and check small values in functions with tests
  - id: O4
    text: Connect the functions into a tool that never crashes - an unknown place, a bad number, no internet
  - id: O5
    text: Ship the tool as a real project - its own venv, requirements.txt and a git commit

steps:
  # 1. USE THE FINISHED TOOL -------------------------------------------------
  - id: play
    type: demo
    visual: none
    sealed: true
    objective: O4
    title: Use the finished tool
    intro: |
      This project builds a **weather tool**. You type a place and a number
      of days, and it shows the lowest and highest temperature and the rain
      of each day. Press **Play**.

      The pretend web of this page knows **Oslo**, **Lima** and
      **Nairobi**. On your computer, the tool will know every place on
      Earth.
    web: &web
