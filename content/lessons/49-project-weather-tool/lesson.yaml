# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: c-currency
    type: exercise
    fade: challenge
    objective: O4
    title: "Challenge: a currency converter"
    prompt: |
      The rate API `https://api.rates.test/latest?base=EUR` answers like
      `{"base": "EUR", "rates": {"USD": 1.08, "GBP": 0.86}}`. **Write
      `convert(amount, to)`**, from euros:

      - the result, rounded to 2 decimals, for a known currency,
      - a `ValueError("unknown currency: XYZ")` for an unknown one,
      - `None` when the server answers with an error status, when there is
        no connection, or no answer in time (timeout 5 seconds).

      ```text
      108.0
      unknown currency: XYZ
      ```
    web:
      "https://api.rates.test/latest?base=EUR":
        json: {base: EUR, rates: {USD: 1.08, GBP: 0.86, JPY: 162.5}}
    starter: |
      import requests

      # Your function here.


      print(convert(100, "USD"))
      try:
          convert(5, "XYZ")
      except ValueError as error:
          print(error)
    solution: |
      import requests

      URL = "https://api.rates.test/latest"


      def convert(amount, to):
          try:
              response = requests.get(URL, params={"base": "EUR"}, timeout=5)
          except (requests.ConnectionError, requests.Timeout):
              return None
          if response.status_code != 200:
              return None
          rates = response.json()["rates"]
          if to not in rates:
              raise ValueError(f"unknown currency: {to}")
          return round(amount * rates[to], 2)


      print(convert(100, "USD"))
      try:
          convert(5, "XYZ")
      except ValueError as error:
          print(error)
    after: >-
      Three kinds of failure, three answers: a bad value is the caller's
      mistake (an error), a broken server or network is not (None). A tool
      that knows the difference is easy to trust.
    cases:
      - {}
      - label: "the server has a problem"
        web:
          "https://api.rates.test/latest?base=EUR":
            status: 503
            json: {error: maintenance}
      - label: "there is no internet"
        web: {}
    checks:
      - expr: "callable(ns.get('convert')) and ((convert(10, 'GBP'), convert(2, 'JPY')) == (8.6, 325.0) if (raises(__import__('requests').get, 'https://api.rates.test/latest?base=EUR', timeout=1) is None and __import__('requests').get('https://api.rates.test/latest?base=EUR', timeout=1).status_code == 200) else True)"
        pass: "It converts with the rate of the API"
        hint: "`round(amount * rates[to], 2)`."
      - expr: "callable(ns.get('convert')) and (raises(convert, 1, 'ABC') == 'ValueError' if (raises(__import__('requests').get, 'https://api.rates.test/latest?base=EUR', timeout=1) is None and __import__('requests').get('https://api.rates.test/latest?base=EUR', timeout=1).status_code == 200) else True)"
        pass: "An unknown currency raises ValueError"
        hint: "`if to not in rates: raise ValueError(f\"unknown currency: {to}\")`."
      - expr: "callable(ns.get('convert')) and (True if (raises(__import__('requests').get, 'https://api.rates.test/latest?base=EUR', timeout=1) is None and __import__('requests').get('https://api.rates.test/latest?base=EUR', timeout=1).status_code == 200) else raises(convert, 1, 'USD') is None and convert(1, 'USD') is None)"
        pass: "An error status or no connection gives None, without a crash"
        hint: "Catch `requests.ConnectionError` and `requests.Timeout`, and check `response.status_code`."
        misconceptions:
          - when: "callable(ns.get('convert')) and raises(convert, 1, 'USD') in ('ConnectionError', 'KeyError', 'ReadTimeout')"
            say: "A broken server or no internet must give None, not an error. Catch the request errors, and check the status first."
      - expr: "all(r['timeout'] for r in requests_made) and len(requests_made) >= 1"
        pass: "Every request has a timeout"
        hint: "`requests.get(URL, params=..., timeout=5)`."
    hints:
      - "The request goes into `try:`; catch `(requests.ConnectionError, requests.Timeout)` and return None."
      - "Then: status not 200 gives None; read `response.json()[\"rates\"]`."
      - "An unknown currency: `raise ValueError(f\"unknown currency: {to}\")`."
  - id: c-pages
    type: exercise
    fade: challenge
    objective: O2
    title: "Challenge: all the pages"
    prompt: |
      The book API gives its answer in **pages**:
      `https://api.books.test/books?page=1` answers
      `{"books": ["Dune", "Emma"], "next": 2}`. The last page has
      `"next": null` (`None` in Python).

      **Write `all_titles()`**: it starts at page 1, follows `next` until it
      is `None`, and gives back **all** titles, sorted. Use a timeout of 5
      seconds.

      ```text
      ['Dune', 'Emma', 'Hamlet', 'Ulysses', 'Walden']
      ```
    web:
      "https://api.books.test/books?page=1":
        json: {books: [Ulysses, Dune], next: 2}
      "https://api.books.test/books?page=2":
        json: {books: [Emma, Walden], next: 3}
      "https://api.books.test/books?page=3":
        json: {books: [Hamlet], next: null}
    starter: |
      import requests

      # Your function here.


      print(all_titles())
    solution: |
      import requests

      URL = "https://api.books.test/books"


      def all_titles():
          titles = []
          page = 1
          while page is not None:
              response = requests.get(URL, params={"page": page}, timeout=5)
              data = response.json()
              titles.extend(data["books"])
              page = data["next"]
          return sorted(titles)


      print(all_titles())
    after: >-
      Many real APIs page their answers like this. A while loop that follows
      `next` works for 2 pages or 200.
    cases:
      - {}
      - label: "there is only one page"
        web:
          "https://api.books.test/books?page=1":
            json: {books: [Solo], next: null}
    checks:
      - expr: "callable(ns.get('all_titles')) and err is None and lines[-1:] == [str(sorted(t for p in [p for p in (1, 2, 3) if raises(__import__('requests').get, f'https://api.books.test/books?page={p}', timeout=1) is None] for t in __import__('requests').get(f'https://api.books.test/books?page={p}', timeout=1).json()['books']))]"
        pass: "All titles of all pages, sorted"
        hint: "Collect the books of each page in one list, and sort it at the end."
      - expr: "any(r['params'].get('page') == '1' for r in requests_made)"
        pass: "It starts at page 1"
        hint: "`params={\"page\": page}` with `page = 1` at the start."
      - expr: "callable(ns.get('all_titles')) and (lambda n: (all_titles(), len(requests_made) - n)[1])(len(requests_made)) == len([p for p in (1, 2, 3) if raises(__import__('requests').get, f'https://api.books.test/books?page={p}', timeout=1) is None])"
        pass: "It asks each page once, and stops at next: null"
        hint: "`while page is not None:` and `page = data[\"next\"]`."
        misconceptions:
          - when: "callable(ns.get('all_titles')) and raises(all_titles) == 'ConnectionError'"
            say: "It asked for a page that does not exist: stop when `next` is `None`."
      - expr: "all(r['timeout'] for r in requests_made)"
        pass: "Every request has a timeout"
        hint: "`timeout=5` in each request."
    hints:
      - "Start with `titles = []` and `page = 1`."
      - "`while page is not None:` ask for the page, add its books, `page = data[\"next\"]`."
      - "Return `sorted(titles)`."

# Challenges of the module: spec only, hidden checks.
  - id: c-todo-cli
    type: exercise
    fade: challenge
    objective: O3
    title: "Challenge: a to-do tool"
    prompt: |
      **Write a command-line tool with argparse** that keeps tasks in
      `todo.json` (a list of `{"text": ..., "done": ...}`; no file means no
      tasks):

      - `python main.py add "Buy milk"`: adds a task, saves, prints
        `Added 3: Buy milk` (its number, from 1).
      - `python main.py list`: one line per task, `1 [x] Call Ana` or
        `2 [ ] Buy milk`; with no tasks, `Nothing to do.`
      - `python main.py done 2`: marks task 2 as done, saves, prints
        `Done: Buy milk`.
      - Wrong use ends with `sys.exit(...)` and exit code 1: `add` without
        a text (`add needs a text`), or `done` with a number that is not a
        task (`No task 9`).

      Make `command` an argument with `choices`, and `text` an optional
      one: `add_argument("text", nargs="?", default="")`.
    files:
      todo.json: |
        [{"text": "Call Ana", "done": true}, {"text": "Buy milk", "done": false}]
    starter: |
      import argparse
      import json
      import sys
      from pathlib import Path

      # Write the tool yourself.
    solution: |
      import argparse
      import json
      import sys
      from pathlib import Path

      FILE = Path("todo.json")

      parser = argparse.ArgumentParser(description="A small to-do list.")
      parser.add_argument("command", choices=["add", "list", "done"])
      parser.add_argument("text", nargs="?", default="")
      args = parser.parse_args()

      tasks = json.loads(FILE.read_text()) if FILE.exists() else []

      if args.command == "add":
          if not args.text.strip():
              sys.exit("add needs a text")
          tasks.append({"text": args.text.strip(), "done": False})
          FILE.write_text(json.dumps(tasks))
          print(f"Added {len(tasks)}: {args.text.strip()}")
      elif args.command == "list":
          if not tasks:
              print("Nothing to do.")
          for number, task in enumerate(tasks, start=1):
              mark = "x" if task["done"] else " "
              print(f"{number} [{mark}] {task['text']}")
      else:
          if not args.text.isdigit() or not 1 <= int(args.text) <= len(tasks):
              sys.exit(f"No task {args.text}")
          task = tasks[int(args.text) - 1]
          task["done"] = True
          FILE.write_text(json.dumps(tasks))
          print(f"Done: {task['text']}")
    after: >-
      A real tool in 30 lines: argparse checks the command, JSON keeps the
      tasks between runs, and the exit code tells a script when something
      was wrong.
    cases:
      - argv: ["list"]
      - label: "the command is `python main.py add \"Buy bread\"`"
        argv: ["add", "Buy bread"]
      - label: "the command is `python main.py done 2`"
        argv: ["done", "2"]
      - label: "the command is `python main.py done 9`"
        argv: ["done", "9"]
      - label: "the command is `python main.py add` without a text"
        argv: ["add"]
      - label: "there is no todo.json; the command is `python main.py list`"
        argv: ["list"]
        files: {}
      - label: "the command is `python main.py remove 1`"
        argv: ["remove", "1"]
    checks:
      - expr: "argv != ['list'] or (err is None and lines == ([f'{i} [{\"x\" if t[\"done\"] else \" \"}] {t[\"text\"]}' for i, t in enumerate(__import__('json').loads(start_files['todo.json']), 1)] if 'todo.json' in start_files else ['Nothing to do.']))"
        pass: "`list` shows each task with its number and mark, or `Nothing to do.`"
        hint: "`for number, task in enumerate(tasks, start=1):` and `\"x\" if task[\"done\"] else \" \"`."
        misconceptions:
          - when: "argv == ['list'] and err == 'FileNotFoundError'"
            say: "Without `todo.json` there are no tasks: check `exists()` before you read the file."
      - expr: "argv != ['add', 'Buy bread'] or (lines == ['Added 3: Buy bread'] and __import__('json').loads(files['todo.json'])[-1] == {'text': 'Buy bread', 'done': False})"
        pass: "`add` adds the task, saves it and prints its number"
        hint: "Append `{\"text\": ..., \"done\": False}`, write the file, print `Added N: text`."
      - expr: "argv != ['done', '2'] or (lines == ['Done: Buy milk'] and [t['done'] for t in __import__('json').loads(files['todo.json'])] == [True, True])"
        pass: "`done` marks the task and saves"
        hint: "Task 2 is `tasks[1]`: numbers start at 1, indexes at 0."
      - expr: "argv not in (['done', '9'], ['add']) or (exit_code == 1 and lines[-1:] == ['No task 9' if argv == ['done', '9'] else 'add needs a text'] and files.get('todo.json') == start_files.get('todo.json'))"
        pass: "Wrong use ends with a message and exit code 1, and changes nothing"
        hint: "`sys.exit(\"add needs a text\")` and `sys.exit(f\"No task {args.text}\")`."
        misconceptions:
          - when: "argv == ['done', '9'] and err == 'IndexError'"
            say: "Task 9 does not exist. Check that the number is between 1 and `len(tasks)` first."
      - expr: "argv != ['remove', '1'] or exit_code == 2"
        pass: "An unknown command is refused by argparse"
        hint: "`add_argument(\"command\", choices=[\"add\", \"list\", \"done\"])`."
    hints:
      - "Two arguments: `command` with `choices`, and `text` with `nargs=\"?\"` and `default=\"\"`."
      - "Load the list (or `[]`), then one branch for each command; save after `add` and `done`."
      - "Check the wrong cases first, and end them with `sys.exit(\"...\")`."
