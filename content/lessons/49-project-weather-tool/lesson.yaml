  # 5. STEP 3 ----------------------------------------------------------------
  - id: m3-small
    type: exercise
    fade: milestone
    carry: true
    objective: O3
    title: "Step 3: small functions, with tests"
    prompt: |
      **Write two small functions**, and test each with at least one
      `assert`:

      - `format_day(day)` gives one line of text, with the low first:
        ```
        2026-11-13: 0.5 to 5.8 °C, rain 0.1 mm
        ```
      - `parse_days(text)` turns text like `" 3 "` into `3`. Text that is
        not a whole number from 1 to 7 raises a `ValueError`.

      Tip: copy `°` from the line above.
    web: *web
    solution: &s3 |
      import requests

      GEO_URL = "https://geocoding-api.open-meteo.com/v1/search"
      FORECAST_URL = "https://api.open-meteo.com/v1/forecast"
      DAILY = "temperature_2m_max,temperature_2m_min,precipitation_sum"

      def get_json(url, params):
          try:
              response = requests.get(url, params=params, timeout=10)
          except requests.RequestException:
              print("No answer from the server.")
              return None
          if response.status_code != 200:
              print(f"The server says {response.status_code}.")
              return None
          return response.json()

      def find_place(name):
          data = get_json(GEO_URL, {"name": name, "count": 1})
          if data is None:
              return None
          results = data.get("results", [])
          if not results:
              print(f"No place called {name}.")
              return None
          return results[0]

      def get_forecast(place):
          params = {
              "latitude": place["latitude"],
              "longitude": place["longitude"],
              "daily": DAILY,
              "timezone": "auto",
          }
          data = get_json(FORECAST_URL, params)
          if data is None:
              return None
          daily = data["daily"]
          days = []
          columns = zip(
              daily["time"],
              daily["temperature_2m_min"],
              daily["temperature_2m_max"],
              daily["precipitation_sum"],
          )
          for date, low, high, rain in columns:
              days.append({"date": date, "low": low, "high": high, "rain": rain})
          return days

      def format_day(day):
          low, high = day["low"], day["high"]
          return f"{day['date']}: {low} to {high} °C, rain {day['rain']} mm"

      def parse_days(text):
          days = int(text.strip())
          if not 1 <= days <= 7:
              raise ValueError("Days must be from 1 to 7.")
          return days

      assert parse_days(" 3 ") == 3
      assert format_day(
          {"date": "2026-01-01", "low": -2, "high": 1.5, "rain": 0}
      ) == "2026-01-01: -2 to 1.5 °C, rain 0 mm"

      place = find_place("Oslo")
      if place is not None:
          print(place["name"], place["country"])
      print(find_place("Xqzwvbn"))
    after: >-
      These two functions need no web and no input, so they are the easiest
      to test. When the tool shows a strange line later, you know that
      these two parts are fine.
    checks:
      - &c-format
        expr: "callable(ns.get('format_day')) and format_day({'date': '2026-11-13', 'low': 0.5, 'high': 5.8, 'rain': 0.1}) == '2026-11-13: 0.5 to 5.8 °C, rain 0.1 mm' and format_day({'date': '2026-11-14', 'low': -3.4, 'high': 1.5, 'rain': 12.6}) == '2026-11-14: -3.4 to 1.5 °C, rain 12.6 mm'"
        pass: "`format_day` gives the line exactly as shown"
        hint: "`f\"{day['date']}: {day['low']} to {day['high']} °C, rain {day['rain']} mm\"`."
        misconceptions:
          - when: "callable(ns.get('format_day')) and raises(format_day, {'date': 'd', 'low': 1, 'high': 2, 'rain': 0}) is None and format_day({'date': 'd', 'low': 1, 'high': 2, 'rain': 0}).startswith('d: 2 to 1')"
            say: "High and low are swapped: the line shows the low first."
          - when: "callable(ns.get('format_day')) and raises(format_day, {'date': 'd', 'low': 1, 'high': 2, 'rain': 0}) is None and '°' not in format_day({'date': 'd', 'low': 1, 'high': 2, 'rain': 0})"
            say: "The line needs `°C`. Copy `°` from the example in the task."
          - when: "callable(ns.get('format_day')) and raises(format_day, {'date': 'd', 'low': 1, 'high': 2, 'rain': 0}) == 'NameError'"
            say: "Inside an f-string with double quotes, write the keys with single quotes: `{day['date']}`."
      - &c-parse
        expr: "callable(ns.get('parse_days')) and parse_days('3') == 3 and parse_days(' 7 ') == 7 and parse_days('1') == 1 and all(raises(parse_days, t) == 'ValueError' for t in ['0', '8', 'ten', '2.5', ''])"
        pass: "`parse_days` gives a number from 1 to 7, and raises `ValueError` for anything else"
        hint: "`int(text.strip())`, then `if not 1 <= days <= 7: raise ValueError(...)`."
        misconceptions:
          - when: "callable(ns.get('parse_days')) and raises(parse_days, '8') is None"
            say: "`8` must raise a `ValueError` too: the tool shows 1 to 7 days. Check the range and `raise ValueError(...)`."
          - when: "callable(ns.get('parse_days')) and raises(parse_days, ' 7 ') == 'ValueError'"
            say: "`\" 7 \"` is a good answer with spaces around it. Use `text.strip()`."
      - expr: "err is None and syntax('Assert') >= 2"
        pass: "There are tests with `assert`, and they pass"
        hint: "For example `assert parse_days(\" 3 \") == 3`, and one `assert` for `format_day`."
        misconceptions:
          - when: "err == 'AssertionError'"
            say: "One of your tests fails. Read the line in the message: is the test right, or the function?"
    hints:
      - "`format_day`: one f-string. Use single quotes for the keys inside: `{day['date']}`."
      - "`parse_days`: `days = int(text.strip())` already raises `ValueError` for `ten`."
      - "For 0 and 8: `if not 1 <= days <= 7: raise ValueError(\"Days must be from 1 to 7.\")`."

  # 6. STEP 4 ----------------------------------------------------------------
  - id: m4-tool
    type: exercise
    fade: milestone
    carry: true
    objective: O4
    title: "Step 4: the tool"
    prompt: |
      **Replace the lines at the end** (after the tests) with the tool:

      1. Ask `Place: ` and find the place. If it is not found, the program
         ends: no more questions.
      2. Ask `Days (1-7): `. A bad answer prints `Type a number from 1 to
         7.`, and asks again, until the answer is good.
      3. Get the forecast. If it is `None`, the program ends.
      4. Print `Oslo, Norway` (name, comma, country), then one line for each
         of the first days, with `format_day`.

      The check types: Oslo and 3; Lima, `ten`, 9 and 2; an unknown place;
      and Oslo without internet.
    web: *web
    solution: *tool
    after: >-
      Each function does one job and says what went wrong. So the tool
      itself is short: it only connects them, and it has an answer for every
      bad day.
    cases:
      # The first case is the learner's own run: the page puts in what they
      # typed. So it has no fixed answer. The fixed cases follow.
      - stdin: ["Oslo", "3"]
        setup: "_expected = None; _bad = None; _online = True"
      - label: "Oslo and 3"
        stdin: ["Oslo", "3"]
        setup: "_expected = ['Oslo, Norway', '2026-11-13: 0.5 to 5.8 °C, rain 0.1 mm', '2026-11-14: -0.3 to 4.9 °C, rain 0.2 mm', '2026-11-15: 2.8 to 6.7 °C, rain 0.4 mm']; _bad = 0; _online = True"
      - label: "Lima, then the answers `ten`, `9` and `2`"
        stdin: ["Lima", "ten", "9", "2"]
        setup: "_expected = ['Lima, Peru', '2026-11-13: 17.4 to 23.1 °C, rain 0.1 mm', '2026-11-14: 17.9 to 23.8 °C, rain 0.2 mm']; _bad = 2; _online = True"
      - label: "a place that does not exist"
        stdin: ["Xqzwvbn"]
        setup: "_expected = ['No place called Xqzwvbn.']; _bad = 0; _online = True"
      - label: "Oslo, without internet"
        stdin: ["Oslo"]
        setup: "_expected = ['No answer from the server.']; _bad = 0; _online = False"
        web: {}
    checks:
      - expr: "err is None"
        pass: "It never crashes: an unknown place, bad numbers, no internet"
        hint: "Read the message of the case that fails, and check its part of the tool."
        misconceptions:
          - when: "err == 'EOFError'"
            say: "The tool asks one question too many. When the place is not found (or there is no answer), it must end without asking for the days: put the rest inside `if place is not None:`."
          - when: "err == 'ValueError'"
            say: "A bad number of days stops the tool. Put `parse_days(input(...))` inside `try:` and catch `ValueError` in a `while True` loop."
          - when: "err == 'TypeError'"
            say: "Something is `None`. Check `place` and `forecast` with `is not None` before you use them."
      - expr: "_expected is None or [l for l in lines if not l.startswith(('Place:', 'Days (1-7):')) and l != 'Type a number from 1 to 7.'] == _expected"
        pass: "It prints the place and the days that were asked for, or one clear message"
        hint: "`print(f\"{place['name']}, {place['country']}\")`, then `for day in forecast[:days]: print(format_day(day))`."
        misconceptions:
          - when: "not any(l.startswith('Place:') for l in lines)"
            say: "The tool does not ask yet. Replace the lines at the end with the tool: it starts with `input(\"Place: \")`."
          - when: "_bad is not None and _bad and lines.count('Type a number from 1 to 7.') != _bad"
            say: "After a bad number, print exactly `Type a number from 1 to 7.`, then ask again."
          - when: "len([l for l in lines if l[:4].isdigit()]) == 7"
            say: "It prints all 7 days. Print only the first ones: `forecast[:days]`."
      - expr: "_bad is None or lines.count('Type a number from 1 to 7.') == _bad"
        pass: "A bad number gets `Type a number from 1 to 7.`, and the question again"
        hint: "In `except ValueError:` print `Type a number from 1 to 7.`. The loop then asks again."
      - expr: "syntax('Assert') >= 2"
        pass: "The tests of step 3 are still there"
        hint: "Keep the `assert` lines above the tool."
      - *c-find
      - *c-format
      - *c-parse
    hints:
      - "`name = input(\"Place: \").strip()` and `place = find_place(name)`. All the rest goes inside `if place is not None:`."
      - "Ask for the days in a loop: `while True:` `try:` `days = parse_days(input(\"Days (1-7): \"))` and `break`, `except ValueError:` print the message."
      - "Then `forecast = get_forecast(place)`. Inside `if forecast is not None:` print the place line and `for day in forecast[:days]:`."

