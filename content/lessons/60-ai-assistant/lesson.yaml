id: ai-assistant
order: 60
title: Working with an AI assistant
summary: Ask an AI assistant for code in a way that helps. Then check its answer like a reviewer. Run it, test it, and look up what it uses. Keep secrets out.
minutes: 35
outcomes: [A1, A6]

objectives:
  - id: O1
    text: Ask well - give the task, the context, an example and the limits, and ask again with more detail when the answer is not right
  - id: O2
    text: Check AI code before you use it - read it, run it, and test it with typical, border and wrong inputs
  - id: O3
    text: Make sure that the modules, functions and methods it uses exist and do what it says
  - id: O4
    text: Keep passwords, keys and personal data out of your questions, and stay responsible for the code you use

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: ask
    type: theory
    objective: O1
    title: Ask like you talk to a colleague
    body: |
      An AI assistant writes code fast, and it explains errors well. But it
      only knows what you tell it. Compare:

      ```text
      make a function for dates
      ```

      ```text
      Write a Python 3.13 function days_between(a, b). a and b are texts
      like "2026-11-21". It gives back the number of days from a to b
      (negative when b is earlier). Use only the standard library.
      Example: days_between("2026-11-21", "2026-12-01") is 10.
      Add three pytest tests, and explain each line in one sentence.
      ```

      The second one gives:

      - **the task**: names, inputs and the result,
      - **the context**: the Python version, what you already have, the
        full error message if there is one,
      - **an example**: an input and the result you expect,
      - **the limits**: only the standard library, no global variables...

      When the answer is wrong or does not fit, **ask again with more
      detail**: "It fails for an empty list", "I cannot install packages".
      And ask it to *explain* its code: if you cannot follow the
      explanation, you cannot check the code.
    keys:
      - code: "task + context"
        means: "What to build, and where it must fit."
      - code: "example"
        means: "An input and the result you expect."
      - code: "limits"
        means: "What it may not use or change."

  # 2. DRILL -----------------------------------------------------------------
  - id: better
    type: drill
    objective: O1
    title: A better question
    items:
      - kind: mcq
        id: d-best
        objective: O1
        prompt: "Which question to an AI assistant will give the most useful answer?"
        options:
          - text: "\"Python 3.13: average([]) gives ZeroDivisionError, not 0. Code and error below.\""
            correct: true
            why: "The version, the input that fails, the wanted result, the code and the error: everything it needs."
          - text: "\"My code does not work. Please look at it carefully and fix it fast.\""
            why: "Which code? What should it do? The assistant can only guess."
          - text: "\"Write the best and fastest average function that exists, ever.\""
            why: "\"Best\" says nothing. Say what it must do, and for which inputs."
      - kind: mcq
        id: d-library
        objective: O1
        prompt: "The answer uses `pandas`, but your program must run on a Pi without extra packages. What do you do?"
        options:
          - text: "Ask again, with the limit"
            correct: true
            why: "Add \"only the standard library\". A limit that you do not say, the assistant does not know."
          - text: "Use the answer anyway"
            why: "It would fail on the Pi with `ModuleNotFoundError`."
          - text: "Give up on the assistant"
            why: "One more sentence in the question is enough."
      - kind: mcq
        id: d-explain
        objective: O1
        prompt: "The assistant gives you 30 lines, and you do not understand three of them. What next?"
        options:
          - text: "Ask it to explain those lines, and check the explanation in the docs"
            correct: true
            why: "Use only code that you can explain yourself."
          - text: "Copy them: the assistant knows best"
            why: "It can be wrong, and sounds sure even then."
          - text: "Delete the three lines"
            why: "They may be needed. Understand them first."

  # 3. THEORY ----------------------------------------------------------------
  - id: check-first
    type: theory
    objective: O2
    title: Check before you trust
    body: |
      An AI assistant can be wrong, and then it sounds as sure as when it is right.
      The usual mistakes:

      - a case it did not think of: an empty list, an even number of
        values, the border of a range,
      - a function or method that **does not exist**, or that works
        differently (it is a guess that looks right),
      - an old way of doing things, or a module you do not have,
      - a security hole, like `eval(input())` or a password in the code.

      So you check it, like a reviewer checks the code of a colleague. You
      are the human in the loop:

      1. **Read** it: can you explain every line?
      2. **Run** it.
      3. **Test** it: typical inputs, the borders, and wrong inputs.
      4. **Look up** every name you do not know: `help(str.split)`, or the
         page on docs.python.org.

      Only then does it go into your project.
    keys:
      - code: "read · run · test · look up"
        means: "Four checks before AI code goes into your project."
      - code: "help(name)"
        means: "Python's own description of a function or method."
      - code: "borders, empty, wrong"
        means: "The inputs where AI code fails most often."

  # 4. EXERCISE: debug -------------------------------------------------------
  - id: ex-median
    type: exercise
    fade: debug
    objective: O2
    title: The median of an AI
    prompt: |
      You asked an AI assistant for `median(numbers)`: the middle value of
      a list. Its code is below. It works for `[3, 1, 2]`.

      **Test it** with a list of four numbers and with an empty list. Then
      fix it:

      - for an even number of values, the median is the average of the two
        in the middle: `median([4, 1, 3, 2])` is `2.5`,
      - an empty list raises a `ValueError`.
    starter: |
      # Written by an AI assistant: "median gives the middle value of a list."
      def median(numbers):
          ordered = sorted(numbers)
          middle = len(ordered) // 2
          return ordered[middle]


      print(median([3, 1, 2]))
      print(median([4, 1, 3, 2]))
    solution: |
      # Written by an AI assistant, checked and fixed by me.
      def median(numbers):
          if not numbers:
              raise ValueError("the median of an empty list")
          ordered = sorted(numbers)
          middle = len(ordered) // 2
          if len(ordered) % 2 == 0:
              return (ordered[middle - 1] + ordered[middle]) / 2
          return ordered[middle]


      print(median([3, 1, 2]))
      print(median([4, 1, 3, 2]))
    after: >-
      The code looked right and worked for the first test: that is the
      danger. And the docs have one more surprise: the standard library
      already has `statistics.median`. Looking up first can save the whole
      function.
    checks:
      - expr: "err is None and lines == ['2', '2.5']"
        pass: "It prints `2` and `2.5`"
        hint: "For four values, take the two in the middle and their average."
        misconceptions:
          - when: "err is None and lines == ['2', '3']"
            say: "For `[4, 1, 3, 2]` it gives 3: it takes only one of the two middle values. Test even lengths."
      - expr: "callable(ns.get('median')) and median([5]) == 5 and median([1, 2]) == 1.5 and median([9, 1, 5, 3, 7, 2]) == 4.0"
        pass: "It is right for one value, two values and six values"
        hint: "`if len(ordered) % 2 == 0:` then `(ordered[middle - 1] + ordered[middle]) / 2`."
      - expr: "callable(ns.get('median')) and raises(median, []) == 'ValueError'"
        pass: "An empty list raises a `ValueError`"
        hint: "At the start: `if not numbers: raise ValueError(...)`."
        misconceptions:
          - when: "callable(ns.get('median')) and raises(median, []) == 'IndexError'"
            say: "An empty list now gives an `IndexError` from `ordered[middle]`. Raise a clear `ValueError` first."
      - expr: "callable(ns.get('median')) and (lambda data: (median(data), data)[1] == [3, 1, 2])([3, 1, 2])"
        pass: "It does not change the list it gets"
        hint: "`sorted(numbers)` makes a new list. Keep it, do not use `numbers.sort()`."
    hints:
      - "Add `print(median([4, 1, 3, 2]))` and `print(median([]))`. Which answers are wrong?"
      - "With an even length, `middle` points at the second of the two middle values."
      - "`if len(ordered) % 2 == 0: return (ordered[middle - 1] + ordered[middle]) / 2`, and `if not numbers: raise ValueError(\"...\")` at the start."

  # 5. EXERCISE: independent -------------------------------------------------
  - id: ex-pin
    type: exercise
    fade: independent
    pytest: true
    objective: O2
    title: Tests for an AI function
    prompt: |
      An AI assistant wrote `is_valid_pin(pin)`: a PIN is valid when it is
      a text of **exactly 4 digits**, like `"0473"`.

      Before you use it, **write at least four tests** for it. The check puts
      typical AI mistakes into `is_valid_pin`, one at a time: your tests
      must catch each one. Think of the borders and of wrong inputs.
    starter: |
      import pytest


      def is_valid_pin(pin):
          return len(pin) == 4 and pin.isdigit()


      # Write your tests here.
    solution: |
      import pytest


      def is_valid_pin(pin):
          return len(pin) == 4 and pin.isdigit()


      def test_four_digits_are_valid():
          assert is_valid_pin("4821")


      def test_a_zero_at_the_start_is_valid():
          assert is_valid_pin("0473")
          assert is_valid_pin("0000")


      def test_three_or_five_digits_are_not_valid():
          assert not is_valid_pin("123")
          assert not is_valid_pin("12345")


      def test_letters_are_not_valid():
          assert not is_valid_pin("12a4")
          assert not is_valid_pin("")
    after: >-
      Tests are the fastest way to check AI code, and they stay: when you,
      or the assistant, change the function later, they check it again. You
      can even ask the assistant for the tests, and then check the tests.
    checks:
      - expr: "len(test_results) >= 4 and tests_pass()"
        pass: "At least four tests, and all pass with the right function"
        hint: "Functions whose names start with `test_`, each with `assert`."
        misconceptions:
          - when: "len(test_results) == 0"
            say: "pytest found no tests. Each test is a function whose name starts with `test_`."
          - when: "len(test_results) > 0 and not tests_pass()"
            say: "A test fails with the right function, so the test is wrong. Read its `E` line."
      - expr: |-
          tests_pass() and fails_with('''
          def is_valid_pin(pin):
              return len(pin) >= 4 and pin.isdigit()
          ''')
        pass: "Your tests catch a PIN with too many digits"
        hint: "Test five digits: `assert not is_valid_pin(\"12345\")`."
      - expr: |-
          tests_pass() and fails_with('''
          def is_valid_pin(pin):
              return len(pin) == 4
          ''')
        pass: "Your tests catch letters in a PIN"
        hint: "Test a PIN with a letter: `assert not is_valid_pin(\"12a4\")`."
      - expr: |-
          tests_pass() and fails_with('''
          def is_valid_pin(pin):
              return pin.isdigit() and 1000 <= int(pin) <= 9999
          ''')
        pass: "Your tests catch a PIN that starts with 0"
        hint: "`\"0473\"` is a valid PIN. A version with `int(pin)` thinks it has 3 digits."
      - expr: |-
          tests_pass() and fails_with('''
          def is_valid_pin(pin):
              return 3 <= len(pin) <= 4 and pin.isdigit()
          ''')
        pass: "Your tests catch a PIN with too few digits"
        hint: "Test three digits: `assert not is_valid_pin(\"123\")`."
    hints:
      - "One test for a good PIN: `assert is_valid_pin(\"4821\")`."
      - "The borders: 3 digits and 5 digits are not valid. A PIN that starts with 0 is."
      - "Wrong inputs: a letter, `\"12a4\"`, and an empty text `\"\"`."

  # 6. THEORY ----------------------------------------------------------------
  - id: names
    type: theory
    objective: O3
    title: Does it exist?
    body: |
      AI assistants sometimes use a function that sounds right but does not
      exist, or a parameter that the function does not have. Python will
      tell you, but only when that line runs:

      ```text
      AttributeError: 'str' object has no attribute 'reverse'
      ModuleNotFoundError: No module named 'easyweather'
      TypeError: sorted() got an unexpected keyword argument 'order'
      ```

      Check every name that is new to you:

      - `help(sorted)` or `help(str.split)` in Python,
      - `dir("text")`: the methods of a text,
      - the official docs, docs.python.org, or the docs of the package.

      A name that you cannot find in the docs does not exist. And a package
      name you do not know: look it up on pypi.org before `pip install`.
      Attackers publish packages with names that AI assistants invent.
    keys:
      - code: 'dir("text")'
        means: "All methods of a text. Is it there?"
      - code: "help(sorted)"
        means: "What it does, and its parameters."
      - code: "pypi.org"
        means: "Check a package before you install it."

  # 7. DEMO -----------------------------------------------------------------
  - id: lookup
    type: demo
    objective: O3
    title: Ask Python, not the AI
    intro: |
      An AI said: "texts have `reverse()` and `removeprefix()`". Press
      **Run**: Python itself tells you which of them exist, and what one of
      them does.
    code: |
      text = "Raspberry Pi"

      print("reverse" in dir(text))
      print("removeprefix" in dir(text))
      print(str.removeprefix.__doc__)
      print(text.removeprefix("Raspberry "))
    experiments:
      - text: "Run it as it is."
        expr: "err is None and lines[0] == 'False' and lines[1] == 'True'"
      - text: "Check if texts have a method `title`, and try it on `text`."
        expr: "err is None and \"'title'\" in src or err is None and 'title()' in src"
      - text: "Print the description of `str.split`: `print(str.split.__doc__)`."
        expr: "err is None and 'str.split.__doc__' in src"
    investigate:
      - kind: mcq
        id: i-dir
        prompt: "`\"reverse\" in dir(text)` is `False`. What does that tell you?"
        options:
          - text: "The AI was wrong"
            correct: true
            why: "Texts have no method `reverse`: `dir` lists every method of the object. Lists have `reverse`, texts do not."
          - text: "The method exists, but is hidden"
            why: "`dir` shows the methods; it is not there."
          - text: "You must import it first from `str`"
            why: "Methods come with the object. It does not exist for texts."

  # 8. THEORY ----------------------------------------------------------------
  - id: secrets
    type: theory
    objective: O4
    title: What not to share
    body: |
      What you type into an AI chat leaves your computer. It may be stored,
      read by people, or used to train the next model. So **never** paste:

      - passwords, API keys and tokens,
      - personal data of other people: names, addresses, phone numbers,
      - code or data that is not yours to share, like your company's code.

      Replace them first: `API_KEY = "YOUR_KEY"`, `"Ana Example"`, a small
      example made up by you. The assistant needs the shape of the problem,
      not the real secrets.

      Commands too: never run a command from an AI that you do not
      understand, above all with `sudo` (`curl ... | sudo bash` runs
      anything from the internet as root).

      **You are responsible** for the code you use, not the assistant. "The
      AI wrote it" does not fix a bug, a leak or a copied piece of someone
      else's code. Use it as a fast helper, and stay the one who decides.
    keys:
      - code: 'API_KEY = "YOUR_KEY"'
        means: "Replace secrets before you share code."
      - code: "sudo ... from an AI"
        means: "Only when you understand every word."
      - code: "you decide"
        means: "The responsibility for the code stays with you."

  # 8. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O4
    title: Check yourself
    items:
      - kind: diagnose
        id: q-reverse
        objective: O3
        mode: predict
        code: |
          word = "level"
          backwards = word.reverse()
          print(word == backwards)
        explain: >-
          An AI suggested `word.reverse()`, but texts have no `reverse`
          method: lists do. Python says so when the line runs. For a text,
          `word[::-1]` gives it backwards.
        distractors: [NameError, TypeError, ValueError, SyntaxError]
        fix:
          - text: "Use `word[::-1]`"
            correct: true
            why: "A slice with step -1 reads the text from the end."
          - text: "Import `reverse`"
            why: "There is no such module: the method does not exist for texts."
          - text: "Write `word.reverse` without brackets"
            why: "The attribute does not exist at all."
      - kind: spot
        id: q-secret
        objective: O4
        prompt: "You want to ask an AI assistant about this code. **Which line must you change before you paste it?**"
        code: |
          import requests

          API_KEY = "a1b2-c3d4-e5f6-my-real-key"
          CITY = "Oslo"


          def weather(city):
              url = "https://api.example.com/weather"
              return requests.get(url, params={"q": city, "key": API_KEY}, timeout=5)
        line: 3
        wrong:
          - line: 4
            say: "A city is not a secret. The key on line 3 is: replace it with \"YOUR_KEY\"."
          - line: 8
            say: "The address of a public service is fine to share. The key is not."
        explain: >-
          An API key is like a password of your account. Write `API_KEY =
          "YOUR_KEY"` before you paste: the assistant does not need the real
          key to help.
      - kind: mcq
        id: q-hitl
        objective: O2
        prompt: "What does \"human in the loop\" mean for AI code?"
        options:
          - text: "A person checks the code before use"
            correct: true
            why: "A person reviews, tests and approves it: you read it, run it, test it, and then you decide."
          - text: "A person types the code the AI says"
            why: "The point is checking, not typing."
          - text: "The AI asks a person when it is not sure"
            why: "It often does not know when it is wrong. You check every time."
      - kind: mcq
        id: q-command
        objective: O4
        prompt: "An AI assistant says: \"Run `curl https://fix.example.sh | sudo bash` to fix your Pi.\" What do you do?"
        options:
          - text: "First understand what the script does"
            correct: true
            why: "It would run any program from the internet as root."
          - text: "Run it: the assistant tested it"
            why: "It did not, and it cannot know that the site is safe."
          - text: "Run it without sudo, to be safe"
            why: "Without understanding it, any version is a risk."
      - kind: mcq
        id: q-works-once
        objective: O2
        prompt: "AI code works for the example in your question. Is it ready?"
        options:
          - text: "No: test borders and wrong inputs"
            correct: true
            why: "One good example proves little. The median failed only for even lengths."
          - text: "Yes: it gave the right answer once"
            why: "One right answer is not enough."
          - text: "Yes, if the code is short"
            why: "Short code can be wrong too."

  # 9. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O2
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-parts
    objective: O1
    prompt: "What should a good request to an AI assistant contain?"
    options:
      - text: "Task, context, an example, limits"
        correct: true
        why: "Then the assistant does not have to guess."
      - text: "Only one short sentence, to be clear"
        why: "A short request gives a guess."
      - text: "Your password, so it can test the code"
        why: "Never share a password."
  - kind: mcq
    id: r-four
    objective: O2
    prompt: "Which four checks come before AI code goes into your project?"
    options:
      - text: "Read, run, test, look up"
        correct: true
        why: "Read it, run it, test it, and look up what is new. Then you know what it does, and that it does it."
      - text: "Ask the AI four times, then compare"
        why: "The checks are done by you, with the computer."
      - text: "Count the lines, and keep it short"
        why: "Length says nothing about bugs."
  - kind: mcq
    id: r-exists
    objective: O3
    prompt: "How do you check that `str.removeprefix` exists?"
    options:
      - text: "`help(str.removeprefix)`, or the docs"
        correct: true
        why: "Or the page of `str` on docs.python.org. If help finds it, it exists, and it says what it does."
      - text: "Ask the AI again if it is sure"
        why: "It may repeat the same mistake. Check in Python or the docs."
      - text: "It exists if it sounds right"
        why: "Invented names sound right too."
  - kind: mcq
    id: r-share
    objective: O4
    prompt: "Which of these may you paste into an AI chat?"
    options:
      - text: "A small made-up example"
        correct: true
        why: "With a placeholder key: the shape of the problem, without the secrets."
      - text: "The real API key of your account"
        why: "It leaves your computer and may be stored."
      - text: "The addresses of your customers"
        why: "Personal data of other people stays out."
  - kind: mcq
    id: r-responsible
    objective: O4
    prompt: "Who is responsible for a bug in code that an AI wrote and you used?"
    options:
      - text: "You: you chose to use it"
        correct: true
        why: "Check it like your own code."
      - text: "The AI that wrote it"
        why: "The AI cannot fix the problem it caused in your project. You decide what goes in."
      - text: "Nobody: it was a tool"
        why: "Someone used it. That is you."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-empty-text
    type: exercise
    fade: debug
    objective: O2
    title: The AI forgot the empty text
    prompt: |
      An AI wrote `average_word_length`. It works for normal text, but a
      border test with an empty text stops with an error. **Fix it**: an
      empty text gives 0.

      ```text
      4.0
      0
      ```
    starter: |
      def average_word_length(text):
          words = text.split()
          return sum(len(w) for w in words) / len(words)


      print(average_word_length("tree bird"))
      print(average_word_length(""))
    solution: |
      def average_word_length(text):
          words = text.split()
          if not words:
              return 0
          return sum(len(w) for w in words) / len(words)


      print(average_word_length("tree bird"))
      print(average_word_length(""))
    after: >-
      AI code often works for the typical case and fails at the border.
      Test empty values, one value, and odd input before you trust it.
    checks:
      - expr: "callable(ns.get('average_word_length')) and average_word_length('') == 0 and average_word_length('   ') == 0"
        pass: "An empty text gives 0"
        hint: "`if not words: return 0`."
      - expr: "callable(ns.get('average_word_length')) and average_word_length('ab abcd') == 3.0"
        pass: "Normal text still works"
        hint: "Keep the last line."
      - expr: "lines == ['4.0', '0']"
        pass: "It prints 4.0 and 0"
        hint: "Keep the prints."
    hints:
      - "What is `len(words)` for an empty text?"
      - "Check for no words before you divide."
      - "`if not words: return 0`."
  - id: x-no-such-method
    type: exercise
    fade: debug
    objective: O3
    title: A method that does not exist
    prompt: |
      An AI said: "use `text.reverse()` to reverse a text". The program
      stops with an `AttributeError`. Check: `"reverse" in dir(str)` is
      `False`. **Fix it** with a slice that steps backwards.

      ```text
      olleh
      ```
    starter: |
      def backwards(text):
          return text.reverse()


      print(backwards("hello"))
    solution: |
      def backwards(text):
          return text[::-1]


      print(backwards("hello"))
    after: >-
      Lists have `reverse()`, texts do not. AI tools mix such names up.
      `dir()` and `help()` tell you in a second what really exists.
    checks:
      - expr: "callable(ns.get('backwards')) and backwards('abc') == 'cba' and backwards('') == ''"
        pass: "It reverses any text"
        hint: "`return text[::-1]`."
      - expr: "lines == ['olleh']"
        pass: "It prints olleh"
        hint: "Keep the print."
    hints:
      - "Read the message: which object has no `reverse`?"
      - "A slice can take a step: `[start:stop:step]`."
      - "A step of -1 goes backwards: `text[::-1]`."

# Challenges of the module: spec only, hidden checks.
  - id: c-inventory
    type: exercise
    fade: challenge
    objective: O2
    title: "Challenge: an inventory"
    prompt: |
      **Write two classes** for the stock of a shop:

      - `Item`: a dataclass with `name`, `price` and `count`.
      - `Inventory`:
        - `add(item)`: adds an item; an item with a name that is already
          there raises a `ValueError`.
        - `remove(name, n)`: takes `n` away from the count of that item; a
          missing name or not enough items raises a `ValueError`, and
          nothing changes.
        - `total_value`: a **property**, the sum of price × count.
        - `low_stock(limit)`: the sorted names of items with a count below
          `limit`.
        - `len(inv)` is the number of items, and `"tea" in inv` works.

      ```text
      2
      38.0
      ['cake']
      True
