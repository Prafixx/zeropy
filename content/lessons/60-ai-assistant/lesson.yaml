    solution: |
      import re

      import pytest


      def minutes(text):
          match = re.fullmatch(r"(?:(\d+)h)?(?:(\d+)m)?", text)
          if not text or not match:
              raise ValueError(f"not a time: {text!r}")
          hours, mins = match.groups()
          return int(hours or 0) * 60 + int(mins or 0)


      def test_hours_and_minutes():
          assert minutes("1h30m") == 90


      def test_minutes_only():
          assert minutes("45m") == 45


      def test_hours_only():
          assert minutes("2h") == 120


      def test_empty_is_an_error():
          with pytest.raises(ValueError):
              minutes("")


      def test_bad_text_is_an_error():
          with pytest.raises(ValueError):
              minutes("abc")
          with pytest.raises(ValueError):
              minutes("30m1h")
    after: >-
      Each bug lives in one kind of input. A test for each kind catches them
      all: that is why testers list the kinds of input first.
