      - expr: "callable(ns.get('Inventory')) and (lambda v: (v.add(Item('a', 2.0, 5)), raises(v.remove, 'a', 6), raises(v.remove, 'zz', 1), v.total_value, v.remove('a', 5), v.total_value)[1:])(Inventory()) == ('ValueError', 'ValueError', 10.0, None, 0.0)"
