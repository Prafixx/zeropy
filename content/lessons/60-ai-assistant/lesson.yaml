    solution: |
      from dataclasses import dataclass


      @dataclass
      class Item:
          name: str
          price: float
          count: int


      class Inventory:
          def __init__(self):
              self.items = {}

          def add(self, item):
              if item.name in self.items:
                  raise ValueError(f"{item.name} is already there")
              self.items[item.name] = item

          def remove(self, name, n):
              if name not in self.items:
                  raise ValueError(f"no {name}")
              item = self.items[name]
              if n > item.count:
                  raise ValueError(f"only {item.count} {name} left")
              item.count = item.count - n

          @property
          def total_value(self):
              return sum(i.price * i.count for i in self.items.values())

          def low_stock(self, limit):
              return sorted(i.name for i in self.items.values() if i.count < limit)

          def __len__(self):
              return len(self.items)

          def __contains__(self, name):
              return name in self.items


      inv = Inventory()
      inv.add(Item("tea", 2.5, 15))
      inv.add(Item("cake", 4.0, 2))
      inv.remove("tea", 3)
      print(len(inv))
      print(inv.total_value)
      print(inv.low_stock(5))
      print("tea" in inv)
    after: >-
      Two classes, each with one job: the item holds data, the inventory
      keeps the rules. Every rule refuses a bad change before it changes
      anything.
