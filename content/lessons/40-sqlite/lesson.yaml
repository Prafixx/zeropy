  - id: x-rename
    type: exercise
    fade: independent
    objective: O4
    title: Rename a product
    prompt: |
      **Write `rename(old, new)`**: it changes the name of every product
      called `old` to `new`, saves the change, and gives back how many rows
      changed. The `rowcount` of what `execute` gives back is that number.

      ```text
      1
      0
      ['coffee', 'milk']
      ```
    starter: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE products (name TEXT)")
      con.executemany("INSERT INTO products VALUES (?)", [("tea",), ("milk",)])

      # Your function here.


      print(rename("tea", "coffee"))
      print(rename("cake", "pie"))
      print([name for (name,) in con.execute("SELECT name FROM products ORDER BY name")])
    solution: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE products (name TEXT)")
      con.executemany("INSERT INTO products VALUES (?)", [("tea",), ("milk",)])


      def rename(old, new):
          with con:
              cursor = con.execute("UPDATE products SET name = ? WHERE name = ?", (new, old))
          return cursor.rowcount


      print(rename("tea", "coffee"))
      print(rename("cake", "pie"))
      print([name for (name,) in con.execute("SELECT name FROM products ORDER BY name")])
    after: >-
      `rowcount` tells you whether anything happened: 0 means no row had
      that name, which a program can report to the user.
    checks:
      - expr: "callable(ns.get('rename')) and rename('milk', 'water') == 1 and rename('nothing', 'x') == 0 and [n for (n,) in con.execute('SELECT name FROM products ORDER BY name')] == ['coffee', 'water']"
        pass: "It renames, and gives back how many rows changed"
        hint: "`UPDATE products SET name = ? WHERE name = ?`, with the values `(new, old)` in that order: they fill the `?` places from the left."
      - expr: "lines == ['1', '0', \"['coffee', 'milk']\"]"
        pass: "It prints 1, 0 and ['coffee', 'milk']"
        hint: "Return the `rowcount` of the UPDATE."
      - expr: "'execute(f' not in src.replace(' ', '')"
        pass: "The names go in with ?"
        hint: "No f-strings in the SQL."
    hints:
      - "`with con:` around the UPDATE saves the change."
      - "Keep what `execute` gives back: `cursor = con.execute(...)`."
      - "`return cursor.rowcount` after the `with` block."
