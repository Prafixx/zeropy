extra:
  - id: x-count
    type: exercise
    fade: completion
    objective: O2
    title: How many books?
    prompt: |
      **Replace `___`** so that `count_by(author)` gives the number of
      books of that author. `COUNT(*)` counts the rows, and `fetchone()`
      gives the one row of the result.

      ```text
      2
      0
      ```
    starter: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE books (title TEXT, author TEXT)")
      books = [("Emma", "Austen"), ("Dune", "Herbert"), ("Persuasion", "Austen")]
      con.executemany("INSERT INTO books VALUES (?, ?)", books)


      def count_by(author):
          query = "SELECT COUNT(*) FROM books WHERE author = ?"
          return con.execute(query, ___).fetchone()[0]


      print(count_by("Austen"))
      print(count_by("Tolkien"))
    solution: |
      import sqlite3

      con = sqlite3.connect(":memory:")
      con.execute("CREATE TABLE books (title TEXT, author TEXT)")
