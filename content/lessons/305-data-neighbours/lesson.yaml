id: data-neighbours
order: 305
title: "Sort into classes: nearest neighbours"
summary: A model that puts things into classes, by looking at the most similar examples. Measure it with accuracy, choose its settings without fooling yourself, and put the features on the same scale.
minutes: 55
outcomes: []

objectives:
  - id: O1
    text: Tell classification (a class) from regression (a number)
  - id: O2
    text: Classify a new example by its nearest neighbours, with distances from numpy
  - id: O3
    text: Measure a classifier with accuracy on a test set, and know when accuracy fools you
  - id: O4
    text: Choose k on a validation set, keep the test set for one last check, and see that k = 1 can learn the noise
  - id: O5
    text: Put the features on the same scale - standardize them with the mean and spread of the training data

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: classes
    type: theory
    objective: O1
    title: A class instead of a number
    body: |
      The line of the last lesson predicted a **number**: litres of fuel.
      That is **regression**. Many questions want a **class** instead: spam
      or not spam, cat or dog, which kind of penguin. That is
      **classification**.

      A simple classifier: **k nearest neighbours**. For a new example,
      find the `k` examples that are most similar, and take the class that
      most of them have. "Tell me who your neighbours are..."

      Here, two kinds of penguins, measured by the length of the bill and
      of the flipper (in mm):

      ```python
      train = np.array([[39.1, 181], [38.6, 190], ..., [49.9, 213]])
      labels = np.array(["Adelie", "Adelie", ..., "Gentoo"])
      ```

      Each row is one penguin, with 2 **features**. `labels` holds the class
      of each row.
    keys:
      - code: "regression"
        means: "Predict a number."
      - code: "classification"
        means: "Predict a class."
      - code: "k nearest neighbours"
        means: "Take the class of most of the k most similar examples."

  # 2. THEORY ----------------------------------------------------------------
  - id: distance
    type: theory
    objective: O2
    title: How similar? A distance
    body: |
      Two penguins are similar when their features are close. The distance
      between two points, like on a map:

      ```text
      distance = √((bill₁ - bill₂)² + (flipper₁ - flipper₂)²)
      ```

      numpy does it for all penguins at once. `train - new` subtracts `new`
      from **every row** (numpy repeats the row for you):

      ```python
      new = np.array([45.1, 207])
      d = np.sqrt(((train - new) ** 2).sum(axis=1))   # one distance per penguin
      np.argmin(d)          # the place of the smallest distance
      np.argsort(d)[:3]     # the places of the 3 smallest, nearest first
      labels[np.argsort(d)[:3]]    # their classes
      ```

      `argmin` and `argsort` give **places**, not values: use them as an
      index into `labels`.
    keys:
      - code: "((train - new) ** 2).sum(axis=1)"
        means: "Squared differences, summed per row."
      - code: "np.argmin(d)"
        means: "The place of the nearest example."
      - code: "np.argsort(d)[:k]"
        means: "The places of the k nearest."

  # 3. DEMO -----------------------------------------------------------------
  - id: nearest
    type: demo
    visual: none
    objective: O2
    title: Who are the neighbours?
    intro: |
      A new penguin has a bill of 45.1 mm and a flipper of 207 mm. Press
      **Run**: the program finds its nearest neighbours. The chart shows
      the training penguins (blue: Adelie, orange: Gentoo) and the new one.
    code: |
      import numpy as np
      import matplotlib.pyplot as plt

      train = np.array([[39.1, 181], [38.6, 190], [40.3, 195], [36.7, 193],
                        [39.3, 190], [38.9, 184], [46.0, 209], [46.1, 211],
                        [48.7, 210], [47.5, 217], [50.0, 220], [45.5, 215],
                        [49.9, 213]])
      labels = np.array(["Adelie"] * 7 + ["Gentoo"] * 6)
      new = np.array([45.1, 207])

      d = np.sqrt(((train - new) ** 2).sum(axis=1))
      print("distances:", d.round(1))
      print("nearest:", labels[np.argmin(d)])
      print("3 nearest:", labels[np.argsort(d)[:3]])

      # "C0" is the first colour of matplotlib (blue), "C1" the second (orange).
      colors = ["C0" if label == "Adelie" else "C1" for label in labels]
      plt.scatter(train[:, 0], train[:, 1], c=colors)   # c=: one colour per point
      plt.scatter([new[0]], [new[1]], color="red", marker="x", label="new penguin")
      plt.xlabel("bill (mm)")
      plt.ylabel("flipper (mm)")
      plt.legend()
      plt.show()
    experiments:
      - text: "Run it as it is."
        expr: "err is None and 'nearest: Adelie' in out"
      - text: "Try a penguin with a bill of 38 mm and a flipper of 186 mm."
        expr: "err is None and 'nearest: Adelie' in out and 'new=np.array([38' in src.replace(' ', '')"
      - text: "Print the 5 nearest: `np.argsort(d)[:5]`."
        expr: "err is None and '[:5]' in src"
    investigate:
      - kind: mcq
        id: i-odd
        prompt: "The nearest penguin is an Adelie, but the next two are Gentoo. What is special about the nearest one?"
        options:
          - text: "It is an unusual Adelie"
            correct: true
            why: "Its measurements are like a Gentoo: row 6, `[46.0, 209]`, sits among them. Real data has such cases."
          - text: "The distance was calculated wrong"
            why: "It is the closest: 2.2 mm away."
          - text: "Adelie and Gentoo are the same"
            why: "They are two kinds. This one Adelie is unusual."
      - kind: mcq
        id: i-argmin
        prompt: "What does `np.argmin(d)` give here?"
        options:
          - text: "6: a place in the list"
            correct: true
            why: "The place of the smallest distance, so `labels[6]` gives its class."
          - text: "2.2: the smallest distance"
            why: "That is `d.min()`. `argmin` gives the place."
          - text: "\"Adelie\": the class of the nearest"
            why: "That is `labels[np.argmin(d)]`."

  # 4. EXERCISE: completion --------------------------------------------------
  - id: ex-vote
    type: exercise
    fade: completion
    objective: O2
    title: Let the neighbours vote
    prompt: |
      **Complete `classify(new, k)`**: it finds the `k` nearest training
      penguins, and gives back the class that most of them have.

      ```text
      Adelie
      Gentoo
      ```
    given: |
      import numpy as np
      from collections import Counter

      train = np.array([[39.1, 181], [38.6, 190], [40.3, 195], [36.7, 193],
                        [39.3, 190], [38.9, 184], [46.0, 209], [46.1, 211],
                        [48.7, 210], [47.5, 217], [50.0, 220], [45.5, 215],
                        [49.9, 213]])
      labels = np.array(["Adelie"] * 7 + ["Gentoo"] * 6)
    starter: |
      # numpy (np), Counter, train and labels exist.


      def classify(new, k):
          d = np.sqrt(((train - new) ** 2).sum(axis=1))
          near = ___
          votes = Counter(labels[near])
          return ___


      new = np.array([45.1, 207])
      print(classify(new, 1))
      print(classify(new, 3))
    solution: |
      def classify(new, k):
          d = np.sqrt(((train - new) ** 2).sum(axis=1))
          near = np.argsort(d)[:k]
          votes = Counter(labels[near])
          return votes.most_common(1)[0][0]


      new = np.array([45.1, 207])
      print(classify(new, 1))
      print(classify(new, 3))
    after: >-
      With one neighbour, the unusual Adelie decides. With three, the two
      Gentoo outvote it. More neighbours make the model calmer about odd
      examples.
    checks:
      - expr: "callable(ns.get('classify')) and classify(np.array([38.0, 186]), 1) == 'Adelie' and classify(np.array([49.0, 216]), 3) == 'Gentoo'"
        pass: "It classifies clear cases right"
        hint: "`near = np.argsort(d)[:k]`: the places of the k nearest."
      - expr: "callable(ns.get('classify')) and classify(np.array([45.1, 207]), 1) == 'Adelie' and classify(np.array([45.1, 207]), 3) == 'Gentoo'"
        pass: "k = 1 and k = 3 give different answers for the new penguin"
        hint: "`return votes.most_common(1)[0][0]`: the class with the most votes."
      - expr: "err is None and lines == ['Adelie', 'Gentoo']"
        pass: "It prints Adelie, then Gentoo"
        hint: "Keep the two prints."
    hints:
      - "The first `___`: the places of the `k` smallest distances."
      - "`np.argsort(d)[:k]`."
      - "The second: `votes.most_common(1)` is a list with one pair `(class, count)`: take `[0][0]`."

  # 5. THEORY ----------------------------------------------------------------
  - id: accuracy
    type: theory
    objective: O3
    title: Accuracy, and when it lies
    body: |
      **Accuracy** is the share of predictions that are right:

      ```python
      predicted = np.array([classify(p, 3) for p in test])
      accuracy = (predicted == test_labels).mean()     # True counts as 1
      ```

      As always, measure on a **test set** that the model never saw.

      Accuracy can fool you. If only 1 email in 100 is spam, a "model" that
      **always** says "not spam" has an accuracy of 99%, and it never finds
      one spam email. With rare classes, also count how many of the rare
      ones the model really finds.

      And **k**: with `k = 1`, one unusual example decides alone. The model
      learns the **noise** of the examples, not the rule: that is
      **overfitting**. A bigger `k` is calmer; a very big `k` ignores the
      details. How to choose `k` without fooling yourself comes after the
      next exercise.
    keys:
      - code: "(predicted == true).mean()"
        means: "Accuracy: the share that is right."
      - code: "99% can be useless"
        means: "With a rare class, always saying \"no\" scores high."
      - code: "k = 1"
        means: "One odd example decides: overfitting."

  # 6. EXERCISE: debug -------------------------------------------------------
  - id: ex-perfect
    type: exercise
    fade: debug
    objective: O3
    title: A perfect score that means nothing
    prompt: |
      The program measures the accuracy of the classifier with `k = 1`. It
      prints `1.0`: perfect. Too good to be true. **Find the mistake**, fix
      it, and print the real accuracy on the test penguins:

      ```text
      0.857
      ```
    given: |
      import numpy as np
      from collections import Counter

      train = np.array([[39.1, 181], [38.6, 190], [40.3, 195], [36.7, 193],
                        [39.3, 190], [38.9, 184], [46.0, 209], [46.1, 211],
                        [48.7, 210], [47.5, 217], [50.0, 220], [45.5, 215],
                        [49.9, 213]])
      labels = np.array(["Adelie"] * 7 + ["Gentoo"] * 6)
      test = np.array([[37.8, 188], [46.8, 215], [41.1, 198], [48.4, 214],
                       [45.1, 207], [42.0, 201], [46.3, 210]])
      test_labels = np.array(["Adelie", "Gentoo", "Adelie", "Gentoo",
                              "Gentoo", "Adelie", "Gentoo"])


      def classify(new, k):
          d = np.sqrt(((train - new) ** 2).sum(axis=1))
          votes = Counter(labels[np.argsort(d)[:k]])
          return votes.most_common(1)[0][0]
    starter: |
      # train, labels, test, test_labels and classify exist.
      predicted = np.array([classify(p, 1) for p in train])
      accuracy = (predicted == labels).mean()
      print(round(accuracy, 3))
    solution: |
      predicted = np.array([classify(p, 1) for p in test])
      accuracy = (predicted == test_labels).mean()
      print(round(accuracy, 3))
    after: >-
      Each training penguin is its own nearest neighbour, at distance 0, so
      `k = 1` is always right on the training set. Only the test set shows
      the truth: one test penguin was fooled by the unusual Adelie.
    checks:
      - expr: "err is None and lines == ['0.857']"
        pass: "It prints the accuracy on the test penguins: 0.857"
        hint: "Classify the `test` penguins, and compare with `test_labels`."
        misconceptions:
          - when: "err is None and lines == ['1.0']"
            say: "1.0 comes from measuring on the training penguins: each one finds itself. Use `test` and `test_labels`."
      - expr: "'test_labels' in src and 'for p in test' in src"
        pass: "It measures on the test set"
        hint: "`for p in test`, and `== test_labels`."
    hints:
      - "Which penguins does the program classify? Has the model seen them?"
      - "Each training penguin is at distance 0 from itself."
      - "`for p in test` and `(predicted == test_labels).mean()`."

  # 7. THEORY ----------------------------------------------------------------
  - id: three-sets
    type: theory
    objective: O4
    title: Three sets, not two
    body: |
      Each time you try a `k` and look at the test score, you learn
      something from the test set. If you choose `k` by its test score,
      the test set has become part of the training. Its score is then too
      good to trust.

      So split the examples into **three** sets:

      - **training**: the model learns from it (for this model: the
        examples it compares with);
      - **validation**: try the settings, like `k`, and choose the best;
      - **test**: use it **once**, at the very end. Its score is your
        honest estimate of how the model does on new data.

      ```python
      for k in [1, 3, 5]:
          ...                        # accuracy on val: choose k here
      ...                            # once, at the end: accuracy on test
      ```

      With very little data, every set is tiny, and one example moves a
      score a lot. Then people use **cross-validation**: split the data
      into, say, 5 parts, use each part once as the validation set, and
      take the average of the 5 scores.
    keys:
      - code: "training set"
        means: "The model learns from it."
      - code: "validation set"
        means: "Compare settings, like k, and choose."
      - code: "test set"
        means: "Once, at the end: the honest score."

  # 7b. DRILL ---------------------------------------------------------------
  - id: drill-sets
    type: drill
    objective: O4
    title: Which set, for what?
    items:
      - kind: mcq
        id: d-learn
        objective: O4
        prompt: "The model compares a new penguin with known examples. Which set holds those examples?"
        options:
          - text: "The training set"
            correct: true
            why: "The model learns from the training set: here, it is the examples it compares with."
          - text: "The validation set"
            why: "That set is for choosing settings like k, not for the model to learn from."
          - text: "The test set"
            why: "That set waits until the very end, unused."
      - kind: mcq
        id: d-try
        objective: O4
        prompt: "You want to try k = 1, 3, 5 and 7. Which accuracy do you compare?"
        options:
          - text: "On the validation set"
            correct: true
            why: "That is its job. The test set stays untouched."
          - text: "On the test set, as it is new data"
            why: "Then the test set helps to choose, and its score is too good to trust."
          - text: "On the training set, as it is the biggest"
            why: "With k = 1, every training penguin finds itself: always 100%."
      - kind: mcq
        id: d-report
        objective: O4
        prompt: "You chose k = 3. Which score do you report as the quality of the model?"
        options:
          - text: "The test score, measured once"
            correct: true
            why: "Nothing was chosen with it, so it is the honest estimate."
          - text: "The best validation score"
            why: "You chose k by that score, so it is a little too good."
          - text: "The mean of all validation scores"
            why: "That mixes in the k values you did not choose."

  # 8. EXERCISE: independent -------------------------------------------------
  - id: ex-k
    type: exercise
    fade: independent
    objective: O4
    title: Which k is best?
    prompt: |
      **Choose `k` on the validation set.** Print the validation accuracy
      for `k = 1`, `k = 3` and `k = 5`, rounded to 3 decimals. Then take the
      best `k` (the first one with the highest accuracy), and print its
      accuracy on the test set, once:

      ```text
      k=1: 0.857
      k=3: 1.0
      k=5: 1.0
      best k: 3
      test: 1.0
      ```
    given: |
      import numpy as np
      from collections import Counter

      train = np.array([[39.1, 181], [38.6, 190], [40.3, 195], [36.7, 193],
                        [39.3, 190], [38.9, 184], [46.0, 209], [46.1, 211],
                        [48.7, 210], [47.5, 217], [50.0, 220], [45.5, 215],
                        [49.9, 213]])
      labels = np.array(["Adelie"] * 7 + ["Gentoo"] * 6)
      val = np.array([[37.8, 188], [46.8, 215], [41.1, 198], [48.4, 214],
                      [45.1, 207], [42.0, 201], [46.3, 210]])
      val_labels = np.array(["Adelie", "Gentoo", "Adelie", "Gentoo",
                             "Gentoo", "Adelie", "Gentoo"])
      test = np.array([[38.2, 185], [47.2, 214], [40.6, 199], [44.9, 208],
                       [36.9, 189], [49.1, 219]])
      test_labels = np.array(["Adelie", "Gentoo", "Adelie", "Gentoo",
                              "Adelie", "Gentoo"])


      def classify(new, k):
          d = np.sqrt(((train - new) ** 2).sum(axis=1))
          votes = Counter(labels[np.argsort(d)[:k]])
          return votes.most_common(1)[0][0]
    starter: |
      # train, labels, val, val_labels, test, test_labels and classify exist.
    solution: |
      scores = {}
      for k in [1, 3, 5]:
          predicted = np.array([classify(p, k) for p in val])
          scores[k] = (predicted == val_labels).mean()
          print(f"k={k}: {round(scores[k], 3)}")
      best = max(scores, key=scores.get)
      print("best k:", best)
      predicted = np.array([classify(p, best) for p in test])
      print("test:", round((predicted == test_labels).mean(), 3))
    after: >-
      The test score is the one to report, because nothing was chosen with
      it. Here it is 1.0 on 6 penguins: with so few, that only means
      "probably good". A real project needs hundreds of examples.
    checks:
      - expr: "err is None and lines[:3] == ['k=1: 0.857', 'k=3: 1.0', 'k=5: 1.0']"
        pass: "The validation accuracy for k = 1, 3 and 5"
        hint: "A loop over `[1, 3, 5]`, and inside it the accuracy on `val` and `val_labels`."
        misconceptions:
          - when: "err is None and lines[:3] == ['k=1: 0.833', 'k=3: 1.0', 'k=5: 1.0']"
            say: "These are test scores. Choose `k` on `val`: the test set is only for the very end."
          - when: "err is None and lines[:3] == ['k=1: 1.0', 'k=3: 1.0', 'k=5: 1.0']"
            say: "Measure on `val` and `val_labels`, not on the training penguins."
      - expr: "err is None and lines[3:] == ['best k: 3', 'test: 1.0']"
        pass: "It chooses k = 3, then measures the test set once"
        hint: "`best = max(scores, key=scores.get)`, then the accuracy of `best` on `test`."
      - expr: "src.count('in test') == 1 and 'val_labels' in src"
        pass: "The test set is used only once"
        hint: "Classify `test` only one time, with the best `k`, after the loop."
    hints:
      - "Keep the scores in a dict: `scores[k] = (predicted == val_labels).mean()`."
      - "`max(scores, key=scores.get)` gives the key with the highest score; on a tie, the first one."
      - "After the loop: `predicted = np.array([classify(p, best) for p in test])`, then print the test accuracy."

  # 9. THEORY ----------------------------------------------------------------
  - id: scale
    type: theory
    objective: O5
    title: The same scale for every feature
    body: |
      Look at the numbers: bills go from about 37 to 50 mm, flippers from
      181 to 220 mm. The distance adds up the differences as they are, so
      10 mm of flipper counts as much as 10 mm of bill. But 10 mm is a big
      step for a bill and a small one for a flipper. So the flipper decides
      almost alone.

      **Standardize** each feature: subtract its mean, then divide by its
      **standard deviation** (`std`: how far the values spread around the
      mean). After that, every feature has a mean of 0 and a spread of 1:

      ```python
      mean = train.mean(axis=0)      # one mean per column
      std = train.std(axis=0)        # one spread per column
      train_s = (train - mean) / std
      new_s = (new - mean) / std     # the SAME mean and std
      ```

      Compute `mean` and `std` on the **training set only**, and use them
      for every new, validation and test example. Taken from the test set
      too, they would **leak** it into the model: information from the test
      set would get into the model, and its score would be too good.
    keys:
      - code: "train.mean(axis=0)"
        means: "The mean of each column (each feature)."
      - code: "(x - mean) / std"
        means: "Standardize: mean 0, spread 1."
      - code: "mean and std of train"
        means: "Use them for new and test data too."

  # 10. EXERCISE: completion -------------------------------------------------
  - id: ex-scale
    type: exercise
    fade: completion
    objective: O5
    title: Neighbours on the same scale
    prompt: |
      A new penguin has a bill of 41.5 mm and a flipper of 206 mm. Without
      scaling, its 3 nearest neighbours vote Gentoo. **Replace the three
      `___`** to standardize with the training data, and see who the
      neighbours are then:

      ```text
      raw: ['Adelie' 'Gentoo' 'Gentoo']
      scaled: ['Adelie' 'Adelie' 'Gentoo']
      ```
    given: |
      import numpy as np

      train = np.array([[39.1, 181], [38.6, 190], [40.3, 195], [36.7, 193],
                        [39.3, 190], [38.9, 184], [46.0, 209], [46.1, 211],
                        [48.7, 210], [47.5, 217], [50.0, 220], [45.5, 215],
                        [49.9, 213]])
      labels = np.array(["Adelie"] * 7 + ["Gentoo"] * 6)


      def nearest3(X, point):
          d = np.sqrt(((X - point) ** 2).sum(axis=1))
          return labels[np.argsort(d)[:3]]
    starter: |
      # train, labels and nearest3 exist.
      new = np.array([41.5, 206])
      print("raw:", nearest3(train, new))

      mean = train.___(axis=0)
      std = train.___(axis=0)
      train_s = (train - mean) / std
      new_s = (new - ___) / std
      print("scaled:", nearest3(train_s, new_s))
    solution: |
      # train, labels and nearest3 exist.
      new = np.array([41.5, 206])
      print("raw:", nearest3(train, new))

      mean = train.mean(axis=0)
      std = train.std(axis=0)
      train_s = (train - mean) / std
      new_s = (new - mean) / std
      print("scaled:", nearest3(train_s, new_s))
    after: >-
      On the same scale, the bill counts again, and 41.5 mm is an Adelie
      bill. The model did not change; only the units of the distance did.
    checks:
      - expr: "err is None and lines == [\"raw: ['Adelie' 'Gentoo' 'Gentoo']\", \"scaled: ['Adelie' 'Adelie' 'Gentoo']\"]"
        pass: "On the same scale, the neighbours vote Adelie"
        hint: "`train.mean(axis=0)` and `train.std(axis=0)`, and the new penguin gets the same `mean`."
        misconceptions:
          - when: "err == 'NameError'"
            say: "Each `___` needs a name: `mean`, `std` (the methods of the array), and the variable `mean`."
      - expr: "'train.mean(axis=0)' in src.replace(' ', '') and 'train.std(axis=0)' in src.replace(' ', '') and '(new-mean)/std' in src.replace(' ', '')"
        pass: "The mean and std come from the training data, and the new penguin uses them too"
        hint: "Scale the new penguin with the training `mean` and `std`, never with its own."
    hints:
      - "numpy arrays have the methods `.mean()` and `.std()`."
      - "`axis=0` gives one value per column: one for the bill, one for the flipper."
      - "`train.mean(axis=0)`, `train.std(axis=0)`, and `(new - mean) / std`."

  # 11. QUIZ ----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O3
    title: Check yourself
    items:
      - kind: mcq
        id: q-kind
        objective: O1
        prompt: "Which of these is classification?"
        options:
          - text: "Is this photo a cat or a dog?"
            correct: true
            why: "The answer is a class."
          - text: "How many mm of rain will fall tomorrow?"
            why: "A number: regression."
          - text: "What will this flat cost?"
            why: "A price is a number: regression."
      - kind: mcq
        id: q-rare
        objective: O3
        prompt: "1 in 100 patients has a rare illness. A model always says \"healthy\". What is its accuracy?"
        options:
          - text: "99%"
            correct: true
            why: "And it is useless: it never finds the illness. With rare classes, accuracy alone fools you."
          - text: "0%"
            why: "It is right for the 99 healthy patients."
          - text: "50%"
            why: "The classes are not half and half."
      - kind: predict
        id: q-argsort
        objective: O2
        code: |
          import numpy as np

          d = np.array([5.0, 1.0, 4.0, 2.0])
          print(np.argmin(d))
          print(np.argsort(d)[:2])
        explain: "The smallest value, 1.0, is at place 1. Sorted, the places are 1, 3, 2, 0."
        misconceptions:
          - answer: "1.0\n[1. 2.]"
            say: "`argmin` and `argsort` give places, not values."
      - kind: mcq
        id: q-choose
        objective: O4
        prompt: "You tried 20 values of k and kept the one with the best **test** score: 96%. What is wrong?"
        options:
          - text: "The test set helped to choose, so 96% is too good to trust"
            correct: true
            why: "Choose on a validation set, then measure the test set once. That score is honest."
          - text: "Nothing: the test set was not used for training"
            why: "Choosing k with it is a kind of training. Its score no longer shows new data."
          - text: "20 values are too many: only k = 3 is allowed"
            why: "Any number of tries is fine, on the validation set."
      - kind: mcq
        id: q-k1
        objective: O4
        prompt: "Why can `k = 1` be a bad choice?"
        options:
          - text: "One unusual example decides alone"
            correct: true
            why: "The model learns the noise: that is overfitting. More neighbours outvote odd examples."
          - text: "It is much slower than k = 5"
            why: "It is faster. The problem is the noise."
          - text: "It cannot classify new examples"
            why: "It can: it takes the class of the one nearest example."

  # 12. REVIEW --------------------------------------------------------------
  - id: review
    type: review
    objective: O3
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-regression
    objective: O1
    prompt: "What does a regression model predict?"
    options:
      - text: "A number"
        correct: true
        why: "Like litres of fuel, or a price."
      - text: "A class"
        why: "That is classification."
      - text: "A chart"
        why: "A model predicts values."
  - kind: mcq
    id: r-knn
    objective: O2
    prompt: "How does k nearest neighbours classify a new example?"
    options:
      - text: "The class most of the k nearest have"
        correct: true
        why: "The k most similar examples vote. Similar means: a small distance between the features."
      - text: "It draws the best line"
        why: "That is the line model."
      - text: "It always takes the first class"
        why: "It asks the neighbours."
  - kind: mcq
    id: r-accuracy
    objective: O3
    prompt: "8 of 10 test predictions are right. What is the accuracy?"
    options:
      - text: "0.8"
        correct: true
        why: "The share that is right: 8 / 10."
      - text: "8"
        why: "Accuracy is a share, from 0 to 1."
      - text: "0.2"
        why: "That is the share that is wrong."
  - kind: mcq
    id: r-train-score
    objective: O3
    prompt: "A k = 1 model is 100% right on its training data. What does it prove?"
    options:
      - text: "Nothing"
        correct: true
        why: "Each training example finds itself. Measure on a test set."
      - text: "The model is perfect"
        why: "On new data it can be much worse."
      - text: "The data is easy"
        why: "k = 1 is always 100% on its own training data."
  - kind: mcq
    id: r-overfit
    objective: O4
    prompt: "What is overfitting?"
    options:
      - text: "The model learns the noise of its examples"
        correct: true
        why: "And then it does worse on new data. The test set shows it."
      - text: "The model is too small"
        why: "That is the other problem: it misses the rule."
      - text: "The data has too many rows to learn"
        why: "More data usually helps."
  - kind: mcq
    id: r-validation
    objective: O4
    prompt: "Which set do you use to choose k?"
    options:
      - text: "The validation set"
        correct: true
        why: "The test set stays unused until the end, so its score stays honest."
      - text: "The test set"
        why: "Then the test set helped to choose, and its score is too good."
      - text: "The training set"
        why: "With k = 1, every training example finds itself: always 100%."
  - kind: mcq
    id: r-scale
    objective: O5
    prompt: "Where do the mean and the std for standardizing come from?"
    options:
      - text: "From the training set, and they are used for all other data too"
        correct: true
        why: "The model may only learn from the training data. New and test data get the same mean and std."
      - text: "From the test set, because the model is measured there"
        why: "Then the test set leaks into the model, and its score is too good."
      - text: "From each set on its own, so every set has mean 0"
        why: "Then the same penguin gets different numbers in different sets."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-distance
    type: exercise
    fade: completion
    objective: O2
    title: How far apart?
    prompt: |
      **Replace `___`** so that `distance(a, b)` is the straight distance
      between two points: the square root of the sum of the squared
      differences.

      ```text
      5.0
      ```
    starter: |
      import numpy as np


      def distance(a, b):
          return np.sqrt(((a - b) ___).sum())


      print(float(distance(np.array([0.0, 0.0]), np.array([3.0, 4.0]))))
    solution: |
      import numpy as np


      def distance(a, b):
          return np.sqrt(((a - b) ** 2).sum())


      print(float(distance(np.array([0.0, 0.0]), np.array([3.0, 4.0]))))
    after: >-
      3² + 4² = 25, and the root of 25 is 5: the old theorem of Pythagoras.
      The same line works for points with 2, 3 or 100 features.
    checks:
      - expr: "callable(ns.get('distance')) and float(distance(np.array([1.0, 1.0, 1.0]), np.array([1.0, 3.0, 1.0]))) == 2.0 and float(distance(np.array([2.0]), np.array([-1.0]))) == 3.0"
        pass: "It gives the distance for any number of features"
        hint: "Square each difference: `** 2`."
      - expr: "lines == ['5.0']"
        pass: "It prints 5.0"
        hint: "Keep the print."
    hints:
      - "Each difference must be squared before the sum."
      - "The power operator is `**`."
      - "`(a - b) ** 2`."
  - id: x-accuracy
    type: exercise
    fade: independent
    objective: O3
    title: How often is it right?
    prompt: |
      **Write `accuracy(predicted, true)`**: the share of predictions that are
      right, as a number from 0 to 1. Both are numpy arrays of the same
      length.

      ```text
      0.75
      ```
    starter: |
      import numpy as np

      # Your function here.


      predicted = np.array(["cat", "dog", "dog", "cat"])
      true = np.array(["cat", "dog", "cat", "cat"])
      print(float(accuracy(predicted, true)))
    solution: |
      import numpy as np


      def accuracy(predicted, true):
          return (predicted == true).mean()


      predicted = np.array(["cat", "dog", "dog", "cat"])
      true = np.array(["cat", "dog", "cat", "cat"])
      print(float(accuracy(predicted, true)))
    after: >-
      `predicted == true` gives True or False for each place, and the mean
      of booleans is the share of True. Three right out of four: 0.75.
    checks:
      - expr: "callable(ns.get('accuracy')) and float(accuracy(np.array([1, 2, 3]), np.array([1, 2, 3]))) == 1.0 and float(accuracy(np.array(['a', 'b']), np.array(['b', 'a']))) == 0.0 and float(accuracy(np.array([1, 1, 2, 2, 3]), np.array([1, 2, 2, 2, 1]))) == 0.6"
        pass: "It gives the share of right predictions"
        hint: "Compare the two arrays with `==`, then take the `.mean()`."
        misconceptions:
          - when: "callable(ns.get('accuracy')) and raises(accuracy, np.array([1, 2, 3]), np.array([1, 2, 3])) is None and float(accuracy(np.array([1, 2, 3]), np.array([1, 2, 3]))) == 3.0"
            say: "That is the number of right predictions. Divide by how many there are, or use `.mean()`."
      - expr: "lines == ['0.75']"
        pass: "It prints 0.75"
        hint: "Keep the print."
    hints:
      - "`predicted == true` compares every place at once."
      - "The mean of True and False is the share of True."
      - "`return (predicted == true).mean()`."
