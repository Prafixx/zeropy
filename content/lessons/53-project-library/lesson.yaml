          - text: "All four"
            why: "`models.py` and `main.py` do not know about JSON."
          - text: "Only `main.py`"
            why: "`main.py` only calls `load` and `save`."
      - kind: predict
        id: q-asdict
        objective: O3
        code: |
          from dataclasses import asdict, dataclass

          @dataclass
          class Book:
              title: str
              year: int

          data = asdict(Book("Dune", 1965))
          print(data)
          print(Book(**data) == Book("Dune", 1965))
        explain: "`asdict` makes a dictionary of the fields. `**data` gives each key as a named argument, so the same book comes back, and dataclasses compare their fields."
      - kind: mcq
        id: q-bugs
        objective: O4
        prompt: "Your tests pass. Why did the check also put bugs into your code?"
        options:
          - text: "Tests that pass with a bug do not protect you; each bug must make a test fail"
            correct: true
            why: "A test is good when it fails for a real mistake."
          - text: "To make your code slower"
            why: "The bugs are put in only for the check, then taken out."
          - text: "Because pytest needs bugs to run"
            why: "pytest runs with or without bugs."

