        solution: |
          import pytest

          from models import Book, Library
          from storage import load, save


          def small_library():
              library = Library()
              library.add(Book("Dune", "Frank Herbert", 1965))
              library.add(Book("Emma", "Jane Austen", 1815))
              return library


          def test_add_the_same_title_twice():
              library = small_library()
              with pytest.raises(ValueError):
                  library.add(Book("dune", "Someone", 2000))
              assert len(library) == 2


          def test_find_by_author_in_capitals():
              assert [book.title for book in small_library().find("AUSTEN")] == ["Emma"]


          def test_borrow_twice():
              library = small_library()
              library.borrow("Dune")
              with pytest.raises(ValueError):
                  library.borrow("dune")


          def test_available_after_borrow_and_return():
              library = small_library()
              library.borrow("Emma")
              assert [book.title for book in library.available] == ["Dune"]
              library.give_back("Emma")
              assert [book.title for book in library.available] == ["Dune", "Emma"]


          def test_unknown_title():
              with pytest.raises(ValueError):
                  small_library().borrow("Ulysses")


          def test_save_and_load():
              library = small_library()
              library.borrow("Emma")
              save(library, "test.json")
              again = load("test.json")
              assert [(book.title, book.borrowed) for book in again] == [("Dune", False), ("Emma", True)]
