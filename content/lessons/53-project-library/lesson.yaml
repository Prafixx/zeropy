        options:
          - text: "A file `models.py`, first in the folder of `main.py`"
            correct: true
            why: "The folder of the program comes first, then the standard library."
          - text: "A function called `models`"
            why: "`models` is the name of a module: the file `models.py`."
          - text: "A file `Book.py`"
            why: "`Book` is a name inside `models.py`."
