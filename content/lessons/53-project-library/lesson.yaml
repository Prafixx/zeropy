id: project-library
order: 53
title: "Project: a library manager"
summary: Build a tool of four files - models, storage, tests and the app - the way real Python projects are split.
minutes: 75
outcomes: [A1, A6, A8, A9]

objectives:
  - id: O1
    text: Split a program into files with one job each, and import from one file into another
  - id: O2
    text: Write a class that keeps the rules of its data, and refuses a bad change with an error
  - id: O3
    text: Save objects to a JSON file and load them back as objects
  - id: O4
    text: Test a project of several files with a test file that catches real bugs

steps:
  # 1. USE THE FINISHED TOOL -------------------------------------------------
  - id: play
    type: demo
    visual: none
    sealed: true
    objective: O1
    title: Use the finished tool
    intro: |
      This project builds a **library manager**: a tool that knows the books
      of a small library, and who has borrowed which. Press **Play** and type
      commands, like `list`, `find austen`, `borrow dune`, `return emma`,
      `add Walden; Henry Thoreau; 1854` and `quit`.

      Try something wrong too: borrow a book twice, or add a book with no
      year. The code is hidden. You will write it yourself, in **four
      files**.
    files:
      library.json: &start |
        [
          {"title": "Dune", "author": "Frank Herbert", "year": 1965, "borrowed": false},
          {"title": "Emma", "author": "Jane Austen", "year": 1815, "borrowed": true},
          {"title": "Ulysses", "author": "James Joyce", "year": 1922, "borrowed": false}
        ]
    code: |
      import json
      from dataclasses import asdict, dataclass
      from pathlib import Path


      @dataclass
      class Book:
          title: str
          author: str
          year: int
          borrowed: bool = False


      class Library:
          def __init__(self):
              self.books = {}

          def add(self, book):
              if book.title.lower() in self.books:
                  raise ValueError(f"{book.title} is already in the library.")
              self.books[book.title.lower()] = book

          def get(self, title):
              if title.lower() not in self.books:
                  raise ValueError(f"No book called {title}.")
              return self.books[title.lower()]

          def borrow(self, title):
              book = self.get(title)
              if book.borrowed:
                  raise ValueError(f"{book.title} is already borrowed.")
              book.borrowed = True
              return book

          def give_back(self, title):
              book = self.get(title)
              if not book.borrowed:
                  raise ValueError(f"{book.title} was not borrowed.")
              book.borrowed = False
              return book

          @property
          def available(self):
              return [book for book in self if not book.borrowed]

          def find(self, text):
              text = text.lower()
              return [book for book in self if text in book.title.lower() or text in book.author.lower()]

          def __len__(self):
              return len(self.books)

          def __iter__(self):
              return iter(sorted(self.books.values(), key=lambda book: book.title))


      def save(library, name):
          Path(name).write_text(json.dumps([asdict(book) for book in library], indent=2))


      def load(name):
          library = Library()
          if Path(name).exists():
              for item in json.loads(Path(name).read_text()):
                  library.add(Book(**item))
          return library


      def show(book):
          line = f"{book.title} - {book.author}, {book.year}"
          return line + " (borrowed)" if book.borrowed else line


      def parse_book(text):
          parts = [part.strip() for part in text.split(";")]
          if len(parts) != 3 or not all(parts) or not parts[2].isdigit():
              raise ValueError("Use: add title; author; year")
          return Book(parts[0], parts[1], int(parts[2]))


      library = load("library.json")
      print(f"{len(library)} books, {len(library.available)} here.")
      while True:
          word, _, rest = input("> ").strip().partition(" ")
          word, rest = word.lower(), rest.strip()
          try:
              if word == "quit":
                  save(library, "library.json")
                  print("Saved.")
                  break
              elif word == "list":
                  for book in library:
                      print(show(book))
              elif word == "find":
                  found = library.find(rest)
                  for book in found:
                      print(show(book))
                  if not found:
                      print("Nothing found.")
              elif word == "add":
                  book = parse_book(rest)
                  library.add(book)
                  print(f"Added {book.title}.")
              elif word == "borrow":
                  print(f"You borrowed {library.borrow(rest).title}.")
              elif word == "return":
                  print(f"Thank you for {library.give_back(rest).title}.")
              else:
                  print("Commands: list, find, add, borrow, return, quit")
          except ValueError as error:
              print(error)
    experiments:
      - text: "Type `list` to see all books."
        expr: "any(l.endswith('(borrowed)') for l in lines)"
      - text: "Borrow a book: `borrow dune`. Then try to borrow it again."
        expr: "any(l.startswith('You borrowed') for l in lines) and any(l.endswith('is already borrowed.') for l in lines)"
      - text: "Add a book: `add Walden; Henry Thoreau; 1854`."
        expr: "any(l.startswith('Added ') for l in lines)"
      - text: "Type `quit`, and look at `library.json` under the output."
        expr: "'Saved.' in lines"

  # 2. THE PLAN --------------------------------------------------------------
  - id: plan
    type: theory
    objective: O1
    title: Four files, one job each
    body: |
      ## Why more than one file?

      The finished tool has about 130 lines. In one file you scroll a lot,
      and a change to the screen can break the saving. Real projects split
      the code by **job**: each file does one thing, and you can read, test
      and change it alone.

      ```text
      main.py           the app: commands, input and print
        │ imports
      storage.py        save and load the JSON file
        │ imports
      models.py         Book and Library: the data and its rules

      test_library.py   tests: they import models.py and storage.py
      ```

      ## Import from your own file

      A file next to `main.py` is a **module**. `from models import Book`
      runs `models.py` once and gives you its name `Book`. Write the name of
      the file without `.py`. The arrows go one way: `models.py` imports
      nothing of yours, so you can test it alone.

      In this project the editor has a **tab for each file**. Run always
      starts `main.py`, like `python main.py` on your computer.

      ## The plan

      Steps 1 to 4 build the files from the bottom: models, then storage.
      Steps 5 and 6 give you only the description, like a real task: the
      tests, then the app.
    keys:
      - code: "from models import Book"
        means: "Runs `models.py` once, then gives you `Book`."
      - code: "import storage"
        means: "The whole module: `storage.load(...)`."
      - code: "models.py"
        means: "No `input` and no `print`: only data and rules."
      - code: "test_library.py"
        means: "pytest finds the files whose names start with `test_`."

  # 3. STEP 1 ----------------------------------------------------------------
  - id: m1-book
    type: exercise
    fade: milestone
    carry: true
    objective: O1
    title: "Step 1: a Book in models.py"
    prompt: |
      **In the tab `models.py`**, write a dataclass `Book` with the fields
      `title` (a `str`), `author` (a `str`), `year` (an `int`) and
      `borrowed` (a `bool`, `False` if you do not give it).

      **In `main.py`**, import `Book` from `models.py`, make the book
      `Dune` by `Frank Herbert` from `1965`, and print it.

      ```text
      Book(title='Dune', author='Frank Herbert', year=1965, borrowed=False)
      ```
    starter: |
      # Import Book from models.py, make a book and print it.
    modules:
      models.py:
        starter: |
          from dataclasses import dataclass

        solution: &models1 |
          from dataclasses import dataclass


          @dataclass
          class Book:
              title: str
              author: str
              year: int
              borrowed: bool = False
    solution: |
      from models import Book

      book = Book("Dune", "Frank Herbert", 1965)
      print(book)
    after: >-
      `main.py` does not know how a Book is made, only that it exists. That
      line between the files is what lets you change one file without
      breaking the other.
    checks:
      - expr: "'models.py' in files and hasattr(__import__('models'), 'Book') and list(getattr(__import__('models').Book, '__dataclass_fields__', {})) == ['title', 'author', 'year', 'borrowed']"
        pass: "`models.py` has a dataclass `Book` with title, author, year and borrowed"
