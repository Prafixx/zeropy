    hints:
      - "Click the tab `models.py` above the editor to write the class there."
      - "In `models.py`: `@dataclass`, `class Book:`, then `title: str`, `author: str`, `year: int`, `borrowed: bool = False`."
      - "In `main.py`: `from models import Book`, then `print(Book(\"Dune\", \"Frank Herbert\", 1965))`."

  # 4. STEP 2 ----------------------------------------------------------------
  - id: m2-library
    type: exercise
    fade: milestone
    carry: true
    objective: O2
    title: "Step 2: a Library that keeps its rules"
    prompt: |
      **Add the class `Library` to `models.py`.** It keeps the books in a
      dictionary, by title in small letters, so `dune` finds `Dune`.

      - `add(book)` adds a book. A title that is already there (in any
        capitals) raises `ValueError(f"{book.title} is already in the library.")`.
      - `get(title)` gives back the book with that title, in any capitals,
        or raises `ValueError(f"No book called {title}.")`.
      - `len(library)` is the number of books, and `for book in library`
        gives the books sorted by title.

      **In `main.py`**, make a library, add `Emma` (`Jane Austen`, `1815`)
      and `Dune`, then print how many books there are and each title.

      ```text
      2
      Dune
      Emma
      ```
    modules:
      models.py:
        solution: &models2 |
          from dataclasses import dataclass


          @dataclass
          class Book:
              title: str
              author: str
              year: int
              borrowed: bool = False


          class Library:
              def __init__(self):
                  self.books = {}

              def add(self, book):
                  if book.title.lower() in self.books:
                      raise ValueError(f"{book.title} is already in the library.")
                  self.books[book.title.lower()] = book

              def get(self, title):
                  if title.lower() not in self.books:
                      raise ValueError(f"No book called {title}.")
                  return self.books[title.lower()]

              def __len__(self):
                  return len(self.books)

              def __iter__(self):
                  return iter(sorted(self.books.values(), key=lambda book: book.title))
    solution: |
      from models import Book, Library

      library = Library()
      library.add(Book("Emma", "Jane Austen", 1815))
      library.add(Book("Dune", "Frank Herbert", 1965))
      print(len(library))
      for book in library:
          print(book.title)
    after: >-
      The rules live in the class, so no part of the program can add a book
      twice, not even by mistake. A rule in one place is a rule everywhere.
    checks:
      - &c-iter
        expr: |-
          (lambda m: (lambda lib: (lib.add(m.Book('Emma', 'Jane Austen', 1815)), lib.add(m.Book('Dune', 'Frank Herbert', 1965)), len(lib), [b.title for b in lib])[2:])(m.Library()))(__import__('models')) == (2, ['Dune', 'Emma'])
        pass: "`add`, `len` and `for` work; the books come sorted by title"
        hint: "`__len__` gives `len(self.books)`; `__iter__` gives `iter(sorted(...))` with `key=lambda book: book.title`."
        misconceptions:
          - when: "not hasattr(__import__('models'), 'Library')"
            say: "There is no class `Library` in `models.py` yet. Write it in that tab, under `Book`."
      - &c-twice
        expr: |-
          (lambda m: (lambda lib: (lib.add(m.Book('Dune', 'Frank Herbert', 1965)), raises(lib.add, m.Book('DUNE', 'X', 2000)), len(lib))[1:])(m.Library()))(__import__('models')) == ('ValueError', 1)
        pass: "A title that is already there, in any capitals, raises `ValueError`"
        hint: "Keep the books by `book.title.lower()`, and check `in self.books` first."
      - &c-get
        expr: |-
          (lambda m: (lambda lib: (lib.add(m.Book('Dune', 'Frank Herbert', 1965)), lib.get('dUNE').title, raises(lib.get, 'Emma'))[1:])(m.Library()))(__import__('models')) == ('Dune', 'ValueError')
        pass: "`get` finds a title in any capitals, and raises `ValueError` for a missing one"
        hint: "`if title.lower() not in self.books: raise ValueError(...)`."
        misconceptions:
          - when: "hasattr(__import__('models'), 'Library') and raises(__import__('models').Library().get, 'x') == 'KeyError'"
            say: "A missing title gives a `KeyError` from the dictionary. Check first, and raise `ValueError(f\"No book called {title}.\")`."
      - expr: "err is None and lines == ['2', 'Dune', 'Emma']"
        pass: "`main.py` prints the number of books and the titles"
        hint: "`print(len(library))`, then `for book in library: print(book.title)`."
    hints:
      - "`def __init__(self): self.books = {}`."
      - "`add`: `if book.title.lower() in self.books: raise ValueError(...)`, else `self.books[book.title.lower()] = book`."
      - "`__iter__`: `return iter(sorted(self.books.values(), key=lambda book: book.title))`."

  # 5. STEP 3 ----------------------------------------------------------------
  - id: m3-borrow
    type: exercise
    fade: milestone
    carry: true
    objective: O2
    title: "Step 3: borrow, return and find"
    prompt: |
      **Add four parts to `Library`:**

      - `borrow(title)`: marks the book as borrowed and gives it back. A
        book that is already borrowed raises
        `ValueError(f"{book.title} is already borrowed.")`.
      - `give_back(title)`: the other way. A book that is not borrowed
        raises `ValueError(f"{book.title} was not borrowed.")`.
      - `available`: a **property**, the list of books that are not
        borrowed, sorted by title.
      - `find(text)`: the list of books whose title or author has `text` in
        it, in any capitals, sorted by title.

      Use `get` in `borrow` and `give_back`: a missing title then raises its
      error by itself. **In `main.py`**, add `Ulysses` (`James Joyce`,
      `1922`) too, borrow `emma`, and print the titles of the available
      books and of `find("ja")`.

      ```text
      ['Dune', 'Ulysses']
      ['Emma', 'Ulysses']
      ```
    modules:
      models.py:
        solution: &models3 |
          from dataclasses import dataclass


          @dataclass
          class Book:
              title: str
              author: str
              year: int
              borrowed: bool = False


          class Library:
              def __init__(self):
                  self.books = {}

              def add(self, book):
                  if book.title.lower() in self.books:
                      raise ValueError(f"{book.title} is already in the library.")
                  self.books[book.title.lower()] = book

              def get(self, title):
                  if title.lower() not in self.books:
                      raise ValueError(f"No book called {title}.")
                  return self.books[title.lower()]

              def borrow(self, title):
                  book = self.get(title)
                  if book.borrowed:
                      raise ValueError(f"{book.title} is already borrowed.")
                  book.borrowed = True
                  return book

              def give_back(self, title):
                  book = self.get(title)
                  if not book.borrowed:
                      raise ValueError(f"{book.title} was not borrowed.")
                  book.borrowed = False
                  return book

              @property
              def available(self):
                  return [book for book in self if not book.borrowed]

              def find(self, text):
                  text = text.lower()
                  return [book for book in self if text in book.title.lower() or text in book.author.lower()]

              def __len__(self):
                  return len(self.books)

              def __iter__(self):
                  return iter(sorted(self.books.values(), key=lambda book: book.title))
    solution: |
      from models import Book, Library

      library = Library()
      library.add(Book("Emma", "Jane Austen", 1815))
      library.add(Book("Dune", "Frank Herbert", 1965))
      library.add(Book("Ulysses", "James Joyce", 1922))
      library.borrow("emma")
      print([book.title for book in library.available])
      print([book.title for book in library.find("ja")])
    after: >-
      `available` and `find` loop over `self`: they use `__iter__`, so they
      come sorted for free. Small methods that use each other keep a class
      short.
    checks:
      - *c-iter
      - *c-twice
      - &c-borrow
        expr: |-
          (lambda m: (lambda lib: (lib.add(m.Book('Dune', 'Frank Herbert', 1965)), lib.borrow('dune').borrowed, raises(lib.borrow, 'Dune'), lib.give_back('DUNE').borrowed, raises(lib.give_back, 'Dune'), raises(lib.borrow, 'Nope'))[1:])(m.Library()))(__import__('models')) == (True, 'ValueError', False, 'ValueError', 'ValueError')
        pass: "`borrow` and `give_back` change the book, and refuse a wrong change"
        hint: "`book = self.get(title)`, check `book.borrowed`, then change it and `return book`."
        misconceptions:
          - when: "hasattr(__import__('models'), 'Library') and hasattr(__import__('models').Library, 'borrow') and (lambda m: (lambda lib: (lib.add(m.Book('A', 'B', 1)), lib.borrow('A'), raises(lib.borrow, 'A'))[2])(m.Library()))(__import__('models')) is None"
            say: "A book can be borrowed twice. Check `if book.borrowed:` first, and raise the error."
      - &c-available
        expr: |-
          (lambda m: isinstance(m.Library.__dict__.get('available'), property) and (lambda lib: (lib.add(m.Book('Emma', 'Jane Austen', 1815)), lib.add(m.Book('Dune', 'Frank Herbert', 1965)), lib.add(m.Book('Cosmos', 'Carl Sagan', 1980)), lib.borrow('Dune'), [b.title for b in lib.available])[-1])(m.Library()) == ['Cosmos', 'Emma'])(__import__('models'))
        pass: "`available` is a property with the books that are not borrowed, sorted"
        hint: "`@property` above `def available(self):`, then `[book for book in self if not book.borrowed]`."
        misconceptions:
          - when: "callable(getattr(__import__('models').Library, 'available', None)) and not isinstance(__import__('models').Library.__dict__.get('available'), property)"
            say: "`available` is a method now, so `library.available` gives the method itself. Put `@property` above it."
      - &c-find
        expr: |-
          (lambda m: (lambda lib: (lib.add(m.Book('Ulysses', 'James Joyce', 1922)), lib.add(m.Book('Emma', 'Jane Austen', 1815)), lib.add(m.Book('Dune', 'Frank Herbert', 1965)), [b.title for b in lib.find('JA')], [b.title for b in lib.find('dune')], lib.find('zzz'))[3:])(m.Library()))(__import__('models')) == (['Emma', 'Ulysses'], ['Dune'], [])
        pass: "`find` looks in titles and authors, in any capitals, sorted"
        hint: "`text = text.lower()`, then test `text in book.title.lower() or text in book.author.lower()`."
        misconceptions:
          - when: "hasattr(__import__('models').Library, 'find') and (lambda m: (lambda lib: (lib.add(m.Book('Emma', 'Jane Austen', 1815)), [b.title for b in lib.find('Jane')], [b.title for b in lib.find('JANE')])[1:])(m.Library()))(__import__('models')) == (['Emma'], [])"
            say: "The search cares about capitals: `JANE` finds nothing. Compare `text.lower()` with `author.lower()` and `title.lower()`."
      - expr: "err is None and lines == [\"['Dune', 'Ulysses']\", \"['Emma', 'Ulysses']\"]"
        pass: "`main.py` prints the available books and the books found"
        hint: "`print([book.title for book in library.available])`, then the same for `library.find(\"ja\")`."
    hints:
      - "`borrow`: `book = self.get(title)`, `if book.borrowed: raise ValueError(...)`, `book.borrowed = True`, `return book`."
      - "`available` with `@property`: `return [book for book in self if not book.borrowed]`."
      - "`find`: `text = text.lower()` first, then a list comprehension over `self`."

  # 6. STEP 4 ----------------------------------------------------------------
  - id: m4-storage
    type: exercise
    fade: milestone
    carry: true
    objective: O3
    title: "Step 4: storage.py"
    prompt: |
      **In the new tab `storage.py`**, write two functions:

      - `save(library, name)` writes the books to the file as a JSON list
        of dictionaries, with `indent=2`. `asdict(book)` from `dataclasses`
        makes the dictionary of one book.
      - `load(name)` gives back a new `Library` with the books of the file.
        Without the file, the library is empty. `Book(**item)` makes a
        book from one dictionary.

      **`main.py` is now the start of the app:** load `library.json`, and
      print how many books there are, and how many are here.

      ```text
      3 books, 2 here.
      ```
    files:
      library.json: *start
    modules:
      storage.py:
        starter: |
          import json
          from dataclasses import asdict
          from pathlib import Path

          from models import Book, Library

        solution: &storage |
          import json
          from dataclasses import asdict
          from pathlib import Path

          from models import Book, Library


          def save(library, name):
              data = [asdict(book) for book in library]
              Path(name).write_text(json.dumps(data, indent=2))


          def load(name):
              library = Library()
              path = Path(name)
              if not path.exists():
                  return library
              for item in json.loads(path.read_text()):
                  library.add(Book(**item))
              return library
    solution: &main4 |
      from storage import load

      library = load("library.json")
      print(f"{len(library)} books, {len(library.available)} here.")
    after: >-
      Only `storage.py` knows that the data is JSON. To keep it in a
      database one day, you change one file, and `main.py` never knows.
    cases:
      - {}
      - label: "there is no `library.json` yet"
        files: {}
    checks:
      - &c-round
        expr: |-
          (lambda m, s: (lambda lib: (lib.add(m.Book('Dune', 'Frank Herbert', 1965)), lib.add(m.Book('Emma', 'Jane Austen', 1815)), lib.borrow('Emma'), s.save(lib, 'check.json'), [(b.title, b.author, b.year, b.borrowed) for b in s.load('check.json')])[-1])(m.Library()))(__import__('models'), __import__('storage')) == [('Dune', 'Frank Herbert', 1965, False), ('Emma', 'Jane Austen', 1815, True)]
        pass: "Saved books load again the same, also `borrowed`"
        hint: "`save`: `[asdict(book) for book in library]`; `load`: `library.add(Book(**item))` for each item."
        misconceptions:
          - when: "'storage.py' in files and not hasattr(__import__('storage'), 'load')"
            say: "`storage.py` has no function `load` yet. Write `save` and `load` in that tab."
          - when: "err == 'TypeError' and 'JSON serializable' in out"
            say: "`json` cannot write a `Book`. Make a dictionary of each book first: `asdict(book)`."
      - expr: |-
          (lambda m, s: (lambda lib: (lib.add(m.Book('Dune', 'Frank Herbert', 1965)), s.save(lib, 'look.json'), open('look.json').read())[-1])(m.Library()))(__import__('models'), __import__('storage')).lstrip().startswith('[') and '\n' in open('look.json').read().strip() and __import__('json').loads(open('look.json').read())[0].get('title') == 'Dune'
        pass: "The file is a JSON list of dictionaries, easy to read"
        hint: "`Path(name).write_text(json.dumps(data, indent=2))`."
      - expr: "isinstance(__import__('storage').load('nothing.json'), __import__('models').Library) and len(__import__('storage').load('nothing.json')) == 0"
        pass: "Without the file, `load` gives an empty `Library`"
        hint: "`if not path.exists(): return library` before you read."
        misconceptions:
          - when: "raises(__import__('storage').load, 'nothing.json') == 'FileNotFoundError'"
            say: "Without the file, `read_text` fails. Check `path.exists()` first."
