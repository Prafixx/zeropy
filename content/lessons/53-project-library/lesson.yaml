  # 8. STEP 6 ----------------------------------------------------------------
  - id: m6-app
    type: exercise
    fade: milestone
    carry: true
    objective: O1
    title: "Step 6: the app"
    prompt: |
      **This step gives you only the task.** Finish `main.py`: after the
      line with the number of books, repeat `input("> ")`. The first word
      is the command (any capitals); the rest of the line is its text.

      | Command | What it does |
      | --- | --- |
      | `list` | Each book, sorted: `Dune - Frank Herbert, 1965`, and ` (borrowed)` at the end of a borrowed one. |
      | `find TEXT` | The books found, in the same form, or `Nothing found.` |
      | `add TITLE; AUTHOR; YEAR` | Adds the book and prints `Added Walden.` Text in another form prints `Use: add title; author; year` |
      | `borrow TITLE` | Prints `You borrowed Dune.` |
      | `return TITLE` | Prints `Thank you for Dune.` |
      | `quit` | Saves to `library.json`, prints `Saved.` and stops. |
      | anything else | Prints `Commands: list, find, add, borrow, return, quit` |

      When the library refuses a change, print its message (like
      `Dune is already borrowed.`) and go on. Keep `models.py` and
      `storage.py` as they are: the app only uses them.
    files:
      library.json: *start
    solution: |
      from models import Book
      from storage import load, save

      FILE = "library.json"
      HELP = "Commands: list, find, add, borrow, return, quit"


      def show(book):
          line = f"{book.title} - {book.author}, {book.year}"
          return line + " (borrowed)" if book.borrowed else line


      def parse_book(text):
          parts = [part.strip() for part in text.split(";")]
          if len(parts) != 3 or not all(parts) or not parts[2].isdigit():
              raise ValueError("Use: add title; author; year")
          return Book(parts[0], parts[1], int(parts[2]))


      library = load(FILE)
      print(f"{len(library)} books, {len(library.available)} here.")

      while True:
          word, _, rest = input("> ").strip().partition(" ")
          word = word.lower()
          rest = rest.strip()
          try:
              if word == "quit":
                  save(library, FILE)
                  print("Saved.")
                  break
              elif word == "list":
                  for book in library:
                      print(show(book))
              elif word == "find":
                  found = library.find(rest)
                  for book in found:
                      print(show(book))
                  if not found:
                      print("Nothing found.")
              elif word == "add":
                  book = parse_book(rest)
                  library.add(book)
                  print(f"Added {book.title}.")
              elif word == "borrow":
                  print(f"You borrowed {library.borrow(rest).title}.")
              elif word == "return":
                  print(f"Thank you for {library.give_back(rest).title}.")
              else:
                  print(HELP)
          except ValueError as error:
              print(error)
    after: >-
      The whole app is a loop that reads, calls one method and prints. All
      the rules are in `models.py`, tested by `test_library.py`. This is the
      shape of most real tools, from small scripts to big programs.
    cases:
      - {}
      - label: "the user types `list`, then `quit`"
        stdin: ["list", "quit"]
      - label: "the user borrows `dune` two times, returns `Emma` and quits"
        stdin: ["borrow dune", "borrow Dune", "return Emma", "quit"]
      - label: "the user adds `Walden`, adds `Dune` again, types `add Hamlet`, searches and quits"
        stdin: ["add Walden; Henry Thoreau; 1854", "add Dune; Someone; 2000", "add Hamlet", "find WALDEN", "find zzz", "quit"]
      - label: "there is no `library.json`; the user borrows `Dune`, types `dance`, then `QUIT`"
        files: {}
        stdin: ["borrow Dune", "dance", "QUIT"]
    checks:
      - *c-borrow
      - *c-round
      - expr: "err is None and asked == len(inputs)"
        pass: "The app reads commands until `quit`, and asks for nothing more"
        hint: "`while True:` and `break` after `quit`."
        misconceptions:
          - when: "err == 'EOFError' or (err is None and asked > len(inputs))"
            say: "The app does not stop. After `quit`, end the loop with `break`."
          - when: "err == 'ValueError'"
            say: "A refused change stops the app. Put the commands in `try:`, and `print(error)` in `except ValueError as error:`."
      - expr: "inputs != ['list', 'quit'] or (lambda want: [l for l in lines if l in want] == want)(['Dune - Frank Herbert, 1965', 'Emma - Jane Austen, 1815 (borrowed)', 'Ulysses - James Joyce, 1922', 'Saved.'])"
        pass: "`list` shows each book in the right form, sorted"
        hint: "`f\"{book.title} - {book.author}, {book.year}\"`, and `\" (borrowed)\"` at the end of a borrowed book."
      - expr: "inputs != ['borrow dune', 'borrow Dune', 'return Emma', 'quit'] or ((lambda want: [l for l in lines if l in want] == want)(['You borrowed Dune.', 'Dune is already borrowed.', 'Thank you for Emma.', 'Saved.']) and [b['borrowed'] for b in __import__('json').loads(files['library.json'])] == [True, False, False])"
        pass: "`borrow` and `return` work, a refused change prints its message, and `quit` saves"
        hint: "`print(f\"You borrowed {library.borrow(rest).title}.\")`, and `except ValueError as error: print(error)`."
      - expr: "inputs[:1] != ['add Walden; Henry Thoreau; 1854'] or ((lambda want: [l for l in lines if l in want] == want)(['Added Walden.', 'Dune is already in the library.', 'Use: add title; author; year', 'Walden - Henry Thoreau, 1854', 'Nothing found.', 'Saved.']) and len(__import__('json').loads(files['library.json'])) == 4)"
        pass: "`add` and `find` work, and bad `add` text prints how to use it"
        hint: "Split the text at `;` and `strip` each part. Wrong parts: `raise ValueError(\"Use: add title; author; year\")`."
        misconceptions:
          - when: "inputs[:1] == ['add Walden; Henry Thoreau; 1854'] and 'Use: add title; author; year' not in lines and 'Added Walden.' in lines"
            say: "`add Hamlet` has no author and no year. Check that there are 3 parts and that the year is a number, else raise `ValueError(\"Use: add title; author; year\")`."
      - expr: "inputs[:1] != ['borrow Dune'] or ((lambda want: [l for l in lines if l in want] == want)(['0 books, 0 here.', 'No book called Dune.', 'Commands: list, find, add, borrow, return, quit', 'Saved.']) and __import__('json').loads(files['library.json']) == [])"
        pass: "Without a file the app starts empty; unknown commands show the list of commands; `QUIT` works"
        hint: "Clean the command with `.lower()`, and print the commands in the last `else`."
      - expr: "syntax('ClassDef') == 0 and not uses('json')"
        pass: "`main.py` uses `models.py` and `storage.py`; it does not do their work again"
        hint: "Use `load`, `save` and the methods of `Library`; no `json` and no class in `main.py`."
    hints:
      - "`word, _, rest = input(\"> \").strip().partition(\" \")` splits the first word from the rest."
      - "All commands go inside one `try:`, with `except ValueError as error: print(error)` after them."
      - "Write two small functions in `main.py`: `show(book)` gives the line of a book; `parse_book(text)` makes a Book or raises the `Use:` error."

