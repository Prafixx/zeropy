      - expr: "hasattr(__import__('models'), 'Book') and raises(__import__('models').Book, 'a', 'b', 1) is None and __import__('models').Book('a', 'b', 1).borrowed is False"
        pass: "`borrowed` is `False` when you do not give it"
        hint: "`borrowed: bool = False`. A field with a default comes last."
      - expr: "err is None and 'class Book' not in src and 'models' in src"
        pass: "`main.py` imports `Book` from `models.py`; it does not make its own"
