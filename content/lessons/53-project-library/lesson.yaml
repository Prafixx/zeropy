        misconceptions:
          - when: "'class Book' in src"
            say: "`Book` belongs in `models.py`. In `main.py`, write only `from models import Book`."
          - when: "err == 'ModuleNotFoundError'"
            say: "Python looks for the file `models.py`. Write the name without `.py`: `from models import Book`."
      - expr: "lines[-1:] == [\"Book(title='Dune', author='Frank Herbert', year=1965, borrowed=False)\"]"
        pass: "It prints the book"
