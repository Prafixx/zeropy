    solution: |
      import time
      from concurrent.futures import ThreadPoolExecutor

      def download(page):
          time.sleep(1)
          return page.upper()

      pages = ["a", "b", "c", "d", "e", "f"]
      start = time.perf_counter()
      with ThreadPoolExecutor(max_workers=3) as pool:
          print(list(pool.map(download, pages)))
      print(f"{time.perf_counter() - start:.1f} s")
    after: >-
      Many servers block a program that sends too many requests at once.
      `max_workers` is also how you stay polite.
    checks:
      - expr: "err is None and most_at_once == 3"
        pass: "Never more than 3 requests at once"
        hint: "`max_workers` is the number of tasks that run at the same time."
      - expr: "err is None and lines == [\"['A', 'B', 'C', 'D', 'E', 'F']\", '2.0 s']"
        pass: "Six pages in 2 seconds, in order"
        hint: "With 3 workers: three in the first second, three in the next."
    hints:
      - "What does `max_workers` set?"
      - "The server allows 3 at once."
      - "`max_workers=3`."
  - id: x-timeout
    type: exercise
    fade: independent
    objective: O4
    title: Too slow is too slow
    prompt: |
      One shop sometimes needs 10 seconds. **Write `async def ask(shop)`**:
      it waits for `price(shop)` for at most 2 seconds, with
      `asyncio.wait_for(..., timeout=2)`. If the time runs out, it returns
      `"too slow"`. Then ask all shops at once, as in `main`.

      ```text
      ['books.example: 12.5', 'slow.example: too slow', 'pages.example: 11.0']
      ```
    starter: |
      import asyncio

      DELAY = {"books.example": 1, "slow.example": 10, "pages.example": 0.5}
      PRICES = {"books.example": 12.5, "slow.example": 7.0, "pages.example": 11.0}

      async def price(shop):
          await asyncio.sleep(DELAY[shop])
          return PRICES[shop]

      # Your ask(shop) here.

      async def main():
          answers = await asyncio.gather(*[ask(shop) for shop in DELAY])
          print([f"{shop}: {a}" for shop, a in zip(DELAY, answers)])

      asyncio.run(main())
    solution: |
      import asyncio

      DELAY = {"books.example": 1, "slow.example": 10, "pages.example": 0.5}
      PRICES = {"books.example": 12.5, "slow.example": 7.0, "pages.example": 11.0}

      async def price(shop):
          await asyncio.sleep(DELAY[shop])
          return PRICES[shop]

      async def ask(shop):
          try:
              return await asyncio.wait_for(price(shop), timeout=2)
          except TimeoutError:
              return "too slow"

      async def main():
          answers = await asyncio.gather(*[ask(shop) for shop in DELAY])
          print([f"{shop}: {a}" for shop, a in zip(DELAY, answers)])

      asyncio.run(main())
    after: >-
      A timeout is the same idea as `timeout=` in `requests.get`: never let
      one slow server hold up the whole program.
    checks:
      - expr: "err is None and lines == [\"['books.example: 12.5', 'slow.example: too slow', 'pages.example: 11.0']\"]"
        pass: "The slow shop gives too slow, the others their price"
        hint: "`try: return await asyncio.wait_for(price(shop), timeout=2)`, `except TimeoutError: return \"too slow\"`."
      - expr: "err is None and async_runs >= 1 and waited <= 2.05"
        pass: "The program waits at most 2 seconds"
        hint: "`timeout=2` in `asyncio.wait_for`."
        misconceptions:
          - when: "err is None and waited > 9"
            say: "It waited for the slow shop. Wrap `price(shop)` in `asyncio.wait_for(..., timeout=2)`."
    hints:
      - "`asyncio.wait_for(price(shop), timeout=2)` raises `TimeoutError` after 2 seconds."
      - "Catch it with `try` / `except TimeoutError:`."
      - "In the `try`: `return await asyncio.wait_for(price(shop), timeout=2)`; in the `except`: `return \"too slow\"`."
