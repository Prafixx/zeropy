id: local-setup
order: 42
title: Install Python and an editor
summary: Leave the browser. Install Python and a code editor, and run your first program on your own computer.
minutes: 40
outcomes: [A1, A5]

objectives:
  - id: O1
    text: Install Python, and check its version in a terminal
  - id: O2
    text: Use a terminal - see the folder, list its files, move, and run a script
  - id: O3
    text: Write a file in a code editor and run it
  - id: O4
    text: Read the messages of a terminal - a command or a file that is not found, and the >>> of Python

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: install
    type: theory
    objective: O1
    title: Two programs to install
    body: |
      Until now, Python ran inside this page. Real projects need Python on
      your computer: your own files, packages, and programs that others can
      use. You need two free programs.

      ## 1. Python

      - **Windows:** on [python.org/downloads](https://www.python.org/downloads/),
        get the **Python install manager**, and install it. Then open a new
        terminal: the commands `python` and `py` work.
      - **macOS:** get the installer for macOS on the same page. The
        command is `python3`.
      - **Linux:** Python is usually there. Try `python3 --version`.

      ## 2. A code editor

      Install [Visual Studio Code](https://code.visualstudio.com/) (VS Code).
      In VS Code, open **Extensions** and install **Python** (by
      Microsoft).

      ## Your course folder

      1. Make a folder `python-course`, for example in Documents.
      2. In VS Code: **File → Open Folder…** and choose it.
      3. **Terminal → New Terminal.** A terminal opens at the bottom, already
         inside your folder.
    keys:
      - code: "python --version"
        means: "Shows the version of Python. On macOS and Linux: `python3 --version`."
      - code: "Terminal → New Terminal"
        means: "A terminal in VS Code, in the folder that is open."
      - code: "python-course"
        means: "One folder for all your work in the next lessons."

  # 2. LOCAL: PYTHON ---------------------------------------------------------
  - id: check-python
    type: local
    objective: O1
    title: Is Python ready?
    prompt: |
      **Show the course that Python runs on your computer.**

      1. Download `check.py` (on the right) and move it into your
         `python-course` folder. In VS Code you see it in the list of files.
      2. In the terminal of VS Code, type `python --version`. You see a
         version like `Python 3.14.0`.
      3. Run the check and paste what it prints.
    task: python
    example:
      python: "3.14.7"
      os: Windows
      bits: "64"
    checks:
      - expr: "tuple(int(x) for x in report.get('python', '0.0').split('.')[:2]) >= (3, 10)"
        pass: "Python 3.10 or newer runs in your terminal"
        hint: "Install a new Python from python.org, open a new terminal, and run the check again."
        misconceptions:
          - when: "report.get('python', '0').startswith('2.') or tuple(int(x) for x in report.get('python', '0.0').split('.')[:2]) < (3, 10)"
            say: "Your terminal runs an old Python. Install the newest one from python.org, then open a **new** terminal, so it finds the new version."
    hints:
      - "If the terminal says that `python` is not found, close it and open a new one: a terminal sees a new program only after a restart."
      - "On Windows, `py check.py python` works too. On macOS and Linux, use `python3`."
      - "If it says that it cannot open `check.py`, the file is in another folder. Move it into the folder that is open in VS Code."
    after: >-
      Python runs on your computer now. The same commands work for the rest
      of the course: `python` on Windows, `python3` on macOS and Linux.

  # 3. THEORY ----------------------------------------------------------------
  - id: terminal
    type: theory
    objective: O2
    title: The terminal
    body: |
      A terminal is a window where you type commands for the computer. It
      always works **in one folder**: the folder that you see before the
      cursor.

      | Job | Windows | macOS and Linux |
      | --- | --- | --- |
      | Which folder am I in? | `pwd` | `pwd` |
      | List the files | `dir` | `ls` |
      | Go into a folder | `cd games` | `cd games` |
      | Go one folder up | `cd ..` | `cd ..` |
      | Make a folder | `mkdir games` | `mkdir games` |
      | Run a Python file | `python hello.py` | `python3 hello.py` |

      ## Two different places

      - The **terminal** runs commands like `cd` and `python hello.py`.
      - `python` alone starts **Python itself**: the prompt `>>>` appears, and
        each line is Python code, like `2 + 3`. Type `exit()` to go back to
        the terminal.

      Press the **up arrow** to get the last command again.
    keys:
      - code: "cd games"
        means: "Go into the folder `games`. `cd ..` goes back up."
      - code: "python hello.py"
        means: "A terminal command: run the file `hello.py` of this folder."
      - code: ">>>"
        means: "You are inside Python, not in the terminal. `exit()` leaves."

  # 4. DRILL -----------------------------------------------------------------
  - id: drill
    type: drill
    objective: O4
    title: Read the terminal
    items:
      - kind: mcq
        id: d-repl
        objective: O4
        prompt: "You see `>>>` and type `python hello.py`. Python says `SyntaxError`. Why?"
        options:
          - text: "You are inside Python. `python hello.py` is a terminal command, not Python code"
            correct: true
            why: "Type `exit()` to go back to the terminal, then run the command there."
          - text: "`hello.py` has a bug"
            why: "The file was not even read. The command went to the wrong place."
          - text: "Python is not installed"
            why: "It is: you are inside it."
      - kind: mcq
        id: d-not-found
        objective: O4
        prompt: "Windows says: `python : The term 'python' is not recognized`. What is the first thing to try?"
        options:
          - text: "Close the terminal, open a new one, and try again (or try `py`)"
            correct: true
            why: "A terminal that was open during the install does not know the new program yet."
          - text: "Reinstall Windows"
            why: "That is never needed. A new terminal usually fixes it."
          - text: "Type `pip install python`"
            why: "`pip` installs packages for Python. It cannot install Python itself."
      - kind: mcq
        id: d-no-file
        objective: O2
        prompt: "`python hello.py` says: `can't open file ... hello.py: [Errno 2] No such file or directory`. What is wrong?"
        options:
          - text: "The terminal is in another folder than `hello.py`"
            correct: true
            why: "Use `dir` or `ls` to see the files, and `cd` to go to the right folder."
          - text: "`hello.py` has a `FileNotFoundError` inside"
            why: "Python did not find the file itself, so it could not run it."
          - text: "Python is too old"
            why: "The version is not the problem. The folder is."
      - kind: mcq
        id: d-cd
        objective: O2
        prompt: "The terminal shows the folder `python-course`. Inside it is a folder `games`, with `snake.py`. Which commands run it?"
        options:
          - text: "`cd games`, then `python snake.py`"
            correct: true
            why: "First go into the folder, then run the file there. `python games/snake.py` also works."
          - text: "`python snake.py`"
            why: "`snake.py` is not in `python-course` itself, but in `games`."
          - text: "`cd snake.py`"
            why: "`cd` goes into folders. A file is run with `python`."
      - kind: mcq
        id: d-exit
        objective: O4
        prompt: "How do you leave `>>>` and go back to the terminal?"
        options:
          - text: "Type `exit()` and press Enter"
            correct: true
            why: "On Windows, Ctrl+Z then Enter works too. On macOS and Linux, Ctrl+D."
          - text: "Type `cd ..`"
            why: "`cd` is a terminal command. Inside Python it is a `SyntaxError`."
          - text: "Close VS Code"
            why: "That works, but you lose the terminal. `exit()` is enough."

  # 5. THEORY ----------------------------------------------------------------
  - id: editor
    type: theory
    objective: O3
    title: Write and run a file
    body: |
      1. In VS Code, make a new file in your folder: **File → New File**,
         save it as `hello.py`.
      2. Write a program. Save it with **Ctrl+S** (on macOS **Cmd+S**). An
         unsaved file has a dot on its tab.
      3. Run it in the terminal: `python hello.py`.

      VS Code also has a **Run** button (a triangle) at the top right. It
      types the command into the terminal for you. Both ways are fine; the
      terminal way works everywhere, also without VS Code.

      If VS Code asks which Python to use (an **interpreter**), choose the
      newest version from the list.

      An editor helps in many small ways: colors for the code, a red line
      under some errors, and suggestions while you type. Read them, but the
      terminal and Python have the last word.
    keys:
      - code: "Ctrl+S"
        means: "Save. Python runs the file on the disk, not what you see in the editor."
      - code: "python hello.py"
        means: "Run the saved file."
      - code: "the Run button"
        means: "The same command, typed for you."

  # 6. LOCAL: HELLO ----------------------------------------------------------
  - id: check-hello
    type: local
    objective: O3
    title: Your first program on your computer
    prompt: |
      **Write `hello.py` in your `python-course` folder** with VS Code. It
      prints at least two lines: for example a greeting, and one fact about
      you.

      Run it with `python hello.py` and read what it prints. Then run the
      check: it runs your `hello.py` and reports if it works.
    task: hello
    example:
      python: "3.14.7"
      os: Windows
      bits: "64"
      hello_exists: "yes"
      hello_ok: "yes"
      hello_lines: "2"
      hello_first: "Hello, I am Ana."
    checks:
      - expr: "report.get('hello_exists') == 'yes'"
        pass: "`hello.py` is in the folder"
        hint: "Save the file as `hello.py` (not `hello.py.txt`), in the same folder as `check.py`."
        misconceptions:
          - when: "report.get('hello_exists') == 'no'"
            say: "`check.py` did not find `hello.py` in its folder. Save `hello.py` next to `check.py`, and run the check in that folder."
      - expr: "report.get('hello_ok') == 'yes'"
        pass: "`hello.py` runs to the end without an error"
        hint: "Run `python hello.py` yourself and read the message."
        misconceptions:
          - when: "report.get('hello_ok') == 'timeout'"
            say: "`hello.py` waits for something, maybe an `input()`. For this check, the program must only print."
          - when: "report.get('hello_ok') == 'no'"
            say: "`hello.py` stops with an error. Run `python hello.py`, read the last line of the message, and fix the file. Did you save it?"
      - expr: "int(report.get('hello_lines', '0')) >= 2"
        pass: "It prints at least two lines"
        hint: "Add a second `print(...)`, save, and run the check again."
    hints:
      - "Check the name of the file in VS Code: `hello.py`, in the list on the left."
      - "Save with Ctrl+S before you run. A dot on the tab means: not saved."
      - "`hello.py` can be two lines: `print(\"Hello, I am Ana.\")` and `print(\"I like tea.\")`."
    after: >-
      Your first program runs on your own computer. From now on, every
      project of the course lives in files like this one.

  # 7. QUIZ ------------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: mcq
        id: q-where
        objective: O2
        prompt: "Which command shows the files of the folder that the terminal is in, on Windows?"
        options:
          - text: "`dir`"
            correct: true
            why: "On macOS and Linux it is `ls`. PowerShell knows `ls` too."
          - text: "`cd`"
            why: "`cd` moves to another folder."
          - text: "`python`"
            why: "`python` starts Python."
      - kind: mcq
        id: q-save
        objective: O3
        prompt: "You changed `hello.py` but `python hello.py` prints the old text. Why?"
        options:
          - text: "The file is not saved: Python runs the file on the disk"
            correct: true
            why: "Save with Ctrl+S, then run again."
          - text: "Python remembers the old program"
            why: "Each run reads the file again."
          - text: "The terminal is too old"
            why: "The terminal runs what is on the disk. Save first."
      - kind: mcq
        id: q-python3
        objective: O1
        prompt: "On a Mac, `python hello.py` says `command not found`. What do you try?"
        options:
          - text: "`python3 hello.py`"
            correct: true
            why: "On macOS and Linux, the command is usually `python3`."
          - text: "`py hello.py`"
            why: "`py` is the Windows launcher."
          - text: "`run hello.py`"
            why: "There is no `run` command."
      - kind: mcq
        id: q-up
        objective: O2
        prompt: "How do you get the last command again, without typing it?"
        options:
          - text: "Press the up arrow"
            correct: true
            why: "The terminal remembers your commands. Up goes back, down goes forward."
          - text: "Type `again`"
            why: "There is no such command."
          - text: "Press Ctrl+S"
            why: "Ctrl+S saves a file in the editor."
      - kind: mcq
        id: q-two
        objective: O4
        prompt: "Where does `print(2 + 3)` give `5` at once, without a file?"
        options:
          - text: "After `>>>`, inside Python"
            correct: true
            why: "Inside Python, each line runs when you press Enter. Good for small tries."
          - text: "In the terminal, before `python`"
            why: "The terminal does not know Python code. It would be an error."
          - text: "Nowhere: Python always needs a file"
            why: "The `>>>` prompt runs code without a file."

  # 8. REVIEW ----------------------------------------------------------------
  - id: review
    type: review
    objective: O2
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-cd
    objective: O2
    prompt: "What does `cd ..` do in a terminal?"
    options:
      - text: "It goes one folder up"
        correct: true
        why: "`..` is the folder that holds the folder you are in."
      - text: "It deletes the folder"
        why: "`cd` only moves. It never deletes."
      - text: "It runs Python"
        why: "That is `python`."
  - kind: mcq
    id: r-repl
    objective: O4
    prompt: "What does the prompt `>>>` tell you?"
    options:
      - text: "You are inside Python: each line is Python code"
        correct: true
        why: "`exit()` goes back to the terminal."
      - text: "The terminal waits for a command like `cd`"
        why: "The terminal has its own prompt, with the folder name."
      - text: "There is an error"
        why: "It only shows where you are."
  - kind: mcq
    id: r-run
    objective: O3
    prompt: "Which command runs the file `game.py` of this folder on Windows?"
    options:
      - text: "`python game.py`"
        correct: true
        why: "`py game.py` works too. On macOS and Linux: `python3 game.py`."
      - text: "`game.py python`"
        why: "The program comes first, then the file."
      - text: "`open game.py`"
        why: "That opens the file. It does not run it with Python."
  - kind: mcq
    id: r-new-terminal
    objective: O1
    prompt: "You installed Python, but an open terminal does not find it. Why?"
    options:
      - text: "A terminal finds new programs only when it starts. Open a new one"
        correct: true
        why: "The list of programs is read when the terminal starts."
      - text: "The install failed for sure"
        why: "Usually it worked. Try a new terminal first."
      - text: "Python works only in VS Code"
        why: "Python works in any terminal."
  - kind: mcq
    id: r-ls
    objective: O2
    prompt: "On a Mac, which command lists the files of the folder?"
    options:
      - text: "`ls`"
        correct: true
        why: "On Windows, `dir` (PowerShell also knows `ls`)."
      - text: "`list`"
        why: "There is no `list` command."
      - text: "`pwd`"
        why: "`pwd` shows the name of the folder, not its files."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-version
    type: exercise
    fade: completion
    objective: O1
    title: Which Python is this?
    prompt: |
      A program can ask which Python runs it. **Replace `___`** so that it
      prints the version like `Python 3.14`: the major number, a dot, and
      the minor number.
    starter: |
      import sys

      v = sys.version_info
      print(f"Python {v.major}.{v.___}")
    solution: |
      import sys

      v = sys.version_info
      print(f"Python {v.major}.{v.minor}")
    after: >-
      `python --version` in a terminal tells you the same. A program that
      needs a new feature can check `sys.version_info >= (3, 12)` first.
    checks:
      - expr: "err is None and lines == [f'Python {sys.version_info.major}.{sys.version_info.minor}']"
        pass: "It prints Python and the version"
        hint: "The second number is `minor`."
      - expr: "'version_info' in src and '3.' not in src"
        pass: "Python gives the numbers, they are not typed"
        hint: "Keep `sys.version_info`; do not write the numbers yourself."
    hints:
      - "`sys.version_info` has the parts `major`, `minor` and `micro`."
      - "In 3.14, 3 is the major number. What is 14?"
      - "`v.minor`."
  - id: x-wrong-folder
    type: terminal
    objective: O4
    title: "No such file"
    prompt: |
      Your program `hello.py` is somewhere in your home folder.

      1. Try `python3 hello.py` here, and read the message.
      2. Find the file with `ls`, go into its folder with `cd`, and run it
         again.

      (This terminal is Linux. On Windows, `ls`, `cd` and `python` work the
      same way in PowerShell.)
    start:
      files:
        code/hello.py: |
          print("Hello from my computer")
        notes.txt: "ideas\n"
    checks:
      - expr: "sum(1 for h in history if h.startswith('python3')) >= 2"
        pass: "You read the message of the first try"
        hint: "First `python3 hello.py` here: Python says it cannot open the file."
      - expr: "ran('ls')"
        pass: "You looked for the file"
        hint: "`ls` shows a folder `code`."
      - expr: "cwd == '~/code' and 'Hello from my computer' in out"
        pass: "The program runs from its folder"
        hint: "`cd code`, then `python3 hello.py`."
    hints:
      - "`can't open file ... No such file or directory`: Python looks only in the working folder."
      - "`ls` shows what is here. The file is in one of the folders."
      - "`cd code`, then `python3 hello.py`."
    solution: ["python3 hello.py", "ls", "cd code", "python3 hello.py"]
    after: >-
      The most common start problem is the wrong folder. Look at the prompt:
      it shows where you are.
