id: exceptions-in-depth
order: 51
title: Exceptions in depth
summary: The family tree of errors, the order of except branches, errors that travel through functions, and error classes of your own.
minutes: 40
outcomes: [A1, A2, A6]

objectives:
  - id: O1
    text: Order except branches from specific to general, catch several errors in one branch, and read the error object
  - id: O2
    text: Use the family tree of errors - Exception, LookupError, ArithmeticError, OSError - and know what not to catch
  - id: O3
    text: Follow an error up through the functions that called each other, and pass it on with a bare raise
  - id: O4
    text: Write your own error classes, with a message and extra attributes, in a small family

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: tree
    type: theory
    objective: O2
    title: A family tree of errors
    body: |
      Errors are classes, and they inherit from each other. A part of the
      tree:

      ```text
      BaseException
       ├── KeyboardInterrupt        (Ctrl+C)
       ├── SystemExit               (sys.exit())
       └── Exception
            ├── ArithmeticError
            │    └── ZeroDivisionError
            ├── LookupError
            │    ├── IndexError
            │    └── KeyError
            ├── OSError
            │    └── FileNotFoundError
            ├── TypeError
            └── ValueError
      ```

      `except LookupError:` catches an `IndexError` **and** a `KeyError`: a
      branch catches its class and every child of it.

      Catch `Exception` at most, never `BaseException` or a bare `except:`:
      they also catch Ctrl+C and `sys.exit()`, so the program cannot be
      stopped.
    keys:
      - code: "except LookupError:"
        means: "Catches IndexError and KeyError: its children."
      - code: "except Exception:"
        means: "Almost everything. Use it only at the top of a program."
      - code: "except:"
        means: "Never: it catches Ctrl+C too."

  # 2. THEORY ----------------------------------------------------------------
  - id: branches
    type: theory
    objective: O1
    title: Many branches
    body: |
      Python tries the `except` branches **from the top**, and runs the
      **first** one that fits. So put the specific errors first, and the
      general ones last:

      ```python
      try:
          value = data[key] / count
      except (KeyError, IndexError):          # several errors: a tuple
          print("no such entry")
      except ZeroDivisionError as error:      # the error object
          print("cannot divide:", error)
      except Exception as error:
          print(type(error).__name__, error.args)
      ```

      `as error` gives the error object. `str(error)` is its message, and
      `error.args` is a tuple with the values it was made with:
      `ValueError("bad", 3).args` is `('bad', 3)`.
    keys:
      - code: "except (A, B):"
        means: "One branch for several errors, like `KeyError` and `IndexError`."
      - code: "except ... as e:"
        means: "The error object, in the variable `e`."
      - code: "error.args"
        means: "The values it was made with, as a tuple."

  # 3. PREDICT ---------------------------------------------------------------
  - id: predict-order
    type: predict
    objective: O1
    title: Which branch?
    item:
      kind: predict
      id: p-order
      prompt: "**Type every line that this program prints.**"
      code: |
        def divide(a, b):
            try:
                return a / b
            except Exception:
                return "general"
            except ZeroDivisionError:
                return "zero"

        print(divide(6, 3))
        print(divide(1, 0))
      explain: >-
        `ZeroDivisionError` is a child of `Exception`, so the first branch
        already fits. The second branch never runs. Put it first.
      misconceptions:
        - answer: "2.0\nzero"
          say: "Python takes the first branch that fits, from the top. `Exception` fits every error, so `zero` is never reached."

  # 4. DEMO -----------------------------------------------------------------
  - id: catch
    type: demo
    objective: O1
    title: One function, many errors
    intro: |
      Press **Run**. Each call goes wrong in another way: see which branch
      catches it, and what the error object holds.
    code: |
      def price_of(prices, name, amount):
          try:
              return prices[name] / amount
          except LookupError as error:
              return f"unknown: {error.args}"
          except ArithmeticError as error:
              return f"maths: {error}"

      prices = {"apple": 3}
      print(price_of(prices, "apple", 2))
      print(price_of(prices, "pear", 2))
      print(price_of(prices, "apple", 0))
    experiments:
      - text: "Run it as it is."
        expr: "err is None and len(lines) == 3"
      - text: "Make `prices` a list, `[3]`, and ask for `prices[5]`: the same branch catches an `IndexError`."
        expr: "err is None and 'unknown: (' in out and '[3]' in src"
      - text: "Call `price_of(prices, \"apple\", \"two\")`. Which error is not caught?"
        expr: "err == 'TypeError'"
    investigate:
      - kind: mcq
        id: i-family
        prompt: "Why does `except LookupError` catch the `KeyError` of `prices[\"pear\"]`?"
        options:
          - text: "`KeyError` is a child class of `LookupError`"
            correct: true
            why: "A branch catches its class and all its children."
          - text: "Because every error is a LookupError"
            why: "Only `IndexError` and `KeyError` (and a few more) are."
          - text: "Because it is the first branch"
            why: "Being first is not enough: the error must be of that class or a child of it."
      - kind: mcq
        id: i-args
        prompt: "The second line prints `unknown: ('pear',)`. What is `('pear',)`?"
        options:
          - text: "`error.args`: the values the `KeyError` was made with"
            correct: true
            why: "Python made it with the missing key. A tuple with one value has a comma."
          - text: "The whole dictionary"
            why: "Only the missing key is in it."
          - text: "The line number"
            why: "The line is in the traceback, not in `args`."

  # 5. THEORY ----------------------------------------------------------------
  - id: travel
    type: theory
    objective: O3
    title: Errors travel up
    body: |
      When a function does not catch an error, the error leaves the
      function and goes to the line that **called** it. Then to the line
      that called that one, and so on. The traceback shows this way, from
      the first call (top) to the line of the error (bottom).

      Catch an error where you **can do something** about it: often high
      up, in the part that talks to the user. Not deep down, where you can
      only hide it.

      To note an error and still let it travel on, write `raise` alone in
      the `except` branch:

      ```python
      try:
          save(data)
      except OSError:
          print("Saving failed.")
          raise                    # the same error goes on
      ```

      A branch that catches too much, like `except Exception: return 0`,
      also hides your own **bugs**: a typo becomes a quiet wrong answer.
    keys:
      - code: "raise"
        means: "Alone, in an except branch: pass the same error on."
      - code: "Traceback"
        means: "The way of the error: first call at the top, the error at the bottom."
      - code: "except Exception: return 0"
        means: "Hides bugs. Catch what you expect."

  # 6. EXERCISE: debug -------------------------------------------------------
  - id: ex-quiet
    type: exercise
    fade: debug
    objective: O3
    title: An average that is always zero
    prompt: |
      `average(numbers)` should give the average, and `0` for an empty list.
      **Run it.** It gives `0` for every list. Make the `except` catch only
      the error it is meant for, run again, and fix what you find.
    starter: |
      def average(numbers):
          try:
              return sum(numbers) / len(numbrs)
          except Exception:
              return 0

      print(average([2, 4, 6]))
      print(average([]))
    solution: |
      def average(numbers):
          try:
              return sum(numbers) / len(numbers)
          except ZeroDivisionError:
              return 0

      print(average([2, 4, 6]))
      print(average([]))
    after: >-
      The empty list gives a `ZeroDivisionError`: that is the case to catch.
      The typo gave a `NameError`, and `except Exception` turned it into a
      quiet 0. With the narrow branch, Python showed the bug at once.
    checks:
      - expr: "err is None and lines == ['4.0', '0']"
        pass: "It prints `4.0` and `0`"
        hint: "First catch only `ZeroDivisionError`. Then read the error that comes out."
      - expr: "callable(ns.get('average')) and average([1, 2]) == 1.5 and average([]) == 0"
        pass: "The average is right, and an empty list gives 0"
        hint: "The typo: `numbrs`."
      - expr: "syntax('Try') >= 1 and 'except Exception' not in src and 'except:' not in src"
        pass: "The branch catches only the expected error"
        hint: "`except ZeroDivisionError:`."
    hints:
      - "What does `except Exception` catch here, apart from the empty list?"
      - "Write `except ZeroDivisionError:` and run again. Now a `NameError` appears."
      - "The typo: `len(numbrs)` must be `len(numbers)`."

  # 7. THEORY ----------------------------------------------------------------
  - id: own
    type: theory
    objective: O4
    title: Errors of your own
    body: |
      Your program can have its own errors: a class that inherits from
      `Exception` (or from a better fitting one, like `ValueError`):

      ```python
      class ShopError(Exception):
          """Every error of the shop."""

      class OutOfStock(ShopError):
          def __init__(self, item):
              super().__init__(f"no more {item}")
              self.item = item
      ```

      - The name says what went wrong, better than a plain `ValueError`.
      - `super().__init__(message)` gives the message: `str(error)`.
      - Extra attributes, like `item`, help the code that catches it.
      - A family (`OutOfStock` is a `ShopError`) lets the caller catch one
        error, or all of them.

      ```python
      try:
          take(stock, "pear")
      except OutOfStock as error:
          print("Sorry,", error.item, "is sold out")
      ```
    keys:
      - code: "class ShopError(Exception):"
        means: "Your own error: a class."
      - code: "super().__init__(message)"
        means: "The message of the error."
      - code: "except ShopError:"
        means: "Catches all its children too."

  # 8. EXERCISE: independent -------------------------------------------------
  - id: ex-stock
    type: exercise
    fade: independent
    objective: O4
    title: Sold out
    prompt: |
      **Write the error class `OutOfStock`**, a child of `Exception`. It
      takes the name of an item, gives the message `no more ITEM`, and keeps
      the name in the attribute `item`.

      Then **write `take(stock, item)`**: when `stock[item]` is 0, it raises
      `OutOfStock(item)`; else it takes one away.

      The program at the bottom must then print:

      ```text
      apples left: 1
      Sorry, pears are sold out
      ```
    starter: |
      # Write OutOfStock and take here.


      stock = {"apples": 2, "pears": 0}
      take(stock, "apples")
      print("apples left:", stock["apples"])
      try:
          take(stock, "pears")
      except OutOfStock as error:
          print("Sorry,", error.item, "are sold out")
    solution: |
      class OutOfStock(Exception):
          def __init__(self, item):
              super().__init__(f"no more {item}")
              self.item = item


      def take(stock, item):
          if stock[item] == 0:
              raise OutOfStock(item)
          stock[item] -= 1


      stock = {"apples": 2, "pears": 0}
      take(stock, "apples")
      print("apples left:", stock["apples"])
      try:
          take(stock, "pears")
      except OutOfStock as error:
          print("Sorry,", error.item, "are sold out")
    after: >-
      The caller decides what to do with the error: here a polite message.
      Another program could order new pears instead. The function only says
      clearly what went wrong.
    checks:
      - expr: "isinstance(ns.get('OutOfStock'), type) and issubclass(OutOfStock, Exception) and (lambda e: str(e) == 'no more tea' and e.item == 'tea')(OutOfStock('tea'))"
        pass: "`OutOfStock('tea')` has the message `no more tea` and `item` is `tea`"
        hint: "`super().__init__(f\"no more {item}\")`, then `self.item = item`."
        misconceptions:
          - when: "isinstance(ns.get('OutOfStock'), type) and not issubclass(OutOfStock, BaseException)"
            say: "An error class must inherit from `Exception`: `class OutOfStock(Exception):`."
      - expr: "callable(ns.get('take')) and isinstance(ns.get('OutOfStock'), type) and raises(take, {'tea': 0}, 'tea') == 'OutOfStock' and (lambda s: (take(s, 'tea'), s)[1] == {'tea': 2})({'tea': 3})"
        pass: "`take` raises `OutOfStock` at 0, and takes one away otherwise"
        hint: "`if stock[item] == 0: raise OutOfStock(item)`, then `stock[item] -= 1`."
      - expr: "err is None and lines == ['apples left: 1', 'Sorry, pears are sold out']"
        pass: "It prints the two lines"
        hint: "Keep the program at the bottom as it is."
    hints:
      - "The class: `class OutOfStock(Exception):` with an `__init__(self, item)`."
      - "In `__init__`: `super().__init__(f\"no more {item}\")` and `self.item = item`."
      - "In `take`: `raise OutOfStock(item)` when the stock is 0, else `stock[item] -= 1`."

  # 9. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: mcq
        id: q-catches
        objective: O2
        prompt: "Which branch catches a `FileNotFoundError`?"
        options:
          - text: "`except OSError:`"
            correct: true
            why: "`FileNotFoundError` is a child of `OSError`."
          - text: "`except LookupError:`"
            why: "LookupError is the family of IndexError and KeyError."
          - text: "`except ValueError:`"
            why: "A missing file is an OSError."
      - kind: mcq
        id: q-bare
        objective: O2
        prompt: "Why never a bare `except:`?"
        options:
          - text: "It also catches Ctrl+C and sys.exit(), and hides every bug"
            correct: true
            why: "Catch the errors you expect, or `Exception` at the top."
          - text: "It is a syntax error"
            why: "It is allowed. That is why it is dangerous."
          - text: "It is slower"
            why: "Speed is not the problem."
      - kind: predict
        id: q-reraise
        objective: O3
        code: |
          def load():
              raise ValueError("bad data")

          try:
              try:
                  load()
              except ValueError:
                  print("noted")
                  raise
          except ValueError as error:
              print("outside:", error)
        explain: "The inner branch prints, then `raise` passes the same error on to the outer `try`."
      - kind: predict
        id: q-args
        objective: O1
        code: |
          try:
              raise ValueError("too big", 120)
          except ValueError as error:
              print(error.args)
              print(error.args[1])
        explain: "`args` holds every value the error was made with, as a tuple."
      - kind: mcq
        id: q-family
        objective: O4
        prompt: "`class OutOfStock(ShopError):` and `class ShopError(Exception):`. Which branch catches `OutOfStock`?"
        options:
          - text: "`except ShopError:` and `except OutOfStock:` both do"
            correct: true
            why: "A branch catches its class and the children of it."
          - text: "Only `except OutOfStock:`"
            why: "`ShopError` is its parent: it catches it too."
          - text: "Only `except Exception:`"
            why: "That works too, but so do the two shop errors."

  # 10. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-order
    objective: O1
    prompt: "In which order do the except branches go?"
    options:
      - text: "Specific errors first, general ones last"
        correct: true
        why: "Python runs the first branch that fits."
      - text: "General first, so nothing is missed"
        why: "Then the specific branches never run."
      - text: "The order does not matter"
        why: "Python tries them from the top."
  - kind: mcq
    id: r-tuple
    objective: O1
    prompt: "How do you catch `KeyError` and `IndexError` in one branch?"
    options:
      - text: "`except (KeyError, IndexError):`"
        correct: true
        why: "A tuple of classes. `except LookupError:` works too."
      - text: "`except KeyError or IndexError:`"
        why: "`or` gives only `KeyError` here. Use a tuple."
      - text: "`except KeyError, IndexError:`"
        why: "Without brackets it is a syntax error."
  - kind: mcq
    id: r-where
    objective: O3
    prompt: "Where should a program catch an error?"
    options:
      - text: "Where it can do something about it, often near the user"
        correct: true
        why: "Deep down, catching often only hides the problem."
      - text: "In every function, to be safe"
        why: "That hides bugs and makes the code long."
      - text: "Never"
        why: "Expected errors, like a missing file, should be caught."
  - kind: mcq
    id: r-raise-alone
    objective: O3
    prompt: "What does `raise` alone do in an except branch?"
    options:
      - text: "It passes the same error on"
        correct: true
        why: "Good after you noted the error."
      - text: "It stops the error"
        why: "It sends it on, up to the caller."
      - text: "It is a syntax error"
        why: "In an except branch it is allowed."
  - kind: mcq
    id: r-own-parent
    objective: O4
    prompt: "From which class should your own error inherit?"
    options:
      - text: "`Exception`, or a fitting child of it like `ValueError`"
        correct: true
        why: "Then `except Exception` catches it, and Ctrl+C still works."
      - text: "`BaseException`"
        why: "That is for system errors like Ctrl+C."
      - text: "`object`"
        why: "Only classes of the error tree can be raised."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-sold-out
    type: exercise
    fade: completion
    objective: O4
    title: An error of your own
    prompt: |
      **Replace the two `___`**: `OutOfStock` gives the parent a clear
      message, and keeps the item in an attribute.

      ```text
      cake is sold out
      cake
      ```
    starter: |
      class OutOfStock(Exception):
          def __init__(self, item):
              ___(f"{item} is sold out")
              ___ = item


      try:
          raise OutOfStock("cake")
      except OutOfStock as error:
          print(error)
          print(error.item)
    solution: |
      class OutOfStock(Exception):
          def __init__(self, item):
              super().__init__(f"{item} is sold out")
              self.item = item


      try:
          raise OutOfStock("cake")
      except OutOfStock as error:
          print(error)
          print(error.item)
    after: >-
      `super().__init__(message)` makes `print(error)` show the message; the
      attribute keeps the data for the code that catches it.
    checks:
      - expr: "callable(ns.get('OutOfStock')) and issubclass(OutOfStock, Exception) and str(OutOfStock('tea')) == 'tea is sold out'"
        pass: "The error shows its message"
        hint: "`super().__init__(f\"{item} is sold out\")`."
      - expr: "callable(ns.get('OutOfStock')) and OutOfStock('tea').item == 'tea'"
        pass: "It keeps the item"
        hint: "`self.item = item`."
      - expr: "err is None and lines == ['cake is sold out', 'cake']"
        pass: "It prints the message and the item"
        hint: "Keep the try and except at the end."
    hints:
      - "The parent `Exception` keeps the message."
      - "`super().__init__(f\"{item} is sold out\")`."
      - "`self.item = item`."
  - id: x-except-order
    type: exercise
    fade: debug
    objective: O1
    title: Branches that never run
    prompt: |
      `safe_number` should say what went wrong. But it always says
      `something went wrong`. **Fix the order of the branches**:

      ```text
      50.0
      cannot divide by 0
      not a number
      ```
    starter: |
      def safe_number(text):
          try:
              return 100 / int(text)
          except Exception:
              return "something went wrong"
          except ZeroDivisionError:
              return "cannot divide by 0"
          except ValueError:
              return "not a number"


      for text in ["2", "0", "abc"]:
          print(safe_number(text))
    solution: |
      def safe_number(text):
          try:
              return 100 / int(text)
          except ZeroDivisionError:
              return "cannot divide by 0"
          except ValueError:
              return "not a number"
          except Exception:
              return "something went wrong"


      for text in ["2", "0", "abc"]:
          print(safe_number(text))
    after: >-
      Python takes the first branch that fits, and `Exception` fits almost
      every error. Specific branches first, the general one last.
    checks:
      - expr: "callable(ns.get('safe_number')) and safe_number('4') == 25.0 and safe_number('0') == 'cannot divide by 0' and safe_number('x') == 'not a number'"
        pass: "Each error gets its own message"
        hint: "Put `except Exception:` last."
      - expr: "err is None and lines == ['50.0', 'cannot divide by 0', 'not a number']"
        pass: "It prints the three answers"
        hint: "Keep the loop."
    hints:
      - "Which branch does Python try first?"
      - "`Exception` is the parent of ZeroDivisionError and ValueError."
      - "Move `except Exception:` with its line to the end."
