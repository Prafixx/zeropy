id: exceptions
order: 33
title: Exceptions
summary: Catch the errors that you expect, like bad input or a missing file, so the program can go on.
minutes: 35
outcomes: [A1, A2, A6]

objectives:
  - id: O1
    text: Catch an expected error with try and except, and know which lines run
  - id: O2
    text: Name the error that you catch, read its message, and use else and finally
  - id: O3
    text: Decide which errors to catch (input, files, data) and which to fix in the code (bugs)
  - id: O4
    text: Raise an error with raise when a function gets a value that it cannot use

steps:
  # 1. HOOK ------------------------------------------------------------------
  - id: see
    type: hook
    objective: O1
    title: An error that does not stop the program
    question: A user types "12x" instead of a number. Must the whole program stop?
    code: |
      text = "12x"
      try:
          number = int(text)
          print("You typed", number)
      except ValueError:
          print("That is not a number.")
      print("The program goes on.")
    beats:
      - beat: load
        caption: "Until now, every error stopped the program. An error is also called an **exception**."
      - beat: text
        line: 1
        caption: "A text from a user. It is not a whole number."
      - beat: fail
        line: 3
        caption: "`int(\"12x\")` raises a `ValueError`. But this line is inside `try:`. Python does not stop: it looks for a matching `except`."
      - beat: jump
        line: 6
        caption: "`except ValueError:` matches, so its block runs. Line 4 is **skipped**: the rest of the try block does not run after the error."
      - beat: on
        line: 7
        caption: "After the except block, the program goes on, as if nothing happened."

  # 2. THEORY ----------------------------------------------------------------
  - id: try
    type: theory
    objective: O1
    title: try and except
    body: |
      ```
      try:
          number = int(text)
          print("Half:", number / 2)
      except ValueError:
          print("Not a number:", text)
      ```

      - Python runs the **try** block.
      - No error: the except block is skipped.
      - An error of the named type: the rest of the try block is skipped,
        and the except block runs.
      - Another error, for example `ZeroDivisionError`: it is not caught,
        and the program stops as usual.

      Put **only** the line that can fail into `try`, and name the error
      that you expect. Then a real bug elsewhere still shows up.
    keys:
      - code: "try:"
        means: "Run this block. It may raise an error."
      - code: "except ValueError:"
        means: "Runs only when a `ValueError` happens in the try block."
      - code: "except FileNotFoundError:"
        means: "Catch a missing file. Every error type has its own name."

  # 3. PREDICT ---------------------------------------------------------------
  - id: predict-loop
    type: predict
    objective: O1
    title: Errors in a loop
    item:
      kind: predict
      id: p-loop
      code: |
        for text in ["5", "x", "7"]:
            try:
                print(int(text) * 2)
            except ValueError:
                print("skip", text)
        print("end")
      explain: >-
        `5` and `7` are numbers, so the try block runs to its end. For `x`,
        `int` raises a `ValueError`: the except block prints `skip x`, and
        the loop goes on with the next value.
      misconceptions:
        - answer: "10\nskip x"
          say: "The error is caught inside the loop. The loop goes on with `7`, and then `end` is printed."
        - answer: "10\nskip x\nend"
          say: "After the except block, the loop continues with the next value, `7`."

  # 4. DEMO ------------------------------------------------------------------
  - id: try-it
    type: demo
    visual: output
    objective: O1
    title: Watch the jump
    intro: |
      Press **Run** and watch which lines run. Then change the program in
      the ways below, and watch again.
    code: |
      text = "42"
      try:
          number = int(text)
          print("Half:", number / 2)
      except ValueError:
          print("Not a number:", text)
      print("Done")
    experiments:
      - text: "Run the code as it is. Which line does not run?"
        expr: "err is None and 'Half: 21.0' in lines"
      - text: "Change the text to `\"4x2\"`. Which lines run now?"
        expr: "err is None and any(l.startswith('Not a number') for l in lines)"
      - text: "Change the text to `\"0\"`, and line 4 to `print(\"Share:\", 100 / number)`. Is this error caught?"
        expr: "err == 'ZeroDivisionError'"
      - text: "Change `except ValueError:` to `except ZeroDivisionError:` and run with `\"0\"` again."
        expr: "err is None and 'ZeroDivisionError' in src and 'Done' in lines"
    investigate:
      - kind: spot
        id: i-fails
        prompt: "With `text = \"4x\"`, on which line does the `try` block fail?"
        code: |
          text = "42"
          try:
              number = int(text)
              print("Half:", number / 2)
          except ValueError:
              print("Not a number:", text)
          print("Done")
        line: 3
        wrong:
          - line: 4
            say: "Python never reaches this line: `int()` fails on the line before."
          - line: 5
            say: "This is where Python jumps after the error. The error itself happens earlier."
        explain: >-
          `int("4x")` raises a `ValueError`. Python leaves the `try` block at
          once and runs the matching `except` block.
      - kind: predict
        id: i-4x
        prompt: "The same program with a text that is not a number. **What does it print?**"
        code: |
          text = "4x"
          try:
              number = int(text)
              print("Half:", number / 2)
          except ValueError:
              print("Not a number:", text)
          print("Done")
        explain: >-
          `int` fails, so the `print` in the `try` block never runs. The
          `except` block runs, and then the program goes on: `Done`.

  # 5. THEORY ----------------------------------------------------------------
  - id: more
    type: theory
    objective: O3
    title: Which errors to catch
    body: |
      ## The message, else, finally

      ```
      try:
          data = json.loads(path.read_text())
      except FileNotFoundError:
          data = {}
      except json.JSONDecodeError as error:
          print("Broken file:", error)
          data = {}
      else:
          print("Loaded.")       # only when there was no error
      finally:
          print("Checked.")      # always, error or not
      ```

      One try can have several `except` blocks. `as error` gives the error
      a name, so you can print its message.

      ## Catch what comes from outside

      Catch errors that a correct program can still meet: a user types
      text instead of a number, a file is missing, data is broken. Do
      **not** catch `NameError` or `TypeError` from your own code: they are
      bugs. Fix them.

      Never write `except:` alone, or `except Exception:` around a big
      block. It catches every error, also your bugs, and hides them.

      ## raise

      Your own function can raise an error when a value makes no sense:

      ```
      if age < 0:
          raise ValueError("An age cannot be negative.")
      ```
    keys:
      - code: "except ValueError as error:"
        means: "Catch it, and keep the error in `error` to read its message."
      - code: "else: / finally:"
        means: "`else` runs without an error, `finally` always."
      - code: 'raise ValueError("...")'
        means: "Stop the function with an error and a clear message."

  # 6. DRILL -----------------------------------------------------------------
  - id: drill
    type: drill
    objective: O2
    title: try, except, raise
    items:
      - kind: diagnose
        id: d-wrong-type
        objective: O1
        mode: predict
        prompt: "The except block catches a `ZeroDivisionError`. **What happens?**"
        code: |
          try:
              number = int("seven")
          except ZeroDivisionError:
              print("cannot divide")
          print("end")
        explain: "`int(\"seven\")` raises a `ValueError`. The except block only catches `ZeroDivisionError`, so the error is not caught and the program stops."
      - kind: predict
        id: d-else
        objective: O2
        code: |
          for text in ["3", "x"]:
              try:
                  n = int(text)
              except ValueError:
                  print("bad", text)
              else:
                  print("good", n)
              finally:
                  print("next")
        explain: "`else` runs only when the try block had no error; `finally` runs every time."
      - kind: predict
        id: d-message
        objective: O2
        code: |
          try:
              int("abc")
          except ValueError as error:
              print("Problem:", error)
        explain: "`as error` keeps the error. Printing it shows the same message as the last line of a traceback."
      - kind: mcq
        id: d-which
        objective: O3
        prompt: "Which error should a program catch with `except`?"
        options:
          - text: "`FileNotFoundError` when it opens a file that the user named"
            correct: true
            why: "The program is correct, but the user may give a wrong name. Catch it and say so."
          - text: "`NameError` from a name with a typo"
            why: "That is a bug in the code. Fix the typo; do not hide it."
          - text: "`TypeError` from adding a number to a text"
            why: "That is a bug. Fix the code, for example with `str()` or `int()`."
      - kind: diagnose
        id: d-raise
        objective: O4
        mode: read
        code: |
          def set_age(age):
              if age < 0:
                  raise ValueError("An age cannot be negative.")
              return age

          print(set_age(-3))
        explain: "The function raises the error itself, with a message that says what is wrong. The traceback shows both lines: the call and the `raise`."
        fix:
          - text: "Call it with a value that makes sense, for example `set_age(3)`"
            correct: true
            why: "The function works as it should: it refuses a negative age."
          - text: "Delete the `raise` line"
            why: "Then a negative age goes on into the program, and causes trouble later."
          - text: "Put `try:` around the `raise` line in the function"
            why: "Then the function hides its own message. The caller decides what to do with the error."

  # 7. WORKED EXAMPLE --------------------------------------------------------
  - id: example-config
    type: worked
    objective: O3
    title: Load a file that may be missing or broken
    problem: |
      A program loads `config.json`. On the first run it is missing, and a
      person may have broken it with a typo. The program must work in both
      cases.
    lines:
      - goal: "Try the line that can fail"
        code: |
          import json
          from pathlib import Path

          def load_config(name):
              try:
                  return json.loads(Path(name).read_text())
        note: "Only the one line that can fail is inside `try`."
      - goal: "Handle each problem"
        code: |
              except FileNotFoundError:
                  return {}
        note: "The first run: no file yet. That is normal, so no message."
      - code: |
              except json.JSONDecodeError as error:
                  print(f"{name} is broken ({error}). Using defaults.")
                  return {}
        note: "Broken data: tell the user what happened, then go on with defaults."
    check:
      kind: mcq
      id: w-config
      prompt: "In `load_config`, the line has a typo: `Path(nmae)`. What happens?"
      options:
        - text: "A `NameError` stops the program, because nobody catches it"
          correct: true
          why: "Good: the bug shows at once. `except Exception:` would have hidden it."
        - text: "It returns `{}`"
          why: "Only `FileNotFoundError` and `JSONDecodeError` are caught. A `NameError` is neither."
        - text: "It prints that the file is broken"
          why: "That block runs only for a `JSONDecodeError`."

  # PUZZLE: put the lines in order (Parsons) ----------------------------
  - id: order
    type: drill
    objective: O1
    title: Put the lines in order
    items:
      - kind: order
        id: o-try
        objective: O1
        code: |
          text = "12a"
          try:
              number = int(text)
              print("Number:", number)
          except ValueError:
              print("Not a number:", text)
        explain: >-
          `int("12a")` raises a `ValueError`, so Python jumps from that line to
          the `except` block. The print after it inside `try` does not run.

  # 8. EXERCISE: completion --------------------------------------------------
  - id: ex-ask
    type: exercise
    fade: completion
    objective: O1
    title: Ask until it is a number
    prompt: |
      `ask_number()` asks again and again until the user types a whole
      number. **Replace `___`** with the error that `int()` raises for a
      bad text.

      Try it: type `x`, then press Enter with no text, then `21`.
    starter: |
      def ask_number():
          while True:
              text = input("Number: ")
              try:
                  return int(text)
              except ___:
                  print("Please type a whole number.")

      print(ask_number() * 2)
    solution: |
      def ask_number():
          while True:
              text = input("Number: ")
              try:
                  return int(text)
              except ValueError:
                  print("Please type a whole number.")

      print(ask_number() * 2)
    after: >-
      `return` inside `try` ends the function at the first good number. A
      bad text raises a `ValueError`, the message is printed, and the loop
      asks again.
    cases:
      - {}
      - label: "the user types `x`, nothing, then `21`"
        stdin: ["x", "", "21"]
      - label: "the user types `7` at once"
        stdin: ["7"]
      - label: "the user types `3.5`, then `-4`"
        stdin: ["3.5", "-4"]
    checks:
      - expr: "err is None and asked == len(inputs)"
        pass: "It asks until there is a whole number, then stops asking"
        hint: "Which error does `int(\"x\")` raise? Its name goes after `except`."
        misconceptions:
          - when: "err == 'ValueError'"
            say: "The `ValueError` is not caught. Write `except ValueError:`."
          - when: "err == 'NameError'"
            say: "`___` is not a name. Write the name of the error: `ValueError`."
      - expr: "str(int(inputs[-1]) * 2) in lines and out.count('Please type a whole number.') == len(inputs) - 1"
        pass: "It says why for each bad answer, and prints the double of the number"
        hint: "Keep the message in the except block."
    hints:
      - "Run `int(\"x\")` alone and read the last line of the message."
      - "It is a `ValueError`."
      - "Write `except ValueError:`."

  # 9. EXERCISE: debug -------------------------------------------------------
  - id: ex-hidden
    type: exercise
    fade: debug
    objective: O3
    title: An except that hides a bug
    prompt: |
      `average(numbers)` must give back the average, and `0` for an empty
      list. **Run it.** It prints `0`, but the list is not empty.

      Find the bug. Then make the except block catch **only** the error
      that it is for: the division of an empty list.
    starter: |
      def average(numbers):
          try:
              return sum(numbers) / len(number)
          except Exception:
              return 0

      print(average([2, 4, 6]))
      print(average([]))
    solution: |
      def average(numbers):
          try:
              return sum(numbers) / len(numbers)
          except ZeroDivisionError:
              return 0

      print(average([2, 4, 6]))
      print(average([]))
    after: >-
      `except Exception` caught the `NameError` of the typo and returned 0,
      so the bug was hidden. With `except ZeroDivisionError`, a typo stops
      the program with a clear message, and an empty list still gives 0.
    checks:
      - expr: "callable(ns.get('average')) and average([2, 4, 6]) == 4.0 and average([5]) == 5.0 and average([]) == 0"
        pass: "`average` gives the average, and 0 for an empty list"
        hint: "Is every name in the try block spelled right?"
        misconceptions:
          - when: "callable(ns.get('average')) and average([2, 4, 6]) == 0"
            say: "The average is 0, so the except block runs. Something in the try block fails: look at the names."
      - expr: "callable(ns.get('average')) and raises(average, [1, 'a']) == 'TypeError' and raises(average, None) == 'TypeError'"
        pass: "Other errors are not hidden: only an empty list gives 0"
        hint: "`except Exception` catches every error. Name only the error of an empty list."
        misconceptions:
          - when: "callable(ns.get('average')) and average([1, 'a']) == 0"
            say: "A list with a text still gives 0, so the except block catches too much. An empty list raises a `ZeroDivisionError`: catch only that."
    hints:
      - "Compare the name of the parameter with the name in `len(...)`."
      - "What does `len([])` give, and what happens when you divide by it?"
      - "Fix `len(numbers)` and write `except ZeroDivisionError:`."

  # 10. EXERCISE: independent ------------------------------------------------
  - id: ex-prices
    type: exercise
    fade: independent
    objective: O4
    title: Prices from a messy file
    prompt: |
      `prices.txt` has one price on each line. Some lines are not good.

      1. **Write `parse_price(text)`.** It gives back the price as a float.
         It raises a `ValueError` for a text that is not a number (`float`
         does that for you) and for a negative price (raise it yourself,
         with a message).
      2. Go through the lines of the file. Ignore empty lines. Add the good
         prices. Count the bad lines with `try` and `except`.
      3. Print two lines, like `Total: 6.50` and `Bad lines: 2`.
    files:
      prices.txt: |
        2.50
        abc
        -1

        4
    starter: |
      from pathlib import Path

    solution: |
      from pathlib import Path

      def parse_price(text):
          price = float(text)
          if price < 0:
              raise ValueError(f"A price cannot be negative: {price}")
          return price

      total = 0
      bad = 0
      for line in Path("prices.txt").read_text().splitlines():
          if line.strip() == "":
              continue
          try:
              total = total + parse_price(line)
          except ValueError:
              bad = bad + 1

      print(f"Total: {total:.2f}")
      print(f"Bad lines: {bad}")
    after: >-
      `parse_price` refuses what it cannot use, with a clear error. The
      loop decides what to do with it: count the line and go on. That split
      is common: functions raise, the caller catches.
    cases:
      - {}
      - label: "`prices.txt` has `1.25`, `x1`, ` 3 `, `-0.5` and `10`"
        files:
          prices.txt: "1.25\nx1\n 3 \n-0.5\n10\n"
      - label: "every line of `prices.txt` is good"
        files:
          prices.txt: "5\n5\n"
    checks:
      - expr: "callable(ns.get('parse_price')) and parse_price('2.5') == 2.5 and parse_price(' 3 ') == 3.0 and parse_price('0') == 0.0"
        pass: "`parse_price` gives back the price as a float"
        hint: "`float(text)` turns a text into a number. It accepts spaces around it."
      - expr: "callable(ns.get('parse_price')) and raises(parse_price, 'abc') == 'ValueError' and raises(parse_price, '-1') == 'ValueError' and raises(parse_price, '-0.01') == 'ValueError'"
        pass: "It raises a `ValueError` for a text that is not a number and for a negative price"
        hint: "After `float`, check `if price < 0:` and `raise ValueError(...)`."
        misconceptions:
          - when: "callable(ns.get('parse_price')) and raises(parse_price, '-1') is None"
            say: "A negative price does not raise an error. Add `if price < 0: raise ValueError(\"...\")`."
          - when: "callable(ns.get('parse_price')) and raises(parse_price, 'abc') is None"
            say: "A bad text does not raise an error. Do not catch it inside `parse_price`: let `float` raise it."
      - expr: "(lambda ls: f'Total: {sum(float(l) for l in ls if raises(float, l) is None and float(l) >= 0):.2f}' in lines and f'Bad lines: {sum(1 for l in ls if raises(float, l) is not None or float(l) < 0)}' in lines)([l for l in start_files['prices.txt'].splitlines() if l.strip()])"
        pass: "It prints the total of the good prices and the number of bad lines"
        hint: "In the loop: skip empty lines, then `try:` add `parse_price(line)`, `except ValueError:` count it."
        misconceptions:
          - when: "err == 'ValueError'"
            say: "A bad line stops the program. Put the call of `parse_price` inside `try`, and count the line in `except ValueError:`."
      - expr: "err is None"
        pass: "The program runs to the end, also with bad lines"
        hint: "Every call of `parse_price` in the loop must be inside `try`."
    hints:
      - "`parse_price`: `price = float(text)`, then `if price < 0: raise ValueError(\"A price cannot be negative.\")`, then `return price`."
      - "The loop: `for line in Path(\"prices.txt\").read_text().splitlines():` and `continue` for an empty line."
      - "`try: total = total + parse_price(line)` and `except ValueError: bad = bad + 1`."

  # 11. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O1
    title: Check yourself
    items:
      - kind: blanks
        id: q-fill-try
        objective: O1
        prompt: "**Fill in the blanks** so the program prints `0` instead of stopping with an error."
        code: |
          text = "abc"
          [?try?]:
              number = int(text)
          [?except?] ValueError:
              number = 0
          print(number)
        explain: "`int(\"abc\")` raises a ValueError inside `try`. The `except ValueError:` block runs, and the program goes on."
      - kind: predict
        id: q-skip
        objective: O1
        code: |
          try:
              print("a")
              x = 1 / 0
              print("b")
          except ZeroDivisionError:
              print("c")
          print("d")
        explain: "After the error on line 3, the rest of the try block (`b`) is skipped. The except block prints `c`, then the program goes on."
        misconceptions:
          - answer: "a\nb\nc\nd"
            say: "After the error, the rest of the try block does not run. `b` is skipped."
      - kind: mcq
        id: q-bare
        objective: O3
        prompt: "Why is `except:` without an error name a bad idea?"
        options:
          - text: "It catches every error, also bugs like a `NameError`, and hides them"
            correct: true
            why: "Name the error you expect. Bugs must stop the program, so you see and fix them."
          - text: "It is slower"
            why: "Speed is not the problem. Hidden bugs are."
          - text: "Python does not allow it"
            why: "Python allows it. It is still a bad idea."
      - kind: predict
        id: q-finally
        objective: O2
        code: |
          def check(text):
              try:
                  return int(text)
              except ValueError:
                  return -1
              finally:
                  print("checked", text)

          print(check("5"))
          print(check("?"))
        explain: "`finally` runs even when the try or except block has a `return`. So `checked` is printed before the result of each call."
      - kind: mcq
        id: q-raise
        objective: O4
        prompt: "`withdraw(amount)` gets a negative amount. What is the best thing for the function to do?"
        options:
          - text: "`raise ValueError(\"The amount must be positive.\")`"
            correct: true
            why: "The caller learns at once what is wrong, and where."
          - text: "Return 0 and say nothing"
            why: "Then the wrong value goes on in the program, without a sign."
          - text: "Print a message and go on"
            why: "The caller cannot see a printed message. An error stops the wrong path."
      - kind: diagnose
        id: q-not-caught
        objective: O1
        mode: predict
        code: |
          numbers = [1, 2]
          try:
              print(numbers[5])
          except ValueError:
              print("no number")
        explain: "Position 5 does not exist: an `IndexError`. The except block catches only `ValueError`, so the program stops."

  # 12. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: predict
    id: r-jump
    objective: O1
    code: |
      try:
          n = int("x")
          print("number")
      except ValueError:
          print("text")
    explain: "The error skips the rest of the try block, and the except block runs."
  - kind: mcq
    id: r-catch
    objective: O3
    prompt: "Which error is it right to catch?"
    options:
      - text: "`ValueError` from `int(input())`"
        correct: true
        why: "Users type all kinds of things. Catch it and ask again."
      - text: "`NameError` from a typo"
        why: "A typo is a bug. Fix it."
      - text: "Every error, to be safe"
        why: "That hides bugs. Catch only what you expect."
  - kind: predict
    id: r-as
    objective: O2
    code: |
      try:
          {}["key"]
      except KeyError as error:
          print("missing", error)
    explain: "The message of a `KeyError` is the key: `'key'`."
  - kind: diagnose
    id: r-raise
    objective: O4
    mode: predict
    code: |
      def percent(part, whole):
          if whole == 0:
              raise ValueError("whole cannot be 0")
          return part / whole * 100

      print(percent(1, 0))
    explain: "The function raises its own `ValueError` with a clear message, before the division can fail."
  - kind: mcq
    id: r-else
    objective: O2
    prompt: "When does the `else` block of a `try` run?"
    options:
      - text: "Only when the try block had no error"
        correct: true
        why: "`else` is for the code that needs the try block to have worked."
      - text: "Always"
        why: "That is `finally`."
      - text: "Only after an error"
        why: "That is `except`."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-divide
    type: exercise
    fade: completion
    objective: O2
    title: A safe division
    prompt: |
      **Replace the two `___`**: when `b` is 0, `safe_divide` catches the
      error and gives back `None`.

      ```text
      2.5
      None
      ```
    starter: |
      def safe_divide(a, b):
          ___:
              return a / b
          except ___:
              return None


      print(safe_divide(5, 2))
      print(safe_divide(5, 0))
    solution: |
      def safe_divide(a, b):
          try:
              return a / b
          except ZeroDivisionError:
              return None


      print(safe_divide(5, 2))
      print(safe_divide(5, 0))
    after: >-
      Name the error you expect. A bare `except:` would also hide a bug,
      like a text where a number should be.
    checks:
      - expr: "callable(ns.get('safe_divide')) and safe_divide(9, 3) == 3 and safe_divide(1, 0) is None"
        pass: "It divides, and gives None for 0"
        hint: "`try:` and `except ZeroDivisionError:`."
      - expr: "callable(ns.get('safe_divide')) and raises(safe_divide, 'a', 2) == 'TypeError'"
        pass: "Other errors are not hidden"
        hint: "Catch only `ZeroDivisionError`."
        misconceptions:
          - when: "callable(ns.get('safe_divide')) and safe_divide('a', 2) is None"
            say: "`except` without a name (or `Exception`) also hides real bugs, like dividing a text. Name the error: `ZeroDivisionError`."
      - expr: "lines == ['2.5', 'None']"
        pass: "It prints 2.5 and None"
        hint: "Keep the prints."
    hints:
      - "The block that may fail starts with `try:`."
      - "Dividing by 0 raises `ZeroDivisionError`."
      - "`try:` and `except ZeroDivisionError:`."
  - id: x-volume-raise
    type: exercise
    fade: independent
    objective: O4
    title: A value that is not allowed
    prompt: |
      **Write `set_volume(level)`**: it gives back `level` when it is from 0
      to 100. Else it **raises a `ValueError`** with a message that says the
      allowed range.

      ```text
      50
      ValueError: volume must be from 0 to 100, not 120
      ```
    starter: |
      # Your function here.


      print(set_volume(50))
      try:
          set_volume(120)
      except ValueError as error:
          print("ValueError:", error)
    solution: |
      def set_volume(level):
          if not 0 <= level <= 100:
              raise ValueError(f"volume must be from 0 to 100, not {level}")
          return level


      print(set_volume(50))
      try:
          set_volume(120)
      except ValueError as error:
          print("ValueError:", error)
    after: >-
      The function cannot do anything useful with 120, so it says so loudly.
      The caller decides what to do: here it catches the error and shows the
      message.
    checks:
      - expr: "callable(ns.get('set_volume')) and set_volume(0) == 0 and set_volume(100) == 100 and set_volume(37) == 37"
        pass: "0 to 100 come back as they are"
        hint: "`return level` when it is allowed."
      - expr: "callable(ns.get('set_volume')) and raises(set_volume, 101) == 'ValueError' and raises(set_volume, -1) == 'ValueError'"
        pass: "Outside 0 to 100: ValueError"
        hint: "`if not 0 <= level <= 100: raise ValueError(...)`."
        misconceptions:
          - when: "callable(ns.get('set_volume')) and set_volume(120) is None"
            say: "It gives back None, so the caller never learns that 120 is wrong. Raise the error: `raise ValueError(...)`."
      - expr: "err is None and lines == ['50', 'ValueError: volume must be from 0 to 100, not 120']"
        pass: "The message says the range and the value"
        hint: "`f\"volume must be from 0 to 100, not {level}\"`."
    hints:
      - "Check the value first: `if not 0 <= level <= 100:`."
      - "`raise ValueError(\"...\")` stops the function with that error."
      - "Put the value into the message with an f-string."
