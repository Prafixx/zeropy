id: decomposition
order: 23
title: Split a problem
summary: Plan a program as small functions with clear names, test each one alone, then connect them.
minutes: 35
outcomes: [A1, A3, A8]

objectives:
  - id: O1
    text: Split a task into steps, and write one small function with a clear name for each step
  - id: O2
    text: Test one function alone with a few calls and assert
  - id: O3
    text: Connect small functions in one function, with values in through parameters and out with return
  - id: O4
    text: Find the function that must change, when a rule changes or a test fails

steps:
  # 1. HOOK ------------------------------------------------------------------
  - id: see
    type: hook
    objective: O3
    title: One job for each function
    question: A big task is hard to write and hard to check. What if each part had its own name?
    code: |
      def cost(price, count):
          return price * count

      def add_tax(amount):
          return amount * 1.2

      def receipt(item, price, count):
          total = add_tax(cost(price, count))
          return f"{item}: {total:.2f}"

      text = receipt("Tea", 2.5, 4)
    beats:
      - beat: plan
        line: 1
        caption: "Three small functions. Each does **one job**, and its name says which."
      - beat: main
        line: 11
        caption: "`receipt` gets everything it needs as parameters."
      - beat: sub
        line: 8
        caption: "To compute, it asks `cost`. A helper gets **only** the values it needs: here, not the item name."
      - beat: subBack
        line: 2
        caption: "`cost` gives back 10.0."
      - beat: tax
        line: 8
        caption: "That result goes straight into `add_tax`."
      - beat: taxBack
        line: 5
        caption: "12.0 comes back and goes into `total`."
      - beat: done
        line: 11
        caption: "`receipt` gives back the finished line. It only **connects** the helpers. Each piece is small, so you can check it alone."

  # 2. THEORY ----------------------------------------------------------------
  - id: split
    type: theory
    objective: O1
    title: From a task to functions
    body: |
      ## Plan first, in words

      Write the steps as comments before you write code. Each step that
      computes something becomes a function.

      ```
      # 1. clean the text         -> clean(text)
      # 2. split it into words    -> words_of(text)
      # 3. find the longest word  -> longest(words)
      ```

      ## Good helper functions

      - **One job.** If you need "and" to describe it, split it.
      - **A name that says the job**, often a verb: `clean`, `count_vowels`,
        `is_valid` (a name with `is_` gives back `True` or `False`).
      - **Values in, a value out.** It gets what it needs as parameters and
        gives the result back with `return`. It does not print, and it does
        not change names outside.

      One function at the end connects the helpers. It reads like the plan.
    keys:
      - code: "def count_vowels(text):"
        means: "One job. The name says what it gives back."
      - code: "def is_valid(email):"
        means: "A question: it gives back `True` or `False`."
      - code: "return longest(words_of(clean(text)))"
        means: "The connecting function reads like the plan."

  # 3. PREDICT ---------------------------------------------------------------
  - id: predict-chain
    type: predict
    objective: O3
    title: Follow the values
    item:
      kind: predict
      id: p-chain
      prompt: "**Type every line that this program prints.**"
      code: |
        def double(n):
            return n * 2

        def add_one(n):
            return n + 1

        def process(n):
            return add_one(double(n))

        print(process(5))
        print(double(add_one(5)))
      explain: >-
        `process(5)` doubles first, 10, then adds one: 11. The last line
        calls them the other way round: 5 + 1 is 6, and double 6 is 12. The
        innermost call always runs first.
      misconceptions:
        - answer: "11\n11"
          say: "The order of the calls matters. In the last line, `add_one` runs first, because it is inside."
        - answer: "12\n11"
          say: "In `add_one(double(n))`, `double` runs first, because it is inside."

  # 4. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O2
    title: Change one piece
    intro: |
      Press **Run**. Then change the program in the ways below. Each change
      touches only one small function.
    code: |
      def cost(price, count):
          return price * count

      def add_tax(amount):
          return amount * 1.2

      def receipt(item, price, count):
          total = add_tax(cost(price, count))
          return f"{item}: {total:.2f}"

      print(receipt("Tea", 2.5, 4))
    experiments:
      - text: "Run the code as it is."
        expr: "True"
      - text: "Test one piece alone. Add `print(add_tax(100))` at the end."
        expr: "err is None and '120.0' in lines"
      - text: "The tax is now 10%. Change it in **one** place."
        expr: "err is None and callable(ns.get('add_tax')) and abs(add_tax(100) - 110) < 1e-9"
      - text: "Add a test that is wrong on purpose: `assert cost(2, 3) == 5`. Read the message."
        expr: "err == 'AssertionError'"
    investigate:
      - kind: spot
        id: i-combine
        prompt: "Which line puts the two small functions together?"
        code: |
          def cost(price, count):
              return price * count

          def add_tax(amount):
              return amount * 1.2

          def receipt(item, price, count):
              total = add_tax(cost(price, count))
              return f"{item}: {total:.2f}"

          print(receipt("Tea", 2.5, 4))
        line: 8
        wrong:
          - line: 11
            say: "This line calls `receipt`. The combining happens inside `receipt`."
        explain: >-
          `add_tax(cost(price, count))`: the result of `cost` goes straight
          into `add_tax`. Each function does one small job.
      - kind: mcq
        id: i-first
        prompt: "On line 8, which function runs first?"
        options:
          - text: "`cost`: the inner call"
            correct: true
            why: "Its result goes to `add_tax`: Python needs the value of the argument before it can call `add_tax`."
          - text: "`add_tax`, because it is written first"
            why: "Python works from the inside out: first the argument, then the call."
          - text: "Both at the same time"
            why: "Python runs one call after the other."

  # 5. THEORY ----------------------------------------------------------------
  - id: tests
    type: theory
    objective: O2
    title: Test each piece
    body: |
      ## assert

      `assert` checks that something is `True`:

      ```
      assert cost(2, 3) == 6
      ```

      - If it is `True`, nothing happens. The program continues.
      - If it is `False`, the program stops with `AssertionError`, and the
        traceback names the line of the test.

      ## Test before you connect

      Write one helper, then two or three tests for it: a normal value, and
      an unusual one (0, an empty text, a capital letter). When all tests
      pass, write the next helper. A bug is then easy to find: it is in the
      piece whose test failed.

      Later in the course you will use **pytest**, a tool that runs many
      tests like these at once.
    keys:
      - code: 'assert clean(" Hi ") == "hi"'
        means: "A test. Silent when the result is right."
      - code: "AssertionError"
        means: "A test found a wrong result. Its line is in the traceback."
      - code: "assert count_vowels(\"\") == 0"
        means: "Test the unusual cases too: here, an empty text."

  # 6. DRILL -----------------------------------------------------------------
  - id: drill
    type: drill
    objective: O4
    title: Pieces and tests
    items:
      - kind: predict
        id: d-assert
        objective: O2
        prompt: "**What does this program print?** (It can print nothing.)"
        code: |
          def middle(a, b):
              return (a + b) / 2

          assert middle(2, 4) == 3
          assert middle(0, 0) == 0
          print("ok")
        explain: "Both tests are `True`, so `assert` does nothing, and the program prints `ok`."
      - kind: diagnose
        id: d-failed
        objective: O4
        mode: read
        code: |
          def last_letter(word):
              return word[len(word)]

          def ends_with_s(word):
              return last_letter(word) == "s"

          assert ends_with_s("cats")
        explain: >-
          The test calls `ends_with_s`, which calls `last_letter`. Read the
          traceback from the bottom: the error happens in `last_letter`, on
          line 2. The last position is `len(word) - 1`.
        fix:
          - text: "In `last_letter`: `return word[-1]`"
            correct: true
            why: "The bug is in the helper at the bottom of the traceback. `ends_with_s` is right."
          - text: "In `ends_with_s`: compare with `'s'` in single quotes"
            why: "Both quote styles make the same text. The error is an `IndexError` in `last_letter`."
          - text: "Delete the test"
            why: "Then the bug stays, and it is found later, in a bigger program."
      - kind: mcq
        id: d-split
        objective: O1
        prompt: "`def read_and_check_and_save(data):` What is wrong with this function?"
        options:
          - text: "It does three jobs. Split it into three functions"
            correct: true
            why: "A name with \"and\" shows that the function does more than one job."
          - text: "The name is too long for Python"
            why: "Python accepts long names. The problem is the number of jobs."
          - text: "Nothing. Fewer functions are better"
            why: "Small functions are easier to test and to change."
      - kind: mcq
        id: d-print
        objective: O3
        prompt: "A helper computes a total. Which is better at its end?"
        options:
          - text: "`return total`"
            correct: true
            why: "Other functions can use the value. Only the connecting part of the program prints."
          - text: "`print(total)`"
            why: "Then the value is only on the screen. Other code cannot use it, and the call gives back `None`."
          - text: "`total = total`"
            why: "This does nothing. The value is gone when the call ends."

  # 7. WORKED EXAMPLE --------------------------------------------------------
  - id: example-grades
    type: worked
    objective: O1
    title: A plan in three functions
    problem: |
      For a list of scores, show the average and a letter: `A` from 90,
      `B` from 75, else `C`.
    lines:
      - goal: "Plan the pieces"
        code: |
          # 1. average of the scores   -> average(scores)
          # 2. letter for an average   -> letter(avg)
          # 3. one line for the report -> report(scores)
        note: "The plan in words. Each step is one function."
      - goal: "Build and test each piece"
        code: |
          def average(scores):
              return sum(scores) / len(scores)

          assert average([80, 100]) == 90
        note: "The first helper and a test. It passes, so the next piece can start."
      - code: |
          def letter(avg):
              if avg >= 90:
                  return "A"
              if avg >= 75:
                  return "B"
              return "C"

          assert letter(90) == "A"
          assert letter(74.9) == "C"
        note: "The second helper. The tests check the edges: exactly 90, and a little under 75."
      - goal: "Connect the pieces"
        code: |
          def report(scores):
              avg = average(scores)
              return f"{avg:.1f} {letter(avg)}"

          print(report([92, 88, 95]))   # 91.7 A
        note: "The connecting function reads like the plan."
    check:
      kind: mcq
      id: w-grades
      prompt: "The rule changes: `B` starts at 70. **Which function changes?**"
      options:
        - text: "Only `letter`"
          correct: true
          why: "The rule is in one place. `average` and `report` stay the same."
        - text: "`letter` and `report`"
          why: "`report` only asks `letter`. It does not know the rule."
        - text: "All three"
          why: "Each function has one job. Only one of them knows the letters."

  # PUZZLE: put the lines in order (Parsons) ----------------------------
  - id: order
    type: drill
    objective: O3
    title: Put the lines in order
    items:
      - kind: order
        id: o-report
        objective: O3
        code: |
          def average(scores):
              return sum(scores) / len(scores)
          def report(scores):
              avg = average(scores)
              return f"Average: {avg:.1f}"
          print(report([70, 85, 90]))
        explain: >-
          Two small functions, then one call. `report` asks `average` for the
          number and only formats it. The two `def` blocks can change places:
          Python needs them only when the last line runs.

  # 8. EXERCISE: completion --------------------------------------------------
  - id: ex-password
    type: exercise
    fade: completion
    objective: O3
    title: Connect two rules
    prompt: |
      A strong password has at least 8 characters **and** at least one
      digit. The two rules are ready as functions.

      **Replace `___`** so that `is_strong` uses both helpers.
    starter: |
      def long_enough(password):
          return len(password) >= 8

      def has_digit(password):
          for ch in password:
              if ch.isdigit():  # True for "0" to "9"
                  return True
          return False

      def is_strong(password):
          return ___

      print(is_strong("sunflower7"))
      print(is_strong("sunflower"))
    solution: |
      def long_enough(password):
          return len(password) >= 8

      def has_digit(password):
          for ch in password:
              if ch.isdigit():  # True for "0" to "9"
                  return True
          return False

      def is_strong(password):
          return long_enough(password) and has_digit(password)

      print(is_strong("sunflower7"))
      print(is_strong("sunflower"))
    after: >-
      `is_strong` reads like the rule itself. A third rule later (for
      example a capital letter) is one more small function and one more
      `and`.
    checks:
      - expr: "callable(ns.get('is_strong')) and is_strong('sunflower7') is True and is_strong('sunflower') is False and is_strong('sun7') is False and is_strong('12345678') is True"
        pass: "`is_strong` is True only when both rules are True"
        hint: "Both rules must be True at the same time."
        misconceptions:
          - when: "callable(ns.get('is_strong')) and is_strong('sunflower') is True and is_strong('sun7') is True"
            say: "With `or`, one rule is enough. A strong password needs both rules: use `and`."
      - expr: "calls_in('is_strong', 'long_enough') and calls_in('is_strong', 'has_digit')"
        pass: "`is_strong` calls the two helpers"
        hint: "Do not write the rules again. Call `long_enough(password)` and `has_digit(password)`."
    hints:
      - "Call each helper with `password`."
      - "Both must be True: connect them with `and`."
      - "Write `return long_enough(password) and has_digit(password)`."

  # 9. EXERCISE: debug -------------------------------------------------------
  - id: ex-vowels
    type: exercise
    fade: debug
    objective: O4
    title: A test that fails
    prompt: |
      **Run it.** One test fails. Find the function with the bug and fix
      it. Do not change the tests.
    starter: |
      def count_vowels(text):
          count = 0
          for ch in text:
              if ch in "aeiou":
                  count = count + 1
          return count

      def vowel_share(text):
          return count_vowels(text) / len(text)

      assert count_vowels("banana") == 3
      assert count_vowels("Apple") == 2
      assert vowel_share("Oslo") == 0.5
      print("All tests pass")
    solution: |
      def count_vowels(text):
          count = 0
          for ch in text.lower():
              if ch in "aeiou":
                  count = count + 1
          return count

      def vowel_share(text):
          return count_vowels(text) / len(text)

      assert count_vowels("banana") == 3
      assert count_vowels("Apple") == 2
      assert vowel_share("Oslo") == 0.5
      print("All tests pass")
    after: >-
      The failed test pointed at `count_vowels`, and `vowel_share` was fixed
      too, because it uses that helper. One fix in one place.
    checks:
      - expr: "callable(ns.get('count_vowels')) and count_vowels('Apple') == 2 and count_vowels('AEIOU xyz') == 5 and count_vowels('rhythm') == 0 and count_vowels('banana') == 3"
        pass: "`count_vowels` counts capital vowels too"
        hint: "The test with `\"Apple\"` fails. Which letter is not counted?"
        misconceptions:
          - when: "callable(ns.get('count_vowels')) and count_vowels('Apple') == 1"
            say: "The `A` of `Apple` is not counted. `\"A\" in \"aeiou\"` is False: compare the letter in lowercase."
      - expr: "callable(ns.get('vowel_share')) and vowel_share('Oslo') == 0.5 and vowel_share('AB') == 0.5"
        pass: "`vowel_share` is right, too"
        hint: "`vowel_share` uses `count_vowels`. Fix the helper."
      - expr: "err is None and lines == ['All tests pass'] and src.count('assert') >= 3"
        pass: "The three tests are still there, and all pass"
        hint: "Keep the three `assert` lines as they are."
    hints:
      - "The failed test is on the line in the traceback. Which function does it call?"
      - "`\"A\" in \"aeiou\"` is False. Capital letters are different characters."
      - "Loop over `text.lower()`, or compare `ch.lower()`."

  # 10. EXERCISE: independent ------------------------------------------------
  - id: ex-palindromes
    type: exercise
    fade: independent
    objective: O1
    title: Three pieces, then connect them
    prompt: |
      A **palindrome** is a word that is the same backwards: `level`,
      `noon`, `Anna`. Find the palindromes in a text.

      **Write three functions:**

      1. `clean(word)` gives back the word in lowercase, with only its
         letters: `clean("Anna,")` is `"anna"`. To test one character, use
         `ch.isalpha()`. Read what it does in the
         [Python docs](https://docs.python.org/3/library/stdtypes.html#str.isalpha).
      2. `is_palindrome(word)` gives back `True` if `word` is the same
         backwards. `word[::-1]` is the word backwards.
      3. `palindromes(text)` gives back a list of the cleaned palindromes
         in the text. It uses the two helpers.

      Add a test with `assert` for each helper. Then print
      `palindromes("Anna and Bob paddle the kayak at noon.")`.
    starter: |
      # 1. one word, lowercase, only letters -> clean(word)
      # 2. same backwards?                   -> is_palindrome(word)
      # 3. all palindromes in a text         -> palindromes(text)
    solution: |
      def clean(word):
          result = ""
          for ch in word:
              if ch.isalpha():
                  result = result + ch
          return result.lower()

      def is_palindrome(word):
          return word == word[::-1]

      def palindromes(text):
          found = []
          for word in text.split():
              word = clean(word)
              if is_palindrome(word):
                  found.append(word)
          return found

      assert clean("Anna,") == "anna"
      assert is_palindrome("level")
      assert not is_palindrome("tree")

      print(palindromes("Anna and Bob paddle the kayak at noon."))
    after: >-
      Each piece was small and tested alone. The connecting function is a
      plain loop, because the hard parts have names. You used `isalpha()`
      from the docs, without a lesson about it.
    checks:
      - expr: "callable(ns.get('clean')) and clean('Anna,') == 'anna' and clean('kayak.') == 'kayak' and clean('Bob!?') == 'bob'"
        pass: "`clean` gives back only the letters, in lowercase"
        hint: "Loop over the characters and keep a character only if `ch.isalpha()` is True. Then use `.lower()`."
        misconceptions:
          - when: "callable(ns.get('clean')) and clean('Anna,') == 'anna,'"
            say: "The comma is still there. Keep only the characters for which `ch.isalpha()` is True."
          - when: "callable(ns.get('clean')) and clean('Anna,') == 'Anna'"
            say: "The letters must be lowercase. Use `.lower()`."
      - expr: "callable(ns.get('is_palindrome')) and is_palindrome('level') is True and is_palindrome('noon') is True and is_palindrome('tree') is False"
        pass: "`is_palindrome` gives back True or False"
        hint: "Compare the word with `word[::-1]`."
      - expr: "callable(ns.get('palindromes')) and palindromes('Anna and Bob paddle the kayak at noon.') == ['anna', 'bob', 'kayak', 'noon'] and palindromes('Tree house') == []"
        pass: "`palindromes` gives back the cleaned palindromes, in order"
        hint: "Loop over `text.split()`, clean each word, and keep it if it is a palindrome."
        misconceptions:
          - when: "callable(ns.get('palindromes')) and palindromes('Anna and Bob paddle the kayak at noon.') is None"
            say: "`palindromes` gives back `None`. Collect the words in a list and `return` it."
          - when: "callable(ns.get('palindromes')) and palindromes('Anna and Bob paddle the kayak at noon.') == ['kayak']"
            say: "Only `kayak` is found. Clean each word first: `Anna` and `noon.` become palindromes only in lowercase, without the dot."
      - expr: "calls_in('palindromes', 'clean') and calls_in('palindromes', 'is_palindrome')"
        pass: "`palindromes` uses the two helpers"
        hint: "Do not write the rules again inside `palindromes`. Call `clean(word)` and `is_palindrome(...)`."
      - expr: "err is None and src.count('assert') >= 2 and len(lines) >= 1"
        pass: "There are tests, they pass, and the program prints the result"
        hint: "Add at least two `assert` lines, for example `assert clean(\"Anna,\") == \"anna\"`. Then print the result."
    hints:
      - "Start with `clean`. Build a new text: `result = \"\"`, then add each `ch` for which `ch.isalpha()` is True."
      - "`is_palindrome` is one line: `return word == word[::-1]`."
      - "In `palindromes`: `found = []`, loop over `text.split()`, `word = clean(word)`, and `found.append(word)` if `is_palindrome(word)`."

  # 11. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O1
    title: Check yourself
    items:
      - kind: mcq
        id: q-name
        objective: O1
        prompt: "Which name is best for a function that gives back `True` when a year is a leap year?"
        options:
          - text: "`is_leap_year(year)`"
            correct: true
            why: "It says the question, and `is_` shows that the answer is True or False."
          - text: "`check_the_year(year)`"
            why: "Check what? The name does not say the job."
          - text: "`year2(y)`"
            why: "A reader cannot guess what it does."
      - kind: predict
        id: q-assert-pass
        objective: O2
        prompt: "**What does this program print?**"
        code: |
          def shout(text):
              return text.upper() + "!"

          assert shout("hi") == "HI!"
          print(shout("ok"))
        explain: "The test is True, so `assert` is silent. Then the program prints `OK!`."
      - kind: diagnose
        id: q-assert-fail
        objective: O2
        mode: predict
        code: |
          def area(width, height):
              return width + height

          assert area(2, 3) == 6
          print("done")
        explain: "`area(2, 3)` gives back 5, not 6, so the test stops the program with `AssertionError` on line 4. The bug is the `+` in `area`."
      - kind: mcq
        id: q-where
        objective: O4
        prompt: "`assert is_valid(\"a@b.com\")` fails. `is_valid` calls `has_at(text)` and `has_dot(text)`. What do you do first?"
        options:
          - text: "Test `has_at` and `has_dot` alone"
            correct: true
            why: "With the same text, and see which one is wrong. Small pieces can be tested alone; that shows where the bug is."
          - text: "Rewrite all three functions"
            why: "Most of the code is probably right. Find the wrong piece first."
          - text: "Delete the test"
            why: "The test found a real problem. Keep it, so the bug cannot come back."
      - kind: predict
        id: q-chain
        objective: O3
        code: |
          def clean(text):
              return text.strip().lower()

          def is_yes(answer):
              return clean(answer) in ["y", "yes"]

          print(is_yes(" YES "))
          print(is_yes("no"))
        explain: "`clean` turns `\" YES \"` into `\"yes\"`, which is in the list. `\"no\"` is not."
      - kind: mcq
        id: q-print
        objective: O3
        prompt: "Why should a helper use `return` and not `print`?"
        options:
          - text: "So other functions can use its result"
            correct: true
            why: "A printed value is only on the screen. A returned value can be stored, compared and tested."
          - text: "Because `print` is slow"
            why: "Speed is not the reason. A printed value cannot be used by other code."
          - text: "Because a helper cannot call print"
            why: "It can, but then its result is not useful for other code or for tests."

  # 12. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-assert
    objective: O2
    prompt: "What does `assert x == 3` do when `x` is 3?"
    options:
      - text: "Nothing"
        correct: true
        why: "The program continues: `assert` stops the program only when the test is False."
      - text: "It prints True"
        why: "`assert` prints nothing when the test is True."
      - text: "It sets `x` to 3"
        why: "`==` compares. It does not change `x`."
  - kind: predict
    id: r-chain
    objective: O3
    code: |
      def half(n):
          return n / 2

      def plus_ten(n):
          return n + 10

      print(half(plus_ten(4)))
    explain: "The inner call runs first: 4 + 10 is 14, and half of 14 is 7.0."
  - kind: mcq
    id: r-one-job
    objective: O1
    prompt: "How can you see that a function does too much?"
    options:
      - text: "You need \"and\" to say what it does"
        correct: true
        why: "One job, one function. Split it at the \"and\"."
      - text: "It has more than one return line"
        why: "A good helper gives back its result with return."
      - text: "It has a parameter with a default"
        why: "Parameters are how a helper gets what it needs."
  - kind: diagnose
    id: r-fail
    objective: O4
    mode: predict
    code: |
      def total(prices):
          result = 0
          for p in prices:
              result = p
          return result

      assert total([1, 2, 3]) == 6
    explain: "`result = p` replaces the total in each round, so the function gives back 3. The test stops the program with `AssertionError`. The fix is `result = result + p`."
  - kind: mcq
    id: r-rule
    objective: O4
    prompt: "A shop changes its tax. The tax is in `add_tax(amount)`, and three other functions call it. How many functions change?"
    options:
      - text: "One"
        correct: true
        why: "Only `add_tax`: the rule is in one place. Every caller gets the new rule."
      - text: "Four"
        why: "The callers only call `add_tax`. They do not know the tax."
      - text: "Three"
        why: "The three callers stay the same."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-leap
    type: exercise
    fade: debug
    objective: O4
    title: A test about 1900
    prompt: |
      A year is a leap year when it can be divided by 4, **but not** by
      100, **unless** it can be divided by 400. The tests stop with an
      `AssertionError`. **Fix the function**, not the tests.

      ```text
      all tests pass
      ```
    starter: |
      def is_leap(year):
          return year % 4 == 0


      assert is_leap(2024) is True
      assert is_leap(2023) is False
      assert is_leap(1900) is False
      assert is_leap(2000) is True
      print("all tests pass")
    solution: |
      def is_leap(year):
          return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


      assert is_leap(2024) is True
      assert is_leap(2023) is False
      assert is_leap(1900) is False
      assert is_leap(2000) is True
      print("all tests pass")
    after: >-
      The failing test pointed at one small function, and only that one
      had to change. That is why each rule gets its own function and its
      own tests.
    checks:
      - expr: "callable(ns.get('is_leap')) and [is_leap(y) for y in (1600, 1700, 1996, 2000, 2023, 2024, 2100)] == [True, False, True, True, False, True, False]"
        pass: "The rule is right for 100s and 400s too"
        hint: "`year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)`."
      - expr: "err is None and lines == ['all tests pass'] and src.count('assert ') >= 4"
        pass: "All four tests pass, and they are still there"
        hint: "Change the function, keep the tests."
    hints:
      - "Which test fails? Run `is_leap(1900)` by hand."
      - "1900 can be divided by 100, but not by 400."
      - "`return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)`."
  - id: x-time
    type: exercise
    fade: independent
    objective: O3
    title: Two small functions, then connect them
    prompt: |
      **Write two functions:**

      - `to_seconds(h, m, s)` gives the time in seconds.
      - `clock(seconds)` gives a text like `1:02:03` (minutes and seconds
        with two digits).

      Then the last line connects them: one hour, two minutes and three
      seconds, plus one minute.

      ```text
      1:03:03
      ```
    starter: |
      # Your two functions here.


      print(clock(to_seconds(1, 2, 3) + 60))
    solution: |
      def to_seconds(h, m, s):
          return h * 3600 + m * 60 + s


      def clock(seconds):
          h = seconds // 3600
          m = seconds % 3600 // 60
          s = seconds % 60
          return f"{h}:{m:02}:{s:02}"


      print(clock(to_seconds(1, 2, 3) + 60))
    after: >-
      Each function does one job and can be tested alone. The last line
      only connects them: values go in through parameters and come out
      with return.
    checks:
      - expr: "callable(ns.get('to_seconds')) and to_seconds(1, 2, 3) == 3723 and to_seconds(0, 0, 5) == 5"
        pass: "to_seconds works"
        hint: "`h * 3600 + m * 60 + s`."
      - expr: "callable(ns.get('clock')) and clock(3723) == '1:02:03' and clock(59) == '0:00:59' and clock(36000) == '10:00:00'"
        pass: "clock writes h:mm:ss"
        hint: "`seconds // 3600`, `seconds % 3600 // 60`, `seconds % 60`, and `:02` in the f-string."
        misconceptions:
          - when: "callable(ns.get('clock')) and clock(3723) == '1:2:3'"
            say: "Minutes and seconds need two digits: `{m:02}` and `{s:02}`."
      - expr: "lines == ['1:03:03']"
        pass: "It prints 1:03:03"
        hint: "Keep the last line."
    hints:
      - "`to_seconds`: hours × 3600, minutes × 60, plus seconds."
      - "`clock`: `//` and `%` take the parts apart again."
      - "`f\"{h}:{m:02}:{s:02}\"` gives two digits."
