# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-bytearray
    type: exercise
    fade: completion
    objective: O2
    title: Change one byte in place
    prompt: |
      `bytes` cannot change, but a `bytearray` can: it is a buffer of bytes
      that you can edit. **Replace the `___`**: read the file into a
      `bytearray`, change its first byte from `B` to `P`, and write it back.

      ```text
      bytearray(b'BMP')
      PMP
      ```
    given: |
      from pathlib import Path

      Path("icon.bin").write_bytes(b"BMP")
    starter: |
      from pathlib import Path

      data = ___(Path("icon.bin").read_bytes())
      print(data)
      data[0] = ord(___)
      Path("icon.bin").write_bytes(data)
      print(Path("icon.bin").read_text())
    solution: |
      from pathlib import Path

      data = bytearray(Path("icon.bin").read_bytes())
      print(data)
      data[0] = ord("P")
      Path("icon.bin").write_bytes(data)
      print(Path("icon.bin").read_text())
    after: >-
      A byte is a number, so the new value is `ord("P")`, 80. With `bytes`,
      `data[0] = 80` raises a `TypeError`: bytes cannot change.
    checks:
      - expr: "err is None and lines == [\"bytearray(b'BMP')\", 'PMP']"
        pass: "It changes the first byte and saves the file"
        hint: "`bytearray(...)` and `ord(\"P\")`."
        misconceptions:
          - when: "err == 'TypeError'"
            say: "A `bytes` object cannot change, and a byte is a number. Use `bytearray(...)`, and `ord(\"P\")` for the value."
      - expr: "open('icon.bin', 'rb').read() == b'PMP'"
        pass: "The file holds the new bytes"
        hint: "`write_bytes(data)` takes a `bytearray` too."
    hints:
      - "The type of bytes that can change is `bytearray`."
      - "A byte is a number: the number of a letter is `ord(...)`."
      - "`bytearray(...)` and `ord(\"P\")`."
  - id: x-tail
    type: exercise
    fade: independent
    objective: O1
    title: The last lines of a file
    prompt: |
      **Write `tail(name, n)`**: it gives back the last `n` lines of a text
      file, without their `\n`, like the tool `tail` does. Read the file
      with a `for` loop and keep only the last `n` lines while you read,
      so a big file works too.

      ```text
      ['line 8', 'line 9', 'line 10']
      ```
    given: |
      from pathlib import Path

      Path("log.txt").write_text("".join(f"line {i}\n" for i in range(1, 11)))
    starter: |
      # Your function here.


      print(tail("log.txt", 3))
    solution: |
      def tail(name, n):
          last = []
          with open(name) as f:
              for line in f:
                  last.append(line.rstrip("\n"))
                  if len(last) > n:
                      last.pop(0)
          return last


      print(tail("log.txt", 3))
    after: >-
      The list never has more than `n` lines. `collections.deque(f, maxlen=n)`
      does the same in one line, and faster.
    checks:
      - expr: "callable(ns.get('tail')) and tail('log.txt', 3) == ['line 8', 'line 9', 'line 10'] and tail('log.txt', 1) == ['line 10']"
        pass: "It gives the last lines"
        hint: "Add each line, and take the oldest away when there are more than `n`."
      - expr: "callable(ns.get('tail')) and tail('log.txt', 50) == [f'line {i}' for i in range(1, 11)] and (lambda p: (p.write_text(''), tail('empty.txt', 2))[1])(__import__('pathlib').Path('empty.txt')) == []"
        pass: "It works for a short file and an empty one"
        hint: "With fewer than `n` lines, all of them come back."
      - expr: "'readlines' not in src and '.read()' not in src and syntax('For') >= 1"
        pass: "It reads line by line, not the whole file at once"
        hint: "`for line in f:` instead of `read()` or `readlines()`."
    hints:
      - "Keep a list `last = []`."
      - "`last.append(line.rstrip(\"\\n\"))` for each line."
      - "`if len(last) > n: last.pop(0)`."
