id: project-text-adventure
order: 29
title: "Project: text adventure"
summary: Build a small game of rooms and commands, one tested function at a time.
minutes: 60
outcomes: [A1, A8]

objectives:
  - id: O1
    text: Plan a program as small functions, and test each one with assert before you connect them
  - id: O2
    text: Keep the data of a program (the rooms) apart from the code that uses it
  - id: O3
    text: Turn what the user types into clean parts that the program can use
  - id: O4
    text: Write a loop that reads commands, calls the right function and ends at the right time

steps:
  # 1. PLAY THE FINISHED GAME ------------------------------------------------
  - id: play
    type: demo
    visual: none
    sealed: true
    objective: O4
    title: Play the finished game
    intro: |
      This project builds a small **text adventure**: you move between
      rooms by typing commands. Press **Play** and type commands like
      `look`, `go north`, `take` and `quit`.

      Can you get out through the garden gate? The code is hidden. At the
      end of this project you will have written it yourself.
    code: |
      ROOMS = {
          "hall": {
              "text": "You are in a dark hall.",
              "exits": {"north": "kitchen", "east": "garden"},
              "item": None,
          },
          "kitchen": {
              "text": "You are in a small kitchen.",
              "exits": {"south": "hall"},
              "item": "key",
          },
          "garden": {
              "text": "You are in a garden. A locked gate is in the wall.",
              "exits": {"west": "hall"},
              "item": None,
          },
      }

      def describe(name):
          room = ROOMS[name]
          exits = ", ".join(sorted(room["exits"]))
          return f"{room['text']} Exits: {exits}."

      def parse(command):
          words = command.lower().split()
          if len(words) == 0:
              return "", ""
          return words[0], " ".join(words[1:])

      def move(name, direction):
          return ROOMS[name]["exits"].get(direction, name)

      def take(name, bag):
          item = ROOMS[name]["item"]
          if item is None or item in bag:
              return "There is nothing here."
          bag.append(item)
          return f"You take the {item}."

      room = "hall"
      bag = []
      print(describe(room))
      while True:
          verb, rest = parse(input("> "))
          if verb == "quit":
              print("Bye.")
              break
          elif verb == "look":
              print(describe(room))
          elif verb == "go":
              new = move(room, rest)
              if new == room:
                  print("You cannot go there.")
              else:
                  room = new
                  print(describe(room))
          elif verb == "take":
              print(take(room, bag))
          else:
              print("I do not understand.")
          if room == "garden" and "key" in bag:
              print("You open the gate with the key. You win!")
              break
    experiments:
      - text: "Walk around: `go north`, `go south`, `look`."
        expr: "err is None and asked >= 2 and any(i.lower().startswith('go') for i in inputs)"
      - text: "Try to walk through a wall, for example `go west` in the hall."
        expr: "'You cannot go there.' in lines"
      - text: "Type something that the game does not know, like `dance`."
        expr: "'I do not understand.' in lines"
      - text: "Win the game: find the key and open the gate."
        expr: "'You open the gate with the key. You win!' in lines"

  # 2. THE PLAN --------------------------------------------------------------
  - id: plan
    type: theory
    objective: O1
    title: Data, four functions, one loop
    body: |
      ## The data

      The rooms are a **dictionary**. Each room has a text, its exits (a
      direction and the room it leads to) and maybe an item. The data is
      given in every step: `ROOMS`. To make a bigger game later, you only
      add rooms. The code stays the same.

      ## The plan

      Each step is one small function with a clear job. You test it with
      `assert` before the next step. The last step connects them in a loop
      that reads the commands of the player.

      The checks call your functions with all rooms, so use `ROOMS` and do
      not write the texts of the rooms in your code.
    keys:
      - code: "1  describe(name)"
        means: "The text of a room and its exits."
      - code: "2  parse(command)"
        means: "`\"Go North\"` becomes `(\"go\", \"north\")`."
      - code: "3  move(name, direction)"
        means: "The room in that direction, or the same room."
      - code: "4  take(name, bag)"
        means: "Puts the item of the room in the bag."
      - code: "5  The game loop"
        means: "Read a command, call the right function, stop at the end."

  # 3. STEP 1 ----------------------------------------------------------------
  - id: m1-describe
    type: exercise
    fade: milestone
    carry: true
    objective: O2
    title: "Step 1: describe a room"
    prompt: |
      **Write `describe(name)`.** It gives back the text of the room, then
      its exits in alphabetical order:

      `describe("hall")` gives back
      `"You are in a dark hall. Exits: east, north."`

      Add a test with `assert` for one room, and print `describe("hall")`.
    given: &rooms |
      ROOMS = {
          "hall": {
              "text": "You are in a dark hall.",
              "exits": {"north": "kitchen", "east": "garden"},
              "item": None,
          },
          "kitchen": {
              "text": "You are in a small kitchen.",
              "exits": {"south": "hall"},
              "item": "key",
          },
          "garden": {
              "text": "You are in a garden. A locked gate is in the wall.",
              "exits": {"west": "hall"},
              "item": None,
          },
      }
    starter: |
      # Step 1: describe(name)
    solution: |
      def describe(name):
          room = ROOMS[name]
          exits = ", ".join(sorted(room["exits"]))
          return f"{room['text']} Exits: {exits}."

      assert describe("kitchen") == "You are in a small kitchen. Exits: south."
      print(describe("hall"))
    after: >-
      `sorted` on a dictionary gives its keys in order, and `", ".join`
      puts them in one text. The function reads everything from `ROOMS`, so
      it works for any room you add later.
    checks:
      - &c-describe
        expr: "callable(ns.get('describe')) and all(describe(n) == r['text'] + ' Exits: ' + ', '.join(sorted(r['exits'])) + '.' for n, r in ROOMS.items())"
        pass: "`describe` gives the text and the exits of every room"
        hint: "Read the room from `ROOMS[name]`. The exits are the keys of `room[\"exits\"]`."
        misconceptions:
          - when: "callable(ns.get('describe')) and describe('hall') is None"
            say: "`describe` gives back `None`. Use `return`, not `print`, inside the function."
          - when: "callable(ns.get('describe')) and describe('hall') == 'You are in a dark hall. Exits: north, east.'"
            say: "The exits must be in alphabetical order. Use `sorted(room[\"exits\"])`."
          - when: "callable(ns.get('describe')) and isinstance(describe('hall'), str) and 'kitchen' in describe('hall')"
            say: "Show the directions (`north`), not the rooms they lead to. The directions are the keys of `exits`."
      - expr: "err is None and src.count('assert') >= 1 and describe('hall') in lines"
        pass: "There is a test with `assert`, and the program prints the hall"
        hint: "Add `assert describe(\"kitchen\") == ...` and `print(describe(\"hall\"))`."
    hints:
      - "`room = ROOMS[name]`, then `room[\"text\"]` and `room[\"exits\"]`."
      - "`\", \".join(sorted(room[\"exits\"]))` gives `\"east, north\"`."
      - "Return `f\"{room['text']} Exits: {exits}.\"`."

  # 4. STEP 2 ----------------------------------------------------------------
  - id: m2-parse
    type: exercise
    fade: milestone
    carry: true
    objective: O3
    title: "Step 2: understand a command"
    prompt: |
      Players type commands in many ways: `go north`, `Go North`,
      `  go   north `. **Write `parse(command)`.** It gives back a tuple of
      two texts, in lowercase: the first word, and the rest.

      - `parse("Go North")` gives back `("go", "north")`.
      - `parse("look")` gives back `("look", "")`.
      - `parse("")` gives back `("", "")`. An empty command must not crash.

      Add at least one `assert` for `parse`.
    given: *rooms
    solution: |
      def describe(name):
          room = ROOMS[name]
          exits = ", ".join(sorted(room["exits"]))
          return f"{room['text']} Exits: {exits}."

      def parse(command):
          words = command.lower().split()
          if len(words) == 0:
              return "", ""
          return words[0], " ".join(words[1:])

      assert describe("kitchen") == "You are in a small kitchen. Exits: south."
      assert parse("  Go   NORTH ") == ("go", "north")
      assert parse("") == ("", "")
      print(describe("hall"))
    after: >-
      `split()` without a value cuts at any number of spaces and drops the
      spaces at the ends. That is why `"  go   north "` works. The empty
      command is the case that real players type most: they press Enter.
    checks:
      - *c-describe
      - &c-parse
        expr: "callable(ns.get('parse')) and parse('go north') == ('go', 'north') and parse('  Go   NORTH ') == ('go', 'north') and parse('look') == ('look', '') and parse('') == ('', '') and parse('take the key') == ('take', 'the key')"
        pass: "`parse` gives back the first word and the rest, in lowercase, also for one word or none"
        hint: "Split the command into words. With no words, give back `(\"\", \"\")`."
        misconceptions:
          - when: "callable(ns.get('parse')) and parse('go north') == ['go', 'north']"
            say: "This is a list. Give back a tuple: `return verb, rest`."
          - when: "callable(ns.get('parse')) and parse('Go North') == ('Go', 'North')"
            say: "Make the command lowercase first: `command.lower()`."
          - when: "callable(ns.get('parse')) and parse('go north') == ('go', 'north') and parse('take the key') == ('take', 'the')"
            say: "The rest can have more than one word. Join all words after the first: `\" \".join(words[1:])`."
      - expr: "err is None and src.count('assert') >= 2"
        pass: "There are tests for `describe` and `parse`, and they pass"
        hint: "Add `assert parse(\"Go North\") == (\"go\", \"north\")`."
    hints:
      - "`words = command.lower().split()`."
      - "If `len(words) == 0`, return `\"\", \"\"`."
      - "Else return `words[0], \" \".join(words[1:])`."

  # 5. STEP 3 ----------------------------------------------------------------
  - id: m3-move
    type: exercise
    fade: milestone
    carry: true
    objective: O2
    title: "Step 3: move"
    prompt: |
      **Write `move(name, direction)`.** It gives back the name of the room
      in that direction. If the room has no exit in that direction, it
      gives back the **same** room name: the player stays.

      - `move("hall", "north")` gives back `"kitchen"`.
      - `move("hall", "west")` gives back `"hall"`.

      Add at least one `assert` for `move`.
    given: *rooms
    solution: |
      def describe(name):
          room = ROOMS[name]
          exits = ", ".join(sorted(room["exits"]))
          return f"{room['text']} Exits: {exits}."

      def parse(command):
          words = command.lower().split()
          if len(words) == 0:
              return "", ""
          return words[0], " ".join(words[1:])

      def move(name, direction):
          return ROOMS[name]["exits"].get(direction, name)

      assert describe("kitchen") == "You are in a small kitchen. Exits: south."
      assert parse("  Go   NORTH ") == ("go", "north")
      assert parse("") == ("", "")
      assert move("hall", "north") == "kitchen"
      assert move("hall", "west") == "hall"
      print(describe("hall"))
    after: >-
      `get` with a second value gives a default when the key is missing:
      here, the room where the player already is. No `if` and no
      `KeyError`.
    checks:
      - *c-describe
      - *c-parse
      - &c-move
        expr: "callable(ns.get('move')) and all(move(n, d) == t for n, r in ROOMS.items() for d, t in r['exits'].items()) and move('hall', 'west') == 'hall' and move('garden', 'up') == 'garden' and move('kitchen', '') == 'kitchen'"
        pass: "`move` follows every exit, and stays in the room for a direction without an exit"
        hint: "The exits of a room are a dictionary: direction to room name."
        misconceptions:
          - when: "callable(ns.get('move')) and move('hall', 'north') == 'kitchen' and move('hall', 'west') is None"
            say: "For a direction without an exit, `move` gives back `None`. Give back the same room: `get(direction, name)`."
      - expr: "err is None and src.count('assert') >= 3"
        pass: "There are tests for `describe`, `parse` and `move`, and they pass"
        hint: "Add `assert move(\"hall\", \"west\") == \"hall\"`."
    hints:
      - "`ROOMS[name][\"exits\"]` is a dictionary like `{\"north\": \"kitchen\"}`."
      - "`get(key, default)` gives the default when the key is missing."
      - "`return ROOMS[name][\"exits\"].get(direction, name)`."

  # 6. STEP 4 ----------------------------------------------------------------
  - id: m4-take
    type: exercise
    fade: milestone
    carry: true
    objective: O2
    title: "Step 4: take an item"
    prompt: |
      The player has a `bag`: a list of items. **Write `take(name, bag)`.**

      - If the room has an item that is not in the bag yet, add it to the
        bag and give back `"You take the key."` (with the name of the item).
      - Otherwise, give back `"There is nothing here."`

      Do **not** change `ROOMS`: the bag shows what the player has. Then
      your tests do not change the game.
    given: *rooms
    solution: |
      def describe(name):
          room = ROOMS[name]
          exits = ", ".join(sorted(room["exits"]))
          return f"{room['text']} Exits: {exits}."

      def parse(command):
          words = command.lower().split()
          if len(words) == 0:
              return "", ""
          return words[0], " ".join(words[1:])

      def move(name, direction):
          return ROOMS[name]["exits"].get(direction, name)

      def take(name, bag):
          item = ROOMS[name]["item"]
          if item is None or item in bag:
              return "There is nothing here."
          bag.append(item)
          return f"You take the {item}."

      assert describe("kitchen") == "You are in a small kitchen. Exits: south."
      assert parse("  Go   NORTH ") == ("go", "north")
      assert parse("") == ("", "")
      assert move("hall", "north") == "kitchen"
      assert move("hall", "west") == "hall"
      assert take("kitchen", []) == "You take the key."
      assert take("kitchen", ["key"]) == "There is nothing here."
      print(describe("hall"))
    after: >-
      The bag is a parameter, so a test can use its own new bag (`[]`) and
      the game uses another one. Nothing outside the function changes in
      secret.
    checks:
      - *c-describe
      - *c-parse
      - *c-move
      - &c-take
        expr: "callable(ns.get('take')) and (lambda bag: take('kitchen', bag) == 'You take the key.' and bag == ['key'] and take('kitchen', bag) == 'There is nothing here.' and bag == ['key'] and take('hall', bag) == 'There is nothing here.' and bag == ['key'])([]) and ROOMS['kitchen']['item'] == 'key'"
        pass: "`take` puts the item in the bag one time, and does not change `ROOMS`"
        hint: "Read `ROOMS[name][\"item\"]`. Add it only if it is not `None` and not in the bag yet."
        misconceptions:
          - when: "ROOMS['kitchen']['item'] != 'key'"
            say: "`take` changes `ROOMS`. Then the key is gone for the game, already after your tests. Only add the item to `bag`."
          - when: "callable(ns.get('take')) and (lambda bag: take('kitchen', bag) == 'You take the key.' and take('kitchen', bag) == 'You take the key.')([])"
            say: "The key can be taken two times. Check `item in bag` first."
          - when: "callable(ns.get('take')) and (lambda bag: take('kitchen', bag) is not None and bag == [])([])"
            say: "The message is right, but the bag stays empty. Add the item: `bag.append(item)`."
      - expr: "err is None and src.count('assert') >= 4"
        pass: "There are tests for all four functions, and they pass"
        hint: "Add `assert take(\"kitchen\", []) == \"You take the key.\"`."
    hints:
      - "`item = ROOMS[name][\"item\"]`."
      - "`if item is None or item in bag:` gives the message for nothing."
      - "Otherwise `bag.append(item)` and return `f\"You take the {item}.\"`."

  # 7. STEP 5 ----------------------------------------------------------------
  - id: m5-loop
    type: exercise
    fade: milestone
    carry: true
    objective: O4
    title: "Step 5: the game loop"
    prompt: |
      **Connect the functions in a game.** Delete the line that prints the
      hall; keep your tests.

      - Start in `"hall"` with an empty bag, and print the hall.
      - Repeat: read a command with `input("> ")` and `parse` it.
        - `quit`: print `Bye.` and stop.
        - `look`: print the room again.
        - `go ...`: `move`. If the room is the same, print
          `You cannot go there.`, else print the new room.
        - `take`: print the result of `take`.
        - Anything else: print `I do not understand.`
      - After each command: if the player is in the garden with the key,
        print `You open the gate with the key. You win!` and stop.
    given: *rooms
    solution: |
      def describe(name):
          room = ROOMS[name]
          exits = ", ".join(sorted(room["exits"]))
          return f"{room['text']} Exits: {exits}."

      def parse(command):
          words = command.lower().split()
          if len(words) == 0:
              return "", ""
          return words[0], " ".join(words[1:])

      def move(name, direction):
          return ROOMS[name]["exits"].get(direction, name)

      def take(name, bag):
          item = ROOMS[name]["item"]
          if item is None or item in bag:
              return "There is nothing here."
          bag.append(item)
          return f"You take the {item}."

      assert describe("kitchen") == "You are in a small kitchen. Exits: south."
      assert parse("  Go   NORTH ") == ("go", "north")
      assert parse("") == ("", "")
      assert move("hall", "north") == "kitchen"
      assert move("hall", "west") == "hall"
      assert take("kitchen", []) == "You take the key."
      assert take("kitchen", ["key"]) == "There is nothing here."

      room = "hall"
      bag = []
      print(describe(room))
      while True:
          verb, rest = parse(input("> "))
          if verb == "quit":
              print("Bye.")
              break
          elif verb == "look":
              print(describe(room))
          elif verb == "go":
              new = move(room, rest)
              if new == room:
                  print("You cannot go there.")
              else:
                  room = new
                  print(describe(room))
          elif verb == "take":
              print(take(room, bag))
          else:
              print("I do not understand.")
          if room == "garden" and "key" in bag:
              print("You open the gate with the key. You win!")
              break
    after: >-
      The loop is short, because each job has its own function with a
      name. To add a command, like `inventory`, you add one `elif` and
      maybe one small function. To add a room, you only change `ROOMS`.
    cases:
      - {}
      - label: "the player wins: `go north`, `take`, `go south`, `go east`"
        stdin: ["go north", "take", "go south", "go east"]
      - label: "the player walks into a wall, looks, and quits"
        stdin: ["go west", "look", "quit"]
      - label: "the player types `dance`, `take` in the hall, an empty command, and `quit`"
        stdin: ["dance", "take", "", "quit"]
      - label: "the player goes to the garden without the key and quits"
        stdin: ["go east", "quit"]
      - label: "the player types `GO North`, `Take`, `QUIT`"
        stdin: ["GO North", "Take", "QUIT"]
    checks:
      - expr: "err is None and asked == len(inputs)"
        pass: "The game reads commands until it ends, and stops at the right time"
        hint: "Use `while True:` and `break` for `quit` and for the win."
        misconceptions:
          - when: "err == 'EOFError' or (err is None and asked > len(inputs))"
            say: "The game does not stop. After `quit` and after the win, end the loop with `break`."
          - when: "err is None and asked < len(inputs)"
            say: "The game stops too early. Read commands in a loop until `quit` or the win."
          - when: "err == 'NameError'"
            say: "A name does not exist yet. Set `room = \"hall\"` and `bag = []` before the loop."
      - expr: "lines[:1] == [describe('hall')]"
        pass: "The game starts by printing the hall"
        hint: "Before the loop: `print(describe(room))`. Delete other prints of the earlier steps."
      - expr: "[i.strip().lower() for i in inputs][-1:] != ['quit'] or lines[-1] == 'Bye.'"
        pass: "`quit` prints `Bye.` and ends the game"
        hint: "`if verb == \"quit\":` then `print(\"Bye.\")` and `break`."
      - expr: "inputs[:1] != ['go west'] or 'You cannot go there.' in lines"
        pass: "A wall says `You cannot go there.`"
        hint: "If `move` gives back the same room, the player cannot go there."
      - expr: "inputs[:1] != ['dance'] or ('I do not understand.' in lines and 'There is nothing here.' in lines)"
        pass: "An unknown or empty command says `I do not understand.`; `take` without an item says so"
        hint: "The last `else` of the commands prints `I do not understand.`"
      - expr: "inputs != ['go north', 'take', 'go south', 'go east'] or (lines[-1] == 'You open the gate with the key. You win!' and 'You take the key.' in lines)"
        pass: "With the key, the garden gate opens: the player wins"
        hint: "After each command: `if room == \"garden\" and \"key\" in bag:`."
      - expr: "inputs != ['go east', 'quit'] or 'You win!' not in out"
        pass: "Without the key, the garden is not a win"
        hint: "Check both: the room is `garden` **and** `\"key\"` is in the bag."
      - expr: "inputs != ['GO North', 'Take', 'QUIT'] or ('You take the key.' in lines and lines[-1] == 'Bye.')"
        pass: "Commands work in capital letters, too"
        hint: "Use `parse` on every command: it makes the command lowercase."
      - expr: "called('describe') and called('parse') and called('move') and called('take')"
        pass: "The game uses your four functions"
        hint: "Call `parse`, `move`, `take` and `describe` in the loop, instead of writing their work again."
    hints:
      - "Before the loop: `room = \"hall\"`, `bag = []`, `print(describe(room))`."
      - "In `while True:`, first `verb, rest = parse(input(\"> \"))`, then `if verb == \"quit\": ... elif ...`."
      - "At the end of the loop body: `if room == \"garden\" and \"key\" in bag:` print the win and `break`."

  # 8. LOOK BACK -------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O1
    title: Look back at your work
    items:
      - kind: mcq
        id: q-room
        objective: O2
        prompt: "You want a fourth room, a cellar under the kitchen. What do you change?"
        options:
          - text: "Only `ROOMS`: a new room, and an exit `down` in the kitchen"
            correct: true
            why: "The functions read everything from the data. They work for any room."
          - text: "`describe`, `move` and the loop"
            why: "None of them names a room. Only the data and the start room are in the code."
          - text: "A new function for each room"
            why: "One function works for all rooms, because the room is a parameter."
      - kind: mcq
        id: q-tests
        objective: O1
        prompt: "Why did `take` not change `ROOMS`?"
        options:
          - text: "So a test can call `take` without changing the game"
            correct: true
            why: "Your tests ran before the game. If `take` changed `ROOMS`, the key would be gone."
          - text: "Because dictionaries cannot be changed"
            why: "They can. It was a choice, so tests and the game stay apart."
          - text: "Because `ROOMS` is written in capital letters"
            why: "Capital letters only tell a reader that this is fixed data. Python does not stop a change."
      - kind: predict
        id: q-parse
        objective: O3
        code: |
          words = "  Open THE  door ".lower().split()
          print(words[0], "|", " ".join(words[1:]))
        explain: "`split()` drops all extra spaces, so the words are `open`, `the`, `door`. The rest is joined with one space."
      - kind: mcq
        id: q-break
        objective: O4
        prompt: "A player types `quit`, but the game asks for another command. What is missing?"
        options:
          - text: "`break` after `print(\"Bye.\")`"
            correct: true
            why: "`while True:` repeats until a `break` runs."
          - text: "A `return` in `parse`"
            why: "`parse` gives back its value. The loop needs `break` to stop."
          - text: "`quit` must be in capital letters"
            why: "`parse` makes it lowercase, so `quit` and `QUIT` are the same."
      - kind: predict
        id: q-get
        objective: O2
        code: |
          exits = {"north": "kitchen"}
          print(exits.get("north", "hall"))
          print(exits.get("west", "hall"))
        explain: "`north` is a key, so `get` gives its value. `west` is not, so `get` gives the default `hall`."

