id: files
order: 30
title: Files and paths
summary: Read and write text files with pathlib, so a program can keep data after it ends.
minutes: 35
outcomes: [A4, A6]

objectives:
  - id: O1
    text: Read a text file with pathlib, as one text or as a list of lines
  - id: O2
    text: Write a new file, replace a file, and add lines to the end of a file
  - id: O3
    text: Build paths, and check that a file exists before you read it
  - id: O4
    text: Work through a file line by line, and skip empty lines

steps:
  # 1. DEMO ------------------------------------------------------------------
  - id: shopping
    type: demo
    visual: none
    objective: O2
    title: A program with a file
    intro: |
      Until now, all values were gone when a program ended. A **file**
      keeps them. Under the output you see the folder of the program, and
      the file `shopping.txt` in it.

      Press **Run**: the program reads the list, then adds one line. In
      this course each run starts with the same folder, so you can try
      again. On your own computer, the file stays changed.
    files:
      shopping.txt: |
        milk
        bread
    code: |
      from pathlib import Path

      path = Path("shopping.txt")
      for item in path.read_text().splitlines():
          print("Buy:", item)

      with open(path, "a") as f:
          f.write("eggs\n")
    experiments:
      - text: "Run the code. Look at the file under the output: it is marked **changed**."
        expr: "files.get('shopping.txt', '').endswith('eggs\\n')"
      - text: "Add a second item, for example `f.write(\"rice\\n\")` under the first `write`."
        expr: "files.get('shopping.txt', '').count('\\n') >= 4"
      - text: "Make a new file: add `Path(\"done.txt\").write_text(\"milk\\n\")` at the end."
        expr: "files.get('done.txt') == 'milk\\n'"
      - text: "Read a file that is not there: change `\"shopping.txt\"` to `\"shoping.txt\"`. Read the message."
        expr: "err == 'FileNotFoundError'"
    investigate:
      - kind: spot
        id: i-append
        prompt: "Which line opens the file to add to it, and keeps what is there?"
        code: |
          from pathlib import Path

          path = Path("shopping.txt")
          for item in path.read_text().splitlines():
              print("Buy:", item)

          with open(path, "a") as f:
              f.write("eggs\n")
        line: 7
        wrong:
          - line: 3
            say: "This line only makes a `Path` object. It opens nothing."
          - line: 4
            say: "`read_text()` reads the file. It does not change it."
        explain: >-
          The mode `"a"` (append) writes at the end of the file. The lines
          that were there stay.
      - kind: mcq
        id: i-write
        prompt: "Line 7 uses `\"w\"` instead of `\"a\"`. What is in the file after the run?"
        options:
          - text: "Only `eggs`: `\"w\"` empties the file first"
            correct: true
            why: "Mode `\"w\"` starts a new, empty file. Use it only when the old text may go."
          - text: "The old list, and `eggs` at the end"
            why: "That is mode `\"a\"`."
          - text: "The old list, without `eggs`"
            why: "`write` still writes `eggs`, but into a file that was made empty."

  # 2. THEORY ----------------------------------------------------------------
  - id: read
    type: theory
    objective: O1
    title: Paths and reading
    body: |
      ## A path

      ```
      from pathlib import Path

      path = Path("scores.txt")
      folder = Path("data")
      inside = folder / "scores.txt"     # data/scores.txt
      ```

      `Path("scores.txt")` is a file in the **working folder**: the folder
      where the program runs. `/` joins parts of a path, on Windows, macOS
      and Linux.

      ## Read

      - `path.read_text()` gives the whole file as one text.
      - `.splitlines()` cuts it into a list of lines, **without** the `\n`
        at the end of each line.
      - `path.exists()` is `True` if the file is there.

      A path also knows its parts: `inside.name` is `"scores.txt"`,
      `inside.suffix` is `".txt"`, `inside.stem` is `"scores"`.
    keys:
      - code: 'Path("data") / "scores.txt"'
        means: "A path to a file inside the folder `data`."
      - code: "path.read_text().splitlines()"
        means: "The lines of the file, as a list of texts."
      - code: "path.exists()"
        means: "Is there a file or folder at this path?"

  # 3. PREDICT ---------------------------------------------------------------
  - id: predict-lines
    type: predict
    objective: O1
    title: What is in the file?
    item:
      kind: predict
      id: p-lines
      prompt: |
        The file `scores.txt` has two lines: `Ana 7` and `Ben 9`, each with
        a line break at the end.

        **What does this program print?**
      files:
        scores.txt: |
          Ana 7
          Ben 9
      code: |
        from pathlib import Path

        lines = Path("scores.txt").read_text().splitlines()
        print(len(lines))
        print(lines[1])
        print(lines[0].split()[1])
      explain: >-
        `splitlines` gives one text for each line, without the line break:
        two lines. Position 1 is the second line. The last line splits
        `Ana 7` into words and takes the second one: the text `7`.
      misconceptions:
        - answer: "3\nBen 9\n7"
          say: "The line break at the end of the last line does not make a third line. `splitlines` gives two lines."
        - answer: "2\nAna 7\n7"
          say: "Positions start at 0. `lines[1]` is the second line."

  # 4. THEORY ----------------------------------------------------------------
  - id: write
    type: theory
    objective: O2
    title: Writing
    body: |
      ## Write a whole file

      ```
      path.write_text("milk\nbread\n")
      ```

      `write_text` makes the file if it is not there. If it is there, it
      **replaces** all the old text.

      ## Add to the end

      ```
      with open(path, "a") as f:
          f.write("eggs\n")
      ```

      `open(path, "a")` opens the file to **append**: new text goes to the
      end. `with` closes the file when its block ends. `write` does not
      add a line break: write `\n` yourself.

      Many lines at once: `path.write_text("\n".join(items) + "\n")`.

      Python 3.15 and newer read and write text as UTF-8. On an older
      Python on Windows, give it yourself: `read_text(encoding="utf-8")`.
    keys:
      - code: "path.write_text(text)"
        means: "The file has exactly this text now. The old text is gone."
      - code: 'open(path, "a")'
        means: "Open to add at the end. `\"w\"` would replace."
      - code: 'f.write("eggs\n")'
        means: "Writes the text, and `\n` ends the line."

  # 5. DRILL -----------------------------------------------------------------
  - id: drill
    type: drill
    objective: O2
    title: Read, write, append
    items:
      - kind: predict
        id: d-replace
        objective: O2
        code: |
          from pathlib import Path

          path = Path("note.txt")
          path.write_text("first\n")
          path.write_text("second\n")
          print(path.read_text())
        explain: "`write_text` replaces the whole file. After the second call, only `second` is in it. (`print` adds one more empty line, because the text already ends with a line break.)"
        misconceptions:
          - answer: "first\nsecond"
            say: "`write_text` does not add. It replaces the whole text of the file."
      - kind: predict
        id: d-newline
        objective: O2
        files:
          list.txt: "milk\n"
        code: |
          from pathlib import Path

          with open("list.txt", "a") as f:
              f.write("eggs")
              f.write("rice")
          print(Path("list.txt").read_text())
        explain: "`write` does not end the line. `eggs` and `rice` are on one line. Write `\"eggs\\n\"` to get a line for each."
      - kind: diagnose
        id: d-missing
        objective: O3
        mode: read
        files:
          notes.txt: "Buy stamps\n"
        code: |
          from pathlib import Path

          print(Path("note.txt").read_text())
        explain: "The folder has `notes.txt`, but the code reads `note.txt`. The message names the path that Python looked for."
        fix:
          - text: "Use the right name: `Path(\"notes.txt\")`"
            correct: true
            why: "The name must match the file exactly."
          - text: "Use `write_text` instead of `read_text`"
            why: "That would make a new, wrong file. The code wants to read the notes."
          - text: "Add `import os`"
            why: "The module is not the problem. The file name is wrong."
      - kind: mcq
        id: d-mode
        objective: O2
        prompt: "A program keeps a log. Each run must add one line at the end of `log.txt`. Which is right?"
        options:
          - text: "`with open(\"log.txt\", \"a\") as f:` and `f.write(line + \"\\n\")`"
            correct: true
            why: "`\"a\"` adds at the end. The old lines stay."
          - text: "`Path(\"log.txt\").write_text(line + \"\\n\")`"
            why: "This replaces the file: only the last line would stay."
          - text: "`Path(\"log.txt\").read_text(line)`"
            why: "`read_text` reads. It does not write."
      - kind: predict
        id: d-parts
        objective: O3
        code: |
          from pathlib import Path

          path = Path("reports") / "2026" / "march.csv"
          print(path.name, path.stem, path.suffix)
          print(path.parent.name)
        explain: "`name` is the last part, `stem` is the name without the ending, `suffix` is the ending. `parent` is the folder that holds the file, and its `name` is `2026`."

  # 6. WORKED EXAMPLE --------------------------------------------------------
  - id: example-total
    type: worked
    objective: O4
    title: Line by line
    problem: |
      `prices.txt` has one price on each line. Some lines are empty, and
      some have spaces. Compute the total.
    lines:
      - goal: "Get the data"
        code: |
          from pathlib import Path

          lines = Path("prices.txt").read_text().splitlines()
        note: "Read all lines. A file from a person is never perfectly clean."
      - goal: "Clean and compute"
        code: |
          total = 0
          for line in lines:
              line = line.strip()
              if line == "":
                  continue
              total = total + float(line)
        note: "`strip` takes away the spaces. An empty line is skipped with `continue`: `float(\"\")` would be a `ValueError`."
      - goal: "Show the result"
        code: 'print(f"Total: {total:.2f}")'
        note: "The text from a file is always text. `float` turns it into a number."
    check:
      kind: mcq
      id: w-total
      prompt: "What happens without the `if line == \"\":` part, when the file has an empty line?"
      options:
        - text: "`float(\"\")` stops the program with a `ValueError`"
          correct: true
          why: "An empty text is not a number. Skip empty lines first."
        - text: "The empty line counts as 0"
          why: "`float` does not accept an empty text."
        - text: "Nothing changes"
          why: "The empty line goes into `float` and stops the program."

  # 7. EXERCISE: completion --------------------------------------------------
  - id: ex-load
    type: exercise
    fade: completion
    objective: O3
    title: A file that may not exist
    prompt: |
      `load_notes(name)` gives back the lines of a file. The first time a
      program runs, the file is not there yet: then it must give back an
      empty list, not stop with an error.

      **Replace `___`.** The check runs with the file and without it.
    files:
      notes.txt: |
        Buy stamps
        Call Ana
    starter: |
      from pathlib import Path

      def load_notes(name):
          path = Path(name)
          if ___:
              return []
          return path.read_text().splitlines()

      print(load_notes("notes.txt"))
    solution: |
      from pathlib import Path

      def load_notes(name):
          path = Path(name)
          if not path.exists():
              return []
          return path.read_text().splitlines()

      print(load_notes("notes.txt"))
    after: >-
      A program that keeps data in a file must work on the first day,
      when there is no file yet. `exists()` checks that before reading.
    cases:
      - {}
      - label: "there is no file `notes.txt` yet"
        files: {}
    checks:
      - expr: "callable(ns.get('load_notes')) and load_notes('notes.txt') == start_files.get('notes.txt', '').splitlines() and load_notes('nothing.txt') == []"
        pass: "`load_notes` gives the lines, or `[]` when there is no file"
        hint: "The condition is True when the file is **not** there."
        misconceptions:
          - when: "err == 'FileNotFoundError' or (callable(ns.get('load_notes')) and load_notes('notes.txt') == [])"
            say: "Check the condition: return `[]` only when the file does **not** exist: `not path.exists()`."
      - expr: "err is None"
        pass: "The program runs with the file and without it"
        hint: "Without the file, `read_text` must not run."
    hints:
      - "`path.exists()` is True when the file is there."
      - "You need the opposite: True when the file is not there."
      - "Write `not path.exists()`."

  # 8. EXERCISE: debug -------------------------------------------------------
  - id: ex-log
    type: exercise
    fade: debug
    objective: O2
    title: A log that forgets
    prompt: |
      `log(message)` must add one line to `log.txt` for each call. After
      the two calls, the file must have two lines.

      **Run it** and look at `log.txt` under the output. Then fix `log`.
    starter: |
      from pathlib import Path

      def log(message):
          Path("log.txt").write_text(message + "\n")

      log("start")
      log("stop")
      print(Path("log.txt").read_text())
    solution: |
      from pathlib import Path

      def log(message):
          with open("log.txt", "a") as f:
              f.write(message + "\n")

      log("start")
      log("stop")
      print(Path("log.txt").read_text())
    after: >-
      `write_text` replaced the file at each call, so only the last line
      stayed. Append mode keeps the old lines. The check also ran with an
      old log: its line stayed at the top.
    cases:
      - {}
      - label: "`log.txt` already has the line `old`"
        files:
          log.txt: "old\n"
    checks:
      - expr: "files.get('log.txt') == start_files.get('log.txt', '') + 'start\\nstop\\n'"
        pass: "Each call adds one line at the end, and old lines stay"
        hint: "Look at the file after the run. Which lines are missing?"
        misconceptions:
          - when: "files.get('log.txt') == 'stop\\n'"
            say: "Only the last line is there. `write_text` replaces the whole file at each call: open the file with `\"a\"` to add."
          - when: "(files.get('log.txt') or '').endswith('startstop')"
            say: "The lines are glued together. `write` does not add a line break: write `message + \"\\n\"`."
      - expr: "err is None and callable(ns.get('log'))"
        pass: "The program runs"
        hint: "Keep the function `log` and the two calls."
    hints:
      - "`write_text` replaces the file. What adds to the end?"
      - "`open(\"log.txt\", \"a\")` opens it to append."
      - "In `log`: `with open(\"log.txt\", \"a\") as f:` and `f.write(message + \"\\n\")`."

  # 9. EXERCISE: independent -------------------------------------------------
  - id: ex-passed
    type: exercise
    fade: independent
    objective: O4
    title: Read one file, write another
    prompt: |
      `scores.txt` has one student on each line: a name and points, like
      `Ana 72`. Some lines are empty.

      **Write `passed.txt`**: the names of the students with 50 points or
      more, one name on each line, in the same order. Then print how many
      passed, like `2 passed`.

      Every line of `passed.txt` ends with a line break. If nobody passed,
      `passed.txt` is an empty file.
    files:
      scores.txt: |
        Ana 72
        Ben 41

        Cleo 50
    starter: |
      from pathlib import Path

    solution: |
      from pathlib import Path

      def passed_names(text):
          names = []
          for line in text.splitlines():
              parts = line.split()
              if len(parts) != 2:
                  continue
              name, points = parts
              if int(points) >= 50:
                  names.append(name)
          return names

      names = passed_names(Path("scores.txt").read_text())
      Path("passed.txt").write_text("".join(name + "\n" for name in names))
      print(f"{len(names)} passed")
    after: >-
      Reading, working and writing are three parts. The work is a function
      on a text (`passed_names`), so you could test it with `assert`
      without any file.
    cases:
      - {}
      - label: "`scores.txt` has other students, and spaces around a line"
        files:
          scores.txt: "  Dan 90  \nEve 12\nFay 49\nGus 100\n"
      - label: "nobody passed"
        files:
          scores.txt: "Hal 3\n\nIda 49\n"
    checks:
      - expr: "files.get('passed.txt') == ''.join(l.split()[0] + '\\n' for l in start_files['scores.txt'].splitlines() if len(l.split()) == 2 and int(l.split()[1]) >= 50)"
        pass: "`passed.txt` has the names with 50 points or more, one on each line"
        hint: "Split each line into a name and points. Skip lines without two parts."
        misconceptions:
          - when: "err == 'ValueError' or err == 'IndexError'"
            say: "An empty line has no name and no points. Skip lines that do not have two parts."
          - when: "'passed.txt' not in files"
            say: "There is no `passed.txt` in the folder. Write it with `Path(\"passed.txt\").write_text(...)`."
          - when: "'Cleo' not in (files.get('passed.txt') or '') and 'Cleo 50' in start_files['scores.txt']"
            say: "Cleo has exactly 50 points, and 50 passes. Use `>= 50`."
          - when: "(files.get('passed.txt') or '') != '' and not (files.get('passed.txt') or '').endswith('\\n')"
            say: "The last line has no line break. Every line ends with `\\n`."
      - expr: "err is None and f\"{sum(1 for l in start_files['scores.txt'].splitlines() if len(l.split()) == 2 and int(l.split()[1]) >= 50)} passed\" in lines"
        pass: "It prints how many passed"
        hint: "Count the names and print `f\"{len(names)} passed\"`."
    hints:
      - "Read the lines: `Path(\"scores.txt\").read_text().splitlines()`."
      - "For each line: `parts = line.split()`, skip it if `len(parts) != 2`, then compare `int(parts[1]) >= 50`."
      - "Write all names at once: `\"\".join(name + \"\\n\" for name in names)`."

  # 10. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: mcq
        id: q-write
        objective: O2
        prompt: "`notes.txt` has 10 lines. What does `Path(\"notes.txt\").write_text(\"hi\\n\")` do?"
        options:
          - text: "The file has only `hi` now. The 10 lines are gone"
            correct: true
            why: "`write_text` replaces all the text."
          - text: "It adds `hi` as line 11"
            why: "That is append mode, `open(path, \"a\")`."
          - text: "It stops with an error, because the file exists"
            why: "`write_text` replaces an existing file without asking."
      - kind: predict
        id: q-strip
        objective: O4
        files:
          names.txt: "  Ana \n\nBen\n"
        code: |
          from pathlib import Path

          names = []
          for line in Path("names.txt").read_text().splitlines():
              if line.strip() != "":
                  names.append(line.strip())
          print(names)
        explain: "The empty line is skipped. `strip` takes away the spaces around `Ana`."
      - kind: diagnose
        id: q-float
        objective: O4
        mode: predict
        files:
          prices.txt: "2.50\n\n1.25\n"
        code: |
          from pathlib import Path

          total = 0
          for line in Path("prices.txt").read_text().splitlines():
              total = total + float(line)
          print(total)
        explain: "The second line is empty, and `float(\"\")` is not a number."
      - kind: mcq
        id: q-exists
        objective: O3
        prompt: "Why does a program check `path.exists()` before `path.read_text()`?"
        options:
          - text: "On the first run there may be no file yet, and `read_text` would stop with `FileNotFoundError`"
            correct: true
            why: "Then the program can start with empty data instead."
          - text: "`read_text` is faster after `exists`"
            why: "Speed is not the reason. A missing file is."
          - text: "`exists` opens the file"
            why: "`exists` only checks. It does not open or read."
      - kind: predict
        id: q-join
        objective: O2
        code: |
          items = ["tea", "jam"]
          text = "\n".join(items) + "\n"
          print(text.count("\n"), len(text.splitlines()))
        explain: "`join` puts one `\\n` between the items, and one more is added at the end: 2 line breaks, 2 lines."

  # 11. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-append
    objective: O2
    prompt: "Which mode of `open` adds text to the end of a file?"
    options:
      - text: "`\"a\"`"
        correct: true
        why: "`a` for append: the old text stays."
      - text: "`\"w\"`"
        why: "`w` (write) replaces the whole file."
      - text: "`\"r\"`"
        why: "`r` (read) only reads."
  - kind: predict
    id: r-splitlines
    objective: O1
    code: |
      text = "a\nb\n"
      print(text.splitlines())
      print(text.split("\n"))
    explain: "`splitlines` gives the lines. `split(\"\\n\")` also gives an empty text after the last line break. Use `splitlines` for files."
  - kind: predict
    id: r-path
    objective: O3
    code: |
      from pathlib import Path

      p = Path("data") / "week1.txt"
      print(p.name, p.suffix)
    explain: "`name` is the last part of the path, and `suffix` its ending."
  - kind: diagnose
    id: r-missing
    objective: O3
    mode: predict
    code: |
      from pathlib import Path

      print(Path("todo.txt").read_text())
    explain: "The folder is empty: there is no `todo.txt`."
  - kind: mcq
    id: r-newline
    objective: O2
    prompt: "`f.write(\"a\")` then `f.write(\"b\")`. How many lines does the file get?"
    options:
      - text: "One line: `ab`"
        correct: true
        why: "`write` does not add a line break."
      - text: "Two lines"
        why: "Only `\\n` makes a new line."
      - text: "None: `write` needs `\\n`"
        why: "`write` writes any text. Without `\\n`, all on one line."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-notes
    type: exercise
    fade: completion
    objective: O4
    title: Count the notes
    prompt: |
      `notes.txt` (see the files) has notes and some empty lines.
      **Replace the two `___`**: go through the lines, and count only the
      lines that are not empty.

      ```text
      3 notes
      ```
    files:
      notes.txt: |
        buy milk

        call Ana


        water the plants
    starter: |
      from pathlib import Path

      lines = Path("notes.txt").read_text().splitlines()
      count = 0
      for line in lines:
          if ___:
              count = ___
      print(f"{count} notes")
    solution: |
      from pathlib import Path

      lines = Path("notes.txt").read_text().splitlines()
      count = 0
      for line in lines:
          if line.strip():
              count = count + 1
      print(f"{count} notes")
    after: >-
      `line.strip()` is an empty text for an empty line (also one with only
      spaces), and an empty text counts as False.
    cases:
      - {}
      - label: "another notes.txt"
        files:
          notes.txt: "a\n   \nb\nc\nd\n"
    checks:
      - expr: "count == len([l for l in files['notes.txt'].splitlines() if l.strip()])"
        pass: "It counts the lines that are not empty"
        hint: "`if line.strip():` and `count = count + 1`."
        misconceptions:
          - when: "ns.get('count') == len(files['notes.txt'].splitlines())"
            say: "The empty lines are counted too. Test `line.strip()` first."
      - expr: "lines[-1:] == [f'{count} notes']"
        pass: "It prints the count"
        hint: "Keep the last line."
    hints:
      - "An empty line is `\"\"` after `strip()`."
      - "`if line.strip():` is True only for a line with text."
      - "`count = count + 1`."
  - id: x-write-list
    type: exercise
    fade: independent
    objective: O2
    title: Save the shopping list
    prompt: |
      **Write each item of `items` into `list.txt`, one per line**, then
      print the file.

      ```text
      bread
      eggs
      tea
      ```
    starter: |
      from pathlib import Path

      items = ["bread", "eggs", "tea"]
      # Write list.txt, then print it.
    solution: |
      from pathlib import Path

      items = ["bread", "eggs", "tea"]
      Path("list.txt").write_text("\n".join(items) + "\n")
      print(Path("list.txt").read_text())
    after: >-
      `"\n".join(items)` puts a line break between the items, and the last
      `"\n"` ends the last line. A file ends with a line break by custom.
    cases:
      - {}
      - label: "other items"
        set: { items: ["soap"] }
    checks:
      - expr: "files.get('list.txt') == '\\n'.join(items) + '\\n'"
        pass: "list.txt has one item per line"
        hint: "`Path(\"list.txt\").write_text(\"\\n\".join(items) + \"\\n\")`."
        misconceptions:
          - when: "files.get('list.txt') == ''.join(items)"
            say: "The items are glued together. Put a line break between them: `\"\\n\".join(items)`."
          - when: "(files.get('list.txt') or '').strip() == items[-1]"
            say: "Only the last item is there: each write replaced the file. Write all items in one text, or open the file with `\"a\"`."
      - expr: "lines[:len(items)] == items"
        pass: "It prints the file"
        hint: "`print(Path(\"list.txt\").read_text())`."
    hints:
      - "One text with all lines: `\"\\n\".join(items)`."
      - "`Path(\"list.txt\").write_text(...)` writes it."
      - "Then `print(Path(\"list.txt\").read_text())`."
