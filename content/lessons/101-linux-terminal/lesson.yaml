id: linux-terminal
order: 101
title: The terminal
summary: Talk to a computer with words. Read the prompt, see where you are, and move between folders.
minutes: 25
outcomes: []

objectives:
  - id: O1
    text: Read the prompt - who you are, which computer, and where you are
  - id: O2
    text: Show where you are and what is there, with pwd and ls
  - id: O3
    text: Move between folders with cd and paths - absolute, relative, ~ and ..

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: shell
    type: theory
    objective: O1
    title: A computer you talk to
    body: |
      **Linux** is an operating system: the base program of a computer, like
      Windows or macOS. Most servers and every Raspberry Pi run it.

      A Raspberry Pi, a web server, a robot: many computers have no screen
      and no mouse. You talk to them in a **terminal**: you type a command,
      press Enter, and the computer answers with text. The program that
      reads your commands is the **shell** (on most Linux computers it is
      called `bash`).

      Before each command, the shell shows a **prompt**:

      ```text
      pi@raspberrypi:~ $
      ```

      - `pi` is your user name.
      - `raspberrypi` is the name of the computer.
      - `~` is where you are now: `~` means your **home directory**, here
        `/home/pi`. A directory is the same as a folder.
      - `$` means: the shell waits for you.

      A command is a name, maybe with **options** (they start with `-`) and
      **arguments** (what the command works on):

      ```text
      ls -l photos
      ```

      `ls` is the command, `-l` an option ("long list"), `photos` the
      argument.

      ## Ask for help

      You never need to remember every option:

      - `man ls` shows the manual of `ls`. Many commands also print a short
        help with `--help`: `ls --help`.
      - A long text opens in **less**: Space shows the next screen, `b` goes
        back, `/word` searches, and **q** quits. `less notes.txt` reads any long
        file the same way.
    keys:
      - code: "pi@raspberrypi:~ $"
        means: "User `pi`, computer `raspberrypi`, in the home directory."
      - code: "~"
        means: "Your home directory: `/home/pi`."
      - code: "ls -l photos"
        means: "Command, option, argument."
      - code: "man ls"
        means: "The manual of a command. Quit with q."
      - code: "ls --help"
        means: "A short help of most commands."

  # 2. TERMINAL --------------------------------------------------------------
  - id: first
    type: terminal
    objective: O2
    title: Your first commands
    prompt: |
      This terminal is a pretend Linux inside ZeroPy, like a Raspberry Pi.
      Nothing on your own computer changes. **Type each command, then press
      Enter.**

      1. `pwd` (print working directory): where are you?
      2. `ls` (list): what is in this directory?
      3. `whoami`: which user are you?

      The picture on the right shows your files and folders. It changes
      with your commands.
    start:
      files:
        notes.txt: "Buy a power supply for the Pi.\n"
        photos/cat.jpg: ""
        photos/pi.jpg: ""
        music/song.mp3: ""
      dirs: [documents]
    checks:
      - expr: "ran('pwd')"
        pass: "You printed the working directory with `pwd`"
        hint: "Type `pwd` and press Enter."
      - expr: "ran('ls')"
        pass: "You listed the directory with `ls`"
        hint: "Type `ls` and press Enter."
      - expr: "ran('whoami')"
        pass: "You asked who you are with `whoami`"
        hint: "Type `whoami` and press Enter."
    hints:
      - "Commands are short and lowercase. Type exactly `pwd`, then Enter."
      - "Then `ls`, then `whoami`, each followed by Enter."
    solution: ["pwd", "ls", "whoami"]
    after: >-
      `pwd` answers `/home/pi`: the full name of your home directory. `ls`
      shows two kinds of things: folders (`photos`, `music`, `documents`)
      and files (`notes.txt`).

  # 2b. TERMINAL -------------------------------------------------------------
  - id: help
    type: terminal
    objective: O2
    title: Ask the terminal
    prompt: |
      **Find out what the options of `ls` do, without the internet.**

      1. Read the manual of `ls` with `man`.
      2. Print the short help of `ls` with `--help`.
      3. Read the long file `notes.txt` with `less`.
    start:
      files:
        notes.txt: |
          Buy a power supply for the Pi.
          Order two LEDs and a breadboard.
          Read the manual of ls.
    checks:
      - expr: "any(h.startswith('man') for h in history)"
        pass: "You read a manual with man"
        hint: "`man ls`. In a real terminal, quit with q."
      - expr: "any('--help' in h for h in history)"
        pass: "You printed a short help with --help"
        hint: "`ls --help`."
      - expr: "any(h.startswith('less') for h in history)"
        pass: "You read a file with less"
        hint: "`less notes.txt`."
    hints:
      - "`man` and the name of the command."
      - "`--help` comes after the command: `ls --help`."
      - "`man ls`, `ls --help`, `less notes.txt`."
    solution: ["man ls", "ls --help", "less notes.txt"]
    after: >-
      `man` and `--help` are always there, also on a server without a
      browser. Read them before you search the web.

  # 3. THEORY ----------------------------------------------------------------
  - id: paths
    type: theory
    objective: O3
    title: Paths
    body: |
      `cd` (change directory) moves you to another directory. You tell it
      where with a **path**:

      - An **absolute** path starts with `/`, the top of everything:
        `/home/pi/photos`. It works from anywhere.
      - A **relative** path starts from where you are: `photos`, or
        `photos/2024`.
      - `~` is your home directory: `cd ~/music` works from anywhere.
      - `..` is the directory one level up. `cd ..` goes up one level,
        `cd ../..` goes up two.
      - `cd` alone takes you home.

      ## Two keys that save time

      - **Tab** completes a name: type `cd pho` and press Tab.
      - **Up** brings back the last command.

      `ls` also takes a path: `ls photos` lists that directory without going
      there.
    keys:
      - code: "cd photos/2024"
        means: "A relative path: from here, into photos, then 2024."
      - code: "cd /home/pi/music"
        means: "An absolute path: from the top."
      - code: "cd .."
        means: "One level up."
      - code: "cd"
        means: "Home (`~`)."

  # 4. TERMINAL --------------------------------------------------------------
  - id: walk
    type: terminal
    objective: O3
    title: Find your way
    prompt: |
      **Move through the folders.**

      1. Go into `photos/2024` (one `cd` is enough).
      2. Look what is there with `ls`.
      3. Go up two levels with `..`.
      4. End in `documents/work`.

      Watch the line "you are here" in the picture.
    start:
      files:
        photos/2024/beach.jpg: ""
        photos/2024/mountain.jpg: ""
        documents/work/plan.txt: "Step 1: buy the parts\n"
        documents/letter.txt: ""
    checks:
      - expr: "any(h.startswith('cd') and '2024' in h for h in history)"
        pass: "You went into `photos/2024`"
        hint: "`cd photos/2024`."
      - expr: "ran('ls')"
        pass: "You looked with `ls`"
        hint: "Type `ls` when you are in `photos/2024`."
      - expr: "any(h.startswith('cd') and '..' in h for h in history)"
        pass: "You went up with `..`"
        hint: "`cd ../..` goes up two levels at once. `cd ..` twice works too."
      - expr: "cwd == '~/documents/work'"
        pass: "You end in `~/documents/work`"
        hint: "From home: `cd documents/work`."
    hints:
      - "Start with `cd photos/2024`, then `ls`."
      - "`cd ../..` takes you from `~/photos/2024` back home."
      - "Then `cd documents/work`. The prompt shows `~/documents/work`."
    solution: ["cd photos/2024", "ls", "cd ../..", "cd documents/work"]
    after: >-
      The prompt always shows where you are, so you never need to guess. If
      you are lost: `pwd`, or `cd` alone to go home.

  # 5. TERMINAL --------------------------------------------------------------
  - id: lost
    type: terminal
    objective: O3
    title: Lost in the folders
    prompt: |
      You start deep inside the folders: look at the prompt.

      1. **Go home with one short command.**
      2. Print the full path of your home directory.
      3. List the folder `music` **without going into it**.
    start:
      cwd: projects/robot/code/old
      files:
        projects/robot/code/old/test.py: "print('old')\n"
        music/song.mp3: ""
        music/podcast.mp3: ""
    checks:
      - expr: "cwd == '~' and any(h.strip() in ('cd', 'cd ~', 'cd ~/', 'cd /home/pi', 'cd $HOME') for h in history)"
        pass: "You went home with one command"
        hint: "`cd` alone takes you home. `cd ~` too."
      - expr: "ran('pwd')"
        pass: "You printed the full path"
        hint: "`pwd`: it shows `/home/pi`."
      - expr: "any(h.startswith('ls') and 'music' in h for h in history) and cwd == '~'"
        pass: "You listed `music` and stayed home"
        hint: "`ls music`: `ls` takes a path too."
    hints:
      - "One command takes you home from anywhere."
      - "It is `cd`, with nothing after it. Then `pwd`."
      - "`ls music` lists that folder, and you stay where you are."
    solution: ["cd", "pwd", "ls music"]
    after: >-
      `cd ../../../..` would work too, but `cd` alone is shorter and works
      from anywhere.

  # 6. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O3
    title: Check yourself
    items:
      - kind: mcq
        id: q-prompt
        objective: O1
        prompt: "What does the prompt `ana@server:~/web $` tell you?"
        options:
          - text: "User `ana`, computer `server`, in `~/web`"
            correct: true
            why: "`~/web` is the folder `web` of the home directory. Before the `@` is the user, after it the computer, after the `:` where you are."
          - text: "User `server`, computer `ana`, in `~/web`"
            why: "The user comes first: `user@computer`."
          - text: "You are in the folder `/web` at the top"
            why: "`~/web` is inside the home directory, not at the top."
      - kind: mcq
        id: q-absolute
        objective: O3
        prompt: "Which path is absolute?"
        options:
          - text: "`/home/pi/music`"
            correct: true
            why: "It starts with `/`, the top: it works from any directory."
          - text: "`music/songs`"
            why: "This is relative: it starts from where you are."
          - text: "`../pi/music`"
            why: "This starts from one level above where you are: relative."
      - kind: mcq
        id: q-up
        objective: O3
        prompt: "You are in `~/photos/2024`. Where does `cd ..` take you?"
        options:
          - text: "`~/photos`"
            correct: true
            why: "`..` is one level up."
          - text: "`~`, your home"
            why: "That is two levels up: `cd ../..`."
          - text: "`/`, the top"
            why: "`/` is the top. `..` goes up only one level."
      - kind: mcq
        id: q-ls
        objective: O2
        prompt: "What does `ls photos` do?"
        options:
          - text: "It lists the folder `photos`"
            correct: true
            why: "And you stay where you are: `ls` takes a path. Only `cd` moves you."
          - text: "It goes into `photos`"
            why: "Moving is the job of `cd`."
          - text: "It makes a folder `photos`"
            why: "That is `mkdir photos`, in the next lesson."
      - kind: mcq
        id: q-home
        objective: O3
        prompt: "What is the shortest way to go home from anywhere?"
        options:
          - text: "`cd`"
            correct: true
            why: "`cd` with nothing after it takes you home."
          - text: "`home`"
            why: "There is no command `home`: the shell says `command not found`."
          - text: "`cd /`"
            why: "`/` is the top of the whole computer, not your home directory."

  # 7. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O3
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-pwd
    objective: O2
    prompt: "Which command shows the full path of where you are?"
    options:
      - text: "`pwd`"
        correct: true
        why: "Print working directory."
      - text: "`ls`"
        why: "`ls` lists what is in a directory, not where you are."
      - text: "`whoami`"
        why: "`whoami` shows your user name."
  - kind: mcq
    id: r-tilde
    objective: O1
    prompt: "What is `~` for the user `pi`?"
    options:
      - text: "The home directory, `/home/pi`"
        correct: true
        why: "`~` is short for your own home directory."
      - text: "The top of the computer, `/`"
        why: "The top is `/`. `~` is your home."
      - text: "The last directory you were in"
        why: "`~` always means home."
  - kind: mcq
    id: r-option
    objective: O1
    prompt: "In `ls -l music`, what is `-l`?"
    options:
      - text: "An option"
        correct: true
        why: "It changes how `ls` works: a long list. Options start with `-`."
      - text: "The folder to list"
        why: "The folder is the argument: `music`."
      - text: "A second command"
        why: "One command per line here: `ls`."
  - kind: mcq
    id: r-relative
    objective: O3
    prompt: "You are in `~`. Which command takes you to `/home/pi/documents/work`?"
    options:
      - text: "`cd documents/work`"
        correct: true
        why: "A relative path from `~`. The absolute path works too."
      - text: "`cd /documents/work`"
        why: "This starts at the top, `/`, where there is no `documents`."
      - text: "`cd work`"
        why: "`work` is inside `documents`, not in `~`."
  - kind: mcq
    id: r-man
    objective: O2
    prompt: "How do you quit `man` or `less`?"
    options:
      - text: "Press q"
        correct: true
        why: "q quits; Space shows the next screen."
      - text: "Press Ctrl+S"
        why: "That stops the output in some terminals. q quits."
      - text: "Type `exit`"
        why: "`exit` leaves the shell. In `man`, press q."

# "Practice more": extra tasks, not shown in the lesson (practice page).
extra:
  - id: x-absolute
    type: terminal
    objective: O3
    title: Jump with absolute paths
    prompt: |
      You are deep in the folder `music/old`.

      1. Go to `/tmp` with an **absolute path**, and check with `pwd`.
      2. Go to `documents/work` in your home folder in one step, with `~`.
    start:
      cwd: music/old
      files:
        music/old/song.mp3: ""
        documents/work/plan.txt: "Step 1: buy the parts\n"
    checks:
      - expr: "any(h.startswith('cd /tmp') for h in history) and ran('pwd')"
        pass: "You went to /tmp, and checked with pwd"
        hint: "`cd /tmp`, then `pwd`."
      - expr: "cwd == '~/documents/work' and any(h.startswith('cd ~') for h in history)"
        pass: "You jumped to ~/documents/work in one step"
        hint: "`cd ~/documents/work`: `~` is your home folder, from anywhere."
    hints:
      - "An absolute path starts with `/`: `cd /tmp`."
      - "`~` means your home folder, `/home/pi`."
      - "`cd /tmp`, `pwd`, then `cd ~/documents/work`."
    solution: ["cd /tmp", "pwd", "cd ~/documents/work"]
    after: >-
      An absolute path works from any folder. A relative path is shorter,
      but it depends on where you are.
  - id: x-hidden
    type: terminal
    objective: O2
    title: Files you do not see
    prompt: |
      Names that start with a dot are **hidden**: `ls` does not show them.

      1. Look at your home folder with `ls`.
      2. Show the hidden files too, with the option `-a`.
      3. Show the details (size, date) with the option `-l`.
    start:
      files:
        notes.txt: "Buy a power supply.\n"
        .bashrc: "# settings of the shell\n"
        .config/robot.ini: "speed = 3\n"
    checks:
      - expr: "any(h.split()[0] == 'ls' and any(w.startswith('-') and 'a' in w for w in h.split()[1:]) for h in history if h.split())"
        pass: "You showed the hidden files with ls -a"
        hint: "`ls -a`."
      - expr: "any(h.split()[0] == 'ls' and any(w.startswith('-') and 'l' in w for w in h.split()[1:]) for h in history if h.split())"
        pass: "You showed the details with ls -l"
        hint: "`ls -l`. You can also join the options: `ls -la`."
    hints:
      - "Options come after the command, with a `-`."
      - "`-a` means all: also the hidden files."
      - "`ls -a`, then `ls -l` (or `ls -la` for both)."
    solution: ["ls", "ls -a", "ls -l"]
    after: >-
      Programs keep their settings in hidden files and folders, like
      `.bashrc` and `.config`. They are hidden so they do not fill your view.
