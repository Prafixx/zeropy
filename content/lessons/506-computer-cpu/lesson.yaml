      def run(program):
          registers = {"A": 0, "B": 0, "C": 0, "D": 0}
          pc = 0
          outputs = []
          while True:
              instruction = program[pc]        # fetch
              pc += 1
              op = instruction[0]              # decode
              if op == "HALT":                 # execute
                  return outputs
              elif op == "SET":
                  registers[instruction[1]] = instruction[2] % 256
              elif op == "OUT":
                  outputs.append(registers[instruction[1]])
              elif op == "ADD":
                  registers[instruction[1]] = (
                      registers[instruction[1]] + registers[instruction[2]]
                  ) % 256
              elif op == "SUB":
                  registers[instruction[1]] = (
                      registers[instruction[1]] - registers[instruction[2]]
                  ) % 256
              elif op == "JMP":
                  pc = instruction[1]
              elif op == "JNZ":
                  if registers[instruction[1]] != 0:
                      pc = instruction[2]
              else:
                  raise ValueError(f"unknown instruction: {op}")


      def sum_to(n):
          return [
              ("SET", "A", n),     # 0  the counter
              ("SET", "B", 1),     # 1
              ("SET", "C", 0),     # 2  the total
              ("ADD", "C", "A"),   # 3  <- the loop
              ("SUB", "A", "B"),   # 4
              ("JNZ", "A", 3),     # 5
              ("OUT", "C"),        # 6
              ("HALT",),           # 7
          ]


      print(run(sum_to(4)))
