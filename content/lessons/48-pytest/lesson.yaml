id: pytest
order: 48
title: Tests with pytest
summary: Write tests that prove your code works, read what pytest says when one fails, and choose tests that catch real bugs.
minutes: 45
outcomes: [A9]

objectives:
  - id: O1
    text: Write a test - a function test_... with assert - and run the tests
  - id: O2
    text: Read a test report - which test failed, and with which values
  - id: O3
    text: Test that a function raises an error, with pytest.raises
  - id: O4
    text: Choose good tests - borders, empty values and errors - so that a bug makes a test fail
  - id: O5
    text: Run pytest on your own project, with the tests in their own file

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: tests
    type: theory
    objective: O1
    title: Code that checks code
    body: |
      Until now you checked your programs by running them and reading the
      output. A **test** does that for you, every time, in a second:

      ```python
      def add(a, b):
          return a + b

      def test_small():
          assert add(2, 3) == 5

      def test_negative():
          assert add(-2, -3) == -5
      ```

      A test is a function whose name starts with `test_`. It calls your
      code and checks the result with `assert`. **pytest** finds all such
      functions, runs them, and reports:

      ```
      collected 2 items

      main.py ..

      === 2 passed ===
      ```

      Each `.` is a test that passed, each `F` a test that failed. In this
      page, the report appears under the output when you press **Run**.
      On your computer, you run pytest yourself (at the end of the lesson).
    keys:
      - code: "def test_small():"
        means: "A test: pytest runs every function whose name starts with `test`."
      - code: "assert add(2, 3) == 5"
        means: "The test fails if this is not true."
      - code: "main.py ..F"
        means: "Two tests passed, one failed."

  # 2. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    visual: none
    pytest: true
    objective: O1
    title: Run the tests, break the code
    intro: |
      Press **Run** and read the report under the output. Then change the
      program in the ways below.
    code: |
      def add(a, b):
          return a + b

      def test_small():
          assert add(2, 3) == 5

      def test_zero():
          assert add(0, 7) == 7

      def test_negative():
          assert add(-2, -3) == -5
    experiments:
      - text: "Run it. How many tests passed?"
        expr: "len(test_results) == 3 and all(t['outcome'] == 'passed' for t in test_results)"
      - text: "Put a bug into `add`: `return a - b`. Which tests fail, and what does the report show?"
        expr: "any(t['outcome'] == 'failed' for t in test_results)"
      - text: "Fix `add` again, and add a fourth test of your own, for example `add(10, -4)`."
        expr: "len(test_results) >= 4 and all(t['outcome'] == 'passed' for t in test_results)"
      - text: "Add a test with a wrong answer on purpose, like `assert add(1, 1) == 3`. Read the line that starts with `E`."
        expr: "any(t['outcome'] == 'failed' for t in test_results) and add(1, 1) == 2"
    investigate:
      - kind: mcq
        id: i-catch
        prompt: "`add` gets a bug: it gives back `abs(a) + abs(b)`. Which test fails?"
        code: |
          def add(a, b):
              return a + b

          def test_small():
              assert add(2, 3) == 5

          def test_zero():
              assert add(0, 7) == 7

          def test_negative():
              assert add(-2, -3) == -5
        options:
          - text: "Only `test_negative`"
            correct: true
            why: "With positive numbers and 0, `abs` changes nothing. Only the negative numbers show the bug: 5 is not -5."
          - text: "All three"
            why: "`abs(2) + abs(3)` is still 5, and `abs(0) + abs(7)` is still 7."
          - text: "None"
            why: "`abs(-2) + abs(-3)` is 5, but the test wants -5."
      - kind: mcq
        id: i-names
        prompt: "Why does the name of each test function start with `test`?"
        options:
          - text: "pytest finds and runs the functions whose names start with `test`"
            correct: true
            why: "No list of tests is needed: the name is enough."
          - text: "Python does not allow other names"
            why: "Any name is allowed. pytest only looks for this one."
          - text: "So that `add` runs faster"
            why: "The names are about finding the tests, not about speed."

  # 3. DRILL -----------------------------------------------------------------
  - id: drill
    type: drill
    objective: O2
    title: Read the report
    items:
      - kind: mcq
        id: d-marks
        objective: O2
        prompt: "pytest shows `main.py .F..`. What happened?"
        options:
          - text: "Four tests ran: the second failed, the other three passed"
            correct: true
            why: "One mark for each test, in the order of the file."
          - text: "One test failed four times"
            why: "Each mark is a different test."
          - text: "The file has an error on line 2"
            why: "The marks are tests, not lines."
      - kind: mcq
        id: d-e-line
        objective: O2
        prompt: "Under a failed test, pytest shows `>   assert total([10, 20], 10) == 27` and `E   assert 20 == 27`. What did `total` return?"
        options:
          - text: "20"
            correct: true
            why: "The `E` line shows the values: on the left the result, on the right what the test expected."
          - text: "27"
            why: "27 is what the test expected."
          - text: "Nothing: it crashed"
            why: "Then the `E` line would name an error, like `TypeError`."
      - kind: mcq
        id: d-who
        objective: O2
        prompt: "A test fails. What is wrong: the code or the test?"
        options:
          - text: "Find out: check what is right first. Usually the code, but a test can be wrong too"
            correct: true
            why: "Never change a test just to make it pass. Decide what the right answer is."
          - text: "Always the test"
            why: "Then tests would never find a bug."
          - text: "Always pytest"
            why: "pytest only reports what your code did."
      - kind: mcq
        id: d-did-not-raise
        objective: O3
        prompt: "The report says `Failed: DID NOT RAISE ValueError`. What does it mean?"
        options:
          - text: "The test expected a `ValueError`, but the code ran without one"
            correct: true
            why: "The code inside `pytest.raises(ValueError)` must raise. It did not."
          - text: "The test raised a `ValueError`"
            why: "Then `pytest.raises` would have caught it, and the test would pass."
          - text: "pytest cannot find ValueError"
            why: "`ValueError` is part of Python."
      - kind: mcq
        id: d-collected
        objective: O1
        prompt: "pytest says `collected 0 items`, but your file has the function `check_add()`. Why?"
        options:
          - text: "pytest only runs functions whose names start with `test`"
            correct: true
            why: "Rename it to `test_add`."
          - text: "The function has a bug"
            why: "pytest did not even run it."
          - text: "pytest needs a `main()`"
            why: "pytest finds tests by their names."

  # 4. EXERCISE: completion --------------------------------------------------
  - id: ex-tests
    type: exercise
    fade: completion
    pytest: true
    objective: O3
    title: Tests for parse_days
    prompt: |
      This is `parse_days` from the weather tool. **Replace the three
      `___`** in the tests, so that all three pass.

      The check also puts a few bugs into `parse_days`: your tests must
      catch them.
    starter: |
      import pytest

      def parse_days(text):
          days = int(text.strip())
          if not 1 <= days <= 7:
              raise ValueError("Days must be from 1 to 7.")
          return days

      def test_simple():
          assert parse_days("3") == ___

      def test_spaces():
          assert ___ == 7

      def test_too_big():
          with pytest.raises(___):
              parse_days("8")
    solution: |
      import pytest

      def parse_days(text):
          days = int(text.strip())
          if not 1 <= days <= 7:
              raise ValueError("Days must be from 1 to 7.")
          return days

      def test_simple():
          assert parse_days("3") == 3

      def test_spaces():
          assert parse_days(" 7 ") == 7

      def test_too_big():
          with pytest.raises(ValueError):
              parse_days("8")
    after: >-
      `pytest.raises(ValueError)` turns "it must fail" into a test: the
      test passes only when the code inside raises that error.
    checks:
      - expr: "len(test_results) == 3 and tests_pass()"
        pass: "All three tests pass"
        hint: "Read the report: which test failed, and what does its `E` line say?"
        misconceptions:
          - when: "err == 'NameError' or any(t.get('error') == 'NameError' for t in test_results)"
            say: "A `___` is still there. Replace all three."
          - when: "any(t['name'] == 'test_too_big' and t['outcome'] != 'passed' for t in test_results)"
            say: "`pytest.raises` needs the kind of error that `parse_days` raises: `ValueError`."
      - expr: "'parse_days(' in src.split('def test_spaces')[-1].split('def test_too_big')[0]"
        pass: "`test_spaces` calls `parse_days`"
        hint: "The second `___` is a call, for example `parse_days(\" 7 \")`."
      - expr: |-
          fails_with('''
          def parse_days(text):
              return int(text.strip())
          ''')
        pass: "The tests catch a `parse_days` that does not check the range"
        hint: "`test_too_big` must call `parse_days(\"8\")` inside `pytest.raises(ValueError)`."
      - expr: |-
          fails_with('''
          def parse_days(text):
              days = int(text.strip())
              if not 1 <= days <= 7:
                  raise ValueError("Days must be from 1 to 7.")
              return 7
          ''')
        pass: "The tests catch a `parse_days` that always gives 7"
        hint: "`test_simple` must check a value other than 7, like `parse_days(\"3\") == 3`."
    hints:
      - "`parse_days(\"3\")` gives `3`."
      - "The second `___` is a call that gives 7: `parse_days(\" 7 \")`."
      - "The error that `parse_days` raises for 8 is a `ValueError`."

  # 5. THEORY ----------------------------------------------------------------
  - id: good-tests
    type: theory
    objective: O4
    title: Good tests, and tests in their own file
    body: |
      ## Which tests to write

      A test is good when a bug makes it fail. Bugs like to live at the
      edges, so test:

      - a normal value: `grade(80)`
      - the **borders**: `grade(90)` and `grade(89)`
      - empty or zero values: `total([])`
      - wrong values, with `pytest.raises`: `grade(101)`

      One idea per test, and a name that says it: `test_90_is_an_a`.

      ## On your computer

      The tests go into their own file, whose name starts with `test_`.
      It imports the functions that it tests:

      ```python
      # test_weather.py
      import pytest
      from weather import parse_days

      def test_simple():
          assert parse_days("3") == 3
      ```

      Run `python -m pytest` in the folder. pytest finds every file named
      `test_*.py` and every test in it.

      An import runs the whole file. So `weather.py` must not start the
      tool when a test imports it. Put the lines of the tool under this
      `if`: they run only when you start the file itself.

      ```python
      if __name__ == "__main__":
          name = input("Place: ").strip()
          ...
      ```
    keys:
      - code: "test_weather.py"
        means: "A test file: its name starts with `test_`."
      - code: "python -m pytest"
        means: "Run all tests in this folder."
      - code: "if __name__ == \"__main__\":"
        means: "True only when this file is started, not when it is imported."

  # 6. EXERCISE: debug -------------------------------------------------------
  - id: ex-fix
    type: exercise
    fade: debug
    pytest: true
    objective: O2
    title: The tests know better
    prompt: |
      `total` should give the sum of the prices, minus a discount in
      **percent**. Two tests fail. **Read the report**, and fix `total`.
      The tests are right: do not change them.
    starter: |
      def total(prices, discount):
          subtotal = sum(prices)
          return subtotal - discount

      def test_no_discount():
          assert total([10, 20], 0) == 30

      def test_ten_percent():
          assert total([10, 20], 10) == 27

      def test_empty():
          assert total([], 50) == 0
    solution: |
      def total(prices, discount):
          subtotal = sum(prices)
          return subtotal * (100 - discount) / 100

      def test_no_discount():
          assert total([10, 20], 0) == 30

      def test_ten_percent():
          assert total([10, 20], 10) == 27

      def test_empty():
          assert total([], 50) == 0
    after: >-
      The `E` lines showed `20 == 27` and `-50 == 0`: the code took 10 and
      50 away, not 10 and 50 percent. The tests told you what was wrong
      before you read the code.
    checks:
      - expr: "len(test_results) == 3 and tests_pass()"
        pass: "All three tests pass"
        hint: "10 percent of 30 is 3: `subtotal * (100 - discount) / 100`."
        misconceptions:
          - when: "len(test_results) < 3"
            say: "Keep all three tests: they say what is right."
      - expr: "all(part in src for part in ('total([10, 20], 0) == 30', 'total([10, 20], 10) == 27', 'total([], 50) == 0'))"
        pass: "The tests are not changed"
        hint: "Fix `total`, not the tests. Go back to the numbers 30, 27 and 0."
        misconceptions:
          - when: "'total([10, 20], 10) == 20' in src or 'total([], 50) == -50' in src"
            say: "You changed a test to match the bug. The tests are right: fix `total`."
      - expr: "callable(ns.get('total')) and total([50], 20) == 40 and total([10, 10], 50) == 10 and total([8], 0) == 8"
        pass: "`total` works for other prices and discounts too"
        hint: "The discount is in percent: `subtotal * (100 - discount) / 100`."
    hints:
      - "Read the `E` line of `test_ten_percent`: what did `total` give, and what should it give?"
      - "A discount of 10 percent on 30 is 3, so the answer is 27."
      - "`return subtotal * (100 - discount) / 100`."

  # 7. EXERCISE: independent -------------------------------------------------
  - id: ex-grade
    type: exercise
    fade: independent
    pytest: true
    objective: O4
    title: Tests that catch bugs
    prompt: |
      `grade(score)` works: 90 to 100 is `"A"`, 75 to 89 `"B"`, 50 to 74
      `"C"`, below 50 `"F"`, and a score outside 0 to 100 raises a
      `ValueError`.

      **Write at least four tests** for it. The check puts bugs into
      `grade`, one at a time, and your tests must catch each one. Think of
      the borders.
    starter: |
      import pytest

      def grade(score):
          if not 0 <= score <= 100:
              raise ValueError("A score is from 0 to 100.")
          if score >= 90:
              return "A"
          if score >= 75:
              return "B"
          if score >= 50:
              return "C"
          return "F"

      # Write your tests here.
    solution: |
      import pytest

      def grade(score):
          if not 0 <= score <= 100:
              raise ValueError("A score is from 0 to 100.")
          if score >= 90:
              return "A"
          if score >= 75:
              return "B"
          if score >= 50:
              return "C"
          return "F"

      def test_90_is_an_a():
          assert grade(90) == "A"
          assert grade(100) == "A"

      def test_89_is_a_b():
          assert grade(89) == "B"
          assert grade(75) == "B"

      def test_74_is_a_c():
          assert grade(74) == "C"
          assert grade(50) == "C"

      def test_49_fails():
          assert grade(49) == "F"
          assert grade(0) == "F"

      def test_outside_raises():
          with pytest.raises(ValueError):
              grade(101)
          with pytest.raises(ValueError):
              grade(-1)
    after: >-
      Each bug lives at a border: 90, 75, 50, or the edge of 0 to 100.
      Tests at both sides of each border catch all of them. This is how
      testers think.
    checks:
      - expr: "len(test_results) >= 4 and tests_pass()"
        pass: "At least four tests, and all pass with the real `grade`"
        hint: "Write functions whose names start with `test_`, and check `grade(...)` with `assert`."
        misconceptions:
          - when: "len(test_results) == 0"
            say: "pytest found no tests. Each test is a function whose name starts with `test_`."
          - when: "len(test_results) > 0 and not tests_pass()"
            say: "A test fails with the real `grade`, so the test is wrong. Read its `E` line, and check the borders in the task."
      - expr: |-
          fails_with('''
          def grade(score):
              if not 0 <= score <= 100:
                  raise ValueError("A score is from 0 to 100.")
              if score > 90:
                  return "A"
              if score >= 75:
                  return "B"
              if score >= 50:
                  return "C"
              return "F"
          ''')
        pass: "Your tests catch a wrong border at 90"
        hint: "Test the border itself: `grade(90)` must be `\"A\"`."
      - expr: |-
          fails_with('''
          def grade(score):
              if not 0 <= score <= 100:
                  raise ValueError("A score is from 0 to 100.")
              if score >= 90:
                  return "A"
              if score >= 76:
                  return "B"
              if score >= 50:
                  return "C"
              return "F"
          ''')
        pass: "Your tests catch a wrong border at 75"
        hint: "Test `grade(75)`: it must be `\"B\"`."
      - expr: |-
          fails_with('''
          def grade(score):
              if not 0 <= score <= 100:
                  raise ValueError("A score is from 0 to 100.")
              if score >= 90:
                  return "A"
              if score >= 75:
                  return "B"
              if score >= 40:
                  return "C"
              return "F"
          ''')
        pass: "Your tests catch a wrong border at 50"
        hint: "Test just below the border: `grade(49)` must be `\"F\"`."
      - expr: |-
          fails_with('''
          def grade(score):
              if score >= 90:
                  return "A"
              if score >= 75:
                  return "B"
              if score >= 50:
                  return "C"
              return "F"
          ''')
        pass: "Your tests catch a `grade` that accepts 101 or -1"
        hint: "Use `with pytest.raises(ValueError):` and call `grade(101)` inside."
    hints:
      - "Start with `def test_90_is_an_a():` and `assert grade(90) == \"A\"`."
      - "For each border, test the value on it and the value just below: 90 and 89, 75 and 74, 50 and 49."
      - "For a score outside: `with pytest.raises(ValueError):` then `grade(101)`."

  # 8. LOCAL -----------------------------------------------------------------
  - id: check-tests
    type: local
    objective: O5
    title: Test your weather tool
    prompt: |
      **Add tests to your `weather` project.**

      1. In `weather`, with the venv active: `pip install pytest`.
      2. In `weather.py`, put the lines of the tool (from `name = input(...)`
         to the end) under `if __name__ == "__main__":`, one level in.
      3. Write `test_weather.py`, with at least three tests for
         `parse_days` and `format_day`, one of them with `pytest.raises`.
      4. Run `python -m pytest` and read the report.
      5. Download `check.py` **again**, and run the check in `weather`.

      The check also puts two bugs into your functions, in memory only:
      your tests must catch them.
    task: pytest
    needs: 6
    example:
      python: "3.14.7"
      os: Windows
      bits: "64"
      venv_exists: "yes"
      in_venv: "yes"
      venv_here: "yes"
      pytest: "9.2.0"
      test_files: "1"
      import_ok: "yes"
      pytest_exit: "0"
      tests_passed: "4"
      tests_failed: "0"
      tests_errors: "0"
      catches_parse_days: "yes"
      catches_format_day: "yes"
    checks:
      - expr: "report.get('in_venv') == 'yes' and report.get('venv_here') == 'yes' and report.get('pytest', 'no') != 'no'"
        pass: "pytest is installed in the venv of `weather`"
        hint: "Activate the venv in `weather`, then `pip install pytest`."
        misconceptions:
          - when: "report.get('in_venv') == 'no'"
            say: "The venv is not active. Activate it, then run the check again."
          - when: "report.get('pytest') == 'no'"
            say: "pytest is not in this venv. With `(.venv)` in the prompt: `pip install pytest`."
      - expr: "report.get('import_ok') == 'yes'"
        pass: "`import weather` does not start the tool"
        hint: "Put the lines of the tool under `if __name__ == \"__main__\":`."
        misconceptions:
          - when: "report.get('import_ok') in ('no', 'timeout')"
            say: "When a test imports `weather.py`, the tool starts and asks for a place. Put its last lines under `if __name__ == \"__main__\":`, indented one level."
          - when: "report.get('import_ok') is None"
            say: "There is no `weather.py` in this folder. Run the check in `weather`."
      - expr: "int(report.get('test_files', '0')) >= 1 and int(report.get('tests_passed', '0')) >= 3 and report.get('tests_failed') == '0' and report.get('tests_errors') == '0'"
        pass: "At least three tests, and all of them pass"
        hint: "Write `test_weather.py` with three functions `test_...`, and run `python -m pytest`."
        misconceptions:
          - when: "report.get('test_files') == '0'"
            say: "There is no test file. Its name must start with `test_`: `test_weather.py`."
          - when: "report.get('tests_errors', '0') != '0'"
            say: "pytest cannot run the tests: often the import fails. Run `python -m pytest` and read the first error."
          - when: "report.get('tests_failed', '0') != '0'"
            say: "Some tests fail. Run `python -m pytest`, read the `E` lines, and decide: is the code wrong, or the test?"
      - expr: "report.get('catches_parse_days') == 'yes' and report.get('catches_format_day') == 'yes'"
        pass: "Your tests catch a broken `parse_days` and a broken `format_day`"
        hint: "Test that `parse_days(\"8\")` raises `ValueError`, and compare `format_day` with a whole line."
        misconceptions:
          - when: "report.get('catches_parse_days') == 'no'"
            say: "Your tests pass with a `parse_days` that does not check the range. Add a test with `pytest.raises(ValueError)` for `parse_days(\"8\")`."
          - when: "report.get('catches_format_day') == 'no'"
            say: "Your tests pass with a `format_day` that shows high before low. Compare the whole line, like `\"2026-11-13: 0.5 to 5.8 °C, rain 0.1 mm\"`."
    hints:
      - "`test_weather.py` starts with `import pytest` and `from weather import format_day, parse_days`."
      - "Under `if __name__ == \"__main__\":` everything moves one level in. In VS Code: select the lines and press Tab."
      - "Run the tests with `python -m pytest`, not `pytest` alone: then the Python of the venv runs them."
    after: >-
      Your weather tool now has tests. Change it as much as you like: one
      command tells you in a second if it still works.

  # 9. QUIZ ------------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O4
    title: Check yourself
    items:
      - kind: mcq
        id: q-name
        objective: O1
        prompt: "Which function does pytest run as a test?"
        options:
          - text: "`def test_empty_cart():`"
            correct: true
            why: "Its name starts with `test`."
          - text: "`def check_empty_cart():`"
            why: "pytest only looks for names that start with `test`."
          - text: "`def empty_cart_test():`"
            why: "`test` must come first."
      - kind: mcq
        id: q-border
        objective: O4
        prompt: "`is_adult(age)` is `True` from 18. Which two tests catch most bugs?"
        options:
          - text: "`is_adult(18)` is `True`, and `is_adult(17)` is `False`"
            correct: true
            why: "Both sides of the border: a wrong `>` or `>=` fails one of them."
          - text: "`is_adult(40)` is `True`, and `is_adult(5)` is `False`"
            why: "Far from the border, a bug like `age > 18` passes both."
          - text: "`is_adult(18)` twice"
            why: "The same test twice finds nothing new."
      - kind: mcq
        id: q-raises
        objective: O3
        prompt: "How do you test that `parse_days(\"0\")` raises a `ValueError`?"
        options:
          - text: "`with pytest.raises(ValueError):` and then `parse_days(\"0\")` inside"
            correct: true
            why: "The test passes only if the code inside raises `ValueError`."
          - text: "`assert parse_days(\"0\") == ValueError`"
            why: "The call raises before `==` can compare anything, so the test fails with the error."
          - text: "`try:` and `except:` with no `assert`"
            why: "Then the test also passes when nothing is raised."
      - kind: mcq
        id: q-main
        objective: O5
        prompt: "Why does `weather.py` need `if __name__ == \"__main__\":`?"
        options:
          - text: "So that `import weather` in a test does not start the tool and ask for input"
            correct: true
            why: "The lines under it run only when the file itself is started."
          - text: "Because pytest needs a function `main`"
            why: "pytest needs nothing like that. The `if` protects the import."
          - text: "It makes the tool faster"
            why: "It changes when the lines run, not how fast."
      - kind: mcq
        id: q-good
        objective: O4
        prompt: "When is a test good?"
        options:
          - text: "When a bug in the code makes it fail"
            correct: true
            why: "A test that passes with broken code proves nothing."
          - text: "When it always passes"
            why: "A test that cannot fail cannot find a bug."
          - text: "When it is long"
            why: "Short tests with one idea each are easier to read."

  # 10. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-run
    objective: O5
    prompt: "Which command runs all tests of the folder, with the Python of the venv?"
    options:
      - text: "`python -m pytest`"
        correct: true
        why: "`-m pytest` runs the pytest of the Python that you start."
      - text: "`python test_weather.py`"
        why: "That runs the file, but no test: the functions are only defined."
      - text: "`pip test`"
        why: "pip installs packages. It does not run tests."
  - kind: mcq
    id: r-e
    objective: O2
    prompt: "In a pytest report, what does the line that starts with `E` show?"
    options:
      - text: "Why the test failed: the values that were compared, or the error"
        correct: true
        why: "For example `E   assert 20 == 27`."
      - text: "The end of the report"
        why: "`E` lines are under each failed test."
      - text: "The tests that passed"
        why: "Passed tests are only dots."
  - kind: mcq
    id: r-file
    objective: O5
    prompt: "Which file name does pytest find?"
    options:
      - text: "`test_shop.py`"
        correct: true
        why: "pytest looks for files named `test_*.py`."
      - text: "`shop_tests.txt`"
        why: "A test file is a Python file, and its name starts with `test_`."
      - text: "`tests.py`"
        why: "`tests.py` does not start with `test_`."
  - kind: mcq
    id: r-pass-broken
    objective: O4
    prompt: "Your tests pass, also with a bug in the code. What does that tell you?"
    options:
      - text: "A test is missing: add one that this bug makes fail"
        correct: true
        why: "Good tests fail when the code is wrong."
      - text: "The bug does not matter"
        why: "It matters. The tests do not see it yet."
      - text: "pytest is broken"
        why: "pytest runs what you wrote. The tests need another case."
  - kind: mcq
    id: r-assert
    objective: O1
    prompt: "What does `assert grade(90) == \"A\"` do in a test?"
    options:
      - text: "The test fails if `grade(90)` is not `\"A\"`"
        correct: true
        why: "If it is true, nothing happens, and the test goes on."
      - text: "It sets the grade of 90 to A"
        why: "`assert` only checks. It changes nothing."
      - text: "It prints the grade"
        why: "`assert` prints nothing when it is true."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-raises
    type: exercise
    fade: completion
    objective: O3
    title: A test for an error
    pytest: true
    prompt: |
      **Replace the two `___`** in `test_too_big`: it checks that
      `percent("120")` raises a `ValueError`. Run it: both tests must pass.
    starter: |
      import pytest


      def percent(text):
          value = int(text)
          if not 0 <= value <= 100:
              raise ValueError("A percent is from 0 to 100.")
          return value


      def test_normal():
          assert percent("42") == 42


      def test_too_big():
          with pytest.raises(___):
              percent(___)
    solution: |
      import pytest


      def percent(text):
          value = int(text)
          if not 0 <= value <= 100:
              raise ValueError("A percent is from 0 to 100.")
          return value


      def test_normal():
          assert percent("42") == 42


      def test_too_big():
          with pytest.raises(ValueError):
              percent("120")
    after: >-
      `pytest.raises` passes only when the block raises that error. If
      `percent` forgot its check, this test would fail: it guards the rule.
    checks:
      - expr: "len(test_results) >= 2 and tests_pass()"
        pass: "Both tests pass"
        hint: "`with pytest.raises(ValueError):` and `percent(\"120\")`."
        misconceptions:
          - when: "len(test_results) > 0 and not tests_pass()"
            say: "A test fails. Read its line in the report: which error, which value?"
      - expr: |-
          fails_with('''
          def percent(text):
              return int(text)
          ''')
        pass: "The test catches a percent without the check"
        hint: "The value in the call must be outside 0 to 100."
    hints:
      - "`pytest.raises(...)` takes the kind of error."
      - "`pytest.raises(ValueError)`."
      - "Call it with a value that is too big: `percent(\"120\")`."
  - id: x-palindrome-tests
    type: exercise
    fade: independent
    objective: O4
    title: Tests for palindromes
    pytest: true
    prompt: |
      `is_palindrome(text)` says if a text reads the same both ways,
      **without caring about capitals and spaces**: `"Never odd or even"`
      is one.

      **Write at least three tests.** The check puts bugs into the function,
      one at a time, and your tests must catch each.
    starter: |
      def is_palindrome(text):
          letters = text.lower().replace(" ", "")
          return letters == letters[::-1]


      # Your tests here.
    solution: |
      def is_palindrome(text):
          letters = text.lower().replace(" ", "")
          return letters == letters[::-1]


      def test_simple():
          assert is_palindrome("level")
          assert not is_palindrome("python")


      def test_capitals():
          assert is_palindrome("Anna")


      def test_spaces():
          assert is_palindrome("never odd or even")
    after: >-
      Each rule needs its own test: one for "same both ways", one for
      capitals, one for spaces, and one that must say False.
    checks:
      - expr: "len(test_results) >= 3 and tests_pass()"
        pass: "At least three tests, all passing with the real function"
        hint: "Functions named `test_...` with `assert is_palindrome(...)`."
        misconceptions:
          - when: "len(test_results) == 0"
            say: "No tests found. Each test is a function whose name starts with `test_`."
      - expr: |-
          fails_with('''
          def is_palindrome(text):
              letters = text.replace(" ", "")
              return letters == letters[::-1]
          ''')
        pass: "Your tests catch a version that cares about capitals"
        hint: "Test a word with a capital, like \"Anna\"."
      - expr: |-
          fails_with('''
          def is_palindrome(text):
              letters = text.lower()
              return letters == letters[::-1]
          ''')
        pass: "Your tests catch a version that cares about spaces"
        hint: "Test a sentence with spaces, like \"never odd or even\"."
      - expr: |-
          fails_with('''
          def is_palindrome(text):
              return True
          ''')
        pass: "Your tests catch a version that always says True"
        hint: "Test a text that is not a palindrome too: `assert not is_palindrome(\"python\")`."
    hints:
      - "A test is a function `test_...` with `assert`."
      - "One test per rule: both ways, capitals, spaces."
      - "And one text that is not a palindrome, with `assert not ...`."
