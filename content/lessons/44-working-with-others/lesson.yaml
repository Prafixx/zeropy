      - expr: "err is None and lines == ['## New', '- Add a dark theme', '- Export to CSV', '## Fixed', '- Search ignores capitals']"
        pass: "It prints the notes with headings and sorted titles"
        hint: "One heading for each label that has titles, in the order New, Fixed, Other."
      - expr: "callable(ns.get('changelog')) and changelog([{'title': 'B', 'label': 'other'}, {'title': 'A', 'label': 'other'}]) == '## Other\\n- A\\n- B' and changelog([]) == ''"
        pass: "Labels without PRs get no heading"
        hint: "Add a heading only when the list of titles is not empty."
