    solution: &logic-sol |
      import json
      from pathlib import Path

      def add_task(tasks, text):
          text = text.strip()
          if not text:
              raise ValueError("A task needs a text.")
          return tasks + [text]

      def remove_task(tasks, index):
          return tasks[:index] + tasks[index + 1:]

      def save_tasks(tasks, name):
          Path(name).write_text(json.dumps(tasks, indent=2))

      def load_tasks(name):
          path = Path(name)
          if not path.exists():
              return []
          return json.loads(path.read_text())

      assert add_task([], " Buy milk ") == ["Buy milk"]
      assert remove_task(["a", "b", "c"], 1) == ["a", "c"]
      print("All tests pass.")
    after: >-
      These functions do not change the list that they get: they give back
      a new one. That makes them easy to test: the same input always gives
      the same output.
    checks:
      - expr: "err is None and lines == ['All tests pass.']"
        pass: "The tests at the end pass"
        hint: "An empty text is `not text`. The part after `index` starts at `index + 1`."
        misconceptions:
          - when: "err == 'NameError'"
            say: "A `___` is still there. Replace both."
          - when: "err == 'AssertionError'"
            say: "A test fails. Read its line: is it `add_task` or `remove_task`?"
      - expr: "callable(ns.get('add_task')) and raises(add_task, ['a'], '   ') == 'ValueError' and raises(add_task, [], '') == 'ValueError' and add_task(['a'], 'b') == ['a', 'b']"
        pass: "`add_task` refuses an empty text with `ValueError`"
        hint: "`if not text:` after `strip()`."
      - expr: "callable(ns.get('remove_task')) and remove_task(['a', 'b', 'c'], 0) == ['b', 'c'] and remove_task(['a', 'b', 'c'], 2) == ['a', 'b'] and (lambda t: (remove_task(t, 0), t == ['x', 'y'])[1])(['x', 'y'])"
        pass: "`remove_task` takes out the task at `index`, and leaves the old list as it was"
        hint: "`tasks[:index] + tasks[index + 1:]`."
    hints:
      - "After `strip()`, an empty text is `\"\"`, and `not \"\"` is `True`."
      - "`tasks[:index]` is everything before the task. What comes after it starts at `index + 1`."
      - "`tasks[index + 1:]`."

