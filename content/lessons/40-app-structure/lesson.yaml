    solution: |
      import json
      import tkinter as tk
      from pathlib import Path
      from tkinter import messagebox

      def add_task(tasks, text):
          text = text.strip()
          if not text:
              raise ValueError("A task needs a text.")
          return tasks + [text]

      def remove_task(tasks, index):
          return tasks[:index] + tasks[index + 1:]

      def save_tasks(tasks, name):
          Path(name).write_text(json.dumps(tasks, indent=2))

      def load_tasks(name):
          path = Path(name)
          if not path.exists():
              return []
          return json.loads(path.read_text())

      class TodoApp:
          def __init__(self, root):
              root.title("To-do")
              self.tasks = load_tasks("tasks.json")
              self.entry = tk.Entry(root, width=30)
              self.entry.grid(row=0, column=0, padx=8, pady=8)
              add = tk.Button(root, text="Add", command=self.add)
              add.grid(row=0, column=1, padx=(0, 8))
              self.listbox = tk.Listbox(root, width=40)
              self.listbox.grid(row=1, column=0, columnspan=2)
              remove = tk.Button(root, text="Remove",
                                 command=self.remove)
              remove.grid(row=2, column=0, columnspan=2, pady=8)
              self.show()

          def show(self):
              self.listbox.delete(0, tk.END)
              for task in self.tasks:
                  self.listbox.insert(tk.END, task)

          def add(self):
              try:
                  self.tasks = add_task(self.tasks, self.entry.get())
              except ValueError as error:
                  messagebox.showerror("To-do", str(error))
                  return
              self.entry.delete(0, tk.END)
              save_tasks(self.tasks, "tasks.json")
              self.show()

          def remove(self):
              selection = self.listbox.curselection()
              if not selection:
                  return
              self.tasks = remove_task(self.tasks, selection[0])
              save_tasks(self.tasks, "tasks.json")
              self.show()

      if __name__ == "__main__":
          root = tk.Tk()
          app = TodoApp(root)
          root.mainloop()
    after: >-
      Each method is short: read from the window, call the logic, save,
      show. The window never decides what a valid task is: `add_task` does.
    cases:
      - {}
      - label: "there is no `tasks.json` yet"
        files: {}
    checks:
      - expr: "err is None and gui_window is not None and gui_items() == __import__('json').loads(start_files.get('tasks.json', '[]'))"
        pass: "The window opens and shows the tasks of `tasks.json`"
        hint: "In `show`: `self.listbox.insert(tk.END, task)`."
        misconceptions:
          - when: "err == 'NameError'"
            say: "A `___` is still there, or `command=` names something that does not exist yet. The command of **Add** is `self.add`."
          - when: "err is None and gui_items() == []"
            say: "The list stays empty. In the loop of `show`, insert each task: `self.listbox.insert(tk.END, task)`."
      - expr: "gui_find('Add') is not None and (gui_type(0, ' Read a book '), gui_click('Add'), gui_items()[-1:] == ['Read a book'] and gui_widgets('Entry')[0].get() == '' and __import__('json').loads(open('tasks.json').read())[-1] == 'Read a book')[2]"
        pass: "**Add** shows the new task, empties the entry, and saves it"
        hint: "The command of **Add** is `self.add`, without parentheses."
        misconceptions:
          - when: "gui_find('Add') is not None and gui_find('Add').options.get('command') is None"
            say: "**Add** has no command. Write `command=self.add`, without parentheses."
          - when: "gui_find('Add') is not None and (gui_type(0, 'Feed the cat'), gui_click('Add'), gui_items()[-1:] == ['Feed the cat'] and 'Feed the cat' not in (open('tasks.json').read() if __import__('os').path.exists('tasks.json') else ''))[2]"
            say: "The task is shown, but `tasks.json` does not have it. Keep `save_tasks(self.tasks, \"tasks.json\")` in `add`."
      - expr: "gui_find('Add') is not None and (lambda before: (gui_type(0, '   '), gui_click('Add'), len(gui_items()) == before and bool(gui_dialogs) and gui_dialogs[-1]['kind'] == 'error' and gui_dialogs[-1]['message'] == 'A task needs a text.')[2])(len(gui_items()))"
        pass: "An empty task shows the error in a message window, and adds nothing"
        hint: "`messagebox.showerror(\"To-do\", str(error))`."
        misconceptions:
          - when: "gui_find('Add') is not None and (gui_type(0, '   '), raises(gui_click, 'Add'))[1] == 'TypeError'"
            say: "`showerror` needs a text as its message: `str(error)`."
      - expr: "gui_find('Remove') is not None and (gui_type(0, 'Water plants'), gui_click('Add'), (lambda n: (gui_select(0), gui_click('Remove'), len(gui_items()) == n - 1 and __import__('json').loads(open('tasks.json').read()) == gui_items())[2])(len(gui_items())))[2]"
        pass: "**Remove** takes out the selected task, and saves"
        hint: "`selection = self.listbox.curselection()`."
        misconceptions:
          - when: "gui_find('Remove') is not None and (gui_select(0), raises(gui_click, 'Remove'))[1] is not None"
            say: "A click on **Remove** crashes. `self.listbox.curselection()` gives the selected numbers, like `(0,)`."
      - expr: "gui_find('Remove') is not None and (gui_widgets('Listbox')[0].selection_clear(0), raises(gui_click, 'Remove') is None)[1]"
        pass: "**Remove** with nothing selected does nothing, and does not crash"
        hint: "Keep `if not selection: return`."
    hints:
      - "**Add** calls the method `add` of this app: `command=self.add`."
      - "In `show`, each task goes into the list: `self.listbox.insert(tk.END, task)`."
      - "The message is the text of the error: `str(error)`. The selection: `self.listbox.curselection()`."

  # 6. EXERCISE: debug -------------------------------------------------------
  - id: ex-shop
    type: exercise
    fade: debug
    objective: O1
    title: A shopping list with three bugs
    prompt: |
      Type `Milk` in the window and click **Add**: it should appear in the
      list, and the entry should be empty again. **Run it, click, read the
      message**, and fix the three bugs, one after the other.
    starter: |
      import tkinter as tk

      class ShopApp:
          def __init__(self, root):
              root.title("Shopping")
              entry = tk.Entry(root, width=25)
              entry.pack(padx=8, pady=8)
              tk.Button(root, text="Add", command=self.add).pack()
              self.items = tk.Listbox(root)
              self.items.pack(padx=8, pady=8)

          def add():
              self.items.insert(tk.END, self.entry.get())
              self.entry.delete(0)

      root = tk.Tk()
      app = ShopApp(root)
      root.mainloop()
    solution: |
      import tkinter as tk

      class ShopApp:
          def __init__(self, root):
              root.title("Shopping")
              self.entry = tk.Entry(root, width=25)
              self.entry.pack(padx=8, pady=8)
              tk.Button(root, text="Add", command=self.add).pack()
              self.items = tk.Listbox(root)
              self.items.pack(padx=8, pady=8)

          def add(self):
              self.items.insert(tk.END, self.entry.get())
              self.entry.delete(0, tk.END)

      root = tk.Tk()
      app = ShopApp(root)
      root.mainloop()
    after: >-
      The bugs of an app class hide until the click: the window opens
      fine, and the error comes when the method runs. Always click every
      button once after a change.
    checks:
      - expr: "gui_find('Add') is not None and (gui_type(0, 'Milk'), raises(gui_click, 'Add') is None and gui_items() == ['Milk'])[1]"
        pass: "**Add** puts the text into the list"
        hint: "Click **Add** in the window, and read the message."
        misconceptions:
          - when: "gui_find('Add') is not None and (gui_type(0, 'Milk'), raises(gui_click, 'Add'))[1] == 'TypeError'"
            say: "`add()` has no `self`, but Python passes the app as the first value. Write `def add(self):`."
          - when: "gui_find('Add') is not None and (gui_type(0, 'Milk'), raises(gui_click, 'Add'))[1] == 'AttributeError'"
            say: "The app has no `entry`: `__init__` made a local name `entry`, which is gone after `__init__`. Write `self.entry = tk.Entry(...)`, and `self.entry.pack(...)`."
      - expr: "gui_find('Add') is not None and (gui_type(0, 'Bread'), gui_click('Add'), gui_widgets('Entry')[0].get() == '')[2]"
        pass: "After **Add**, the entry is empty"
        hint: "`self.entry.delete(0, tk.END)` deletes all text."
        misconceptions:
          - when: "gui_find('Add') is not None and (gui_type(0, 'Bread'), gui_click('Add'), gui_widgets('Entry')[0].get())[2] == 'read'"
            say: "`delete(0)` deletes only the first letter. `delete(0, tk.END)` deletes from the first to the last."
    hints:
      - "Click **Add**: the first message says that `add()` takes 0 values, but got 1. What is missing in `def add():`?"
      - "Then the app has no `entry`. In `__init__`, a widget that methods need must be `self.entry`."
      - "Last: `delete(0)` removes one letter. Use `delete(0, tk.END)`."

  # 7. LOCAL -----------------------------------------------------------------
  - id: check-todo
    type: local
    objective: O5
    title: Your to-do app
    prompt: |
      **Run the to-do app on your computer.**

      1. Make a folder `todo` in `python-course`, with `todo.py`: your
         code from the step **The to-do window**. Keep the buttons **Add**
         and **Remove**.
      2. Run `python todo.py`. Add tasks, close the window, and start it
         again: your tasks are still there, in `tasks.json`.
      3. Download `check.py` **again** into `todo`, and run the check.

      The check runs your app in a temporary folder, so your own
      `tasks.json` does not change. It adds a task, starts the app again,
      and removes the task.
    task: todo
    needs: 9
    example:
      python: "3.14.7"
      os: Windows
      bits: "64"
      tkinter: "yes"
      todo_exists: "yes"
      todo_ok: "yes"
      starts_empty: "yes"
      adds: "yes"
      saves: "yes"
      loads: "yes"
      removes: "yes"
      refuses_empty: "yes"
    checks:
      - expr: "report.get('tkinter') == 'yes' and report.get('todo_exists') == 'yes' and report.get('todo_ok') == 'yes'"
        pass: "`todo.py` opens its window"
        hint: "Save `todo.py` in `todo`, and run `python todo.py` once."
        misconceptions:
          - when: "report.get('tkinter') == 'no'"
            say: "This Python has no tkinter. On Linux: `sudo apt install python3-tk`."
          - when: "report.get('todo_exists') == 'no'"
            say: "There is no `todo.py` in this folder. Run the check in `todo`."
          - when: "report.get('todo_ok') == 'no'"
            say: "`todo.py` stops with an error. Run it, and read the last line in the terminal."
          - when: "report.get('todo_ok') == 'nobuttons'"
            say: "The check found no buttons **Add** and **Remove**, or no entry and list. Keep those names on the buttons."
      - expr: "report.get('adds') == 'yes' and report.get('saves') == 'yes' and report.get('refuses_empty') == 'yes'"
        pass: "**Add** adds a task and saves it, and refuses an empty one"
        hint: "`add` calls `add_task`, then `save_tasks`, then `show`."
        misconceptions:
          - when: "report.get('saves') == 'no'"
            say: "After **Add**, `tasks.json` does not hold the task. Call `save_tasks(self.tasks, \"tasks.json\")` in `add`."
      - expr: "report.get('loads') == 'yes'"
        pass: "A new start shows the saved tasks"
        hint: "In `__init__`: `self.tasks = load_tasks(\"tasks.json\")`, then `self.show()`."
      - expr: "report.get('removes') == 'yes'"
        pass: "**Remove** takes out the selected task"
        hint: "`remove` uses `self.listbox.curselection()`, then `remove_task` and `save_tasks`."
    hints:
      - "Copy your code of **The to-do window**: it runs the same on your computer."
      - "The check needs the buttons **Add** and **Remove**, one entry and one list."
      - "If the check says `todo_ok: no`, run `python todo.py` and click each button: the error is printed in the terminal."
    after: >-
      A real app: a window, logic that you can test, and data that stays.
      One step is left: make it a program that others can start without
      Python.

  # 8. QUIZ ------------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O1
    title: Check yourself
    items:
      - kind: mcq
        id: q-attr
        objective: O1
        prompt: "In `__init__` of an app, why `self.entry = tk.Entry(root)`, and not `entry = tk.Entry(root)`?"
        options:
          - text: "A method like `add` needs the entry later. A local name is gone after `__init__`"
            correct: true
            why: "Attributes live as long as the object."
          - text: "tkinter needs `self` to show it"
            why: "The window shows it either way. Your methods need to reach it."
          - text: "It is only a style"
            why: "Without `self.`, `add` cannot find the entry: `AttributeError`."
      - kind: mcq
        id: q-command
        objective: O1
        prompt: "In an app class, which command makes a button call the method `save`?"
        options:
          - text: "`command=self.save`"
            correct: true
            why: "The method of this object, without parentheses."
          - text: "`command=save`"
            why: "There is no global name `save`: it is a method of the app."
          - text: "`command=self.save()`"
            why: "That calls `save` at once, while the window is built."
      - kind: mcq
        id: q-logic
        objective: O2
        prompt: "Why is `add_task(tasks, text)` a plain function, outside the window class?"
        options:
          - text: "It needs no window, so a test can check it easily"
            correct: true
            why: "Logic without tkinter is plain Python: fast and easy to test."
          - text: "Classes cannot have methods that add"
            why: "They can. Keeping the logic apart is what makes it testable."
          - text: "tkinter forbids functions"
            why: "The window calls plain functions all the time."
      - kind: mcq
        id: q-curselection
        objective: O3
        prompt: "Nothing is selected in the list. What is `listbox.curselection()`?"
        options:
          - text: "`()`, an empty tuple"
            correct: true
            why: "So check `if not selection: return` before you use `selection[0]`."
          - text: "`0`"
            why: "0 would be the first line. Nothing selected is `()`."
          - text: "An error"
            why: "It gives an empty tuple."
      - kind: mcq
        id: q-save
        objective: O4
        prompt: "When should the to-do app save `tasks.json`?"
        options:
          - text: "After every change: add and remove"
            correct: true
            why: "Then closing the window never loses a task."
          - text: "Only at the start"
            why: "At the start it loads. Changes come later."
          - text: "Never: tkinter remembers"
            why: "A closed window forgets everything. The file remembers."

  # 9. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-state
    objective: O1
    prompt: "Where does the state of an app, like `count`, belong?"
    options:
      - text: "In an attribute of the app: `self.count`"
        correct: true
        why: "Every method can read and change it through `self`."
      - text: "In a label only"
        why: "A label shows it. The value itself lives in the object."
      - text: "In a local name of `__init__`"
        why: "That is gone when `__init__` ends."
  - kind: mcq
    id: r-insert
    objective: O3
    prompt: "Which line adds `Buy milk` at the end of a Listbox?"
    options:
      - text: "`listbox.insert(tk.END, \"Buy milk\")`"
        correct: true
        why: "`tk.END` is after the last line."
      - text: "`listbox.append(\"Buy milk\")`"
        why: "A Listbox has no `append`. Use `insert`."
      - text: "`listbox.text = \"Buy milk\"`"
        why: "That changes nothing on the screen."
  - kind: mcq
    id: r-grid
    objective: O3
    prompt: "What does `button.grid(row=0, column=1)` do?"
    options:
      - text: "It puts the button in the first row, second column"
        correct: true
        why: "Rows and columns count from 0."
      - text: "It puts it in row 1, column 0"
        why: "`row=0` is the first row."
      - text: "It packs it under the others"
        why: "That is `pack`. `grid` uses rows and columns."
  - kind: mcq
    id: r-error-box
    objective: O3
    prompt: "How does an app show the error `A task needs a text.` in a small window?"
    options:
      - text: "`messagebox.showerror(\"To-do\", \"A task needs a text.\")`"
        correct: true
        why: "The first text is the title, the second the message."
      - text: "`print(\"A task needs a text.\")`"
        why: "That goes to the terminal, not to the user."
      - text: "`raise ValueError(...)` in the window"
        why: "That crashes the click. Show the message instead."
  - kind: mcq
    id: r-main
    objective: O1
    prompt: "Why do the last lines of `todo.py` go under `if __name__ == \"__main__\":`?"
    options:
      - text: "So that tests can import the logic without opening the window"
        correct: true
        why: "The window starts only when the file itself runs."
      - text: "tkinter needs it to draw"
        why: "tkinter draws without it. Imports need it."
      - text: "It makes the app faster"
        why: "It changes when the lines run, not how fast."
