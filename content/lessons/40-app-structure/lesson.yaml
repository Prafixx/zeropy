id: app-structure
order: 40
title: Structure of an app
summary: Build a to-do app the way real apps are built - a class for the window, plain functions for the logic, and a file that remembers.
minutes: 45
outcomes: [A11, A8]

objectives:
  - id: O1
    text: Write an app as a class - widgets and state as attributes, methods as the commands of buttons
  - id: O2
    text: Keep the logic apart from the window, in plain functions that tests can check
  - id: O3
    text: Use a Listbox, grid and messagebox
  - id: O4
    text: Save the data of an app to a file, and load it again at the start
  - id: O5
    text: Run and check a to-do app on your own computer

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: class-app
    type: theory
    objective: O1
    title: An app is a class
    body: |
      In the last lesson, the widgets were global names. In a bigger app
      that becomes a mess. So an app is one class:

      ```python
      class CounterApp:
          def __init__(self, root):
              self.count = 0
              self.label = tk.Label(root, text="0")
              self.label.pack()
              tk.Button(root, text="+1",
                        command=self.add_one).pack()

          def add_one(self):
              self.count = self.count + 1
              self.label.config(text=str(self.count))
      ```

      - `__init__` builds the window. Widgets that you need later, and the
        **state** (here `count`), are attributes: `self.label`,
        `self.count`.
      - The commands of the buttons are **methods**: `command=self.add_one`.
        A method can reach everything through `self`, so there is no need
        for global names.

      At the end of the file, start it only when the file itself runs:

      ```python
      if __name__ == "__main__":
          root = tk.Tk()
          app = CounterApp(root)
          root.mainloop()
      ```
    keys:
      - code: "self.label = tk.Label(...)"
        means: "A widget that methods need later: an attribute."
      - code: "command=self.add_one"
        means: "The button calls this method of this app."
      - code: "self.count"
        means: "The state of the app, kept in the object."

  # 2. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    visual: none
    objective: O1
    title: A counter as a class
    intro: |
      Press **Run**, and click the button in the window. Then change the
      app in the ways below.
    code: |
      import tkinter as tk

      class CounterApp:
          def __init__(self, root):
              self.count = 0
              root.title("Counter")
              self.label = tk.Label(root, text="0", font=("Arial", 24))
              self.label.pack(padx=40, pady=10)
              plus = tk.Button(root, text="+1", command=self.add_one)
              plus.pack(pady=(0, 10))

          def add_one(self):
              self.count = self.count + 1
              self.label.config(text=str(self.count))

      root = tk.Tk()
      app = CounterApp(root)
      root.mainloop()
    experiments:
      - text: "Run it, and click **+1** a few times."
        expr: "err is None and gui_find('+1') is not None"
      - text: "Add a button **Reset** with a method `reset`, which sets the count back to 0."
        expr: "err is None and gui_find('Reset') is not None and (gui_click('+1'), gui_click('+1'), gui_click('Reset'), '0' in gui_texts())[3]"
      - text: "Add a button **-1** with a method `subtract_one`."
        expr: "err is None and gui_find('-1') is not None and (gui_click('Reset') if gui_find('Reset') else None, gui_click('-1'), '-1' in gui_texts())[2]"
      - text: "Make the label show `Clicks: 2` instead of `2`."
        expr: "err is None and (gui_click('+1'), gui_click('+1'), any(t.startswith('Clicks: ') for t in gui_texts()))[2]"

  # 3. THEORY ----------------------------------------------------------------
  - id: logic
    type: theory
    objective: O2
    title: Logic apart from the window
    body: |
      A to-do app has two parts:

      - **The logic**: add a task, remove a task, save, load. Plain
        functions with plain values. No tkinter.
      - **The window**: widgets that show the tasks, and methods that call
        the logic when the user clicks.

      ```python
      def add_task(tasks, text):
          text = text.strip()
          if not text:
              raise ValueError("A task needs a text.")
          return tasks + [text]
      ```

      The logic needs no window, so tests can check it, like in lesson 37.
      The window code stays short: read, call, show.

      ## Three new tools

      | Tool | Use |
      | --- | --- |
      | `tk.Listbox(root)` | A list of lines: `insert(tk.END, text)`, `delete(0, tk.END)`, `curselection()` |
      | `.grid(row=0, column=1)` | Place widgets in rows and columns, instead of `pack` |
      | `messagebox.showerror("Title", "Text")` | A small window with a message |

      Do not mix `pack` and `grid` in one window: choose one.
    keys:
      - code: "listbox.curselection()"
        means: "The numbers of the selected lines, as a tuple: `(2,)`, or `()`."
      - code: "grid(row=1, column=0, columnspan=2)"
        means: "Row 1, column 0, two columns wide."
      - code: "from tkinter import messagebox"
        means: "Small message windows: `showinfo`, `showerror`, `askyesno`."

  # 4. EXERCISE: completion --------------------------------------------------
