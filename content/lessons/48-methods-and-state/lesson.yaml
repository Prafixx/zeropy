id: methods-and-state
order: 48
title: Methods and state
summary: Let the methods of an object guard its data. Refuse bad changes, answer questions, and make print show your objects clearly.
minutes: 35
outcomes: [A8, A9]

objectives:
  - id: O1
    text: Tell methods that change the state of an object from methods that answer a question
  - id: O2
    text: Keep an object valid - a method refuses a bad change with raise ValueError, before it changes anything
  - id: O3
    text: Write __str__, so that print shows an object as clear text
  - id: O4
    text: Keep many objects in a list, and work with them in a loop

steps:
  # 1. HOOK ------------------------------------------------------------------
  - id: see
    type: hook
    objective: O2
    title: An account that says no
    question: You ask for 100, and there are only 50. What should happen to the balance?
    code: |
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self.balance = 0

          def deposit(self, amount):
              self.balance = self.balance + amount

          def withdraw(self, amount):
              if amount > self.balance:
                  raise ValueError("Not enough money.")
              self.balance = self.balance - amount

      account = Account("Ana")
      account.deposit(50)
      account.withdraw(100)
    beats:
      - beat: make
        line: 14
        caption: "A new account: its **state** is the values of its attributes. Ana has 0."
      - beat: deposit
        line: 15
        caption: "`deposit(50)` is a method that **changes** the state. Inside, `self` is the account, and `amount` is 50."
      - beat: added
        line: 7
        caption: "The balance is 50 now."
      - beat: back
        line: 15
        caption: "The call ends. Only methods changed the account, so the account itself can check every change."
      - beat: withdraw
        line: 16
        caption: "`withdraw(100)`: there are only 50. The method checks **first**."
      - beat: refused
        line: 11
        caption: "`raise ValueError` stops the method **before** the change. The balance stays 50: the account never shows a wrong state, like −50."

  # 2. THEORY ----------------------------------------------------------------
  - id: kinds
    type: theory
    objective: O1
    title: Commands and questions
    body: |
      Most methods are one of two kinds:

      | Kind | It does | Example |
      | --- | --- | --- |
      | A **command** | changes the state, returns nothing | `account.deposit(50)` |
      | A **question** | returns an answer, changes nothing | `account.can_pay(40)` |

      Keep the two apart. A question that also changes the object is a
      surprise for anyone who calls it.

      ## Rules in the methods

      An object has rules: a balance is never below 0, a glass never holds
      more than fits. Put each rule in the method that makes the change,
      and check it **before** the change:

      ```python
      def withdraw(self, amount):
          if amount > self.balance:
              raise ValueError("Not enough money.")
          self.balance = self.balance - amount
      ```

      The code that calls the method can catch the `ValueError` with
      `try` and `except`, as in lesson 30.
    keys:
      - code: "a command"
        means: "Changes the object: `deposit`, `withdraw`, `finish`."
      - code: "a question"
        means: "Gives back an answer: `can_pay`, `is_empty`."
      - code: "raise ValueError(...)"
        means: "Refuse a bad change. Do it before you change anything."

  # 3. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O2
    title: Commands, questions, and a no
    intro: |
      Press **Run** and watch the account. Then change the program in the
      ways below.
    code: |
      class Account:
          def __init__(self, owner):
              self.owner = owner
              self.balance = 0

          def deposit(self, amount):
              if amount <= 0:
                  raise ValueError("A deposit must be more than 0.")
              self.balance = self.balance + amount

          def withdraw(self, amount):
              if amount > self.balance:
                  raise ValueError("Not enough money.")
              self.balance = self.balance - amount

          def can_pay(self, price):
              return price <= self.balance

      account = Account("Ana")
      account.deposit(50)
      account.withdraw(20)
      print(account.balance)
      print(account.can_pay(40))
    experiments:
      - text: "Run it. Which methods changed the account, and which one only answered?"
        expr: "err is None and lines == ['30', 'False']"
      - text: "Add `account.withdraw(100)` at the end. What happens?"
        expr: "err == 'ValueError'"
      - text: "Put that line in `try:`, and in `except ValueError as error:` print the error. Is the balance still 30?"
        expr: "err is None and 'Not enough money.' in out and getattr(ns.get('account'), 'balance', None) == 30"
      - text: "Add `print(account)` at the end. Is that text useful?"
        expr: "err is None and any('Account object' in l for l in lines)"
    investigate:
      - kind: spot
        id: i-check
        prompt: "Which line checks that there is enough money for a withdrawal?"
        code: |
          class Account:
              def __init__(self, owner):
                  self.owner = owner
                  self.balance = 0

              def deposit(self, amount):
                  if amount <= 0:
                      raise ValueError("A deposit must be more than 0.")
                  self.balance = self.balance + amount

              def withdraw(self, amount):
                  if amount > self.balance:
                      raise ValueError("Not enough money.")
                  self.balance = self.balance - amount

              def can_pay(self, price):
                  return price <= self.balance

          account = Account("Ana")
          account.deposit(50)
          account.withdraw(20)
          print(account.balance)
          print(account.can_pay(40))
        line: 12
        wrong:
          - line: 17
            say: "`can_pay` answers the same question, but `withdraw` does not use it. Look inside `withdraw`."
          - line: 7
            say: "This check is in `deposit`: it stops amounts of 0 or less."
        explain: >-
          `withdraw` checks first, and raises an error before it changes the
          balance. So the balance can never go below 0.
      - kind: mcq
        id: i-too-much
        prompt: "After line 21, the balance is 30. You add `account.withdraw(100)`. What happens?"
        options:
          - text: "A `ValueError`: Not enough money. The balance stays 30"
            correct: true
            why: "The check comes before the change, so the balance is not touched."
          - text: "The balance becomes -70"
            why: "The method refuses: it raises an error before it subtracts."
          - text: "The balance becomes 0"
            why: "The method takes all or nothing. Here: nothing."

  # 4. EXERCISE: completion --------------------------------------------------
  - id: ex-glass
    type: exercise
    fade: completion
    objective: O2
    title: A glass that never overflows
    prompt: |
      A glass holds at most `capacity` ml. **Replace the two `___`**:

      - `pour` refuses water that would not fit, with a `ValueError`.
      - `drink` refuses more than the glass holds, with a `ValueError`
        and the message `There is not that much water.`

      A refused change must leave the water as it was.
    starter: |
      class Glass:
          def __init__(self, capacity):
              self.capacity = capacity
              self.water = 0

          def pour(self, ml):
              if ___:
                  raise ValueError("The glass would overflow.")
              self.water = self.water + ml

          def drink(self, ml):
              if ml > self.water:
                  ___
              self.water = self.water - ml

          def is_empty(self):
              return self.water == 0

      glass = Glass(250)
      glass.pour(200)
      glass.drink(50)
      print(glass.water, glass.is_empty())
    solution: |
      class Glass:
          def __init__(self, capacity):
              self.capacity = capacity
              self.water = 0

          def pour(self, ml):
              if self.water + ml > self.capacity:
                  raise ValueError("The glass would overflow.")
              self.water = self.water + ml

          def drink(self, ml):
              if ml > self.water:
                  raise ValueError("There is not that much water.")
              self.water = self.water - ml

          def is_empty(self):
              return self.water == 0

      glass = Glass(250)
      glass.pour(200)
      glass.drink(50)
      print(glass.water, glass.is_empty())
    after: >-
      The check comes before the change, so a refused pour or drink leaves
      the glass as it was. Nobody can see a glass with 300 ml in a 250 ml
      glass.
    checks:
      - expr: "callable(ns.get('Glass')) and (lambda g: (g.pour(200), raises(g.pour, 60) == 'ValueError' and g.water == 200 and raises(g.pour, 50) is None and g.water == 250)[1])(Glass(250))"
        pass: "`pour` refuses water that does not fit, and then the water stays the same"
        hint: "The glass overflows when `self.water + ml > self.capacity`."
        misconceptions:
          - when: "callable(ns.get('Glass')) and (lambda g: (g.pour(200), raises(g.pour, 60) == 'ValueError' and g.water != 200)[1])(Glass(250))"
            say: "The pour is refused, but the water has changed already. Check first, and add only when the check passes."
          - when: "callable(ns.get('Glass')) and (lambda g: (g.pour(200), raises(g.pour, 60) is None)[1])(Glass(250))"
            say: "200 ml plus 60 ml is more than 250 ml, but `pour` took it. Compare the new total with the capacity: `self.water + ml > self.capacity`."
          - when: "callable(ns.get('Glass')) and (lambda g: (g.pour(200), raises(g.pour, 50) == 'ValueError')[1])(Glass(250))"
            say: "Exactly full is fine: 200 + 50 is 250. Use `>`, not `>=`."
      - expr: "callable(ns.get('Glass')) and (lambda g: (g.pour(100), raises(g.drink, 101) == 'ValueError' and g.water == 100)[1])(Glass(250))"
        pass: "`drink` refuses more than the glass holds, and the water stays the same"
        hint: "`raise ValueError(\"There is not that much water.\")`."
        misconceptions:
          - when: "callable(ns.get('Glass')) and (lambda g: (g.pour(100), raises(g.drink, 101) is None)[1])(Glass(250))"
            say: "`drink` must stop with `raise`, not only print or return. Then the line that subtracts never runs."
      - expr: "err is None and lines == ['150 False']"
        pass: "It prints `150 False`"
        hint: "Keep the lines at the end as they are."
    hints:
      - "The first `___` is a comparison: the water after pouring, against the capacity."
      - "`self.water + ml > self.capacity`."
      - "The second `___`: `raise ValueError(\"There is not that much water.\")`."

  # 5. THEORY ----------------------------------------------------------------
  - id: str
    type: theory
    objective: O3
    title: Clear text, and many objects
    body: |
      `print(account)` shows `<__main__.Account object at 0x7f3a...>`. A
      method `__str__` gives your own text instead. It must **return** the
      text:

      ```python
      def __str__(self):
          return f"{self.owner}: {self.balance} euro"
      ```

      Then `print(account)`, `f"{account}"` and `str(account)` all show
      `Ana: 30 euro`.

      ## Many objects

      Objects go into lists like any value. A loop works with each one:

      ```python
      accounts = [Account("Ana"), Account("Ben")]
      accounts[0].deposit(50)
      for account in accounts:
          print(account)
      total = sum(a.balance for a in accounts)
      ```
    keys:
      - code: "def __str__(self):"
        means: "The text that `print` shows. It returns a `str`."
      - code: "for account in accounts:"
        means: "Each object of the list, one after the other."
      - code: "sum(a.balance for a in accounts)"
        means: "One attribute of every object, added up."

  # 6. PREDICT ---------------------------------------------------------------
  - id: predict-str
    type: predict
    objective: O3
    title: What does print show?
    item:
      kind: predict
      id: p-str
      prompt: "**What does this program print?**"
      code: |
        class Song:
            def __init__(self, title, seconds):
                self.title = title
                self.seconds = seconds

            def __str__(self):
                return f"{self.title} ({self.seconds // 60} min)"

        print(Song("Intro", 150))
      explain: >-
        `print` calls `__str__` and shows the text that it returns. 150 // 60
        is 2.
      misconceptions:
        - answer: "Intro (150 min)"
          say: "`//` divides and drops the rest: 150 // 60 is 2."
        - answer: "Intro (2.5 min)"
          say: "`//` gives a whole number. `/` would give 2.5."

  # 7. EXERCISE: debug -------------------------------------------------------
  - id: ex-str
    type: exercise
    fade: debug
    objective: O3
    title: A __str__ that prints
    prompt: |
      This program should print:

      ```
      21.5 °C
      Today: 21.5 °C
      ```

      **Run it**, read the message, and fix `__str__`.
    starter: |
      class Temperature:
          def __init__(self, degrees):
              self.degrees = degrees

          def __str__(self):
              print(f"{self.degrees} °C")

      today = Temperature(21.5)
      print(today)
      print("Today:", today)
    solution: |
      class Temperature:
          def __init__(self, degrees):
              self.degrees = degrees

          def __str__(self):
              return f"{self.degrees} °C"

      today = Temperature(21.5)
      print(today)
      print("Today:", today)
    after: >-
      `__str__` only makes the text. The code that calls `print` decides
      where it goes: the screen, a file, or a longer line.
    checks:
      - expr: "err is None and lines == ['21.5 °C', 'Today: 21.5 °C']"
        pass: "It prints both lines"
        hint: "`__str__` must give the text back with `return`."
        misconceptions:
          - when: "err is None and lines[:1] != ['21.5 °C']"
            say: "The text must be exactly `21.5 °C`: the number, a space, and `°C`."
          - when: "err == 'TypeError'"
            say: "`__str__` printed the text and gave back `None`. `print` needs a text from it: write `return f\"...\"` instead of `print(...)`."
      - expr: "isinstance(ns.get('Temperature'), type) and str(Temperature(-3)) == '-3 °C' and f'{Temperature(10)}' == '10 °C'"
        pass: "`str()` of any temperature is its text"
        hint: "Return `f\"{self.degrees} °C\"`."
    hints:
      - "Read the last line of the message: what did `__str__` return?"
      - "A function that only prints gives back `None`."
      - "Change `print(...)` in `__str__` to `return f\"{self.degrees} °C\"`."

  # 8. EXERCISE: independent -------------------------------------------------
  - id: ex-tasks
    type: exercise
    fade: independent
    objective: O4
    title: A list of tasks
    prompt: |
      **Write a class `Task` and a function `open_tasks(tasks)`.**

      - `Task("Buy milk")` has the title `"Buy milk"`, and `done` is
        `False`.
      - `finish()` makes `done` `True`.
      - `str()` of a task is `[ ] Buy milk`, or `[x] Buy milk` when it is
        done.
      - `open_tasks(tasks)` gives back how many tasks of the list are not
        done.

      The lines at the end must print:

      ```
      [ ] Buy milk
      [x] Call Ana
      [ ] Read a book
      2 open
      ```
    starter: |
      # Write the class Task and the function open_tasks here.


      tasks = [Task("Buy milk"), Task("Call Ana"), Task("Read a book")]
      tasks[1].finish()
      for task in tasks:
          print(task)
      print(open_tasks(tasks), "open")
    solution: |
      class Task:
          def __init__(self, title):
              self.title = title
              self.done = False

          def finish(self):
              self.done = True

          def __str__(self):
              mark = "x" if self.done else " "
              return f"[{mark}] {self.title}"

      def open_tasks(tasks):
          return sum(1 for task in tasks if not task.done)

      tasks = [Task("Buy milk"), Task("Call Ana"), Task("Read a book")]
      tasks[1].finish()
      for task in tasks:
          print(task)
      print(open_tasks(tasks), "open")
    after: >-
      Each task knows its own state and how to show it. The loop and
      `open_tasks` only ask the tasks: they never need to know how a task
      keeps its data.
    checks:
      - expr: "isinstance(ns.get('Task'), type) and (lambda t: t.title == 'Walk' and t.done is False and str(t) == '[ ] Walk')(Task('Walk'))"
        pass: "A new task is not done, and shows `[ ] title`"
        hint: "`self.done = False` in `__init__`, and a `__str__` that returns `[ ] ` and the title."
        misconceptions:
          - when: "isinstance(ns.get('Task'), type) and raises(str, Task('Walk')) == 'TypeError'"
            say: "`__str__` must return the text, not print it."
          - when: "isinstance(ns.get('Task'), type) and raises(str, Task('Walk')) is None and str(Task('Walk')) == '[] Walk'"
            say: "An open task has a space between the brackets: `[ ] Walk`."
          - when: "isinstance(ns.get('Task'), type) and raises(str, Task('Walk')) is None and str(Task('Walk')).startswith('<')"
            say: "`print` shows the default text: the class has no `__str__`. Check the name: two underscores on each side."
      - expr: "isinstance(ns.get('Task'), type) and (lambda t: (t.finish(), t.finish(), t.done is True and str(t) == '[x] Walk')[2])(Task('Walk'))"
        pass: "`finish()` marks the task as done, and it shows `[x] title`"
        hint: "`finish` sets `self.done = True`. In `__str__`, use `x` when `self.done` is `True`."
        misconceptions:
          - when: "isinstance(ns.get('Task'), type) and (lambda t: (t.finish(), t.finish(), t.done)[2])(Task('Walk')) is False"
            say: "Two calls of `finish()` make the task not done again. `finish` must set `self.done = True`, not switch it with `not`."
      - expr: "callable(ns.get('open_tasks')) and isinstance(ns.get('Task'), type) and (lambda a, b, c: (b.finish(), open_tasks([a, b, c]) == 2 and open_tasks([]) == 0 and open_tasks([b]) == 0)[1])(Task('A'), Task('B'), Task('C'))"
        pass: "`open_tasks` counts the tasks that are not done"
        hint: "Count the tasks where `not task.done`."
      - expr: "err is None and lines == ['[ ] Buy milk', '[x] Call Ana', '[ ] Read a book', '2 open']"
        pass: "It prints the list as shown"
        hint: "Keep the lines at the end. Check the spaces inside `[ ]`."
    hints:
      - "Start with `class Task:` and `__init__(self, title)` with two attributes."
      - "`__str__`: `mark = \"x\" if self.done else \" \"`, then `return f\"[{mark}] {self.title}\"`."
      - "`open_tasks`: a loop with a counter, or `sum(1 for task in tasks if not task.done)`."

  # PUZZLE: put the lines in order (Parsons) ----------------------------
  - id: order
    type: drill
    objective: O2
    title: Put the lines in order
    items:
      - kind: order
        id: o-deposit
        objective: O2
        code: |
          class Account:
              def __init__(self):
                  self.balance = 0
              def deposit(self, amount):
                  if amount <= 0:
                      raise ValueError("amount must be positive")
                  self.balance = self.balance + amount
          acc = Account()
          acc.deposit(50)
          print(acc.balance)
        explain: >-
          The method checks the value **before** it changes the balance. If the
          check came after the change, a bad amount would already be in the
          account when the error comes.

  # 9. QUIZ ------------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: mcq
        id: q-kind
        objective: O1
        prompt: "`glass.is_empty()` gives `True` or `False`. What kind of method is it?"
        options:
          - text: "A question: it answers, and changes nothing"
            correct: true
            why: "A question returns a value and leaves the object as it was."
          - text: "A command: it changes the glass"
            why: "It only reads `self.water`."
          - text: "Neither: it is an attribute"
            why: "It has parentheses: it is a method call."
      - kind: mcq
        id: q-order
        objective: O2
        prompt: "Why does `withdraw` check the balance **before** it subtracts?"
        options:
          - text: "So a refused change leaves the object as it was"
            correct: true
            why: "`raise` stops the method, and the subtraction never runs."
          - text: "Because Python runs methods from the bottom up"
            why: "Methods run from the top down, like all code."
          - text: "It makes no difference"
            why: "After the subtraction, the balance would already be wrong."
      - kind: mcq
        id: q-str-return
        objective: O3
        prompt: "What must `__str__` do?"
        options:
          - text: "Return the text that shows the object"
            correct: true
            why: "`print`, `str()` and f-strings use the returned text."
          - text: "Print the object"
            why: "Then it returns `None`, and `print(obj)` fails with a `TypeError`."
          - text: "Change the object into a text"
            why: "The object stays as it is. `__str__` only describes it."
      - kind: mcq
        id: q-list
        objective: O4
        prompt: "`accounts` is a list of `Account` objects. Which line adds up all balances?"
        options:
          - text: "`sum(a.balance for a in accounts)`"
            correct: true
            why: "One attribute of each object, added up."
          - text: "`sum(accounts)`"
            why: "Python cannot add up `Account` objects."
          - text: "`accounts.balance`"
            why: "A list has no attribute `balance`. Each object has one."
      - kind: mcq
        id: q-catch
        objective: O2
        prompt: "`account.withdraw(100)` raises `ValueError`. How does the program go on?"
        options:
          - text: "Put the call in `try:` and handle it in `except ValueError:`"
            correct: true
            why: "The method says no, and the caller decides what to do."
          - text: "Change `withdraw` so it never raises"
            why: "Then the account could hold a wrong balance."
          - text: "It cannot: the program must stop"
            why: "`try` and `except` catch the error."

  # 10. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O3
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-state
    objective: O1
    prompt: "What is the state of an object?"
    options:
      - text: "The values of its attributes right now"
        correct: true
        why: "Commands change it, questions read it."
      - text: "Its class"
        why: "The class is the plan. The state is in each object."
      - text: "The lines of its methods"
        why: "The methods are the same for all objects of the class."
  - kind: mcq
    id: r-refuse
    objective: O2
    prompt: "A method gets a value that would break a rule of the object. What does it do?"
    options:
      - text: "`raise ValueError(...)`, before it changes anything"
        correct: true
        why: "The object stays valid, and the caller learns why."
      - text: "Change the value, then print a warning"
        why: "Then the object already holds the wrong value."
      - text: "Return `None` and say nothing"
        why: "The caller would never know that the change did not happen."
  - kind: mcq
    id: r-str
    objective: O3
    prompt: "Which method makes `print(task)` show `[x] Walk`?"
    options:
      - text: "`__str__`, with `return`"
        correct: true
        why: "`print` uses the text that `__str__` returns."
      - text: "`__init__`"
        why: "`__init__` sets the first attributes. It does not make text."
      - text: "`print_task`"
        why: "A method with any other name is not used by `print`."
  - kind: mcq
    id: r-loop
    objective: O4
    prompt: "`tasks` is a list of `Task` objects. What does `for task in tasks: task.finish()` do?"
    options:
      - text: "It finishes every task of the list"
        correct: true
        why: "`task` is each object in turn, and `finish()` changes it."
      - text: "It finishes only the last task"
        why: "The method runs once for each object."
      - text: "Nothing: the list keeps copies"
        why: "The list holds the objects themselves."
  - kind: mcq
    id: r-str-error
    objective: O3
    prompt: "`print(t)` says `TypeError: __str__ returned non-string (type NoneType)`. What is wrong?"
    options:
      - text: "`__str__` prints instead of returning the text"
        correct: true
        why: "A function without `return` gives back `None`."
      - text: "`t` is not an object"
        why: "`print` found a `__str__` on it, so it is an object."
      - text: "The text is too long"
        why: "Any length is fine. It must be a `str`."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-account
    type: exercise
    fade: completion
    objective: O2
    title: No money, no withdrawal
    prompt: |
      **Replace the two `___`**: `withdraw` refuses an amount bigger than
      the balance with a `ValueError`, **before** it changes anything.

      ```text
      70
      Not enough money: 70 left
      70
      ```
    starter: |
      class Account:
          def __init__(self, balance):
              self.balance = balance

          def withdraw(self, amount):
              if ___:
                  raise ___
              self.balance = self.balance - amount


      acc = Account(100)
      acc.withdraw(30)
      print(acc.balance)
      try:
          acc.withdraw(500)
      except ValueError as error:
          print(error)
      print(acc.balance)
    solution: |
      class Account:
          def __init__(self, balance):
              self.balance = balance

          def withdraw(self, amount):
              if amount > self.balance:
                  raise ValueError(f"Not enough money: {self.balance} left")
              self.balance = self.balance - amount


      acc = Account(100)
      acc.withdraw(30)
      print(acc.balance)
      try:
          acc.withdraw(500)
      except ValueError as error:
          print(error)
      print(acc.balance)
    after: >-
      Check first, change after. If the change came first, a refused
      withdrawal would still have taken the money.
    checks:
      - expr: "callable(ns.get('Account')) and (lambda a: (a.withdraw(40), a.balance)[1])(Account(50)) == 10"
        pass: "A normal withdrawal takes the money"
        hint: "Keep the last line of `withdraw`."
      - expr: "callable(ns.get('Account')) and (lambda a: (raises(a.withdraw, 60), a.balance))(Account(50)) == ('ValueError', 50)"
        pass: "Too much: ValueError, and the balance stays"
        hint: "`if amount > self.balance: raise ValueError(...)`."
        misconceptions:
          - when: "callable(ns.get('Account')) and (lambda a: (raises(a.withdraw, 60), a.balance))(Account(50))[1] == -10"
            say: "The money is taken before the error. Check first, then change."
      - expr: "err is None and lines == ['70', 'Not enough money: 70 left', '70']"
        pass: "It prints 70, the message, and 70"
        hint: "`ValueError(f\"Not enough money: {self.balance} left\")`."
    hints:
      - "The test: is the amount bigger than the balance?"
      - "`if amount > self.balance:`"
      - "`raise ValueError(f\"Not enough money: {self.balance} left\")`."
  - id: x-temp-str
    type: exercise
    fade: independent
    objective: O3
    title: A clear print
    prompt: |
      **Write the class `Temperature`**: it keeps `celsius`, and `print`
      shows it like `21.5 °C`.

      ```text
      21.5 °C
      -3.0 °C
      ```
    starter: |
      # Your class here.


      print(Temperature(21.5))
      print(Temperature(-3.0))
    solution: |
      class Temperature:
          def __init__(self, celsius):
              self.celsius = celsius

          def __str__(self):
              return f"{self.celsius} °C"


      print(Temperature(21.5))
      print(Temperature(-3.0))
    after: >-
      `print` calls `__str__` for you. Without it, you would see something
      like `<Temperature object at 0x...>`.
    checks:
      - expr: "callable(ns.get('Temperature')) and Temperature(7.5).celsius == 7.5"
        pass: "It keeps celsius"
        hint: "`self.celsius = celsius` in `__init__`."
      - expr: "callable(ns.get('Temperature')) and str(Temperature(7.5)) == '7.5 °C'"
        pass: "str() shows the value with °C"
        hint: "`def __str__(self): return f\"{self.celsius} °C\"`."
        misconceptions:
          - when: "callable(ns.get('Temperature')) and raises(str, Temperature(7.5)) == 'TypeError'"
            say: "`__str__` must give back a text with `return`, not print it."
      - expr: "lines == ['21.5 °C', '-3.0 °C']"
        pass: "print shows both temperatures"
        hint: "Keep the prints."
    hints:
      - "A class with `__init__` and `__str__`."
      - "`__str__` returns a text."
      - "`return f\"{self.celsius} °C\"`."
