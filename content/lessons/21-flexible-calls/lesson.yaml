id: flexible-calls
order: 21
title: "zip, *args and **kwargs"
summary: Walk two lists side by side, and write functions that take any number of values.
minutes: 30
outcomes: [A1, A3]

objectives:
  - id: O1
    text: Walk two lists side by side with zip, and build a dictionary from two lists
  - id: O2
    text: Write a function that takes any number of values with *args
  - id: O3
    text: Take named values with **kwargs, and open a list or a dictionary in a call with * and **

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: pairs
    type: theory
    objective: O1
    title: Two lists, side by side
    body: |
      Often two lists belong together: the first name goes with the first
      score, the second with the second, and so on.

      ```python
      names = ["Ana", "Ben", "Cleo"]
      scores = [7, 9, 4]

      for name, score in zip(names, scores):
          print(name, score)
      ```

      `zip` makes **pairs**: the first value of each list, then the second
      of each, and so on. Each pair is a tuple, so the `for` line can unpack
      it into two names, as you did with `.items()` of a dictionary.

      `zip` stops at the end of the **shortest** list. Values that have no
      partner are left out, with no error.

      Pairs are also what `dict()` needs:

      ```python
      dict(zip(names, scores))    # {'Ana': 7, 'Ben': 9, 'Cleo': 4}
      ```
    keys:
      - code: "zip(names, scores)"
        means: "Pairs: (first, first), (second, second), ..."
      - code: "for name, score in zip(a, b):"
        means: "Each pair is unpacked into two names."
      - code: "dict(zip(keys, values))"
        means: "A dictionary from two lists."

  # 2. PREDICT ---------------------------------------------------------------
  - id: predict-short
    type: predict
    objective: O1
    title: One list is shorter
    item:
      kind: predict
      id: p-short
      prompt: "**What does this program print?**"
      code: |
        cities = ["Oslo", "Rome", "Lima"]
        temps = [3, 18]
        for city, temp in zip(cities, temps):
            print(city, temp)
      explain: >-
        `zip` stops at the end of the shortest list. `temps` has two values,
        so there are two pairs. Lima has no partner and is left out, with no
        error.
      misconceptions:
        - answer: "Oslo 3\nRome 18\nLima None"
          say: "`zip` does not fill the gap with `None`. It stops when the shortest list ends."

  # 3. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O1
    title: Pairs and a dictionary
    intro: |
      Press **Run**, and watch `name` and `score` change together in each
      round. Then try the changes below.
    code: |
      names = ["Ana", "Ben", "Cleo"]
      scores = [7, 9, 4]

      for name, score in zip(names, scores):
          print(f"{name}: {score}")

      table = dict(zip(names, scores))
      print(table["Ben"])
    experiments:
      - text: "Run it as it is."
        expr: "err is None and 'Ana: 7' in lines"
      - text: "Add a fourth name, `\"Dan\"`, to `names`, but no score. How many lines does the loop print now?"
        expr: "err is None and len(ns.get('names', [])) == 4 and len(ns.get('scores', [])) == 3"
      - text: "At the end, add `print(list(zip(names, scores)))` to see the pairs themselves."
        expr: "err is None and \"('Ana', 7)\" in out"
      - text: "Print the whole dictionary: `print(table)`."
        expr: "err is None and \"'Ben': 9\" in out"
    investigate:
      - kind: spot
        id: i-dict
        prompt: "Which line makes the pairs into a dictionary?"
        code: |
          names = ["Ana", "Ben", "Cleo"]
          scores = [7, 9, 4]

          for name, score in zip(names, scores):
              print(f"{name}: {score}")

          table = dict(zip(names, scores))
          print(table["Ben"])
        line: 7
        wrong:
          - line: 4
            say: "This line uses `zip` too, but it only walks the pairs. It keeps nothing."
          - line: 8
            say: "This line reads the dictionary. It was made before."
        explain: >-
          `zip` gives the pairs, and `dict()` turns pairs into keys and
          values: `{'Ana': 7, 'Ben': 9, 'Cleo': 4}`.
      - kind: mcq
        id: i-longer
        prompt: "`scores` gets a fourth value, `5`, but `names` still has three names. What does the loop do?"
        options:
          - text: "It runs three times. The `5` has no partner, so it is left out"
            correct: true
            why: "`zip` stops at the end of the shortest list, here `names`."
          - text: "It runs four times, with `None` as the fourth name"
            why: "`zip` never adds `None`. It stops."
          - text: "It stops with an error, because the lists are not equally long"
            why: "There is no error: `zip` stops at the shortest list."

  # 4. TRACE -----------------------------------------------------------------
  - id: trace
    type: drill
    objective: O1
    title: Be the computer
    items:
      - kind: trace
        id: t-zip
        objective: O1
        code: |
          names = ["Ana", "Ben"]
          ages = [30, 25]
          total = 0
          for name, age in zip(names, ages):
              total = total + age
              print(name, total)
        names: [name, age, total]
        explain: >-
          Each round of the loop takes one pair: first `('Ana', 30)`, then
          `('Ben', 25)`. The `for` line gives `name` and `age` their new
          values together. `total` grows by the age of each round.

  # 5. EXERCISE: completion --------------------------------------------------
  - id: ex-prices
    type: exercise
    fade: completion
    objective: O1
    title: Products and their costs
    prompt: |
      **Replace the two `___`**, so that the loop prints each product with
      its cost, and `prices` is a dictionary from product to cost.
    starter: |
      products = ["tea", "cake", "milk"]
      costs = [2.5, 4.0, 1.5]

      for product, cost in ___:
          print(f"{product} costs {cost}")

      prices = ___
      print(prices[products[1]])
    solution: |
      products = ["tea", "cake", "milk"]
      costs = [2.5, 4.0, 1.5]

      for product, cost in zip(products, costs):
          print(f"{product} costs {cost}")

      prices = dict(zip(products, costs))
      print(prices[products[1]])
    after: >-
      `zip` is the clean way to walk lists that belong together. Without it,
      you need an index: `for i in range(len(products))`, and then
      `products[i]` and `costs[i]`. That is longer and easier to get wrong.
    cases:
      - {}
      - label: "other products"
        set: { products: ["pen", "ink"], costs: [1.2, 3] }
    checks:
      - expr: "err is None and lines[:len(products)] == [f'{p} costs {c}' for p, c in zip(products, costs)]"
        pass: "The loop prints each product with its cost"
        hint: "Walk both lists together: `zip(products, costs)`."
        misconceptions:
          - when: "err == 'ValueError'"
            say: "`for product, cost in products` tries to split each word into two names. Walk the two lists together with `zip(products, costs)`."
      - expr: "isinstance(ns.get('prices'), dict) and prices == dict(zip(products, costs))"
        pass: "`prices` is a dictionary: product → cost"
        hint: "`dict()` turns pairs into a dictionary: `dict(zip(products, costs))`."
        misconceptions:
          - when: "ns.get('prices') is not None and not isinstance(ns.get('prices'), dict)"
            say: "`zip(...)` alone gives pairs, not a dictionary. Put `dict( )` around it."
      - expr: "err is None and lines[-1] == str(costs[1])"
        pass: "The last line prints the cost of the second product"
        hint: "Keep the last line as it is."
    hints:
      - "The first `___` gives the pairs: `zip(products, costs)`."
      - "The second `___` is a dictionary made from the same pairs."
      - "`prices = dict(zip(products, costs))`."

  # 6. THEORY ----------------------------------------------------------------
  - id: stars
    type: theory
    objective: O2
    title: Any number of values
    body: |
      ## *args: any number of values

      ```python
      def total(*numbers):
          return sum(numbers)

      total(2, 3)       # 5
      total(1, 2, 3, 4) # 10
      total()           # 0
      ```

      The star collects all the values of the call into **one tuple**. The
      name is free; `args` is the usual one.

      ## **kwargs: any named values

      ```python
      def profile(name, **facts):
          print(name, facts)

      profile("Ana", age=30, city="Oslo")
      # Ana {'age': 30, 'city': 'Oslo'}
      ```

      Two stars collect the **named** values into a dictionary, in the
      order of the call. The usual name is `kwargs` (keyword arguments).

      ## Stars in a call

      In a call, a star does the opposite: it opens a collection.
      `total(*[2, 3, 4])` is the same as `total(2, 3, 4)`, and
      `profile("Ana", **{"age": 30})` is `profile("Ana", age=30)`.

      ## After the star

      A parameter after `*numbers` can only get a value by its name:
      `def total(*numbers, start=0)`, called as `total(1, 2, start=10)`.
      Now you can read the docs of `print`: `print(*objects, sep=' ',
      end='\n')`. Any number of objects, then `sep` and `end` by name.
    keys:
      - code: "def total(*numbers):"
        means: "All values of the call go into the tuple `numbers`."
      - code: "def profile(name, **facts):"
        means: "All named values go into the dictionary `facts`."
      - code: "total(*scores)"
        means: "Opens the list: each value becomes its own argument."
      - code: "profile(**info)"
        means: "Opens the dictionary: each key becomes a named argument."

  # 7. WORKED ----------------------------------------------------------------
  - id: worked
    type: worked
    objective: O2
    title: A receipt for any number of prices
    problem: |
      Write `receipt(*prices, tax=0.2)`: it takes any number of prices and
      gives back the total with the tax. Then use it in two ways.
    lines:
      - goal: Take any number of prices
        code: "def receipt(*prices, tax=0.2):"
        note: "`prices` collects every value of the call in a tuple. `tax` comes after the star, so a call can only give it by name."
      - goal: Compute
        code: "    subtotal = sum(prices)"
        note: "`sum` works on a tuple as on a list. With no prices, it is 0."
      - code: "    return subtotal * (1 + tax)"
        note: "A tax of 0.2 makes the total 1.2 times the subtotal."
      - goal: Use it
        code: "print(receipt(2.5, 4))"
        note: "Two prices: `prices` is `(2.5, 4)`. It prints `7.8`."
      - code: "basket = [1, 2, 3]"
        note: "Prices that are already in a list."
      - code: "print(receipt(*basket, tax=0))"
        note: "The star opens the list: the same as `receipt(1, 2, 3, tax=0)`. It prints `6`."
    check:
      kind: mcq
      id: w-named
      prompt: "Why does the last call write `tax=0`, and not only `0`?"
      options:
        - text: "Every value without a name goes into `prices`. Only a name reaches `tax`"
          correct: true
          why: "After `*prices`, a parameter is only reached by its name. `receipt(1, 2, 0)` would count 0 as a price."
        - text: "Because `tax` has a default value"
          why: "A default alone does not need a name: `def f(a, b=1)` can be called as `f(1, 2)`. Here, the star is the reason."
        - text: "Python needs names in every call"
          why: "Most calls use no names. Here, the star in front of `prices` takes all values without a name."

  # 8. EXERCISE: debug -------------------------------------------------------
  - id: ex-average
    type: exercise
    fade: debug
    objective: O2
    title: One value too few
    prompt: |
      `average` takes any number of values. The program should print the
      average of `scores` and then `5.0`. **Run it**, read the message, and
      fix the program. Keep `average` as it is: the second call needs it.
    starter: |
      def average(*numbers):
          return sum(numbers) / len(numbers)

      scores = [7, 9, 5]
      print(average(scores))
      print(average(4, 6))
    solution: |
      def average(*numbers):
          return sum(numbers) / len(numbers)

      scores = [7, 9, 5]
      print(average(*scores))
      print(average(4, 6))
    after: >-
      Without the star, the call gives one value: the list itself. Then
      `numbers` is `([7, 9, 5],)`, a tuple with one list in it, and `sum`
      cannot add a list to 0. With `*scores`, the call gives three values.
    cases:
      - {}
      - label: "scores = [1, 2, 3, 6]"
        set: { scores: [1, 2, 3, 6] }
    checks:
      - expr: "err is None and lines[0] == str(sum(scores) / len(scores))"
        pass: "The first line is the average of `scores`"
        hint: "Open the list in the call: `average(*scores)`."
        misconceptions:
          - when: "err == 'TypeError'"
            say: "`average` gets the whole list as ONE value, so `numbers` is `([7, 9, 5],)`. Open the list in the call: `average(*scores)`."
      - expr: "callable(ns.get('average')) and raises(average, 1, 2, 3) is None and average(1, 2, 3) == 2"
        pass: "`average` still takes any number of values"
        hint: "Keep `def average(*numbers):` with its star."
        misconceptions:
          - when: "callable(ns.get('average')) and raises(average, 1, 2, 3) == 'TypeError'"
            say: "Now `average` takes only one value, and `average(4, 6)` fails. Keep the star in `def average(*numbers):` and put a star in the first call instead."
      - expr: "err is None and len(lines) == 2 and lines[1] == '5.0'"
        pass: "The second line is `5.0`"
        hint: "Keep `print(average(4, 6))`."
    hints:
      - "Look at the last line of the message: it is a `TypeError` inside `average`. What is `numbers` in this call?"
      - "`numbers` is a tuple with one value: the list. The call must give the values one by one."
      - "Write `average(*scores)`."

  # 9. EXERCISE: independent -------------------------------------------------
  - id: ex-describe
    type: exercise
    fade: independent
    objective: O3
    title: A name and its facts
    prompt: |
      **Write `describe(name, **facts)`.** It gives back a text:

      - with no facts, only the name: `describe("Ben")` is `"Ben"`;
      - with facts, the name and the facts in parentheses, in the order of
        the call: `describe("Ana", age=30, city="Oslo")` is
        `"Ana (age: 30, city: Oslo)"`.

      The lines at the end must print:

      ```
      Ana (age: 30, city: Oslo)
      Ben
      Cleo (job: pilot)
      ```
    starter: |
      # Write describe here.


      print(describe("Ana", age=30, city="Oslo"))
      print(describe("Ben"))
      info = {"job": "pilot"}
      print(describe("Cleo", **info))
    solution: |
      def describe(name, **facts):
          if not facts:
              return name
          parts = []
          for key, value in facts.items():
              parts.append(f"{key}: {value}")
          return name + " (" + ", ".join(parts) + ")"


      print(describe("Ana", age=30, city="Oslo"))
      print(describe("Ben"))
      info = {"job": "pilot"}
      print(describe("Cleo", **info))
    after: >-
      `facts` is a normal dictionary, so `.items()` gives each key and value.
      In the last call, `**info` opens the dictionary into named values:
      `describe("Cleo", job="pilot")`.
    checks:
      - expr: "callable(ns.get('describe')) and bool(describe.__code__.co_flags & 8)"
        pass: "`describe` collects named values with `**facts`"
        hint: "Start with `def describe(name, **facts):`."
      - expr: "callable(ns.get('describe')) and raises(describe, 'X') is None and describe('X') == 'X'"
        pass: "With no facts, it gives back only the name"
        hint: "`if not facts: return name`. An empty dictionary counts as False."
        misconceptions:
          - when: "callable(ns.get('describe')) and raises(describe, 'X') is None and describe('X') == 'X ()'"
            say: "With no facts, give back only the name, without the parentheses: `if not facts: return name`."
      - expr: "callable(ns.get('describe')) and raises(describe, 'X', a=1) is None and describe('X', a=1) == 'X (a: 1)' and describe('Y', b='z', a=2) == 'Y (b: z, a: 2)'"
        pass: "The facts come in parentheses, in the order of the call"
        hint: "Make a list of texts like `f\"{key}: {value}\"`, then join them with `\", \"`."
        misconceptions:
          - when: "callable(ns.get('describe')) and raises(describe, 'X', a=1) is None and describe('X', a=1) == \"X ({'a': 1})\""
            say: "That is the dictionary as Python prints it. Build the text from each key and value: `f\"{key}: {value}\"`."
      - expr: "err is None and lines == ['Ana (age: 30, city: Oslo)', 'Ben', 'Cleo (job: pilot)']"
        pass: "It prints the three lines"
        hint: "Keep the lines at the end as they are."
    hints:
      - "`def describe(name, **facts):`. Inside, `facts` is a dictionary like `{'age': 30, 'city': 'Oslo'}`."
      - "First the case with no facts: `if not facts: return name`."
      - "Then: `parts = []`, and for each `key, value in facts.items()`, append `f\"{key}: {value}\"`. Return `name + \" (\" + \", \".join(parts) + \")\"`."

  # 10. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: blanks
        id: q-fill-zip
        objective: O2
        prompt: "**Fill in the blanks** so the program prints `Ann 7`, `Bo 9` and `6`."
        code: |
          names = ["Ann", "Bo"]
          scores = [7, 9]
          for name, score in [?zip?](names, scores):
              print(name, score)


          def total([?*numbers?]):
              return sum(numbers)


          print(total(1, 2, 3))
        explain: "`zip` walks both lists side by side. `*numbers` takes any number of values, as a tuple."
        misconceptions:
          - blank: 2
            answer: "numbers"
            say: "Without `*`, the function takes exactly one value, and `total(1, 2, 3)` gives a TypeError."
      - kind: mcq
        id: q-zip
        objective: O1
        prompt: "What is `list(zip([1, 2, 3], ['a', 'b']))`?"
        options:
          - text: "`[(1, 'a'), (2, 'b')]`"
            correct: true
            why: "`zip` makes pairs, and stops at the shortest list."
          - text: "`[(1, 'a'), (2, 'b'), (3, None)]`"
            why: "`zip` does not fill a gap with `None`."
          - text: "`[1, 'a', 2, 'b', 3]`"
            why: "`zip` makes pairs (tuples), not one flat list."
      - kind: mcq
        id: q-args-type
        objective: O2
        prompt: "`def f(*values): print(values)`. What does `f(4, 5)` print?"
        options:
          - text: "`(4, 5)`"
            correct: true
            why: "The star collects the values into a tuple."
          - text: "`[4, 5]`"
            why: "It is a tuple, with round brackets, not a list."
          - text: "`4 5`"
            why: "That is what `print(*values)` would print. `print(values)` prints the tuple."
      - kind: mcq
        id: q-kwargs-type
        objective: O3
        prompt: "`def f(**options): ...`. What is `options` in the call `f(size=2, color='red')`?"
        options:
          - text: "The dictionary `{'size': 2, 'color': 'red'}`"
            correct: true
            why: "Two stars collect the named values into a dictionary."
          - text: "The tuple `(2, 'red')`"
            why: "One star collects values without names into a tuple. Two stars collect named values, with their names."
          - text: "An error: the function has no parameter `size`"
            why: "`**options` takes any named value."
      - kind: mcq
        id: q-open
        objective: O3
        prompt: "`nums = [3, 1, 2]`. Which call is the same as `max(3, 1, 2)`?"
        options:
          - text: "`max(*nums)`"
            correct: true
            why: "The star in a call opens the list into three values."
          - text: "`max(**nums)`"
            why: "Two stars open a dictionary, not a list."
          - text: "`max(nums[0])`"
            why: "That gives only one value, `3`."
      - kind: mcq
        id: q-after-star
        objective: O2
        prompt: "`def total(*numbers, start=0)`. How do you give `start` the value 10?"
        options:
          - text: "`total(1, 2, start=10)`"
            correct: true
            why: "After the star, a parameter is only reached by its name."
          - text: "`total(1, 2, 10)`"
            why: "Then 10 is one more number in `numbers`, and `start` stays 0."
          - text: "`total(start=10, 1, 2)`"
            why: "In a call, values without a name come first. This is a SyntaxError."

  # 11. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O2
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-zip-short
    objective: O1
    prompt: "Two lists: one with 5 values, one with 3. How many pairs does `zip` give?"
    options:
      - text: "3"
        correct: true
        why: "`zip` stops at the end of the shortest list."
      - text: "5"
        why: "There are not enough partners for 5 pairs. `zip` does not invent values."
      - text: "An error"
        why: "Lists of different lengths are fine for `zip`."
  - kind: mcq
    id: r-dict-zip
    objective: O1
    prompt: "`keys = ['a', 'b']` and `values = [1, 2]`. How do you get `{'a': 1, 'b': 2}`?"
    options:
      - text: "`dict(zip(keys, values))`"
        correct: true
        why: "`zip` makes the pairs, and `dict` turns pairs into keys and values."
      - text: "`zip(keys, values)`"
        why: "That gives the pairs, but not a dictionary."
      - text: "`dict(keys, values)`"
        why: "`dict` takes one collection of pairs, not two lists."
  - kind: predict
    id: r-args
    objective: O2
    code: |
      def count(*things):
          return len(things)

      print(count("a", "b", "c"), count())
    explain: >-
      `things` is a tuple of all the values of the call: three in the first
      call, none in the second. A star parameter can be empty.
  - kind: mcq
    id: r-kwargs
    objective: O3
    prompt: "Which line collects any named values into a dictionary `opts`?"
    options:
      - text: "`def setup(**opts):`"
        correct: true
        why: "Two stars: named values, in a dictionary."
      - text: "`def setup(*opts):`"
        why: "One star collects values without names, into a tuple."
      - text: "`def setup(opts={}):`"
        why: "That is one parameter with a default. It does not collect named values."
  - kind: mcq
    id: r-print-sig
    objective: O3
    prompt: "The docs say `print(*objects, sep=' ')`. Why must you write `sep='-'` with its name?"
    options:
      - text: "`sep` comes after `*objects`, so every value without a name goes into `objects`"
        correct: true
        why: "After the star, a parameter is only reached by its name."
      - text: "Because `sep` is text"
        why: "The type is not the reason. The place after the star is."
      - text: "You do not have to: `print('a', 'b', '-')` works the same"
        why: "That prints `a b -`: the `'-'` is one more object."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-capitals
    type: exercise
    fade: completion
    objective: O1
    title: Capitals from two lists
    prompt: |
      **Replace `___`** with one expression that builds a dictionary from
      the two lists: each country with its capital.

      ```text
      Lima
      3
      ```
    starter: |
      countries = ["Peru", "Chile", "Ghana"]
      capitals = ["Lima", "Santiago", "Accra"]
      capital_of = ___
      print(capital_of["Peru"])
      print(len(capital_of))
    solution: |
      countries = ["Peru", "Chile", "Ghana"]
      capitals = ["Lima", "Santiago", "Accra"]
      capital_of = dict(zip(countries, capitals))
      print(capital_of["Peru"])
      print(len(capital_of))
    after: >-
      `zip` makes the pairs, `dict` turns pairs into keys and values. Two
      lists that belong together become one dictionary.
    cases:
      - {}
      - label: "other lists"
        set: { countries: ["Peru", "Japan"], capitals: ["Lima", "Tokyo"] }
    checks:
      - expr: "capital_of == {c: k for c, k in zip(countries, capitals)}"
        pass: "Each country with its capital"
        hint: "`dict(zip(countries, capitals))`."
        misconceptions:
          - when: "isinstance(ns.get('capital_of'), dict) and set(ns.get('capital_of')) == set(capitals)"
            say: "The keys are the capitals: the order of the lists in `zip` is swapped."
      - expr: "'zip(' in src"
        pass: "It uses zip"
        hint: "`zip(countries, capitals)` gives the pairs."
    hints:
