  - id: x-longest
    type: exercise
    fade: independent
    objective: O2
    title: The longest of any words
    prompt: |
      **Write `longest(*words)`**: it takes any number of words, and gives
      back the longest one. With no words at all, it gives back `""`.

      ```text
      banana
      kiwi

      ```
    starter: |
      # Your function here.


      print(longest("fig", "banana", "kiwi"))
      print(longest("kiwi"))
      print(longest())
    solution: |
      def longest(*words):
          best = ""
          for word in words:
              if len(word) > len(best):
                  best = word
          return best


      print(longest("fig", "banana", "kiwi"))
      print(longest("kiwi"))
      print(longest())
    after: >-
      `*words` collects all the values of the call into one tuple, also
      zero values. Starting with `""` makes the empty call work.
    checks:
      - expr: "callable(ns.get('longest')) and longest('a', 'abc', 'ab') == 'abc' and longest('hello') == 'hello'"
        pass: "It finds the longest of any number of words"
        hint: "`def longest(*words):`, then a best-so-far loop over `words`."
        misconceptions:
          - when: "callable(ns.get('longest')) and raises(longest, 'a', 'abc') == 'TypeError'"
            say: "The function takes only one value. Write `*words` to take any number."
      - expr: "callable(ns.get('longest')) and longest() == ''"
        pass: "No words gives an empty text"
        hint: "Start with `best = \"\"`, or use `max(words, key=len, default=\"\")`."
      - expr: "lines == ['banana', 'kiwi', ''] or lines == ['banana', 'kiwi']"
        pass: "It prints banana, kiwi and an empty line"
        hint: "Keep the three prints."
    hints:
      - "`*words` makes `words` a tuple of all the values."
      - "Start with `best = \"\"`, and keep the longer one."
      - "`if len(word) > len(best): best = word`."
