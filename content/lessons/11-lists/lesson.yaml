id: lists
order: 11
title: Lists
summary: Keep many values under one name, in order, and change them.
minutes: 30
outcomes: [A1, A2, A8]

objectives:
  - id: O1
    text: Create a list and read a value by its index, counting from 0
  - id: O2
    text: Change a list - replace a value, add one at the end, take one out
  - id: O3
    text: Use len() and in, and walk through a list with for
  - id: O4
    text: Read an IndexError and fix the index

steps:
  # 1. HOOK ------------------------------------------------------------------
  - id: see
    type: hook
    objective: O1
    title: One name, many places
    question: A program must keep 100 names. Does it need 100 variables?
    code: |
      drinks = ["tea", "milk", "juice"]
      second = drinks[1]
      drinks[0] = "water"
      drinks.append("cola")
    beats:
      - beat: empty
        caption: "Programs often have many values of the same kind: names, prices, scores. A **list** keeps them together, in order, under **one** name."
      - beat: create
        line: 1
        caption: "One variable, three values. Each place has a number: its **index**. The first index is **0**, not 1."
      - beat: read
        line: 2
        caption: "`drinks[1]` reads the value at index 1. That is the **second** value. The list does not change."
      - beat: change
        line: 3
        caption: "`drinks[0] = ...` puts a new value in one place. The other places stay as they are."
      - beat: append
        line: 4
        caption: "`append` adds a value at the end. The list grows, and the new place gets the next index: 3."

  # 2. THEORY ----------------------------------------------------------------
  - id: index
    type: theory
    objective: O1
    title: Numbered places
    body: |
      ## A list

      Write the values between square brackets `[ ]`, with commas between
      them. A list can hold numbers, text, or both.

      To read one value, write the name of the list and the index in
      square brackets. Python counts from **0**. So in a list of three
      values, the indices are 0, 1 and 2. The last index is always the
      length minus 1.

      An index below zero counts from the end: `-1` is the last value.
    keys:
      - code: "scores = [12, 7, 30]"
        means: "A list with three values."
      - code: "scores[0]"
        means: "The first value: `12`."
      - code: "scores[2]"
        means: "The third and last value: `30`."
      - code: "scores[-1]"
        means: "The last value, for a list of any length."
      - code: "len(scores)"
        means: "The number of values: `3`."

  # 3. PREDICT ---------------------------------------------------------------
  - id: predict-index
    type: predict
    objective: O1
    title: Count from zero
    item:
      kind: predict
      id: p-index
      prompt: "This program prints three lines. **Type all three** before you check."
      code: |
        colors = ["red", "green", "blue", "pink"]
        print(colors[1])
        print(colors[-1])
        print(len(colors))
      explain: >-
        Index 1 is the **second** place, because counting starts at 0. Index
        -1 is the last place. `len` counts the values: there are four, so
        the indices go from 0 to 3.
      misconceptions:
        - answer: "red\npink\n4"
          say: "Index 1 is the second value. The first value has index 0."
        - answer: "green\nred\n4"
          say: "`-1` counts from the end. It is the last value, not the first."
        - answer: "green\npink\n3"
          say: "`len` counts the values: four. The last index is 3, one less than the length."

  # 4. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O2
    title: Change the basket
    intro: |
      Press **Run**. Watch the places of the list. Which place changes on
      each line?

      Then change the list yourself.
    code: |
      basket = ["bread", "milk"]
      basket.append("eggs")
      basket[0] = "rice"
      first = basket[0]
      print(basket)
    experiments:
      - text: "Run the code as it is."
        expr: "True"
      - text: "Add a line that appends one more value. The list must have 4 values."
        expr: "err is None and len(ns.get('basket', [])) == 4"
      - text: "Add `basket.pop()` before the last line. Which value leaves?"
        expr: "err is None and called('pop')"
      - text: "Store the last value in a variable `last`. Use `-1`."
        expr: "err is None and ns.get('last') == ns.get('basket', [None])[-1] and '-1' in src"
      - text: "Read an index that does not exist, for example `basket[10]`. Read the message."
        expr: "err == 'IndexError'"
    investigate:
      - kind: trace
        id: i-trace-list
        code: |
          basket = ["bread", "milk"]
          basket.append("eggs")
          basket[0] = "rice"
          first = basket[0]
          print(basket)
        names: [basket, first]
        prompt: "**Be the computer.** Write the whole list each time it changes, like `['bread', 'milk']`. An empty space means: no change."
        explain: >-
          `append` adds at the end. `basket[0] = "rice"` replaces the first
          item; the list keeps its length. Then `first` reads place 0.
      - kind: mcq
        id: i-index
        prompt: "Line 3 becomes `basket[3] = \"rice\"`. What happens?"
        options:
          - text: "An `IndexError`: the places are 0, 1 and 2"
            correct: true
            why: "Three items have the places 0 to 2. Place 3 does not exist, and `=` cannot make it."
          - text: "`rice` is added at the end"
            why: "To add at the end, use `append`. A new place cannot be made with `=`."
          - text: "The third item becomes `rice`"
            why: "The third item is at place 2. Places start at 0."

  # 5. THEORY ----------------------------------------------------------------
  - id: change
    type: theory
    objective: O2
    title: A list can change
    body: |
      ## Change a list

      A list has its own instructions. You write them after the name and a
      **dot**: `basket.append("tea")`. They change the list itself. No new
      list is made, and you do not need an `=`.

      To ask if a value is in a list, use `in`. The answer is `True` or
      `False`, so `in` fits in an `if`.

      In lesson 8, `for` walked through the characters of a text. It walks
      through a list the same way: one value in each round, in order.
    keys:
      - code: 'basket.append("tea")'
        means: "Adds a value at the end."
      - code: 'basket[1] = "jam"'
        means: "Replaces the value at index 1."
      - code: "basket.pop()"
        means: "Takes out the last value."
      - code: 'basket.remove("milk")'
        means: "Takes out the first value that is equal to `\"milk\"`."
      - code: '"tea" in basket'
        means: "`True` when the value is in the list."
      - code: "for item in basket:"
        means: "One round for each value."

  # 6. DRILL -----------------------------------------------------------------
  - id: read-errors
    type: drill
    objective: O4
    title: Places that do not exist
    items:
      - kind: diagnose
        id: d-index
        mode: read
        code: |
          days = ["Mon", "Tue", "Wed"]
          print(days[0])
          print(days[3])
        explain: >-
          The list has 3 values, so the indices are 0, 1 and 2. Index 3 does
          not exist. "Out of range" means: this index is not one of the
          places of the list.
        fix:
          - text: "Use `days[2]` or `days[-1]` for the last day"
            correct: true
            why: "Both give `\"Wed\"`. `-1` works for a list of any length."
          - text: "Use `days[4]`"
            why: "Index 4 is even further away. The list ends at index 2."
          - text: "Add quotes: `days[\"3\"]`"
            why: "An index is a whole number. Text in the brackets gives a `TypeError`."
      - kind: diagnose
        id: d-len
        mode: predict
        code: |
          prices = [4, 9, 2]
          total = prices[0] + prices[1] + prices[2]
          last = prices[len(prices)]
          print(total, last)
        explain: >-
          `len(prices)` is 3, but the last index is 2. The last value is
          `prices[len(prices) - 1]`, or shorter: `prices[-1]`.
      - kind: diagnose
        id: d-remove
        mode: read
        code: |
          names = ["Ana", "Ben"]
          names.remove("Tom")
          print(names)
        distractors: [IndexError, TypeError, NameError, KeyError]
        explain: >-
          `remove` looks for a value, not for an index. `"Tom"` is not in the
          list, so the value is the problem: a `ValueError`. Ask first with
          `in`: `if "Tom" in names:`.
        fix:
          - text: 'Remove a value that is in the list, or ask first: `if "Tom" in names:`'
            correct: true
            why: "`remove` works only when the value is in the list."
          - text: "Use `names.remove(2)`"
            why: "`remove` takes a value, not an index. The number 2 is not in the list either."
          - text: "Use `names[\"Tom\"]`"
            why: "In the brackets of a list goes an index, a whole number."

  # 7. WORKED EXAMPLE --------------------------------------------------------
  - id: example-names
    type: worked
    objective: O3
    title: Collect names in a list
    problem: |
      **Ask for three names. Keep them in a list. Then greet every person.**

      The program does not know the names before it runs. So it starts
      with an empty list and fills it.
    lines:
      - goal: "Prepare the start value"
        code: "names = []"
        note: "An empty list: brackets with nothing between them. It is the start value, like `total = 0`."
      - goal: "Collect the data"
        code: |
          for i in range(3):
              name = input("Name: ")
              names.append(name)
        note: "Each round adds one value at the end. After three rounds, the list has three values."
      - goal: "Show the result"
        code: 'print(f"{len(names)} names")'
        note: "`len` counts the values in the list."
      - code: |
          for name in names:
              print(f"Hello, {name}!")
        note: "`for` walks through the list in its order. No index is needed, so no index can be wrong."
    check:
      kind: mcq
      id: w-names
      prompt: "The user types `Ana` in the first round. **What does `names` hold after that round?**"
      options:
        - text: '`["Ana"]`'
          correct: true
          why: "The list started empty, and `append` added one value."
        - text: '`["Ana", "", ""]`'
          why: "A list has no empty places that wait. It grows by one value for each `append`."
        - text: '`"Ana"`'
          why: "`names` is still a list. It holds one value now, the text `\"Ana\"`."

  # PUZZLE: put the lines in order (Parsons) ----------------------------
  - id: order
    type: drill
    objective: O2
    title: Put the lines in order
    items:
      - kind: order
        id: o-names
        objective: O2
        code: |
          names = ["Ana", "Ben"]
          names.append("Chen")
          names[0] = "Ada"
          print(names)
          print(len(names))
        explain: >-
          The list must exist before you change it. `append` adds "Chen" at the
          end, and `names[0] = "Ada"` replaces "Ana". These two changes can come
          in any order.
      - kind: order
        id: o-expensive
        objective: O3
        code: |
          prices = [3, 8, 5]
          for price in prices:
              if price > 4:
                  print(price, "is expensive")
          print("Checked", len(prices), "prices")
        explain: >-
          The `if` is inside the loop (4 spaces), and its print is inside the
          `if` (8 spaces). So the check runs for every price, and only 8 and 5
          are printed.

  # 8. EXERCISE: completion --------------------------------------------------
  - id: ex-first-last
    type: exercise
    fade: completion
    objective: O1
    title: First and last in the queue
    prompt: |
      People wait in a queue. The program must show who is first and who
      is last.

      **Replace each `___` with an index expression.** Your code must work
      for a queue of any length, also for one person.
    starter: |
      queue = ["Ana", "Ben", "Cleo", "Dan"]
      first = ___
      last = ___
      print(f"First: {first}, last: {last}")
    solution: |
      queue = ["Ana", "Ben", "Cleo", "Dan"]
      first = queue[0]
      last = queue[-1]
      print(f"First: {first}, last: {last}")
    after: >-
      `queue[-1]` is the last value for every length. `queue[3]` was right
      only for four people. The check used a queue of two people and a
      queue of one.
    cases:
      - {}
      - label: "the queue is `Eva`, `Finn`"
        set: { queue: ["Eva", "Finn"] }
      - label: "the queue has only `Gil`"
        set: { queue: ["Gil"] }
    checks:
      - expr: "ns.get('first') == queue[0]"
        pass: "`first` is the first person"
        hint: "The first place has index 0."
        misconceptions:
          - when: "len(queue) > 1 and ns.get('first') == queue[1]"
            say: "Index 1 is the second place. Python counts from 0."
          - when: "ns.get('first') == 'Ana' and queue[0] != 'Ana'"
            say: "You typed the name. Read it from the list: `queue[...]`."
      - expr: "err is None and ns.get('last') == queue[-1]"
        pass: "`last` is the last person, for a queue of any length"
        hint: "Which index means the last place, for any length?"
        misconceptions:
          - when: "err == 'IndexError'"
            say: "This index exists in a queue of four, but not in a shorter one. Use `-1`: it always means the last place."
          - when: "ns.get('last') == 'Dan' and queue[-1] != 'Dan'"
            say: "You typed the name. Read it from the list: `queue[...]`."
      - expr: "lines == [f'First: {queue[0]}, last: {queue[-1]}']"
        pass: "It prints the first and the last person"
        hint: "Keep the last line."
    hints:
      - "The first place has index 0."
      - "An index below zero counts from the end."
      - "Write `queue[0]` and `queue[-1]`."

  # 9. EXERCISE: debug -------------------------------------------------------
  - id: ex-average
    type: exercise
    fade: debug
    objective: O4
    title: The average of the marks
    prompt: |
      This program adds a new mark to a list and prints the average of all
      marks. For `6, 8, 7, 9` the right answer is `7.5`.

      It has two mistakes. One gives a message. **The other gives a wrong
      result without a message.**
    starter: |
      marks = [6, 8, 7]
      marks.append(9)
      total = 0
      for i in range(len(marks) + 1):
          total = total + marks[i]
      average = total / 3
      print(average)
    solution: |
      marks = [6, 8, 7]
      marks.append(9)
      total = 0
      for mark in marks:
          total = total + mark
      average = total / len(marks)
      print(average)
    after: >-
      `for mark in marks` is the simple form: it gives every value, and
      there is no index that can be too big. And `len(marks)` follows the
      list when it grows, but the number 3 does not.
    cases:
      - {}
      - label: "`marks` is `10, 4, 5, 8, 3` before the new mark"
        set: { marks: [10, 4, 5, 8, 3] }
    checks:
      - expr: "err is None"
        pass: "The program runs without an error"
        hint: "Read the message. Which index is too big?"
        misconceptions:
          - when: "err == 'IndexError'"
            say: "The loop goes one round too far. The last index of a list is its length minus 1. Or let `for` give the values: `for mark in marks:`."
      - expr: "abs(average - sum(marks) / len(marks)) < 0.001"
        pass: "`average` is the sum of all marks divided by the number of marks"
        hint: "How many marks are in the list now? Do not type the number."
        misconceptions:
          - when: "abs(ns.get('average', 0) - sum(marks) / 3) < 0.001"
            say: "The program divides by 3, but the list has more values after `append`. Use `len(marks)`."
      - expr: "lines[-1:] == [str(average)]"
        pass: "The last line is the average"
        hint: "Keep the last line."
    hints:
      - "The first message is an `IndexError` in the loop: `range(len(marks) + 1)` goes one too far."
      - "Simpler: `for mark in marks:` and `total = total + mark`."
      - "Then divide by `len(marks)`, not by 3."

  # 10. EXERCISE: independent ------------------------------------------------
  - id: ex-shopping
    type: exercise
    fade: independent
    objective: O2
    title: A shopping list
    prompt: |
      **Ask for items again and again, until the user types `done`. Keep
      every item in a list.** The word `done` is not an item.

      At the end, print the number of items on one line, and then every
      item on its own line. For `milk`, `eggs`, `done`:

      ```text
      2 items
      milk
      eggs
      ```
    starter: |
      # Ask for items until the user types done.
    solution: |
      items = []
      answer = input("Item: ")
      while answer != "done":
          items.append(answer)
          answer = input("Item: ")
      print(f"{len(items)} items")
      for item in items:
          print(item)
    after: >-
      You joined a `while` loop that collects with a `for` loop that shows.
      This pair appears in many programs: first gather the data, then work
      with it.
    cases:
      - {}
      - label: "the user types `milk`, `eggs`, `done`"
        stdin: ["milk", "eggs", "done"]
      - label: "the user types `done` at once"
        stdin: ["done"]
      - label: "the user types `tea`, `jam`, `rice`, `salt`, `done`"
        stdin: ["tea", "jam", "rice", "salt", "done"]
    checks:
      - expr: "err is None and asked == len(inputs) and inputs[-1:] == ['done']"
        pass: "The program asks until `done`, then stops"
        hint: "Use a `while` loop that runs as long as the answer is not `done`."
        misconceptions:
          - when: "err == 'EOFError'"
            say: "The program asks again after `done`. The loop must stop when the answer is `done`."
          - when: "err is None and inputs[-1:] != ['done']"
            say: "Run again and finish with `done`."
      - expr: "any(isinstance(v, list) and v == inputs[:-1] for v in ns.values())"
        pass: "A list holds every item, in order, without `done`"
        hint: "Start with an empty list before the loop, and `append` each answer."
        misconceptions:
          - when: "any(isinstance(v, list) and v == inputs for v in ns.values())"
            say: "The list also holds `done`. Append an answer only when it is not `done`: ask the next question at the end of the loop."
      - expr: "len(lines) > len(inputs) and lines[len(lines) - len(inputs) + 1:] == inputs[:-1] and str(len(inputs) - 1) in lines[len(lines) - len(inputs)]"
        pass: "It prints the number of items, then every item on its own line"
        hint: "After the loop: one `print` with `len(...)`, then a `for` loop that prints each item."
    hints:
      - "Before the loop: `items = []` and the first question, `answer = input(\"Item: \")`."
      - "The loop: `while answer != \"done\":` Inside: `items.append(answer)`, then ask again."
      - "After the loop: `print(f\"{len(items)} items\")`, then `for item in items:` with `print(item)`."

  # 11. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O3
    title: Check yourself
    items:
      - kind: blanks
        id: q-fill-list
        objective: O2
        prompt: "**Fill in the blanks** so the program prints `['plum', 'pear', 'kiwi']` and then `kiwi`."
        code: |
          fruits = ["apple", "pear"]
          fruits.[?append?]("kiwi")
          fruits[[?0?]] = "plum"
          print(fruits)
          print(fruits[[?-1?]])
        explain: "`append` adds at the end. Index 0 is the first value, so `apple` becomes `plum`. Index `-1` is the last value."
        misconceptions:
          - blank: 2
            answer: "1"
            say: "Index 1 is the second value, `pear`. The first is index 0."
      - kind: mcq
        id: q-first
        objective: O1
        prompt: "`nums = [5, 3, 8]`. Which expression gives `5`?"
        options:
          - text: "`nums[0]`"
            correct: true
            why: "The first place has index 0."
          - text: "`nums[1]`"
            why: "Index 1 is the second place. It gives `3`."
          - text: "`nums[5]`"
            why: "In the brackets goes the index, not the value. Index 5 does not exist here."
      - kind: predict
        id: q-change
        objective: O2
        prompt: "Python prints a list with brackets and quotes, like `['a', 'b']`. **What does this program print?**"
        code: |
          pets = ["cat", "dog"]
          pets.append("fish")
          pets[0] = "bird"
          print(pets)
          print(len(pets))
        explain: "`append` adds `fish` at the end. Then index 0, the first place, gets `bird`. Three values."
        misconceptions:
          - answer: "['cat', 'bird', 'fish']\n3"
            say: "Index 0 is the first place: `cat` is replaced."
          - answer: "['bird', 'cat', 'dog', 'fish']\n4"
            say: "`pets[0] = ...` replaces the value in place 0. It does not add a new place."
      - kind: mcq
        id: q-in
        objective: O3
        prompt: 'What is `"tea" in ["Tea", "milk"]`?'
        options:
          - text: "`False`"
            correct: true
            why: "`in` compares exactly, as `==` does. `Tea` with a capital letter is a different text."
          - text: "`True`"
            why: "Capital letters matter. `\"tea\"` is not equal to `\"Tea\"`."
          - text: "A `TypeError`"
            why: "`in` works with every list and gives `True` or `False`."
      - kind: diagnose
        id: q-pop
        objective: O4
        mode: predict
        code: |
          items = ["a", "b", "c"]
          items.pop()
          print(items[2])
        explain: "`pop` takes out the last value. Two values are left, so the indices are 0 and 1. Index 2 does not exist any more."
      - kind: predict
        id: q-loop
        objective: O3
        code: |
          total = 0
          for price in [3, 5, 2]:
              total = total + price
          print(total)
        explain: "`price` gets 3, then 5, then 2. The loop adds them: 10."
      - kind: mcq
        id: q-remove
        objective: O2
        prompt: '`letters = ["a", "b", "a"]`. What is `letters` after `letters.remove("a")`?'
        options:
          - text: '`["b", "a"]`'
            correct: true
            why: "`remove` takes out the **first** value that is equal, and only that one."
          - text: '`["b"]`'
            why: "`remove` takes out only one value: the first that is equal."
          - text: '`["a", "b"]`'
            why: "`remove` starts its search at index 0. It finds the first `\"a\"`."

  # 12. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: predict
    id: r-index
    objective: O1
    code: |
      letters = ["x", "y", "z"]
      print(letters[1])
      print(letters[-1])
    explain: "Index 1 is the second place. `-1` is the last place."
    misconceptions:
      - answer: "x\nz"
        say: "Index 1 is the second value. The first has index 0."
  - kind: mcq
    id: r-last-index
    objective: O1
    prompt: "A list has 5 values. What is the index of the last value?"
    options:
      - text: "4"
        correct: true
        why: "Counting starts at 0, so the indices are 0 to 4."
      - text: "5"
        why: "Index 5 would be a sixth place. The list ends at index 4."
      - text: "-5"
        why: "`-5` is the first place, counted from the end. The last is `-1`."
  - kind: mcq
    id: r-append
    objective: O2
    prompt: "What does `scores.append(10)` do?"
    options:
      - text: "It adds 10 as a new value at the end of the list"
        correct: true
        why: "The list grows by one place."
      - text: "It replaces the last value with 10"
        why: "To replace, use an index: `scores[-1] = 10`."
      - text: "It adds 10 to every value in the list"
        why: "`append` adds one new place. The values that are there do not change."
  - kind: diagnose
    id: r-out-of-range
    objective: O4
    mode: read
    code: |
      seats = ["A1", "A2"]
      print(seats[2])
    explain: "The list has two values, so the indices are 0 and 1. \"List index out of range\" means that index 2 is not one of the places."
  - kind: mcq
    id: r-in
    objective: O3
    prompt: 'How do you ask if `"egg"` is in the list `basket`?'
    options:
      - text: '`"egg" in basket`'
        correct: true
        why: "`in` gives `True` or `False`, so it fits in an `if`."
      - text: '`basket["egg"]`'
        why: "In the brackets of a list goes an index, a whole number."
      - text: '`basket.find("egg")`'
        why: "A list has no `find`. The word is `in`."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-playlist
    type: exercise
    fade: completion
    objective: O2
    title: A playlist
    prompt: |
      **Replace the two `___`** with list methods: add `"Night"` at the end,
      and take `"Rain"` out.

      ```text
      ['Intro', 'Sun', 'Night']
      3 songs
      ```
    starter: |
      songs = ["Intro", "Rain", "Sun"]
      songs.___("Night")
      songs.___("Rain")
      print(songs)
      print(len(songs), "songs")
    solution: |
      songs = ["Intro", "Rain", "Sun"]
      songs.append("Night")
      songs.remove("Rain")
      print(songs)
      print(len(songs), "songs")
    after: >-
      `append` adds at the end, `remove` takes out a value by what it is
      (not by its place). Both change the list itself.
    checks:
      - expr: "err is None and songs == ['Intro', 'Sun', 'Night']"
        pass: "Night is added at the end, Rain is gone"
        hint: "`songs.append(\"Night\")` and `songs.remove(\"Rain\")`."
        misconceptions:
          - when: "err == 'ValueError'"
            say: "`remove` did not find the value. Check the spelling: \"Rain\" with a capital R."
      - expr: "lines == [\"['Intro', 'Sun', 'Night']\", '3 songs']"
        pass: "It prints the list and the number of songs"
        hint: "Keep the two prints."
    hints:
      - "One method adds at the end, one takes out a value."
      - "`append` adds at the end."
      - "`remove` takes out a value: `songs.remove(\"Rain\")`."
  - id: x-guests
    type: exercise
    fade: independent
    objective: O3
    title: On the guest list?
    prompt: |
      **Write an if/else with `in`**: when `name` is in `guests`, print
      `Welcome, Bo` (with the name). Else print `Sorry, Bo is not on the
      list`.
    starter: |
      guests = ["Ana", "Bo", "Cleo"]
      name = "Bo"
      # Your if and else here.
    solution: |
      guests = ["Ana", "Bo", "Cleo"]
      name = "Bo"
      if name in guests:
          print(f"Welcome, {name}")
      else:
          print(f"Sorry, {name} is not on the list")
    after: >-
      `in` walks through the list for you and answers True or False. No
      loop needed.
    cases:
      - {}
      - label: "name is Dan"
        set: { name: "Dan" }
      - label: "name is Cleo"
        set: { name: "Cleo" }
    checks:
      - expr: "err is None and lines == ([f'Welcome, {name}'] if name in guests else [f'Sorry, {name} is not on the list'])"
        pass: "The right message for guests and for others"
        hint: "`if name in guests:` and an `else:`, each with an f-string."
      - expr: "syntax('If') >= 1 and ' in guests' in src"
        pass: "It asks with in"
        hint: "Use `name in guests` as the condition."
    hints:
      - "`name in guests` is True or False."
      - "Use it as the condition of an `if`."
      - "Print with f-strings, so the message has the name."
