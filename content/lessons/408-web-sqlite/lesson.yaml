id: web-sqlite
order: 408
title: "Keep the data: Flask and SQLite"
summary: A web app whose data survives a restart, in an SQLite file. Show it as HTML and as JSON, and protect its forms against CSRF.
minutes: 45
outcomes: []

objectives:
  - id: O1
    text: Keep the data of a Flask app in SQLite, so it survives a restart - a connection per request, ? placeholders, commit and close
  - id: O2
    text: Show the data of the database as a page and as JSON
  - id: O3
    text: Explain a CSRF attack, and protect POST forms with a token from Flask-WTF

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: survive
    type: theory
    objective: O1
    title: Data that survives a restart
    body: |
      The reading list of the project keeps its books in a Python list.
      When the server stops, the list is gone. A real app keeps its data in
      a database: here an **SQLite** file, as in lesson [[#sqlite]].

      ```python
      import sqlite3
      from flask import Flask, redirect, request, url_for
      from markupsafe import escape

      app = Flask(__name__)
      DB = "books.db"


      def db():
          con = sqlite3.connect(DB)
          con.execute("CREATE TABLE IF NOT EXISTS books "
                      "(id INTEGER PRIMARY KEY, title TEXT NOT NULL)")
          return con


      @app.get("/")
      def home():
          con = db()
          rows = con.execute("SELECT id, title FROM books ORDER BY id").fetchall()
          con.close()
          return "<ul>" + "".join(f"<li>{escape(t)}</li>" for _, t in rows) + "</ul>"


      @app.post("/add")
      def add():
          con = db()
          with con:
              con.execute("INSERT INTO books (title) VALUES (?)", (request.form["title"],))
          con.close()
          return redirect(url_for("home"))
      ```

      - Each request opens its **own connection**, and closes it at the
        end. Requests can come at the same time; one shared connection
        would mix them up.
      - `CREATE TABLE IF NOT EXISTS` makes the table on the first run only.
      - `?` keeps the title out of the SQL (no SQL injection), and
        `with con:` commits the change.
      - `escape` still protects the page: data from a database came from
        visitors too.
    keys:
      - code: "def db():"
        means: "One small function opens the connection, the same way each time."
      - code: "CREATE TABLE IF NOT EXISTS"
        means: "Make the table only if it is not there yet."
      - code: "with con: ... con.close()"
        means: "Commit the change, then close the connection."

  # 2. EXERCISE: completion --------------------------------------------------
  - id: ex-insert
    type: exercise
    fade: completion
    objective: O1
    title: Save a new book
    prompt: |
      **Replace the two `___`** so that a POST to `/add` saves the title in
      `books.db`, safely, and then goes back to the list.
    starter: |
