id: own-modules
order: 29
title: Your own modules and packages
summary: Split a program into files, import them in the right way, read the errors of a failed import, and group modules in a package.
minutes: 45
outcomes: [A3, A4]

objectives:
  - id: O1
    text: Import your own module with import, from ... import and as, and know why import * is risky
  - id: O2
    text: Explain how Python finds a module, and read the three errors of a failed import
  - id: O3
    text: Make a module that runs its tests only as a program, with if __name__ == "__main__"
  - id: O4
    text: Group modules in a package - a folder with __init__.py - and import them with dotted names
  - id: O5
    text: Describe a package in pyproject.toml - its name, version and dependencies - and read the file with tomllib

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: module
    type: theory
    objective: O1
    title: A file is a module
    body: |
      When a program grows, you split it into files. Every `.py` file is a
      **module**: other files can import it, like `math` or `random`.

      Say the folder has a file `helpers.py` with a function `euros`. Then
      in `main.py`:

      ```python
      import helpers                 # the module, as one name
      helpers.euros(5)

      from helpers import euros      # only this name
      euros(5)

      import helpers as h            # a shorter name
      h.euros(5)
      ```

      `import` **runs** the file of the module, from top to bottom, **one
      time**. A second `import helpers` does nothing: Python keeps the module.

      `from helpers import *` takes every name at once. Avoid it: you cannot
      see which names came in, and a name of the module can hide one of
      yours with the same name.
    keys:
      - code: "import helpers"
        means: "Use the names with a dot: `helpers.euros`."
      - code: "from helpers import euros"
        means: "Only `euros`, without a dot."
      - code: "import helpers as h"
        means: "The module with a short name."

  # 2. DEMO -----------------------------------------------------------------
  - id: use-helpers
    type: demo
    objective: O1
    title: Two files, one program
    intro: |
      The folder has `helpers.py`, next to your program (look at its
      text in the files). Press **Run**: how often does it say that it is
      loaded?
    files:
      helpers.py: |
        """Small helpers for prices."""
        VAT = 0.2


        def with_vat(price):
            return round(price * (1 + VAT), 2)


        def euros(amount):
            return f"{amount:.2f} EUR"


        print("helpers is loaded")
    code: |
      import helpers

      price = helpers.with_vat(10)
      print(helpers.euros(price))

      import helpers
      for name in dir(helpers):
          if not name.startswith("_"):
              print(name)
    experiments:
      - text: "Run it as it is."
        expr: "err is None and lines[0] == 'helpers is loaded'"
      - text: "Use `from helpers import with_vat, euros`, and call both without `helpers.`."
        expr: "err is None and syntax('ImportFrom') >= 1 and 'helpers.with_vat' not in src"
      - text: "Print the tax rate of the module: `helpers.VAT`."
        expr: "err is None and '0.2' in lines"
    investigate:
      - kind: predict
        id: i-twice
        prompt: "The program imports `helpers` two times. **What does it print?**"
        files:
          helpers.py: |
            print("helpers is loaded")
        code: |
          import helpers
          import helpers
          print("done")
        explain: >-
          The first `import` runs `helpers.py`. The second one finds the
          module that Python already keeps, and runs nothing.
        misconceptions:
          - answer: "helpers is loaded\nhelpers is loaded\ndone"
            say: "A module runs only at the first import. Python keeps it for the next ones."
      - kind: mcq
        id: i-dir
        prompt: "What does `dir(helpers)` give?"
        options:
          - text: "A list of the names in the module, like `euros` and `with_vat`"
            correct: true
            why: "Also some names that start with `__`, like `__name__`: Python adds them."
          - text: "The folder of the module"
            why: "That is in `helpers.__file__`. `dir` lists names."
          - text: "The text of the file"
            why: "`dir` lists the names that the module has."

  # 3. DRILL -----------------------------------------------------------------
  - id: forms
    type: drill
    objective: O1
    title: Which name is there?
    items:
      - kind: mcq
        id: d-from
        objective: O1
        prompt: "After `from helpers import euros`, what does `helpers.euros(5)` give?"
        options:
          - text: "A `NameError`: the name `helpers` was not imported"
            correct: true
            why: "`from ... import` brings only `euros`. Write `euros(5)`."
          - text: "`5.00 EUR`"
            why: "That works with `import helpers`, not with `from helpers import euros`."
          - text: "An `ImportError`"
            why: "The import worked. The name `helpers` is the problem."
      - kind: mcq
        id: d-star
        objective: O1
        prompt: "Your program has a function `total`. Then you write `from shop import *`, and `shop` has a `total` too. Which `total` runs?"
        options:
          - text: "The one of `shop`: the import came later, and replaced yours"
            correct: true
            why: "This is why `import *` is risky: names come in without you seeing them."
          - text: "Yours: your own names always win"
            why: "The last `total` that was set wins. Here, that is the import."
          - text: "Python stops with an error"
            why: "Python allows it, without a warning. That makes it risky."
      - kind: mcq
        id: d-alias
        objective: O1
        prompt: "`import helpers as h`. Which line works?"
        options:
          - text: "`h.euros(5)`"
            correct: true
            why: "The module now has the name `h`."
          - text: "`helpers.euros(5)`"
            why: "With `as`, the module gets only the new name."
          - text: "`euros(5)`"
            why: "That needs `from helpers import euros`."

  # 4. EXERCISE: completion --------------------------------------------------
  - id: ex-import
    type: exercise
    fade: completion
    objective: O1
    title: Import what you need
    prompt: |
      The folder has `helpers.py` (see the files). **Complete the import**,
      so that the last line works as it is and prints `30.00 EUR`.
    files:
      helpers.py: |
        """Small helpers for prices."""
        VAT = 0.2


        def with_vat(price):
            return round(price * (1 + VAT), 2)


        def euros(amount):
            return f"{amount:.2f} EUR"
    starter: |
      from helpers import ___

      print(euros(with_vat(25)))
    solution: |
      from helpers import euros, with_vat

      print(euros(with_vat(25)))
    after: >-
      `from helpers import euros, with_vat` takes two names, with a comma.
      The order does not matter.
    checks:
      - expr: "err is None and lines == ['30.00 EUR']"
        pass: "It prints `30.00 EUR`"
        hint: "The line uses two names of `helpers`: `euros` and `with_vat`."
        misconceptions:
          - when: "err == 'NameError'"
            say: "The last line uses `euros` and `with_vat`. Import both: `from helpers import euros, with_vat`."
      - expr: "syntax('ImportFrom') >= 1 and 'def ' not in src"
        pass: "It imports the functions, and does not write them again"
        hint: "Use the functions of `helpers.py`: import them."
    hints:
      - "Which two names does the last line use?"
      - "Import more than one name with a comma."
      - "`from helpers import euros, with_vat`."

  # 5. THEORY ----------------------------------------------------------------
  - id: search
    type: theory
    objective: O2
    title: Where Python looks
    body: |
      For `import helpers`, Python looks for a file `helpers.py` in the
      folders of the list `sys.path`, in order:

      1. the folder of your program,
      2. the standard library (`math`, `random`, ...),
      3. the packages you installed with pip.

      The first match wins. So a file **`random.py` of your own**, next to
      your program, hides the real `random`. Never name your files like a
      module that you use.

      ## Three errors

      ```text
      ModuleNotFoundError: No module named 'helper'
      ImportError: cannot import name 'euro' from 'helpers'
      AttributeError: module 'helpers' has no attribute 'euro'
      ```

      - `ModuleNotFoundError`: no file with that name: check the spelling
        and the folder.
      - `ImportError: cannot import name`: the file is there, but not this
        name (in `from ... import`).
      - `AttributeError`: the module is there, but not this name (with a
        dot).
    keys:
      - code: "sys.path"
        means: "The folders where Python looks, in order."
      - code: "ModuleNotFoundError"
        means: "No such file."
      - code: "ImportError"
        means: "The file is there, the name is not. With a dot: `AttributeError`."

  # 6. EXERCISE: debug -------------------------------------------------------
  - id: ex-guard
    type: exercise
    fade: debug
    objective: O3
    title: A module that talks too much
    prompt: |
      Your code is the module `text_tools.py`. At the end it tests itself.

      The problem: another program does `import text_tools`, and the two
      test lines appear in its output too.

      **Fix it**: run as a program, it prints the two test lines; imported,
      it prints nothing. Keep the functions as they are.
    starter: |
      def shout(text):
          return text.upper() + "!"


      def whisper(text):
          return text.lower() + "..."


      print(shout("test"))
      print(whisper("TEST"))
    solution: |
      def shout(text):
          return text.upper() + "!"


      def whisper(text):
          return text.lower() + "..."


      if __name__ == "__main__":
          print(shout("test"))
          print(whisper("TEST"))
    after: >-
      Python sets `__name__` to `"__main__"` in the file that you run, and to
      the name of the module (`"text_tools"`) in a file that is imported. So
      the block runs only when the file is the program.
    checks:
      - expr: "err is None and lines == ['TEST!', 'test...']"
        pass: "Run as a program, it prints the two test lines"
        hint: "Keep the two prints, inside the new block."
      - expr: "err is None and import_out('text_tools') == ''"
        pass: "Imported, it prints nothing"
        hint: "Put the two prints into `if __name__ == \"__main__\":`."
        misconceptions:
          - when: "err is None and 'TEST!' in import_out('text_tools')"
            say: "Imported, the module still prints. The test lines must be inside `if __name__ == \"__main__\":`."
      - expr: "callable(ns.get('shout')) and shout('a') == 'A!' and whisper('B') == 'b...'"
        pass: "The functions are the same"
        hint: "Change only the end of the file."
    hints:
      - "Python has a name that says if the file is the program or a module: `__name__`."
      - "In the file that you run, `__name__` is `\"__main__\"`."
      - "`if __name__ == \"__main__\":`, and move the two prints inside it, indented."

  # 7. THEORY ----------------------------------------------------------------
  - id: packages
    type: theory
    objective: O4
    title: Packages
    body: |
      Many modules go into a **package**: a folder with a file
      `__init__.py` (it may be empty):

      ```text
      shop/
          __init__.py
          prices.py
          labels.py
      main.py
      ```

      Import with dots, from the folder down to the module:

      ```python
      import shop.prices
      shop.prices.total([1, 2])

      from shop.prices import total
      total([1, 2])

      from shop import labels
      labels.line("apple", 1.5)
      ```

      `__init__.py` runs once, at the first import of the package. A package
      can hold other packages too: `shop/tax/__init__.py` is `shop.tax`.

      ## __pycache__

      On your computer, Python makes a folder `__pycache__` next to your
      modules, with `.pyc` files: your modules, translated, so the next start
      is faster. Python makes them by itself. Do not change them, and leave
      them out of Git (`.gitignore`).
    keys:
      - code: "shop/__init__.py"
        means: "The folder `shop` is a package."
      - code: "shop.prices"
        means: "The module `prices` in the package `shop`: `from shop.prices import total`."
      - code: "__pycache__/"
        means: "Python's own copies. Do not touch, do not commit."

  # 8. EXERCISE: independent -------------------------------------------------
  - id: ex-receipt
    type: exercise
    fade: independent
    objective: O4
    title: A receipt from a package
    prompt: |
      The folder has the package `shop`, with `prices.py` and `labels.py`
      (see the files). **Print a receipt** for the dictionary `items`, using
      only the functions of the package:

      - one line for each item, made with `line(name, price)`,
      - a last line `total`, with the sum of the prices **with tax**.

      For the items below:

      ```text
      apple     1.50
      bread     2.25
      milk      0.99
      total     5.69
      ```
    files:
      shop/__init__.py: ""
      shop/prices.py: |
        def total(prices):
            return round(sum(prices), 2)


        def with_tax(amount, rate=0.2):
            return round(amount * (1 + rate), 2)
      shop/labels.py: |
        def line(name, price):
            return f"{name:<8}{price:>6.2f}"
    given: |
      items = {"apple": 1.5, "bread": 2.25, "milk": 0.99}
    starter: |
      # items already exists. Import from the package shop.
    solution: |
      from shop.labels import line
      from shop.prices import total, with_tax

      for name, price in items.items():
          print(line(name, price))
      print(line("total", with_tax(total(items.values()))))
    after: >-
      `main.py` now only says what to do. The how is in the package, where
      other programs can use it too.
    cases:
      - {}
      - label: "`items` is `tea: 3.2`"
        setup: |
          items = {"tea": 3.2}
    checks:
      - expr: "err is None and lines[:-1] == [f'{n:<8}{p:>6.2f}' for n, p in pre['items'].items()]"
        pass: "One line for each item"
        hint: "A loop over `items.items()`, and `print(line(name, price))`."
      - expr: "err is None and lines[-1:] == [f\"{'total':<8}{round(round(sum(pre['items'].values()), 2) * 1.2, 2):>6.2f}\"]"
        pass: "The last line is the total with tax"
        hint: "`line(\"total\", with_tax(total(items.values())))`."
        misconceptions:
          - when: "err is None and lines[-1:] == [f\"{'total':<8}{round(sum(pre['items'].values()), 2):>6.2f}\"]"
            say: "This is the total without tax. Use `with_tax` too."
      - expr: "'shop' in src and (syntax('ImportFrom') + syntax('Import')) >= 1 and 'def ' not in src"
        pass: "It uses the package, and writes no function again"
        hint: "`from shop.labels import line` and `from shop.prices import total, with_tax`."
        misconceptions:
          - when: "err == 'ModuleNotFoundError'"
            say: "The names are `shop.prices` and `shop.labels`: folder, dot, module."
    hints:
      - "Two imports: `from shop.labels import line` and `from shop.prices import total, with_tax`."
      - "The lines: `for name, price in items.items():` and `print(line(name, price))`."
      - "The last line: `print(line(\"total\", with_tax(total(items.values()))))`."

  # 9. THEORY ----------------------------------------------------------------
  - id: pyproject
    type: theory
    objective: O5
    title: A package that describes itself
    body: |
      A package that other people (or your other projects) install needs a
      description: its name, its version, and the packages it needs. Today
      this is one file, **`pyproject.toml`**, next to the package folder:

      ```text
      shapes-project/
          pyproject.toml
          shapes/
              __init__.py
              area.py
      ```

      ```toml
      [build-system]
      requires = ["setuptools>=77"]
      build-backend = "setuptools.build_meta"

      [project]
      name = "shapes"
      version = "0.1.0"
      description = "Areas of simple shapes"
      requires-python = ">=3.10"
      dependencies = ["rich>=14"]
      ```

      - **TOML** is a simple text format: `[sections]`, and `key = value`
        lines. Texts have quotes; lists have `[ ]`.
      - `[project]` describes the package. `dependencies` lists what it
        needs; pip installs those too.
      - `[build-system]` says which tool turns the folder into an
        installable package. Copy these three lines as they are.

      In lesson 43 you will use **pip** in a venv. In the folder of
      `pyproject.toml`, `pip install -e .` then installs your package so
      that `import shapes` works in any of your programs, and a change in
      the code counts at once. (`-e` means editable; `.` means this folder.)

      Python reads TOML with the module `tomllib`, which comes with it.
    keys:
      - code: "pyproject.toml"
        means: "The description of a package: name, version, dependencies."
      - code: "[project]"
        means: "A TOML section; the lines below it belong to it."
      - code: "pip install -e ."
        means: "Install the package of this folder, editable (in a venv)."
      - code: "tomllib.loads(text)"
        means: "Read a TOML text into a dictionary."

  # 10. EXERCISE: completion -------------------------------------------------
  - id: ex-pyproject
    type: exercise
    fade: completion
    objective: O5
    title: Read pyproject.toml
    prompt: |
      A program can read `pyproject.toml` too, for example to show its own
      version. **Replace the two `___`** so that the program prints the
      name and the version of the package, and its dependencies:

      ```text
      shapes 0.1.0
      needs: rich>=14, colorama>=0.4
      ```
    files:
      pyproject.toml: |
        [build-system]
        requires = ["setuptools>=77"]
        build-backend = "setuptools.build_meta"

        [project]
        name = "shapes"
        version = "0.1.0"
        description = "Areas of simple shapes"
        dependencies = ["rich>=14", "colorama>=0.4"]
    starter: |
      import tomllib
      from pathlib import Path

      data = tomllib.___(Path("pyproject.toml").read_text())
      project = data[___]
      print(project["name"], project["version"])
      print("needs:", ", ".join(project["dependencies"]))
    solution: |
      import tomllib
      from pathlib import Path

      data = tomllib.loads(Path("pyproject.toml").read_text())
      project = data["project"]
      print(project["name"], project["version"])
      print("needs:", ", ".join(project["dependencies"]))
    after: >-
      `tomllib` turns each `[section]` into a dictionary inside the big one.
      `loads` reads a text, like `json.loads`; `tomllib.load` reads a file
      opened with `"rb"`.
    cases:
      - {}
      - label: "another package"
        files:
          pyproject.toml: "[project]\nname = \"weather\"\nversion = \"2.1.0\"\ndependencies = [\"requests>=2.32\"]\n"
    checks:
      - expr: "err is None and lines[0] == ' '.join([__import__('tomllib').loads(start_files['pyproject.toml'])['project'][k] for k in ('name', 'version')])"
        pass: "It prints the name and the version from the file"
        hint: "The first `___` is `loads`, like `json.loads`. The second is the name of the section, as a text: `\"project\"`."
        misconceptions:
          - when: "err == 'KeyError'"
            say: "The section is called `project`, without the brackets: `data[\"project\"]`."
          - when: "err == 'NameError'"
            say: "The section name is a text: write it with quotes, `\"project\"`."
      - expr: "err is None and lines[1] == 'needs: ' + ', '.join(__import__('tomllib').loads(start_files['pyproject.toml'])['project']['dependencies'])"
        pass: "It lists the dependencies"
        hint: "Keep the last print."
    hints:
      - "Reading a text into a dictionary is called `loads`, like in `json`."
      - "In the file, the lines of the package come after `[project]`."
      - "`tomllib.loads(...)` and `data[\"project\"]`."

  # 11. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: diagnose
        id: q-own-random
        objective: O2
        mode: predict
        files:
          random.py: |
            def roll():
                return 4
        code: |
          import random

          print(random.randint(1, 6))
        explain: >-
          Your own `random.py` is in the folder of the program, and Python
          looks there first. It has no `randint`, so the real `random` never
          came in.
        distractors: [ModuleNotFoundError, ImportError, NameError, TypeError]
        fix:
          - text: "Rename your file, for example to `dice.py`"
            correct: true
            why: "Then `import random` finds the standard library again."
          - text: "Write `import random` two times"
            why: "The second import gives the same module: your file."
          - text: "Install random with pip"
            why: "`random` is in the standard library. Your file hides it."
      - kind: mcq
        id: q-errors
        objective: O2
        prompt: "`from helpers import euro` says `ImportError: cannot import name 'euro' from 'helpers'`. What is wrong?"
        options:
          - text: "`helpers.py` is found, but it has no name `euro`"
            correct: true
            why: "Check the spelling: maybe it is `euros`."
          - text: "There is no file `helpers.py`"
            why: "That would be `ModuleNotFoundError`."
          - text: "`from ... import` is not allowed for own modules"
            why: "It works for every module."
      - kind: mcq
        id: q-main
        objective: O3
        prompt: "In `tools.py`, what is `__name__` when another file does `import tools`?"
        options:
          - text: "`\"tools\"`"
            correct: true
            why: "Imported, a module gets its own name. Only the program gets `\"__main__\"`."
          - text: "`\"__main__\"`"
            why: "That is the name of the file that you run."
          - text: "`None`"
            why: "Every module has a name."
      - kind: mcq
        id: q-init
        objective: O4
        prompt: "What makes the folder `shop` a package?"
        options:
          - text: "A file `__init__.py` in it"
            correct: true
            why: "It may be empty. It runs at the first import."
          - text: "A file `shop.py` in it"
            why: "That would be the module `shop.shop`."
          - text: "Nothing: every folder is a package"
            why: "A package is marked with `__init__.py`."
      - kind: mcq
        id: q-pycache
        objective: O4
        prompt: "You find a folder `__pycache__` with `.pyc` files. What do you do?"
        options:
          - text: "Nothing, and keep it out of Git"
            correct: true
            why: "Python makes these copies itself, to start faster."
          - text: "Edit the `.pyc` files to fix a bug"
            why: "Fix the `.py` file. Python makes the `.pyc` again."
          - text: "Delete your `.py` files: the `.pyc` are enough"
            why: "Your `.py` files are the real program."

  # 12. REVIEW --------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-runs-once
    objective: O1
    prompt: "`helpers.py` prints a line at the top. A program imports it three times. How often is the line printed?"
    options:
      - text: "Once"
        correct: true
        why: "The first import runs the file. The others use the module Python keeps."
      - text: "Three times"
        why: "Only the first import runs the module."
      - text: "Never"
        why: "The first import runs the whole file."
  - kind: mcq
    id: r-star
    objective: O1
    prompt: "Why is `from shop import *` risky?"
    options:
      - text: "It brings names you cannot see, and they can replace yours"
        correct: true
        why: "Name the names you need: `from shop import total`."
      - text: "It is slow"
        why: "Speed is not the problem. Hidden names are."
      - text: "It only works for packages"
        why: "It works for modules too. That is not the problem."
  - kind: mcq
    id: r-first-folder
    objective: O2
    prompt: "Where does Python look first for `import helpers`?"
    options:
      - text: "In the folder of the program that you run"
        correct: true
        why: "Then in the standard library, then in the installed packages."
      - text: "On the internet"
        why: "Python looks only on your computer. pip downloads, import does not."
      - text: "Only in the standard library"
        why: "The folder of your program comes first."
  - kind: mcq
    id: r-guard
    objective: O3
    prompt: "What does `if __name__ == \"__main__\":` do?"
    options:
      - text: "Its block runs only when the file is run as a program, not when it is imported"
        correct: true
        why: "Good for tests and examples inside a module."
      - text: "It makes the file run faster"
        why: "It only decides if the block runs."
      - text: "It is needed in every file"
        why: "Only where a block must not run at an import."
  - kind: mcq
    id: r-dotted
    objective: O4
    prompt: "Which line imports the function `line` from `shop/labels.py`?"
    options:
      - text: "`from shop.labels import line`"
        correct: true
        why: "Folder, dot, module, then the name."
      - text: "`from shop/labels import line`"
        why: "Python uses dots, not slashes."
      - text: "`import line from shop.labels`"
        why: "The order is `from ... import ...`."

  - kind: mcq
    id: r-import-as
    objective: O1
    prompt: "After `from statistics import mean as average`, which name can you use?"
    options:
      - text: "`average`; the name `mean` is not defined here"
        correct: true
        why: "`as` gives the imported object another name in your file."
      - text: "`mean` and `average`"
        why: "Only the new name is put into your namespace."
      - text: "`statistics.mean`"
        why: "The module itself was not imported, only one name from it."
  - kind: mcq
    id: r-sys-path-insert
    objective: O2
    prompt: "A program must import a module from the folder `tools`, which is not on the search path. What works for this one program?"
    options:
      - text: "`sys.path.insert(0, \"tools\")` before the import"
        correct: true
        why: "It changes the search path only while this program runs. A package or a venv is better for anything that lasts."
      - text: "Rename the folder to `sys.path`"
        why: "`sys.path` is a list in Python, not a folder name."
      - text: "`import tools/module`"
        why: "An import takes module names with dots, not paths."
  - kind: mcq
    id: r-circular
    objective: O2
    prompt: "`a.py` imports `b`, and `b.py` imports `a` at the top. What can happen?"
    options:
      - text: "A circular import: one module is only half loaded, and a name is missing (ImportError or AttributeError)"
        correct: true
        why: "Fix it by moving the shared part into a third module that both import."
      - text: "Python loads both files forever"
        why: "Python loads each module once, which is why one of them is unfinished."
      - text: "Nothing: Python sorts it out"
        why: "It often fails, and the error names a module that seems fine."
  - kind: mcq
    id: r-pyproject
    objective: O5
    prompt: "Where does a package write its name, its version and the packages it needs?"
    options:
      - text: "In `pyproject.toml`, under `[project]`"
        correct: true
        why: "One file next to the package folder describes it, for pip and for people."
      - text: "In `__init__.py`"
        why: "`__init__.py` makes a folder a package. The description of the package is in `pyproject.toml`."
      - text: "In `requirements.txt`"
        why: "That lists what one project needs to run. A package that others install describes itself in `pyproject.toml`."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-shapes
    type: exercise
    fade: completion
    objective: O1
    title: A short name for a module
    prompt: |
      The folder has `shapes.py` (see the files). **Replace `___`** so the
      module gets the short name `sh`, and the last line works as it is.

      ```text
      12.57
      ```
    files:
      shapes.py: |
        """Areas of shapes."""
        PI = 3.14159


        def circle_area(r):
            return PI * r * r


        def square_area(side):
            return side * side
    starter: |
      import shapes as ___

      print(round(sh.circle_area(2), 2))
    solution: |
      import shapes as sh

      print(round(sh.circle_area(2), 2))
    after: >-
      `as` gives a module a second, shorter name. You know it from
      `import numpy as np`.
    checks:
      - expr: "err is None and lines == ['12.57']"
        pass: "It prints 12.57"
        hint: "`import shapes as sh`."
      - expr: "'def ' not in src"
        pass: "It uses the module, and does not copy the function"
        hint: "Import it: do not write the function again."
    hints:
      - "`as` gives a module a new name."
      - "The last line uses the name `sh`."
      - "`import shapes as sh`."
  - id: x-quiet-module
    type: exercise
    fade: debug
    objective: O3
    title: Tests that run on import
    prompt: |
      This file is a module with a function and two tests. When another
      program imports it, the tests print their lines too. **Fix it**: the
      tests may only run when the file itself is run.

      ```text
      test 1: 0.0
      test 2: 100.0
      ```
    starter: |
      def celsius(fahrenheit):
          return round((fahrenheit - 32) * 5 / 9, 1)


      print("test 1:", celsius(32))
      print("test 2:", celsius(212))
    solution: |
      def celsius(fahrenheit):
          return round((fahrenheit - 32) * 5 / 9, 1)


      if __name__ == "__main__":
          print("test 1:", celsius(32))
          print("test 2:", celsius(212))
    after: >-
      `__name__` is `"__main__"` only when the file is run. On import it is
      the module's name, so the `if` keeps the module quiet.
    checks:
      - expr: "err is None and lines == ['test 1: 0.0', 'test 2: 100.0']"
        pass: "Run as a program, it prints the tests"
        hint: "Keep the two prints, inside the `if`."
      - expr: "import_out('temps') == ''"
        pass: "Imported as a module, it prints nothing"
        hint: "Put the tests under `if __name__ == \"__main__\":`."
      - expr: "callable(ns.get('celsius')) and celsius(50) == 10.0"
        pass: "The function still works"
        hint: "Keep the function as it is."
    hints:
      - "When is `__name__` equal to `\"__main__\"`?"
      - "Only when the file itself is run, not when it is imported."
      - "`if __name__ == \"__main__\":`, and indent the two prints under it."
  - id: x-alias
    type: exercise
    fade: completion
    objective: O1
    title: Short names with as
    prompt: |
      `helpers.py` (see the files) has a function with a long name.
      **Replace the `___`**: import it under the short name `fmt`, and
      import the module `statistics` as `st`.

      ```text
      4.50 €
      3
      ```
    files:
      helpers.py: |
        def format_price_in_euros(amount):
            return f"{amount:.2f} €"
    starter: |
      from helpers import format_price_in_euros as ___
      import statistics ___

      print(fmt(4.5))
      print(st.median([1, 3, 7]))
    solution: |
      from helpers import format_price_in_euros as fmt
      import statistics as st

      print(fmt(4.5))
      print(st.median([1, 3, 7]))
    after: >-
      `as` changes only the name in your file. Use it for long names and
      for names that would clash, like two modules that both have `load`.
    checks:
      - expr: "err is None and lines == ['4.50 €', '3']"
        pass: "It prints the price and the median"
        hint: "`... as fmt` and `import statistics as st`."
        misconceptions:
          - when: "err == 'NameError'"
            say: "A name is not defined. After `as`, write the short name: `fmt` and `st`."
      - expr: "'fmt' in ns and 'format_price_in_euros' not in ns and 'st' in ns and 'statistics' not in ns"
        pass: "Only the short names are in the program"
        hint: "With `as`, the long name is not defined in your file."
    hints:
      - "After `as` comes the new name."
      - "`from helpers import format_price_in_euros as fmt`."
      - "`import statistics as st`."
