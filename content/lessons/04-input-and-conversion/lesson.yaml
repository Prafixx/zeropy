id: input-and-conversion
order: 4
title: Input and conversion
summary: Ask the user for values and change text into numbers.
minutes: 25
outcomes: [A1, A2]

objectives:
  - id: O1
    text: Ask the user for a value with input()
  - id: O2
    text: Explain why the answer of input() is always text
  - id: O3
    text: Change the type of a value with int(), float() and str()
  - id: O4
    text: Read a ValueError and find the value that cannot be changed

steps:
  # 1. HOOK ------------------------------------------------------------------
  - id: see
    type: hook
    objective: O2
    title: The answer is text
    question: The user types 12. What does Python receive?
    code: |
      answer = input("Age? ")
      age = int(answer)
      next_age = age + 1
    beats:
      - beat: empty
        caption: "Until now, all values were in the code. A real program gets values from the **user**."
      - beat: ask
        line: 1
        caption: "`input` shows the question and waits. The user types 12. Look at the color: the answer is **text**, always."
      - beat: convert
        line: 2
        caption: "`int()` reads the text and makes a **number** from it. This is a new value with a new type. The text stays as it was."
      - beat: compute
        line: 3
        caption: "Now Python can compute. With the text `'12'`, the line `answer + 1` gives a `TypeError`."

  # 2. THEORY ----------------------------------------------------------------
  - id: tools
    type: theory
    objective: O1
    title: Ask, then convert
    body: |
      ## `input()` and conversion

      `input("question")` does three things: it shows the question, it waits
      until the user presses Enter, and it gives back the typed characters
      as text (`str`).

      To compute with the answer, change its type first. This is called
      **conversion**. Each type has a conversion with the same name.

      Programmers often write both steps on one line:
      `age = int(input("Age? "))`. Python works from the inside to the outside.

      ## Round a number

      `round(x)` gives the nearest whole number. `round(x, 2)` keeps two
      decimals:

      ```python
      print(round(7.6))          # 8
      print(round(3.14159, 2))   # 3.14
      ```

      A number exactly in the middle goes to the even neighbour:
      `round(2.5)` is 2, and `round(3.5)` is 4.
    keys:
      - code: 'input("Name: ")'
        means: "Ask. The result is always text."
      - code: 'int("12")'
        means: "Text to whole number: `12`."
      - code: 'float("2.5")'
        means: "Text to number with decimals: `2.5`."
      - code: "str(12)"
        means: 'Number to text: `"12"`.'
      - code: 'int("ten")'
        means: "Not possible. Python stops with a `ValueError`."
      - code: "round(3.14159, 2)"
        means: "Round to two decimals: `3.14`."

  # 3. PREDICT ---------------------------------------------------------------
  - id: predict-convert
    type: predict
    objective: O3
    title: Before and after int()
    item:
      kind: predict
      id: p-convert
      prompt: "This program prints two lines. **Type both lines** before you check."
      code: |
        a = "2"
        b = "3"
        print(a + b)
        print(int(a) + int(b))
      explain: >-
        `a` and `b` are text, so `+` joins them: `23`. After `int()`, both
        are numbers, so `+` adds them: 5. The answers of `input()` behave
        like `a` and `b` here.
      misconceptions:
        - answer: "5\n5"
          say: "On line 3, `a` and `b` are text. `+` joins text."
        - answer: "23\n23"
          say: "On line 4, `int()` makes numbers. `+` adds numbers."

  # 4. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O1
    title: Talk to your program
    intro: |
      Press **Run**. When the program asks, a field appears under the output.
      Type your answer and press Enter.

      Watch the colors of the cards: which values are text, which are numbers?
    code: |
      name = input("Your name: ")
      age = int(input("Your age: "))
      print(f"Hello, {name}!")
      print(f"Next year you are {age + 1}.")
    experiments:
      - text: "Run the program. Answer both questions."
        expr: "err is None and len(inputs) >= 2"
      - text: "Run again. For the age, type a word, for example `ten`. Read the message."
        expr: "err == 'ValueError'"
      - text: "Change the last line: print the age in 10 years."
        expr: "err is None and isinstance(ns.get('age'), int) and str(ns['age'] + 10) in lines[-1]"
      - text: "Add a third question, for example about a city, and print the answer."
        expr: "err is None and len(inputs) >= 3 and inputs[-1] != '' and any(inputs[-1] in line for line in lines[len(inputs):])"
    investigate:
      - kind: spot
        id: i-int
        prompt: "Which line turns an answer into a number?"
        code: |
          name = input("Your name: ")
          age = int(input("Your age: "))
          print(f"Hello, {name}!")
          print(f"Next year you are {age + 1}.")
        line: 2
        wrong:
          - line: 1
            say: "This line keeps the answer as text, which is right for a name."
          - line: 4
            say: "This line computes `age + 1`, but `age` is already a number here. It became one on another line."
        explain: >-
          `input()` always gives text. `int(...)` around it turns the text
          into a whole number, so `age + 1` can work.
      - kind: mcq
        id: i-no-int
        prompt: "Line 2 becomes `age = input(\"Your age: \")`, without `int`. What happens on line 4?"
        options:
          - text: "A `TypeError`"
            correct: true
            why: "Without `int`, `age` is text like `\"30\"`, and text + number is not allowed."
          - text: "It prints the age plus 1, as before"
            why: "`age` is now text. Python never turns text into a number by itself."
          - text: "It prints `301`"
            why: "That would need two texts. Text and a number cannot be joined with `+`."

  # 5. WORKED EXAMPLE --------------------------------------------------------
  - id: example-total
    type: worked
    objective: O3
    title: Price times count
    problem: |
      A shop program asks for a price and for a count.

      **Print the total price.** The price can have decimals, like 2.5.
    lines:
      - goal: "Get the data"
        code: 'price = float(input("Price: "))'
        note: "The price can have decimals, so the conversion is `float()`."
      - code: 'count = int(input("How many: "))'
        note: "A count is a whole number, so the conversion is `int()`."
      - goal: "Compute"
        code: "total = price * count"
        note: "Both values are numbers now. Python can multiply them."
      - goal: "Show the result"
        code: 'print(f"Total: {total}")'
        note: "An f-string takes any type, so no conversion back to text is needed."
    check:
      kind: mcq
      id: w-total
      prompt: "You remove `float()` and `int()` from lines 1 and 2. **What happens on line 3?**"
      options:
        - text: "A `TypeError`"
          correct: true
          why: "Both answers stay text. `*` between two texts is not possible."
        - text: "The total is still correct"
          why: "Python does not convert by itself. The answers stay text."
        - text: "Python asks the user again"
          why: "Python asks only when it meets `input()`. Line 3 has no `input()`."

  # PUZZLE: put the lines in order (Parsons) ----------------------------
  - id: order
    type: drill
    objective: O3
    title: Put the lines in order
    items:
      - kind: order
        id: o-age
        objective: O3
        code: |
          text = input("Your age: ")
          age = int(text)
          next_year = age + 1
          print(f"Next year you are {next_year}.")
        stdin: [["30"]]
        explain: >-
          First ask, then convert: `input()` always gives text, and `int()`
          makes a number from it. Only a number can be added to 1.

  # 6. EXERCISE: completion --------------------------------------------------
  - id: ex-area
    type: exercise
    fade: completion
    objective: O3
    title: Area of a room
    prompt: |
      This program asks for the width and the height of a room and prints
      the area.

      **Replace each `___` with the right conversion.** The numbers can have
      decimals, for example `2.5`.

      Then run it and answer the questions. The check also runs your program
      with other answers.
    starter: |
      width = ___(input("Width: "))
      height = ___(input("Height: "))
      print(width * height)
    solution: |
      width = float(input("Width: "))
      height = float(input("Height: "))
      print(width * height)
    after: >-
      `float()` reads numbers with and without a decimal point. `int()` reads
      only whole numbers. When a value can have decimals, choose `float()`.
    cases:
      - {}
      - label: "the user types `3` and `4`"
        stdin: ["3", "4"]
      - label: "the user types `2.5` and `4`"
        stdin: ["2.5", "4"]
    checks:
      - expr: "err is None"
        pass: "The program runs without an error"
        hint: "Each `___` must be the name of a conversion."
        misconceptions:
          - when: "err == 'ValueError' and any('.' in text for text in inputs)"
            say: "`int()` cannot read a number with a decimal point. Use `float()`."
          - when: "err == 'ValueError'"
            say: "The answer must be a number, like `3` or `2.5`. Run again and type a number."
          - when: "err == 'TypeError'"
            say: "`str()` keeps the answer as text. Text cannot be multiplied by text."
      - expr: "len(inputs) == 2 and lines[-1:] == [str(float(inputs[0]) * float(inputs[1]))]"
        pass: "It prints the width multiplied by the height"
        hint: "Convert both answers to numbers with decimals, then multiply."
    hints:
      - "The answers are text. Which conversion makes a number?"
      - "The numbers can have decimals. `int()` reads only whole numbers."
      - 'Write `float(input("Width: "))` and the same for the height.'

  # 7. EXERCISE: debug -------------------------------------------------------
  - id: ex-likes
    type: exercise
    fade: debug
    objective: O2
    title: A wrong total
    prompt: |
      This program adds likes and shares. It runs without an error, but the
      total is wrong.

      **Run it with `12` and `3`. Look at the total. Fix the program.**

      A program can be wrong without an error message. Always check the
      result with values you can compute in your head.
    starter: |
      likes = input("Likes: ")
      shares = input("Shares: ")
      total = likes + shares
      print(f"Total: {total}")
    solution: |
      likes = int(input("Likes: "))
      shares = int(input("Shares: "))
      total = likes + shares
      print(f"Total: {total}")
    after: >-
      The answers were text, so `+` joined them: `123`. Python gave no error,
      because joining text is allowed. This kind of mistake is found only by
      testing with known values.
    cases:
      - {}
      - label: "the user types `12` and `3`"
        stdin: ["12", "3"]
      - label: "the user types `0` and `7`"
        stdin: ["0", "7"]
    checks:
      - expr: "err is None and len(inputs) == 2"
        pass: "The program asks two questions and runs without an error"
        hint: "Keep the two `input()` lines. Type whole numbers as answers."
      - expr: "lines[-1:] == [f'Total: {int(inputs[0]) + int(inputs[1])}']"
        pass: "The total is the sum of the two numbers"
        hint: "Which type do `likes` and `shares` have on line 3?"
        misconceptions:
          - when: "len(inputs) == 2 and lines[-1:] == [f'Total: {inputs[0]}{inputs[1]}']"
            say: "The two answers were joined as text. Change them to numbers with `int()` before you add them."
    hints:
      - "With 12 and 3 the program prints 123. What did `+` do?"
      - "The answer of `input()` is always text."
      - 'Write `likes = int(input("Likes: "))` and the same for `shares`.'

  # 8. EXERCISE: independent -------------------------------------------------
  - id: ex-fahrenheit
    type: exercise
    fade: independent
    objective: O3
    title: Celsius to Fahrenheit
    prompt: |
      **Write a program that asks for a temperature in Celsius and prints
      it in Fahrenheit.**

      The rule: multiply by 1.8, then add 32. The temperature can have
      decimals.

      Print the result on the last line, for example `Fahrenheit: 68.0`
      when the user types `20`.
    starter: |
      # Ask for the temperature in Celsius.
      # Print the temperature in Fahrenheit.
    solution: |
      celsius = float(input("Celsius: "))
      fahrenheit = celsius * 1.8 + 32
      print(f"Fahrenheit: {fahrenheit}")
    after: >-
      Ask, convert, compute, print. Almost every small program has these
      four parts. You wrote all of them alone.
    cases:
      - {}
      - label: "the user types `20`"
        stdin: ["20"]
      - label: "the user types `36.6`"
        stdin: ["36.6"]
    checks:
      - expr: "len(inputs) == 1"
        pass: "The program asks one question"
        hint: "Use `input()` one time and store the answer in a variable."
      - expr: "err is None"
        pass: "It runs without an error"
        hint: "Read the message under the editor."
        misconceptions:
          - when: "err == 'TypeError'"
            say: "The answer of `input()` is text. Change it with `float()` before you compute."
          - when: "err == 'ValueError' and any('.' in text for text in inputs)"
            say: "`int()` cannot read a number with a decimal point. Use `float()`."
          - when: "err == 'ValueError'"
            say: "The answer must be a number, like `20`. Run again and type a number."
      - expr: "abs(float(lines[-1].split()[-1]) - (float(inputs[0]) * 1.8 + 32)) < 0.01"
        pass: "The last line ends with the temperature in Fahrenheit"
        hint: "Compute `celsius * 1.8 + 32` and print it at the end of the last line."
    hints:
      - "Start with the question: store `float(input(...))` in a variable."
      - "Compute the new value in a second variable."
      - 'Print it with an f-string: `print(f"Fahrenheit: {fahrenheit}")`.'

  # 9. QUIZ ------------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O3
    title: Check yourself
    items:
      - kind: mcq
        id: q-inputtype
        objective: O2
        prompt: "The user types `7`. What is the type of `x` after `x = input()`?"
        options:
          - text: "`str`"
            correct: true
            why: "`input()` always gives text, also when the user types digits."
          - text: "`int`"
            why: "Python does not guess. The answer stays text until you convert it."
          - text: "It depends on what the user types"
            why: "The type is always `str`. That makes `input()` easy to predict."
      - kind: predict
        id: q-times
        objective: O3
        code: |
          n = "4"
          print(n * 2)
          print(int(n) * 2)
        explain: "Text times 2 repeats the text: `44`. After `int()`, the number 4 times 2 is 8."
        misconceptions:
          - answer: "8\n8"
            say: "On line 2, `n` is text. `*` repeats text."
      - kind: mcq
        id: q-valueerror
        objective: O4
        prompt: "You see `ValueError: invalid literal for int() with base 10: 'ten'`. What is the problem?"
        options:
          - text: "The text `ten` is not a number"
            correct: true
            why: "The message shows the value at the end. `int()` reads only digits, like `10`."
          - text: "The name `ten` does not exist"
            why: "An unknown name gives a `NameError`. Here `'ten'` is a text value, shown in quotes."
          - text: "The word `int` is spelled wrong"
            why: "Then Python would not know the name and give a `NameError`."
      - kind: mcq
        id: q-first
        objective: O1
        prompt: 'What does `input("City: ")` do first?'
        options:
          - text: "It shows `City: ` and waits for the user"
            correct: true
            why: "The text in the brackets is the question. Then Python waits for Enter."
          - text: "It prints the name of a city"
            why: "`input` does not know any city. It shows your question and waits."
          - text: "It creates a variable with the name `City`"
            why: "A variable is created only with `=`, for example `city = input(\"City: \")`."
      - kind: predict
        id: q-float
        objective: O3
        code: |
          print(float("3"))
          print(int("3") + 1)
        explain: "`float()` makes a number with a decimal point, so Python shows `3.0`. `int(\"3\")` is 3, and 3 + 1 is 4."
        misconceptions:
          - answer: "3\n4"
            say: "A `float` is always shown with a point: `3.0`."
          - answer: "3.0\n31"
            say: "`int(\"3\")` is a number, so `+` adds."

  # 10. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O3
    title: From memory
    count: 5

review:
  - kind: predict
    id: r-join
    objective: O2
    code: |
      a = "1"
      b = "1"
      print(a + b)
    explain: "Both values are text, so `+` joins them. Answers of `input()` behave the same way."
    misconceptions:
      - answer: "2"
        say: "The quotes make `a` and `b` text. `+` joins text."
  - kind: mcq
    id: r-ask
    objective: O1
    prompt: "Which line asks the user and stores a whole number?"
    options:
      - text: '`age = int(input("Age: "))`'
        correct: true
        why: "Python works from the inside: first `input`, then `int`, then the result is stored."
      - text: '`age = input(int("Age: "))`'
        why: "Here `int` gets the question text. `int(\"Age: \")` gives a `ValueError`."
      - text: '`int(age) = input("Age: ")`'
        why: "The left side of `=` must be a name. This is a `SyntaxError`."
  - kind: mcq
    id: r-decimal
    objective: O4
    prompt: 'What does `int("3.5")` give?'
    options:
      - text: "A `ValueError`"
        correct: true
        why: "`int()` reads only whole numbers in text. For `3.5`, use `float()`."
      - text: "`3`, the whole part"
        why: "`int()` does not cut text. It stops with a `ValueError`."
      - text: "`3.5`, as a float"
        why: "`int()` can never give a number with decimals."
  - kind: predict
    id: r-both
    objective: O3
    code: |
      x = int("5")
      print(x + x)
      print(str(x) + str(x))
    explain: "`x` is the number 5, so line 2 adds: 10. `str(x)` is the text `5`, so line 3 joins: `55`."
  - kind: mcq
    id: r-silent
    objective: O2
    prompt: "A program adds two answers of `input()` with `+` and no conversion. The user types `2` and `2`. What does it print?"
    options:
      - text: "`22`"
        correct: true
        why: "The answers are text, so `+` joins them. There is no error message."
      - text: "`4`"
        why: "That needs `int()` first. Without conversion the answers are text."
      - text: "A `TypeError`"
        why: "Text plus text is allowed. That is why this mistake is hard to see."
  - kind: mcq
    id: r-round
    objective: O1
    prompt: "What does `round(9.81, 1)` give?"
    options:
      - text: "9.8"
        correct: true
        why: "One decimal is kept, and 9.81 is closer to 9.8."
      - text: "10"
        why: "That is `round(9.81)`, without the 1: a whole number."
      - text: "9.81"
        why: "`round` changes the number: one decimal is kept."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-tickets
    type: exercise
    fade: completion
    objective: O3
    title: Tickets for a group
    prompt: |
      A ticket costs 7.5. **Replace the two `___`**: change the answer to a
      number, and compute the total.

      ```text
      How many tickets? 4
      Total: 30.0
      ```
    starter: |
      tickets = ___(input("How many tickets? "))
      price = 7.5
      total = ___
      print(f"Total: {total}")
    solution: |
      tickets = int(input("How many tickets? "))
      price = 7.5
      total = tickets * price
      print(f"Total: {total}")
    after: >-
      `int()` for a count (you cannot buy half a ticket), and the price can
      have decimals. A whole number times 7.5 gives a float.
    cases:
      - {}
      - label: "the user types `4`"
        stdin: ["4"]
      - label: "the user types `1`"
        stdin: ["1"]
    checks:
      - expr: "len(inputs) == 1 and err is None"
        pass: "It asks once and runs without an error"
        hint: "Change the answer with `int(...)` before you compute."
        misconceptions:
          - when: "err == 'TypeError'"
            say: "The answer of `input()` is text. Change it with `int()`."
      - expr: "lines[-1] == f'Total: {int(inputs[0]) * 7.5}'"
        pass: "The total is tickets times price"
        hint: "`total = tickets * price`."
    hints:
      - "The answer of `input()` is text. Which function makes a whole number?"
      - "`tickets = int(input(\"How many tickets? \"))`."
      - "`total = tickets * price`."
  - id: x-next-year
    type: exercise
    fade: debug
    objective: O2
    title: Next year
    prompt: |
      This program should say how old you are next year. It stops with a
      `TypeError`. **Fix it**:

      ```text
      Your age: 14
      Next year you are 15
      ```
    starter: |
      age = input("Your age: ")
      print("Next year you are", age + 1)
    solution: |
      age = int(input("Your age: "))
      print("Next year you are", age + 1)
    after: >-
      `input()` always gives text, also when you type digits. `"14" + 1`
      mixes text and a number: Python refuses. `int()` makes it a number.
    cases:
      - {}
      - label: "the user types `14`"
        stdin: ["14"]
      - label: "the user types `99`"
        stdin: ["99"]
    checks:
      - expr: "err is None and lines[-1] == f'Next year you are {int(inputs[0]) + 1}'"
        pass: "It prints the age of next year"
        hint: "Change the answer to a number with `int()`."
        misconceptions:
          - when: "err is None and lines[-1:] == [f'Next year you are {inputs[0]}1']"
            say: "That joined the text \"1\" to the age. Change the age to a number with `int()`, and add the number 1."
    hints:
      - "Read the message: text and a number cannot be added."
      - "What type is `age`? It comes from `input()`."
      - "`age = int(input(\"Your age: \"))`."

# Challenges of the module: spec only, hidden checks.
  - id: c-split-bill
    type: exercise
    fade: challenge
    objective: O3
    title: "Challenge: split the bill"
    prompt: |
      **Write a program** that asks three questions, in this order:

      1. the bill (it can have decimals),
      2. the tip in percent (a whole number),
      3. the number of people (a whole number).

      Then it prints four lines. Round every amount to 2 decimals with
      `round(x, 2)`:

      ```text
      Bill: 60.0 for 3 people
      Tip (15%): 9.0
      Total: 69.0
      Each pays: 23.0
      ```
    starter: |
      # Write the whole program yourself.
    solution: |
      bill = float(input("Bill: "))
      percent = int(input("Tip in %: "))
      people = int(input("People: "))
      tip = bill * percent / 100
      total = bill + tip
      each = total / people
      print(f"Bill: {round(bill, 2)} for {people} people")
      print(f"Tip ({percent}%): {round(tip, 2)}")
      print(f"Total: {round(total, 2)}")
      print(f"Each pays: {round(each, 2)}")
    after: >-
      Ask, convert, compute, print: the shape of almost every small program.
      The checks tried a tip of 0%, one person, and a bill with decimals.
    cases:
      - {}
      - label: "the inputs are 60, 15 and 3"
        stdin: ["60", "15", "3"]
      - label: "the inputs are 100, 10 and 4"
        stdin: ["100", "10", "4"]
      - label: "the inputs are 45.5, 0 and 1"
        stdin: ["45.5", "0", "1"]
      - label: "the inputs are 10, 20 and 3"
        stdin: ["10", "20", "3"]
    checks:
      - expr: "len(inputs) == 3 and err is None"
        pass: "It asks three questions and runs without an error"
        hint: "Three `input()` calls; turn each answer into a number."
        misconceptions:
          - when: "err == 'TypeError'"
            say: "An answer of `input()` is text. Use `float()` for the bill and `int()` for the others."
          - when: "err == 'ValueError'"
            say: "`int()` cannot read decimals: the bill needs `float()`."
      - expr: "len(lines) >= 4 and lines[-4] == f'Bill: {round(float(inputs[0]), 2)} for {int(inputs[2])} people'"
        pass: "The first line shows the bill and the people"
        hint: "`print(f\"Bill: {round(bill, 2)} for {people} people\")`."
      - expr: "len(lines) >= 3 and lines[-3] == f'Tip ({int(inputs[1])}%): {round(float(inputs[0]) * int(inputs[1]) / 100, 2)}'"
        pass: "The tip is the bill times the percent, divided by 100"
        hint: "`tip = bill * percent / 100`."
      - expr: "len(lines) >= 2 and lines[-2] == f'Total: {round(float(inputs[0]) * (1 + int(inputs[1]) / 100), 2)}' or len(lines) >= 2 and lines[-2] == f'Total: {round(float(inputs[0]) + float(inputs[0]) * int(inputs[1]) / 100, 2)}'"
        pass: "The total is the bill plus the tip"
        hint: "`total = bill + tip`."
      - expr: "len(lines) >= 1 and lines[-1] == f'Each pays: {round((float(inputs[0]) + float(inputs[0]) * int(inputs[1]) / 100) / int(inputs[2]), 2)}'"
        pass: "Each person pays the total divided by the people"
        hint: "`each = total / people`, rounded at the end."
    hints:
      - "Start with three lines: `bill = float(input(...))`, `percent = int(...)`, `people = int(...)`."
      - "Compute `tip`, `total` and `each` in three lines."
      - "Print with f-strings, and `round(x, 2)` inside the braces."
  - id: c-clock
    type: exercise
    fade: challenge
    objective: O3
    title: "Challenge: seconds to days and hours"
    prompt: |
      **Write a program** that asks for a number of seconds (a whole
      number), and prints how many whole days, hours, minutes and seconds
      that is:

      ```text
      Seconds: 93784
      Days: 1
      Hours: 2
      Minutes: 3
      Seconds: 4
      ```

      Use `//` and `%`. No `if` is needed.
    starter: |
      # Write the whole program yourself.
    solution: |
      total = int(input("Seconds: "))
      days = total // 86400
      rest = total % 86400
      hours = rest // 3600
      rest = rest % 3600
      minutes = rest // 60
      seconds = rest % 60
      print(f"Days: {days}")
      print(f"Hours: {hours}")
      print(f"Minutes: {minutes}")
      print(f"Seconds: {seconds}")
    after: >-
      Each step takes the biggest unit, and keeps the rest for the next one.
      A day has 24 × 60 × 60 = 86400 seconds.
    cases:
      - {}
      - label: "the input is 93784"
        stdin: ["93784"]
      - label: "the input is 59"
        stdin: ["59"]
      - label: "the input is 86400"
        stdin: ["86400"]
      - label: "the input is 3661"
        stdin: ["3661"]
      - label: "the input is 0"
        stdin: ["0"]
    checks:
      - expr: "len(inputs) == 1 and err is None"
        pass: "It asks once and runs without an error"
        hint: "`total = int(input(\"Seconds: \"))`."
      - expr: "len(lines) >= 4 and lines[-4] == f'Days: {int(inputs[0]) // 86400}'"
        pass: "The days are right"
        hint: "A day has 86400 seconds: `total // 86400`."
      - expr: "len(lines) >= 3 and lines[-3] == f'Hours: {int(inputs[0]) % 86400 // 3600}'"
        pass: "The hours are right, without the full days"
        hint: "Keep the rest after the days: `total % 86400`, then `// 3600`."
      - expr: "len(lines) >= 2 and lines[-2] == f'Minutes: {int(inputs[0]) % 3600 // 60}'"
        pass: "The minutes are right"
        hint: "The rest after the hours, `// 60`."
      - expr: "len(lines) >= 1 and lines[-1] == f'Seconds: {int(inputs[0]) % 60}'"
        pass: "The seconds are right"
        hint: "`total % 60`."
    hints:
      - "First the days: `total // 86400`, and the rest `total % 86400`."
      - "Then hours from the rest (3600 seconds each), then minutes (60)."
      - "Four prints at the end, one per unit."

# Challenges of the module: spec only, hidden checks.
  - id: c-coins
    type: exercise
    fade: challenge
    objective: O3
    title: "Challenge: the change machine"
    prompt: |
      A machine gives change in coins. **Write a program** that asks
      `input("Amount in euros: ")`, for example `3.85`, and prints how many
      of each coin it gives, from the biggest coin down, always taking as
      many of the biggest coin as possible. Print every coin, also with 0,
      and at the end the number of coins.

      ```text
      Amount in euros: 3.85
      2 €: 1
      1 €: 1
      50 c: 1
      20 c: 1
      10 c: 1
      5 c: 1
      2 c: 0
      1 c: 0
      coins: 6
      ```

      Work in cents (whole numbers), with `//` and `%`. Careful: `0.29 * 100`
      is not exactly 29 for a computer.
    starter: |
      # Write the whole program yourself.
    solution: |
      cents = round(float(input("Amount in euros: ")) * 100)
      c200 = cents // 200
      cents = cents % 200
      c100 = cents // 100
      cents = cents % 100
      c50 = cents // 50
      cents = cents % 50
      c20 = cents // 20
      cents = cents % 20
      c10 = cents // 10
      cents = cents % 10
      c5 = cents // 5
      cents = cents % 5
      c2 = cents // 2
      c1 = cents % 2
      print("2 €:", c200)
      print("1 €:", c100)
      print("50 c:", c50)
      print("20 c:", c20)
      print("10 c:", c10)
      print("5 c:", c5)
      print("2 c:", c2)
      print("1 c:", c1)
      print("coins:", c200 + c100 + c50 + c20 + c10 + c5 + c2 + c1)
    after: >-
      Money in programs is kept in whole cents, never in euros with
      decimals: whole numbers are exact. `//` gives how many coins, `%` what
      is left for the next one.
    cases:
      - stdin: ["3.85"]
      - label: "the input is 0.29"
        stdin: ["0.29"]
      - label: "the input is 7.99"
        stdin: ["7.99"]
      - label: "the input is 0"
        stdin: ["0"]
    checks:
      - expr: "err is None and lines[-9:-1] == [f'{n}: {k}' for n, k in zip(['2 €', '1 €', '50 c', '20 c', '10 c', '5 c', '2 c', '1 c'], __import__('functools').reduce(lambda acc, v: (acc[0] % v, acc[1] + [acc[0] // v]), [200, 100, 50, 20, 10, 5, 2, 1], (round(float(inputs[0]) * 100), []))[1])]"
        pass: "Each coin with its number, biggest first"
        hint: "Work in cents: `cents // 200`, then `cents % 200` for the rest, and so on."
        misconceptions:
          - when: "inputs == ['0.29'] and lines[-3:-1] == ['2 c: 1', '1 c: 0']"
            say: "`0.29 * 100` is 28.999999... for a computer, and `int` cuts it to 28. Use `round(... * 100)`."
      - expr: "lines[-1:] == [f'coins: {sum(__import__('functools').reduce(lambda acc, v: (acc[0] % v, acc[1] + [acc[0] // v]), [200, 100, 50, 20, 10, 5, 2, 1], (round(float(inputs[0]) * 100), []))[1])}']"
        pass: "The number of coins at the end"
        hint: "Add up the eight counts."
      - expr: "asked == 1 and 'Amount in euros: ' in out"
        pass: "It asks once, with the right question"
        hint: "`input(\"Amount in euros: \")`."
      - expr: "src.count('//') >= 4 and src.count('%') >= 4"
        pass: "It uses `//` and `%`"
        hint: "`//` for the number of coins, `%` for what is left."
    hints:
      - "First turn the euros into cents: `round(float(text) * 100)`."
      - "For each coin: `count = cents // value`, then `cents = cents % value`."
      - "Print the eight counts, then their sum."
