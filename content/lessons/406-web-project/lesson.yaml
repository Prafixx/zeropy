    solution: |
      from flask import Flask, render_template_string

      app = Flask(__name__)
      books = [
          {"id": 1, "title": "The Hobbit", "author": "J. R. R. Tolkien", "read": True},
          {"id": 2, "title": "Dune", "author": "Frank Herbert", "read": False},
      ]
      PAGE = "<ul>{% for b in books %}<li>{{ b.title }}</li>{% endfor %}</ul>"


      @app.route("/")
      def home():
          return render_template_string(PAGE, books=books)


      @app.get("/api/books")
      def api_books():
          return books


      app.run()
    after: >-
      One list, two ways out: HTML for people, JSON for programs. When a
      book is added, both show it, because both read the same data.
    checks:
      - expr: "client is not None and client.get('/api/books').status_code == 200 and client.get('/api/books').get_json() == books"
        pass: "GET /api/books answers the books as JSON"
        hint: "A view that returns the list: Flask turns it into JSON."
      - expr: "client is not None and (books.append({'id': 3, 'title': 'Emma', 'author': 'Jane Austen', 'read': False}) or True) and client.get('/api/books').get_json()[-1]['title'] == 'Emma'"
        pass: "It answers the list as it is now"
