    solution: |
      from flask import Flask, redirect, request, url_for

      app = Flask(__name__)
      books = []


      @app.route("/")
      def home():
          return f"{len(books)} books"


      @app.post("/add")
      def add():
          title = request.form.get("title", "")
          if not title.strip():
              return "Please give a title.", 400
          books.append({"id": len(books) + 1, "title": title.strip()})
          return redirect(url_for("home"))


      app.run()
    after: >-
      `"   ".strip()` is `""`, and an empty text is false. So one check
      refuses both an empty title and a title of only spaces.
    checks:
      - expr: "client is not None and client.post('/add', data={'title': '   '}).status_code == 400 and client.post('/add', data={'title': ''}).status_code == 400 and len(books) == 0"
        pass: "An empty title adds nothing and gives 400"
        hint: "Take the spaces away before you test: `title.strip()`."
      - expr: "client is not None and client.post('/add', data={'title': ' Emma '}).status_code == 302 and books[-1]['title'] == 'Emma'"
        pass: "A real title is added, without the spaces"
        hint: "Keep the append and the redirect."
    hints:
      - "Which text method takes away the spaces at both ends?"
      - "An empty text counts as false in an `if`."
      - "`if not title.strip():`."
