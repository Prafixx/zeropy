id: reading-docs
order: 27
title: Reading the docs
summary: Find help for any function, read its signature, try it in two lines, then use it.
minutes: 30
outcomes: [A2, A3]

objectives:
  - id: O1
    text: Find help for a function with help() and on docs.python.org
  - id: O2
    text: Read a signature, with required parameters, defaults, and the marks / and *
  - id: O3
    text: Try a new function with a small test before you use it
  - id: O4
    text: Use a function that the course never taught, from its documentation

steps:
  # 1. HOOK ------------------------------------------------------------------
  - id: see
    type: hook
    objective: O2
    title: A signature is a plan of the desk
    question: Python has hundreds of functions. Nobody learns them all. How do you use one that you have never seen?
    code: |
      # round(number, ndigits=None)
      a = round(3.14159, 2)
      b = round(7.6)
    beats:
      - beat: sig
        line: 1
        caption: "The documentation of every function starts with its **signature**: the name, and its parameters in brackets."
      - beat: call
        line: 2
        caption: "The signature is the plan of the desk. `round` has two boxes: `number` and `ndigits`. Two values, two boxes."
      - beat: back
        line: 2
        caption: "It gives back 3.14: the number with 2 digits after the point."
      - beat: call2
        line: 3
        caption: "Only one value now. `ndigits=None` in the signature is a **default**: the box gets `None`."
      - beat: back2
        line: 3
        caption: "With `None`, `round` gives back a whole number: 8. You learned this from the signature and one sentence of the docs."

  # 2. THEORY ----------------------------------------------------------------
  - id: where
    type: theory
    objective: O1
    title: Where to look
    body: |
      ## help() in Python

      `help(round)` prints the signature and a short explanation. For a
      method, write the type before the dot: `help(str.split)`.

      ## docs.python.org

      The official documentation is at
      [docs.python.org](https://docs.python.org/3/). The most useful pages:

      - [Built-in functions](https://docs.python.org/3/library/functions.html):
        `print`, `len`, `round`, `sorted`, and the others without a dot.
      - [Text methods](https://docs.python.org/3/library/stdtypes.html#string-methods):
        `split`, `replace`, `find`, and all methods of `str`.
      - One page for each module, for example `random` or `math`.

      ## Read an entry in 4 steps

      1. The **signature**: which values it needs.
      2. The **first sentence**: what it gives back.
      3. The **details**: special cases, for example an empty text.
      4. **Try it** in two or three lines, before you use it in a program.
    keys:
      - code: "help(round)"
        means: "Prints the documentation of `round`."
      - code: "help(str.split)"
        means: "The documentation of a method of texts."
      - code: "docs.python.org"
        means: "The full documentation, with examples."

  # 3. PREDICT ---------------------------------------------------------------
  - id: predict-split
    type: predict
    objective: O2
    title: Read, then predict
    item:
      kind: predict
      id: p-split
      prompt: |
        The docs say: `str.split(sep=None, maxsplit=-1)`. "If `maxsplit` is
        given, at most `maxsplit` splits are done."

        **What does this program print?**
      code: |
        print("a-b-c".split("-"))
        print("a-b-c".split("-", 1))
      explain: >-
        The second value goes to `maxsplit`: at most one split. So the text
        is cut only at the first `-`, and the rest stays together.
      misconceptions:
        - answer: "['a', 'b', 'c']\n['a', 'b', 'c']"
          say: "The second argument is `maxsplit`. With 1, Python cuts only one time."
        - answer: "['a', 'b', 'c']\n['a']"
          say: "`maxsplit` limits the cuts, not the parts. One cut gives two parts."

  # 4. DEMO ------------------------------------------------------------------
  - id: try
    type: demo
    objective: O1
    visual: none
    title: Ask Python
    intro: |
      Press **Run** to see the help of `round`. Then use `help()` to learn
      something new.
    code: |
      help(round)

      print(round(3.14159, 2))
      print(round(7.6))
    experiments:
      - text: "Run the code as it is."
        expr: "True"
      - text: "Read `help(str.center)`. Then use it: `print(\"hi\".center(10, \"*\"))`."
        expr: "err is None and '****hi****' in lines"
      - text: "Print `round(2.5)` and `round(3.5)`. Is the result what you expected? The [docs of round](https://docs.python.org/3/library/functions.html#round) explain it."
        expr: "err is None and ('2' in lines and '4' in lines or '2 4' in lines)"
      - text: "Call `round` with a named argument: `print(round(7.654, ndigits=1))`."
        expr: "err is None and '7.7' in lines"
    investigate:
      - kind: mcq
        id: i-ndigits
        prompt: "`help(round)` shows `round(number, ndigits=None)`. What does `ndigits=None` tell you?"
        options:
          - text: "`ndigits` is optional"
            correct: true
            why: "Without it, `round` gives a whole number. A parameter with `=` has a default; the text of the help says what happens with `None`."
          - text: "`ndigits` must always be `None`"
            why: "`None` is only the default. `round(3.14159, 2)` gives it the value 2."
          - text: "`round` gives back `None`"
            why: "The `None` belongs to the parameter, not to the result."
      - kind: predict
        id: i-round
        prompt: "**What does this print?**"
        code: |
          print(round(3.14159, 3), round(12.7))
        explain: >-
          With `ndigits` 3, three digits stay after the point. Without it,
          the result is the nearest whole number.

  # 5. THEORY ----------------------------------------------------------------
  - id: signatures
    type: theory
    objective: O2
    title: Read a signature
    body: |
      ```
      round(number, ndigits=None)
      sorted(iterable, /, *, key=None, reverse=False)
      print(*objects, sep=' ', end='\n')
      ```

      - A name **without** `=` is required: `number`.
      - A name **with** `=` is optional. The value after `=` is the
        default: `ndigits=None`.
      - Before **`/`**: values only by place. `sorted(nums)` is right,
        `sorted(iterable=nums)` is an error.
      - After **`*`**: values only by name. `sorted(nums, reverse=True)` is
        right, `sorted(nums, True)` is an error.
      - **`*objects`**: any number of values, like in `print(a, b, c)`.

      In `help()`, a method shows `self` first, for example
      `zfill(self, width, /)`. `self` is the value before the dot. You do
      not write it in the brackets: `"7".zfill(3)`.

      The text after the signature says what the function gives back. Look
      for the word **Return**.
    keys:
      - code: "ndigits=None"
        means: "Optional. Without it, the value is `None`."
      - code: "*, key=None, reverse=False"
        means: "After `*`: give these by name, `reverse=True`."
      - code: "zfill(self, width, /)"
        means: "Call it as `text.zfill(5)`: `self` is `text`."

  # 6. DRILL -----------------------------------------------------------------
  - id: drill
    type: drill
    objective: O2
    title: Signatures and surprises
    items:
      - kind: predict
        id: d-round
        objective: O3
        prompt: "The docs of `round`: a value exactly in the middle goes to the **even** choice. **What does this print?**"
        code: |
          print(round(2.5), round(3.5))
          print(round(2.6))
        explain: >-
          2.5 is exactly between 2 and 3, and 2 is even. 3.5 is between 3
          and 4, and 4 is even. 2.6 is not in the middle, so it goes to 3.
          This is a reason to try a function before you trust it.
        misconceptions:
          - answer: "3 4\n3"
            say: "In the middle, `round` does not always go up. It goes to the even number: `round(2.5)` is 2."
      - kind: diagnose
        id: d-sorted
        objective: O2
        mode: read
        prompt: "The signature is `sorted(iterable, /, *, key=None, reverse=False)`."
        code: |
          nums = [3, 1, 2]
          print(sorted(nums, True))
        explain: "`reverse` comes after `*`, so it must be given by name. Python accepts only one value by place."
        fix:
          - text: "`sorted(nums, reverse=True)`"
            correct: true
            why: "After `*` in the signature, a value must have its name."
          - text: "`sorted(True, nums)`"
            why: "The order is not the problem. `reverse` needs its name."
          - text: "`sorted(iterable=nums, reverse=True)`"
            why: "`iterable` is before `/`, so it can only be given by place."
      - kind: predict
        id: d-find
        objective: O3
        prompt: "The docs of `str.find(sub)`: \"Return the lowest index where `sub` is found. Return -1 if `sub` is not found.\" **What does this print?**"
        code: |
          print("banana".find("an"))
          print("banana".find("x"))
        explain: "`an` first starts at position 1. `x` is not in the text, so `find` gives back -1. It does not stop with an error."
      - kind: mcq
        id: d-optional
        objective: O2
        prompt: "The signature is `str.replace(old, new, count=-1)`. What tells you that `count` is optional?"
        options:
          - text: "`=-1`: it has a default value"
            correct: true
            why: "A parameter with `=` has a default, so a call can leave it out."
          - text: "It is the last parameter"
            why: "The last parameter can be required, too. The `=` makes it optional."
          - text: "Nothing. All three are required"
            why: "`old` and `new` are required. `count` has a default."

  # 7. WORKED EXAMPLE --------------------------------------------------------
  - id: example-enumerate
    type: worked
    objective: O4
    title: Learn enumerate from its docs
    problem: |
      A program must print a numbered list, from 1. The docs list a
      function `enumerate`. Learn it in four steps.
    lines:
      - goal: "Read the docs"
        code: "# enumerate(iterable, start=0)"
        note: "Step 1, the signature: one required value, and `start`, optional, 0 by default."
      - code: "# It gives pairs: (count, value), (count, value), ..."
        note: "Step 2, the first sentence of the docs, in short: it gives pairs of a number and a value."
      - goal: "Try it small"
        code: |
          for pair in enumerate(["tea", "cake"]):
              print(pair)   # (0, 'tea') then (1, 'cake')
        note: "Steps 3 and 4: try it small and look at what comes out. Each pair is a tuple."
      - goal: "Use it"
        code: |
          for n, item in enumerate(["tea", "cake"], start=1):
              print(f"{n}. {item}")
        note: "Now use it: unpack each pair, and start counting at 1."
    check:
      kind: mcq
      id: w-enumerate
      prompt: "What is the first pair of `enumerate([\"a\", \"b\"], 5)`?"
      options:
        - text: "`(5, 'a')`"
          correct: true
          why: "The second value goes to `start`, so counting starts at 5."
        - text: "`(0, 'a')`"
          why: "That is the default. Here `start` is 5."
        - text: "`(5, 'b')`"
          why: "The first pair always has the first value, `'a'`."

  # 8. EXERCISE: completion --------------------------------------------------
  - id: ex-zfill
    type: exercise
    fade: completion
    objective: O4
    title: Labels with zeros
    prompt: |
      Order numbers must always have 5 digits: `#00042`. The comment shows
      the help of `str.zfill`.

      **Replace `___`** with a call of `zfill`.
    starter: |
      # help(str.zfill):
      # zfill(self, width, /)
      #     Pad a numeric string with zeros on the left,
      #     to fill a field of the given width.

      def order_label(number):
          return "#" + str(number).___

      print(order_label(42))
      print(order_label(12345))
    solution: |
      # help(str.zfill):
      # zfill(self, width, /)
      #     Pad a numeric string with zeros on the left,
      #     to fill a field of the given width.

      def order_label(number):
          return "#" + str(number).zfill(5)

      print(order_label(42))
      print(order_label(12345))
    after: >-
      `width` is the length of the result, not the number of zeros. That is
      why `zfill(5)` works for 42 and for 12345.
    checks:
      - expr: "callable(ns.get('order_label')) and order_label(42) == '#00042' and order_label(7) == '#00007' and order_label(12345) == '#12345'"
        pass: "Every label has 5 digits"
        hint: "`width` is the length of the whole result."
        misconceptions:
          - when: "callable(ns.get('order_label')) and order_label(42) == '#0000042'"
            say: "`width` is the length of the result, not the number of zeros to add. 5 digits: `zfill(5)`."
          - when: "callable(ns.get('order_label')) and order_label(42) == '#   42'"
            say: "This fills with spaces. `zfill` fills with zeros."
    hints:
      - "The signature has one value for you: `width`."
      - "How long must the result be?"
      - "Write `zfill(5)`."

  # 9. EXERCISE: debug -------------------------------------------------------
  - id: ex-longest
    type: exercise
    fade: debug
    objective: O2
    title: A key without its name
    prompt: |
      `longest(words)` must give back the longest word. The comment shows
      the signature of `max`.

      **Run it.** Read the error, then read the signature again.
    starter: |
      # max(iterable, *, key=None)
      #     key is a function. max compares key(item)
      #     for each item, not the items.

      def longest(words):
          return max(words, len)

      print(longest(["banana", "fig", "apple"]))
    solution: |
      # max(iterable, *, key=None)
      #     key is a function. max compares key(item)
      #     for each item, not the items.

      def longest(words):
          return max(words, key=len)

      print(longest(["banana", "fig", "apple"]))
    after: >-
      `key` comes after `*`, so it needs its name. Without the name, Python
      took `len` as one more value to compare, and a function and a list
      cannot be compared.
    checks:
      - expr: "callable(ns.get('longest')) and longest(['banana', 'fig', 'apple']) == 'banana' and longest(['ox', 'cat', 'dog']) == 'cat' and longest(['a']) == 'a'"
        pass: "`longest` gives back the longest word (the first one, if two are equally long)"
        hint: "In the signature, what is after `*`?"
        misconceptions:
          - when: "callable(ns.get('longest')) and longest(['banana', 'fig', 'apple']) == 'fig'"
            say: "Without `key`, `max` compares the words by the alphabet, and `fig` is last. Use `key=len` to compare their lengths."
          - when: "callable(ns.get('longest')) and longest(['banana', 'fig', 'apple']) == 6"
            say: "This is the length of the longest word, not the word. `max(words, key=len)` gives back the word."
    hints:
      - "The error says that a function and a list cannot be compared. Where does a function go in?"
      - "After `*`, a value needs its name."
      - "Write `max(words, key=len)`."

  # 10. EXERCISE: independent ------------------------------------------------
  - id: ex-clock
    type: exercise
    fade: independent
    objective: O4
    title: A clock from the docs
    prompt: |
      **Write `clock(seconds)`** that gives back a time as minutes and
      seconds: `clock(125)` is `"2:05"`, `clock(59)` is `"0:59"`.

      - Use `divmod`. The course did not teach it: run `help(divmod)` or
        read the [docs of divmod](https://docs.python.org/3/library/functions.html#divmod).
      - The seconds always have two digits.
      - Add at least two tests with `assert`. Then print `clock(3725)`.
    starter: |
      # Try divmod first: print(divmod(125, 60))
    solution: |
      def clock(seconds):
          minutes, rest = divmod(seconds, 60)
          return f"{minutes}:{str(rest).zfill(2)}"

      assert clock(125) == "2:05"
      assert clock(59) == "0:59"

      print(clock(3725))
    after: >-
      You learned `divmod` from its docs: a signature, one sentence, and a
      small try. That is the same way you will learn any new function.
    checks:
      - expr: "callable(ns.get('clock')) and clock(125) == '2:05' and clock(59) == '0:59' and clock(600) == '10:00' and clock(0) == '0:00'"
        pass: "`clock` gives back minutes and seconds, with two digits for the seconds"
        hint: "`divmod(125, 60)` gives back two values: the minutes and the seconds that are left."
        misconceptions:
          - when: "callable(ns.get('clock')) and clock(125) == '2:5'"
            say: "The seconds need two digits: `5` must be `05`. Use `zfill(2)`."
          - when: "callable(ns.get('clock')) and clock(125) == (2, 5)"
            say: "This is the tuple from `divmod`. Unpack it and give back a text."
          - when: "callable(ns.get('clock')) and clock(125) is None"
            say: "`clock` gives back `None`. Use `return`."
      - expr: "calls_in('clock', 'divmod')"
        pass: "`clock` uses `divmod`"
        hint: "The task is to learn `divmod` from its docs. Use it inside `clock`."
      - expr: "err is None and src.count('assert') >= 2 and '62:05' in lines"
        pass: "There are tests, they pass, and the program prints `62:05`"
        hint: "Add two `assert` lines, then `print(clock(3725))`."
    hints:
      - "Run `print(divmod(125, 60))` and look at the result."
      - "Unpack it: `minutes, rest = divmod(seconds, 60)`."
      - "Return `f\"{minutes}:{str(rest).zfill(2)}\"`."

  # 11. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: mcq
        id: q-required
        objective: O2
        prompt: "The signature is `random.randint(a, b)`. Which values must a call give?"
        options:
          - text: "Both `a` and `b`"
            correct: true
            why: "Neither has a default, so both are required."
          - text: "Only `a`"
            why: "`b` has no `=`: it is required, too."
          - text: "None of them"
            why: "A parameter without `=` is required."
      - kind: mcq
        id: q-reverse
        objective: O2
        prompt: "`sorted(iterable, /, *, key=None, reverse=False)`. How do you sort `nums` from large to small?"
        options:
          - text: "`sorted(nums, reverse=True)`"
            correct: true
            why: "`reverse` is after `*`, so it needs its name."
          - text: "`sorted(nums, True)`"
            why: "After `*`, values must have their name. This is a `TypeError`."
          - text: "`sorted(reverse=nums)`"
            why: "`reverse` takes True or False. The list goes first, by place."
      - kind: predict
        id: q-split-empty
        objective: O3
        prompt: "The docs: with a `sep`, two separators next to each other make an empty text. **What does this print?**"
        code: |
          print("a,b,,c".split(","))
        explain: "Between the two commas there is nothing, so one of the parts is the empty text `''`."
      - kind: predict
        id: q-min-key
        objective: O4
        code: |
          words = ["pear", "fig", "banana"]
          print(min(words, key=len))
          print(min(words))
        explain: "With `key=len`, `min` compares the lengths: `fig` is the shortest. Without `key`, it compares by the alphabet: `banana` comes first."
      - kind: mcq
        id: q-unknown
        objective: O1
        prompt: "You find `math.isqrt(n)` in some code, and you do not know it. What is the best first step?"
        options:
          - text: "Read `help(math.isqrt)`, then try it"
            correct: true
            why: "Or its docs page. The signature and the first sentence, then a small try with two small numbers."
          - text: "Guess from the name and use it in the program"
            why: "A guess can be wrong, like `round(2.5)`. Try it first."
          - text: "Delete the line"
            why: "The code needs it. Learn what it does."
      - kind: diagnose
        id: q-len
        objective: O2
        mode: predict
        code: |
          print(len("abc", "d"))
        explain: "The signature is `len(obj, /)`: exactly one value. The message says so."

  # 12. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O2
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-default
    objective: O2
    prompt: "In a signature, what does `sep=' '` mean?"
    options:
      - text: "`sep` is optional, and its default is a space"
        correct: true
        why: "A call can leave it out. Then `sep` is `' '`."
      - text: "`sep` must always be a space, nothing else"
        why: "It is only the default. A call can give another value."
      - text: "`sep` is required in every call"
        why: "A parameter with `=` is optional."
  - kind: mcq
    id: r-star
    objective: O2
    prompt: "A signature has `*` before `key=None`. How must a call give `key`?"
    options:
      - text: "By name: `key=len`"
        correct: true
        why: "After `*`, values only go by name."
      - text: "By place, as the second value"
        why: "After `*`, a value by place is an error."
      - text: "It cannot be given"
        why: "It can, with its name."
  - kind: predict
    id: r-round
    objective: O3
    code: |
      print(round(1.5), round(2.5))
    explain: "Exactly in the middle, `round` goes to the even number: 2 for both."
  - kind: predict
    id: r-find
    objective: O4
    code: |
      print("hello".find("l"))
      print("hello".find("z"))
    explain: "The first `l` is at position 2. `z` is not there, so `find` gives back -1."
  - kind: mcq
    id: r-help
    objective: O1
    prompt: "How do you read the help of the text method `upper` in Python?"
    options:
      - text: "`help(str.upper)`"
        correct: true
        why: "Write the type, a dot and the method name."
      - text: "`help(upper)`"
        why: "`upper` alone is not a name. It belongs to `str`."
      - text: "`upper.help()`"
        why: "`help` is a function: the thing goes inside its brackets."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-divmod
    type: exercise
    fade: completion
    objective: O4
    title: A function from the docs
    prompt: |
      The course never taught `divmod`. Its documentation says:

      > `divmod(a, b)` returns the pair `(a // b, a % b)`.

      **Replace `___`** with one call of `divmod`, so the program shows the
      minutes and seconds of 135 seconds.

      ```text
      2 min 15 s
      ```
    starter: |
      total = 135
      minutes, seconds = ___
      print(f"{minutes} min {seconds} s")
    solution: |
      total = 135
      minutes, seconds = divmod(total, 60)
      print(f"{minutes} min {seconds} s")
    after: >-
      One line of the docs was enough: what goes in, what comes out. Try it
      with `help(divmod)` in the playground.
    cases:
      - {}
      - label: "total is 3599"
        set: { total: 3599 }
    checks:
      - expr: "(minutes, seconds) == (total // 60, total % 60)"
        pass: "minutes and seconds are right"
        hint: "`divmod(total, 60)`."
      - expr: "'divmod(' in src"
        pass: "It uses divmod"
        hint: "One call: `divmod(total, 60)`."
      - expr: "lines[-1:] == [f'{total // 60} min {total % 60} s']"
        pass: "It prints the time"
        hint: "Keep the print."
    hints:
      - "`divmod` gives back two values: unpack them."
      - "Seconds to minutes: divide by 60."
      - "`minutes, seconds = divmod(total, 60)`."
  - id: x-default
    type: exercise
    fade: independent
    objective: O2
    title: max without an error
    prompt: |
      `max([])` stops with a `ValueError`. The signature in the docs is:

      ```text
      max(iterable, *, key=None, default=...)
      ```

      **Write `highest(scores)`** with one call of `max`: it gives back the
      highest score, or `0` for an empty list. No `if` and no `try`.

      ```text
      9
      0
      ```
    starter: |
      # Your function here.


      print(highest([4, 9, 7]))
      print(highest([]))
    solution: |
      def highest(scores):
          return max(scores, default=0)


      print(highest([4, 9, 7]))
      print(highest([]))
    after: >-
      The `*` in the signature means: `default` must be given by its name.
      `max(scores, 0)` would mean something else (the larger of the list and
      0).
    checks:
