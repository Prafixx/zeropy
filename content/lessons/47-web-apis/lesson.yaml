id: web-apis
order: 47
title: Web APIs
summary: Ask a server on the web for data, read its JSON answer, and keep your program alive when the web fails.
minutes: 50
outcomes: [A7, A5]

objectives:
  - id: O1
    text: Say what a web API is - a request to a URL, and a response with a status code and data
  - id: O2
    text: Send a GET request with requests, with parameters and a timeout, and read the JSON
  - id: O3
    text: Check the status code, and handle an answer without results
  - id: O4
    text: Keep a program alive when the request fails - no connection, no answer in time, an error code
  - id: O5
    text: Use a web API in a program on your own computer
  - id: O6
    text: Keep an API key out of the code, in an environment variable

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: api
    type: theory
    objective: O1
    title: Programs that ask the web
    body: |
      A **web API** is a URL that answers with data for programs, usually
      JSON. Your program sends a **request**, and the server sends back a
      **response**.

      ```python
      import requests

      response = requests.get(
          URL, params={"name": "Oslo"}, timeout=10
      )
      print(response.status_code)  # 200 means OK
      data = response.json()  # dicts and lists
      ```

      - `params` are the questions. requests adds them to the URL:
        `...search?name=Oslo`.
      - `timeout=10`: wait at most 10 seconds for an answer. Without it, a
        program can wait forever.
      - The **status code** says how it went:

      | Code | Means |
      | --- | --- |
      | 200 | OK, the data is there |
      | 400 | Your request is wrong, for example a missing parameter |
      | 404 | Not found |
      | 429 | Too many requests: wait a little |
      | 500 | The server has a problem |

      In this lesson we use the free geocoding API of
      [Open-Meteo](https://open-meteo.com): it finds places by name, and
      needs no key. **Python in this page has no internet**: here,
      `requests` talks to a pretend web with fixed answers. On your
      computer, the same code talks to the real server.
    keys:
      - code: "params={\"name\": \"Oslo\"}"
        means: "The questions. requests adds them to the URL: `?name=Oslo`."
      - code: "timeout=10"
        means: "Wait at most 10 seconds for an answer."
      - code: "response.status_code"
        means: "How it went: 200 OK, 404 not found, 500 server problem."
      - code: "response.json()"
        means: "The JSON of the answer, as Python dictionaries and lists."

  # 2. DEMO ------------------------------------------------------------------
  - id: first-request
    type: demo
    visual: none
    objective: O2
    title: Find a place
    intro: |
      Press **Run**. Then change the program in the ways below.
    web: &geo
      "https://geocoding-api.open-meteo.com/v1/search?name=Oslo":
        json: {results: [{name: Oslo, latitude: 59.91273, longitude: 10.74609, country: Norway, country_code: "NO", population: 1082575}], generationtime_ms: 0.21}
      "https://geocoding-api.open-meteo.com/v1/search?name=Lima":
        json: {results: [{name: Lima, latitude: -12.04318, longitude: -77.02824, country: Peru, country_code: PE, population: 7737002}], generationtime_ms: 0.19}
      "https://geocoding-api.open-meteo.com/v1/search?name=Nairobi":
        json: {results: [{name: Nairobi, latitude: -1.28333, longitude: 36.81667, country: Kenya, country_code: KE, population: 2750547}], generationtime_ms: 0.2}
      "https://geocoding-api.open-meteo.com/v1/search":
        json: {generationtime_ms: 0.04}
    code: |
      import requests

      URL = "https://geocoding-api.open-meteo.com/v1/search"

      response = requests.get(URL, params={"name": "Oslo"}, timeout=10)
      print(response.status_code)
      print(response.url)
      data = response.json()
      first = data["results"][0]
      print(first["name"], first["country"])
    experiments:
      - text: "Run it. Which URL did requests make from `URL` and `params`?"
        expr: "err is None and any('name=Oslo' in l for l in lines)"
      - text: "Look for `Lima` instead of `Oslo`."
        expr: "err is None and 'Lima Peru' in lines"
      - text: "Add a line that prints `first[\"latitude\"]` and `first[\"longitude\"]`."
        expr: "err is None and any(l.startswith(('59.9', '-12.0', '-1.28')) for l in lines)"
      - text: "Look for `Xqzwvbn`, a place that does not exist. The status is still 200. Which line stops, and why?"
        expr: "err == 'KeyError' and '200' in lines"
    investigate:
      - kind: spot
        id: i-json
        prompt: "Which line turns the answer of the server into Python dictionaries and lists?"
        code: |
          import requests

          URL = "https://geocoding-api.open-meteo.com/v1/search"

          response = requests.get(URL, params={"name": "Oslo"}, timeout=10)
          print(response.status_code)
          print(response.url)
          data = response.json()
          first = data["results"][0]
          print(first["name"], first["country"])
        line: 8
        wrong:
          - line: 5
            say: "This line sends the request. The answer is still a response object."
          - line: 9
            say: "This line reads from `data`, which is already a dictionary."
        explain: >-
          The server sends JSON text. `response.json()` turns it into Python
          values, like `json.loads` does with the text of a file.
      - kind: mcq
        id: i-zero
        prompt: "What does `data[\"results\"][0]` give?"
        options:
          - text: "The first place found"
            correct: true
            why: "`data[\"results\"]` is a list of places, and `[0]` is the first one of the list."
          - text: "The number of results"
            why: "That would be `len(data[\"results\"])`."
          - text: "The status code"
            why: "The status code is `response.status_code`, not part of `data`."

  # 3. DRILL -----------------------------------------------------------------
  - id: drill
    type: drill
    objective: O1
    title: Read the status
    items:
      - kind: mcq
        id: d-404
        objective: O1
        prompt: "`response.status_code` is `404`. What happened?"
        options:
          - text: "Nothing is at this URL"
            correct: true
            why: "The server works, but it has nothing there. Check the URL for a typo."
          - text: "There is no internet"
            why: "Without internet there is no response at all, so no status code."
          - text: "Everything is fine"
            why: "Fine is 200."
      - kind: mcq
        id: d-500
        objective: O1
        prompt: "The status code is `500`. Whose problem is it?"
        options:
          - text: "The server's"
            correct: true
            why: "It failed: try again later. Codes from 500 up are problems of the server, codes from 400 to 499 are problems of the request."
          - text: "Yours: the URL is wrong"
            why: "A wrong URL gives a code from 400 to 499, often 404."
          - text: "Nobody's: 500 means OK"
            why: "OK is 200."
      - kind: mcq
        id: d-429
        objective: O1
        prompt: "Your loop sends 1,000 requests in a minute. The server starts to answer `429`. What does it mean?"
        options:
          - text: "Too many requests"
            correct: true
            why: "Slow down, and wait a little: free APIs have limits. A short pause between requests is polite."
          - text: "The data is too large"
            why: "429 is about how many requests, not their size."
          - text: "The server is down"
            why: "A server that is down cannot answer at all."
      - kind: mcq
        id: d-params
        objective: O2
        prompt: "`requests.get(URL, params={\"name\": \"Oslo\", \"count\": 1})`. Which URL is sent?"
        options:
          - text: "`URL?name=Oslo&count=1`"
            correct: true
            why: "requests adds the parameters after `?`, joined with `&`."
          - text: "`URL/Oslo/1`"
            why: "Parameters go after `?`, not into the path."
          - text: "`URL` alone: the parameters are sent in another way"
            why: "With GET, they are part of the URL. `response.url` shows it."
      - kind: mcq
        id: d-timeout
        objective: O4
        prompt: "Why give every request a `timeout`?"
        options:
          - text: "Else it may wait forever"
            correct: true
            why: "For a server that does not answer. With `timeout=10`, requests raises `Timeout` after 10 seconds, and you can handle it."
          - text: "It makes the request faster"
            why: "It only limits how long to wait."
          - text: "The server needs it"
            why: "The server never sees it. It is for your program."

  # 4. EXERCISE: completion --------------------------------------------------
  - id: ex-find
    type: exercise
    fade: completion
    objective: O3
    title: A function that finds places
    prompt: |
      **Replace the two `___`**, so that `find` gives back the name and the
      country of a place, or `None` when the API knows no such place.

      When nothing is found, the JSON has **no** `"results"` at all, and
      the status is still 200.
    web: *geo
    starter: |
      import requests

      URL = "https://geocoding-api.open-meteo.com/v1/search"

      def find(place):
          response = requests.get(URL, params=___, timeout=10)
          data = response.json()
          results = data.get(___, [])
          if not results:
              return None
          first = results[0]
          return first["name"], first["country"]

      print(find("Oslo"))
      print(find("Xqzwvbn"))
    solution: |
      import requests

      URL = "https://geocoding-api.open-meteo.com/v1/search"

      def find(place):
          response = requests.get(URL, params={"name": place, "count": 1}, timeout=10)
          data = response.json()
          results = data.get("results", [])
          if not results:
              return None
          first = results[0]
          return first["name"], first["country"]

      print(find("Oslo"))
      print(find("Xqzwvbn"))
    after: >-
      `data.get("results", [])` gives an empty list when the key is
      missing, so one `if` handles "nothing found". `count: 1` asks the
      server for one result only.
    checks:
      - expr: "callable(ns.get('find')) and find('Lima') == ('Lima', 'Peru') and find('Nairobi') == ('Nairobi', 'Kenya')"
        pass: "`find` gives the name and country of the place that you ask for"
        hint: "The parameters are a dictionary: `{\"name\": place}`."
        misconceptions:
          - when: "callable(ns.get('find')) and raises(find, 'Lima') is None and find('Lima') == ('Oslo', 'Norway')"
            say: "`find` always looks for Oslo. Use the parameter: `{\"name\": place}`."
      - expr: "callable(ns.get('find')) and raises(find, 'Xqzwvbn') is None and find('Xqzwvbn') is None"
        pass: "A place that does not exist gives `None`, not an error"
        hint: "Read the list with `data.get(\"results\", [])`."
        misconceptions:
          - when: "err == 'KeyError' or (callable(ns.get('find')) and raises(find, 'Xqzwvbn') == 'KeyError')"
            say: "When nothing is found, the JSON has no `\"results\"`, so `data[\"results\"]` fails. `data.get(\"results\", [])` gives an empty list instead."
      - expr: "err is None and lines == [\"('Oslo', 'Norway')\", 'None']"
        pass: "It prints Oslo, then `None`"
        hint: "Keep the two `print` lines at the end."
    hints:
      - "The first `___` is a dictionary with one key: `{\"name\": place}`."
      - "The second `___` is the name of the key: `\"results\"`."
      - "`data.get(\"results\", [])` gives `[]` when the key is not there."

  # 5. THEORY ----------------------------------------------------------------
  - id: failures
    type: theory
    objective: O4
    title: When the web fails
    body: |
      A request can fail in many ways that are not your bug:

      | What happens | What requests does |
      | --- | --- |
      | No internet, or a wrong address | raises `requests.ConnectionError` |
      | No answer in time | raises `requests.Timeout` |
      | An error code (404, 500) | nothing: check `status_code`, or call `raise_for_status()` |
      | The answer is not JSON | `.json()` raises `requests.JSONDecodeError` |

      All these errors are kinds of `requests.RequestException`. One
      `except` catches them all:

      ```python
      try:
          response = requests.get(
              URL, params=params, timeout=10
          )
          response.raise_for_status()
          data = response.json()
      except requests.RequestException:
          print("No answer from the server.")
      ```

      `raise_for_status()` raises `requests.HTTPError` when the code is
      400 or more, and does nothing when all is fine.

      Catch only these errors, not every `Exception`: a bug in your own
      code must still show its message.
    keys:
      - code: "requests.RequestException"
        means: "The parent of all errors of requests. One `except` for all."
      - code: "response.raise_for_status()"
        means: "Raise `HTTPError` for a code of 400 or more."
      - code: "response.ok"
        means: "`True` when the code is below 400."

  # 6. EXERCISE: debug -------------------------------------------------------
  - id: ex-safe
    type: exercise
    fade: debug
    objective: O4
    title: Do not crash
    prompt: |
      This program works when the web works. But it is also tested with
      **no answer in time** and with **no connection**, and then it
      crashes.

      **Make it print** `No answer from the server.` when the request
      fails. The rest stays the same.
    web: *geo
    cases:
      - {}
      - label: "the server does not answer in time"
        web:
          "https://geocoding-api.open-meteo.com/v1/search": {error: Timeout}
      - label: "there is no connection"
        web: {}
    starter: |
      import requests

      URL = "https://geocoding-api.open-meteo.com/v1/search"

      response = requests.get(URL, params={"name": "Oslo"}, timeout=5)
      first = response.json()["results"][0]
      print(first["name"], first["latitude"], first["longitude"])
    solution: |
      import requests

      URL = "https://geocoding-api.open-meteo.com/v1/search"

      try:
          response = requests.get(URL, params={"name": "Oslo"}, timeout=5)
          first = response.json()["results"][0]
          print(first["name"], first["latitude"], first["longitude"])
      except requests.RequestException:
          print("No answer from the server.")
    after: >-
      One `except requests.RequestException` covers the timeout and the
      lost connection. On a real computer, the same code survives a train
      tunnel.
    checks:
      - expr: "err is None and lines == (['Oslo 59.91273 10.74609'] if raises(__import__('requests').get, 'https://geocoding-api.open-meteo.com/v1/search?name=Oslo', timeout=1) is None else ['No answer from the server.'])"
        pass: "It prints the place when the web works, and `No answer from the server.` when it fails"
        hint: "Put the request and the lines after it into `try:`, and add `except requests.RequestException:`."
        misconceptions:
          - when: "err == 'ReadTimeout'"
            say: "The server did not answer in 5 seconds, and nothing caught the `ReadTimeout`. Put the request into `try:` and catch `requests.RequestException` (or `requests.Timeout`)."
          - when: "err == 'ConnectionError'"
            say: "There is no connection, and nothing caught the `ConnectionError`. Catch `requests.RequestException`: it covers both problems."
          - when: "err in ('NameError', 'AttributeError')"
            say: "Write the name with its module, and check the spelling: `requests.RequestException`."
      - expr: "'except:' not in src.replace(' ', '') and 'exceptException' not in src.replace(' ', '') and 'exceptBaseException' not in src.replace(' ', '')"
        pass: "It catches only the errors of requests"
        hint: "Catch `requests.RequestException`, not every `Exception`: a bug in your code must still show its message."
    hints:
      - "Which lines can fail? The request, and the lines that need its answer."
      - "Indent those three lines under `try:`."
      - "Then `except requests.RequestException:` and the `print` of the message."

  # 7. EXERCISE: independent -------------------------------------------------
  - id: ex-get-json
    type: exercise
    fade: independent
    objective: O4
    title: One safe function for all requests
    prompt: |
      **Write `get_json(url, params)`.** It sends a GET request with these
      parameters and a timeout of 10 seconds.

      - It returns the JSON when the status is 200.
      - For another status, it prints `The server says 404.` (with the real
        code) and returns `None`.
      - When the request fails, it prints `No answer from the server.` and
        returns `None`.

      The three `print` lines at the end must give:

      ```
      {'answer': 42}
      The server says 404.
      None
      No answer from the server.
      None
      ```
    web:
      "https://api.example.com/ok": {json: {answer: 42}}
      "https://api.example.com/missing": {status: 404, json: {error: "not found"}}
      "https://api.example.com/broken": {status: 500, text: "Internal Server Error"}
      "https://api.example.com/slow": {error: Timeout}
    cases:
      - {}
      - label: "other answers from the server"
        web:
          "https://api.example.com/ok": {json: {answer: 7, unit: "cm"}}
          "https://api.example.com/missing": {status: 503, json: {error: "busy"}}
          "https://api.example.com/broken": {status: 500, text: "Internal Server Error"}
          "https://api.example.com/slow": {error: Timeout}
    starter: |
      import requests

      # Write get_json(url, params) here.


      print(get_json("https://api.example.com/ok", {"q": "test"}))
      print(get_json("https://api.example.com/missing", {}))
      print(get_json("https://api.example.com/slow", {}))
    solution: |
      import requests

      def get_json(url, params):
          try:
              response = requests.get(url, params=params, timeout=10)
          except requests.RequestException:
              print("No answer from the server.")
              return None
          if response.status_code != 200:
              print(f"The server says {response.status_code}.")
              return None
          return response.json()

      print(get_json("https://api.example.com/ok", {"q": "test"}))
      print(get_json("https://api.example.com/missing", {}))
      print(get_json("https://api.example.com/slow", {}))
    after: >-
      Every later program can use `get_json` and only check for `None`.
      The details of the web stay in one place.
    checks:
      - expr: "callable(ns.get('get_json')) and get_json('https://api.example.com/ok', {}) == __import__('requests').get('https://api.example.com/ok', timeout=1).json()"
        pass: "It returns the JSON when the status is 200"
        hint: "`return response.json()` at the end."
      - expr: "callable(ns.get('get_json')) and all(raises(get_json, u, {}) is None and get_json(u, {}) is None for u in ['https://api.example.com/missing', 'https://api.example.com/broken'])"
        pass: "An error code gives `None`"
        hint: "Check `response.status_code != 200` before you read the JSON."
        misconceptions:
          - when: "callable(ns.get('get_json')) and raises(get_json, 'https://api.example.com/broken', {}) == 'JSONDecodeError'"
            say: "The answer with code 500 is not JSON, so `.json()` fails. Check the status code first, and return `None` before `.json()`."
      - expr: "callable(ns.get('get_json')) and all(raises(get_json, u, {}) is None and get_json(u, {}) is None for u in ['https://api.example.com/slow', 'https://down.example.org/data'])"
        pass: "No answer, or no connection, gives `None` and no crash"
        hint: "Put `requests.get(...)` into `try:` and catch `requests.RequestException`."
        misconceptions:
          - when: "err in ('ReadTimeout', 'ConnectionError')"
            say: "The request failed, and nothing caught it. Catch `requests.RequestException` around `requests.get`."
      - expr: "err is None and len(lines) == 5 and lines[1] == f\"The server says {__import__('requests').get('https://api.example.com/missing', timeout=1).status_code}.\" and lines[2] == 'None' and lines[3] == 'No answer from the server.' and lines[4] == 'None'"
        pass: "The messages are exactly as asked"
        hint: "`print(f\"The server says {response.status_code}.\")` and `print(\"No answer from the server.\")`."
        misconceptions:
          - when: "len(lines) > 1 and lines[1] == 'No answer from the server.'"
            say: "For the code 404 the server did answer, but your program says that it did not. `raise_for_status()` raises `HTTPError`, a kind of `RequestException`, so your `except` catches it. Check `response.status_code` after the `try` instead."
      - expr: "requests_made and all(r['timeout'] for r in requests_made) and any(r['params'].get('q') == 'test' for r in requests_made)"
        pass: "Every request has a timeout and sends the parameters"
        hint: "`requests.get(url, params=params, timeout=10)`."
    hints:
      - "Start with `try:` around `response = requests.get(url, params=params, timeout=10)`."
      - "In `except requests.RequestException:`, print the message and `return None`."
      - "After the `try`: if `response.status_code != 200`, print the code and `return None`. Else `return response.json()`."


  # Keys ---------------------------------------------------------------------
  - id: keys
    type: theory
    objective: O6
    title: Keep the key out of the code
    body: |
      Many web APIs need a **key**: a secret text that says who is asking,
      and who pays. **Never write a key in your code.** Code gets shared,
      copied, pushed to GitHub and pasted into an AI assistant, and the key
      goes with it.

      Keep it in an **environment variable** instead: a setting of the
      terminal that your program reads when it runs.

      ```python
      import os

      key = os.environ.get("WEATHER_KEY")
      if not key:
          raise RuntimeError("Set WEATHER_KEY first.")
      params = {"q": "Lima", "appid": key}
      ```

      Set it in the terminal, before you run the program:

      - Windows (PowerShell): `$env:WEATHER_KEY = "your-key"`
      - macOS and Linux: `export WEATHER_KEY=your-key`

      Many projects keep their keys in a file `.env` that is listed in
      `.gitignore`, so git never sees it.
    keys:
      - code: "os.environ.get(\"NAME\")"
        means: "The value of the setting, or None when it is not set."
      - code: "$env:NAME = \"...\""
        means: "Set it for this PowerShell window."
      - code: ".env + .gitignore"
        means: "Keys in a file that git never sees."

  - id: ex-key
    type: exercise
    fade: debug
    objective: O6
    title: A key in the code
    prompt: |
      This program has the secret key of a weather service in its code.

      **Change `api_key()`**: it reads `WEATHER_KEY` from the environment,
      and raises a `RuntimeError` with a clear message when it is not set.
      Then delete the key from the code.

      The page sets `WEATHER_KEY` for this run, like your terminal would.
      It must print:

      ```text
      key found: True
      ```
    starter: |
      import os

      KEY = "sk_live_51HcX9fQ2"     # the key of the weather service


      def api_key():
          return KEY


      print("key found:", len(api_key()) > 0)
    solution: |
      import os


      def api_key():
          key = os.environ.get("WEATHER_KEY")
          if not key:
              raise RuntimeError("Set the environment variable WEATHER_KEY first.")
          return key


      print("key found:", len(api_key()) > 0)
    after: >-
      Now the code can be shared, and each person sets their own key. If a
      key ever was in code that you pushed, think of it as public: make a
      new key at the service.
    cases:
      - setup: "import os\nos.environ['WEATHER_KEY'] = 'demo-key'"
    checks:
      - expr: "callable(ns.get('api_key')) and (__import__('os').environ.__setitem__('WEATHER_KEY', 'k-1') or api_key()) == 'k-1'"
        pass: "api_key() reads WEATHER_KEY from the environment"
        hint: "`os.environ.get(\"WEATHER_KEY\")` gives the value of the setting."
      - expr: "callable(ns.get('api_key')) and (__import__('os').environ.pop('WEATHER_KEY', None) and False or raises(api_key)) == 'RuntimeError'"
        pass: "Without WEATHER_KEY, it raises a RuntimeError"
        hint: "`if not key: raise RuntimeError(\"...\")`."
      - expr: "'sk_live' not in src"
        pass: "The key is not in the code any more"
        hint: "Delete the line with `KEY = ...`."
      - expr: "lines == ['key found: True']"
        pass: "It prints key found: True"
        hint: "Keep the print."
    hints:
      - "`os` is already imported: `os.environ.get(\"WEATHER_KEY\")`."
      - "`.get` gives `None` when the setting is missing. Raise the error then."
      - "`key = os.environ.get(\"WEATHER_KEY\")`, `if not key: raise RuntimeError(...)`, `return key`. Delete `KEY = ...`."

  # 8. LOCAL -----------------------------------------------------------------
  - id: check-where
    type: local
    objective: O5
    title: Where is it?
    prompt: |
      **On your computer, write `where.py`.** It asks `Place: ` with
      `input()`, finds the place with the real API, and prints its name and
      country, and its latitude and longitude. The URL:

      ```
      https://geocoding-api.open-meteo.com/v1/search
      ```

      - Parameters `name` and `count` (1), and a timeout.
      - No such place: it prints a message like `No place called Xqzwvbn.`
      - The request fails: it prints a message, never a traceback.

      Set it up like a real project:

      1. A new folder `where` in `python-course`, with its own venv.
         Activate it.
      2. `pip install requests`.
      3. Download `check.py` **again**, into `where`.
      4. Write `where.py` and try it with a place you know.

      The check runs `where.py` three times: with Oslo, with a place that
      does not exist, and without internet. It needs internet itself.
    task: api
    needs: 4
    example:
      python: "3.14.7"
      os: Windows
      bits: "64"
      venv_exists: "yes"
      in_venv: "yes"
      venv_here: "yes"
      requests: "2.34.2"
      where_exists: "yes"
      where_requests: "yes"
      found_ok: "yes"
      found_lines: "2"
      found_country: "yes"
      missing_ok: "yes"
      missing_lines: "1"
      offline_ok: "yes"
      offline_lines: "1"
    checks:
      - expr: "report.get('in_venv') == 'yes' and report.get('venv_here') == 'yes' and report.get('requests', 'no') != 'no'"
        pass: "`requests` is installed in the venv of `where`"
        hint: "Make the venv in `where`, activate it, and run `pip install requests`."
        misconceptions:
          - when: "report.get('venv_exists') == 'no'"
            say: "There is no `.venv` in `where`. Run `python -m venv .venv` there and activate it."
          - when: "report.get('in_venv') == 'no'"
            say: "The venv is not active. Activate it, then run the check again."
          - when: "report.get('requests') == 'no'"
            say: "`requests` is not in this venv. With `(.venv)` in the prompt, run `pip install requests`."
      - expr: "report.get('where_exists') == 'yes' and report.get('where_requests') == 'yes'"
        pass: "`where.py` uses requests"
        hint: "`where.py` starts with `import requests`."
        misconceptions:
          - when: "report.get('where_exists') == 'no'"
            say: "There is no `where.py` in the folder. Save it in `where`, next to `check.py`."
      - expr: "report.get('found_ok') == 'yes' and report.get('found_country') == 'yes'"
        pass: "It finds Oslo and prints its country"
        hint: "Print `first[\"name\"]` and `first[\"country\"]` of the first result."
        misconceptions:
          - when: "report.get('found_ok') == 'timeout'"
            say: "`where.py` did not end. Does it ask `input()` more than once? It must ask one time only."
          - when: "report.get('found_ok') == 'no'"
            say: "`where.py` stops with an error for Oslo. Run `python where.py`, type Oslo, and read the last line of the message."
          - when: "report.get('found_country') == 'no' and report.get('offline_ok') == 'yes'"
            say: "`where.py` ends, but it does not print Norway for Oslo. Is your computer online? Does it print `first[\"country\"]`?"
      - expr: "report.get('missing_ok') == 'yes' and int(report.get('missing_lines', '0')) >= 1"
        pass: "A place that does not exist gives a message, not an error"
        hint: "Read the list with `data.get(\"results\", [])`, and print a message when it is empty."
        misconceptions:
          - when: "report.get('missing_ok') == 'no'"
            say: "`where.py` crashes when the place does not exist: that JSON has no `\"results\"`. Use `data.get(\"results\", [])`."
      - expr: "report.get('offline_ok') == 'yes' and int(report.get('offline_lines', '0')) >= 1"
        pass: "Without internet, it prints a message, not an error"
        hint: "Put the request into `try:` and catch `requests.RequestException`."
        misconceptions:
          - when: "report.get('offline_ok') == 'no'"
            say: "Without internet, `where.py` crashes. Put the request into `try:` and catch `requests.RequestException`, and print a message there."
    hints:
      - "Reuse `find` from this lesson, with `input(\"Place: \")` for the name."
      - "Try it yourself without internet: turn off Wi-Fi and run `python where.py`. It must print a message."
      - "Ask with `input()` one time only: the check types one place and nothing more."
    after: >-
      Your program talks to a real server, and it stays calm when the
      server or the internet does not. That is most of what a web client
      needs.

  # 9. QUIZ ------------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O4
    title: Check yourself
    items:
      - kind: mcq
        id: q-json
        objective: O2
        prompt: "What does `response.json()` give?"
        options:
          - text: "The answer as Python data"
            correct: true
            why: "Dictionaries, lists, numbers and texts: the same as `json.loads(response.text)`."
          - text: "A JSON file on the disk"
            why: "Nothing is saved. You get the data in memory."
          - text: "The status code"
            why: "That is `response.status_code`."
      - kind: mcq
        id: q-404-no-error
        objective: O3
        prompt: "The server answers `404`. Does `requests.get(...)` raise an error?"
        options:
          - text: "No, it returns the response"
            correct: true
            why: "An answer came, so the request worked: check `status_code`, or call `raise_for_status()`. Only you know if 404 is a problem."
          - text: "Yes, always an `HTTPError`"
            why: "Only `raise_for_status()` raises it."
          - text: "Yes, a `ConnectionError`"
            why: "That is for no connection at all."
      - kind: mcq
        id: q-catch
        objective: O4
        prompt: "Which `except` catches a timeout and a lost connection, but not a bug in your code?"
        options:
          - text: "`except requests.RequestException:`"
            correct: true
            why: "It is the parent of the errors of requests, and only of them."
          - text: "`except Exception:`"
            why: "That also hides your own bugs, for example a `KeyError`."
          - text: "`except requests.HTTPError:` for all"
            why: "That is only for error codes after `raise_for_status()`."
      - kind: mcq
        id: q-no-results
        objective: O3
        prompt: "The geocoding API finds no place. What is in its answer?"
        options:
          - text: "Status 200, without `\"results\"`"
            correct: true
            why: "So use `data.get(\"results\", [])`, not `data[\"results\"]`."
          - text: "Status 404, and an empty list"
            why: "This API answers 200 and leaves `results` out. Each API has its own way: read its docs."
          - text: "A `ConnectionError`"
            why: "The server answered, so the connection worked."
      - kind: mcq
        id: q-params
        objective: O2
        prompt: "Why use `params={\"name\": place}` instead of writing `\"?name=\" + place` into the URL?"
        options:
          - text: "requests writes the URL correctly"
            correct: true
            why: "Also for spaces and special letters: `São Paulo` must be written as `S%C3%A3o+Paulo` in a URL. requests does it for you."
          - text: "The server reads only `params`"
            why: "The server only sees the URL. `params` builds it safely."
          - text: "It makes the request faster"
            why: "The speed is the same."

  # 10. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O2
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-get
    objective: O2
    prompt: "Which call asks an API for `name=Oslo`, and waits at most 10 seconds?"
    options:
      - text: "`requests.get(URL, params=..., timeout=10)`"
        correct: true
        why: "With `params={\"name\": \"Oslo\"}`: `params` builds the URL, `timeout` limits the wait."
      - text: "`requests.get(URL, \"Oslo\", 10)` with no names"
        why: "The parameters and the timeout need their names."
      - text: "`requests.json(URL, name=\"Oslo\", wait=10)`"
        why: "`json()` is a method of the response."
  - kind: mcq
    id: r-200
    objective: O1
    prompt: "Which status code means that all went well?"
    options:
      - text: "200"
        correct: true
        why: "Codes from 400 up are problems."
      - text: "404"
        why: "404 means not found."
      - text: "500"
        why: "500 means the server failed."
  - kind: mcq
    id: r-parent
    objective: O4
    prompt: "What is `requests.RequestException`?"
    options:
      - text: "The parent of all errors of requests"
        correct: true
        why: "One `except` catches them all: `ConnectionError`, `Timeout` and `HTTPError` are kinds of it."
      - text: "The error for a status code of 400"
        why: "Error codes give `HTTPError`, and only with `raise_for_status()`."
      - text: "A function that sends a request"
        why: "It is a kind of error."
  - kind: mcq
    id: r-raise
    objective: O3
    prompt: "What does `response.raise_for_status()` do when the code is 200?"
    options:
      - text: "Nothing"
        correct: true
        why: "It raises `HTTPError` only for codes of 400 and more."
      - text: "It raises an error"
        why: "200 is OK, so there is nothing to raise."
      - text: "It prints the status"
        why: "It prints nothing."
  - kind: mcq
    id: r-timeout
    objective: O4
    prompt: "A program has no `timeout` in `requests.get`. The server never answers. What happens?"
    options:
      - text: "The program can wait forever"
        correct: true
        why: "Always give a timeout, for example `timeout=10`."
      - text: "requests stops after 10 seconds by itself"
        why: "requests has no timeout of its own."
      - text: "It raises `HTTPError`"
        why: "No answer means no status code."

  - kind: mcq
    id: r-key
    objective: O6
    prompt: "Where does the key of a web API belong?"
    options:
      - text: "In an environment variable, read with `os.environ.get`"
        correct: true
        why: "The code can be shared, and the key stays on your computer."
      - text: "In a variable at the top of the code, as a constant"
        why: "Then everyone who sees the code sees the key: on GitHub, in a chat, in an AI question."
      - text: "In a comment, so Python ignores it"
        why: "A comment is part of the code too, and it is shared with it."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-weather-status
    type: exercise
    fade: completion
    objective: O3
    title: Check the status first
    prompt: |
      A weather API answers `{"temp": 4.5}` for a city it knows, and the
      status **404** for a city it does not know. **Replace the two `___`**:
      give back `None` when the status is not 200, else the temperature.

      ```text
      4.5
      None
      ```
    web:
      "https://api.weather.test/now?city=Oslo":
        json: {temp: 4.5}
      "https://api.weather.test/now?city=Lima":
        json: {temp: 18.25}
      "https://api.weather.test/now":
        status: 404
        json: {error: unknown city}
    starter: |
      import requests

      URL = "https://api.weather.test/now"


      def temperature(city):
          response = requests.get(URL, params={"city": city}, timeout=5)
          if ___:
              return None
          return ___


      print(temperature("Oslo"))
      print(temperature("Atlantis"))
    solution: |
      import requests

      URL = "https://api.weather.test/now"


      def temperature(city):
          response = requests.get(URL, params={"city": city}, timeout=5)
          if response.status_code != 200:
              return None
          return response.json()["temp"]


      print(temperature("Oslo"))
      print(temperature("Atlantis"))
    after: >-
      For a 404 the body is an error, not data: reading `["temp"]` from it
      would raise a KeyError. Check the status before you read the JSON.
    checks:
      - expr: "callable(ns.get('temperature')) and temperature('Lima') == 18.25 and temperature('Oslo') == 4.5"
        pass: "It gives the temperature of a known city"
        hint: "`return response.json()[\"temp\"]`."
      - expr: "callable(ns.get('temperature')) and temperature('Nowhere') is None"
        pass: "An unknown city gives None"
        hint: "`if response.status_code != 200: return None`."
        misconceptions:
          - when: "callable(ns.get('temperature')) and raises(temperature, 'Nowhere') == 'KeyError'"
            say: "The 404 answer has no `\"temp\"`. Check `response.status_code` before you read the JSON."
      - expr: "lines == ['4.5', 'None']"
        pass: "It prints 4.5 and None"
        hint: "Keep the prints."
    hints:
      - "The status is in `response.status_code`."
      - "`if response.status_code != 200: return None`."
      - "Then `return response.json()[\"temp\"]`."
  - id: x-offline
    type: exercise
    fade: independent
    objective: O4
    title: No internet, no crash
    prompt: |
      **Write `fetch(url)`**: it gives back the JSON of the answer, or
      `None` when there is no connection or no answer in time. Then the
      program prints what it got. Use a timeout of 5 seconds.

      ```text
      None
      ```
    web: {}
    starter: |
      import requests

      # Your function here.


      print(fetch("https://api.weather.test/now?city=Oslo"))
    solution: |
      import requests


      def fetch(url):
          try:
              response = requests.get(url, timeout=5)
          except (requests.ConnectionError, requests.Timeout):
              return None
          return response.json()


      print(fetch("https://api.weather.test/now?city=Oslo"))
    after: >-
      Without internet, `requests.get` raises a ConnectionError; a slow
      server raises a Timeout. Catching both keeps the program alive. The
      check also ran it with a working web.
    cases:
      - {}
      - label: "the web works"
        web:
          "https://api.weather.test/now?city=Oslo":
            json: {temp: 4.5}
      - label: "the server is too slow"
        web:
          "https://api.weather.test/now?city=Oslo":
            error: Timeout
    checks:
      - expr: "err is None and lines[-1:] in (['None'], [\"{'temp': 4.5}\"])"
        pass: "It never crashes, and prints the JSON or None"
        hint: "Put the request into `try:` and catch `requests.ConnectionError` and `requests.Timeout`."
        misconceptions:
          - when: "err in ('ConnectionError', 'ReadTimeout', 'Timeout')"
            say: "The request failed and the program stopped. Catch the error with `try` and `except`."
      - expr: "all(r['timeout'] for r in requests_made)"
        pass: "The request has a timeout"
        hint: "`requests.get(url, timeout=5)`."
    hints:
      - "The request goes into a `try:` block."
      - "`except (requests.ConnectionError, requests.Timeout): return None`."
      - "Else `return response.json()`."
