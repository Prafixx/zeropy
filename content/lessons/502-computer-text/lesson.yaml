id: computer-text
order: 502
title: Text, colours and hex
summary: A computer only stores numbers. See how letters, emoji and colours become numbers - and bytes - and read the short way to write bytes, hexadecimal.
minutes: 40
outcomes: []

objectives:
  - id: O1
    text: Turn characters into numbers and back with ord() and chr(), and explain the order of sorted text
  - id: O2
    text: Encode text as UTF-8 bytes and decode it, and know why the number of bytes can differ from len()
  - id: O3
    text: "Read and write hexadecimal with hex(), int(text, 16) and format(), as in colours like #1E90FF"

steps:
  # 1. THEORY ----------------------------------------------------------------
  - id: codes
    type: theory
    objective: O1
    title: Letters are numbers
    body: |
      Memory holds only bits, so every character has a **number**: its
      **code**. The first 128 codes are **ASCII**, from the 1960s:

      ```text
      " " 32    "0" 48   "A" 65   "a" 97
                "1" 49   "B" 66   "b" 98
                ...      ...      ...
      ```

      Python gives the code of a character with `ord()`, and the character
      of a code with `chr()`:

      ```python
      ord("A")     # 65
      chr(97)      # "a"
      ```

      Today the codes are **Unicode**: more than 150 000 characters from
      all languages, and emoji. `ord("é")` is 233, `ord("€")` is 8364.

      Text is compared by these codes. All capitals (65 to 90) come before
      all small letters (97 to 122): so `"Zoe" < "anna"` is `True`, and
      `sorted()` puts `"Apple"` before `"banana"`.
    keys:
      - code: "ord(\"A\")"
        means: "The code of a character: 65."
      - code: "chr(65)"
        means: "The character of a code: \"A\"."
      - code: "\"Z\" < \"a\""
        means: "True: capitals have smaller codes."

  # 2. DEMO -----------------------------------------------------------------
  - id: table
    type: demo
    visual: none
    objective: O1
    title: The codes of a word
    intro: |
      Press **Run**: each character of a word with its code. Then try your
      own name, an accent, or an emoji.
    code: |
      word = "Hi Zoe!"
      for ch in word:
          print(repr(ch), ord(ch))

      print(chr(ord("a") + 2))
      print(sorted(["banana", "Apple", "cherry", "apple"]))
    experiments:
      - text: "Run it as it is."
        expr: "err is None and lines[0] == \"'H' 72\""
      - text: "Put your own name into `word`."
        expr: "err is None and 'Hi Zoe!' not in src"
      - text: "Add an `é` or `€` to the word. How big is its code?"
        expr: "err is None and any(int(l.split()[-1]) > 127 for l in lines[:-2] if l.split()[-1].isdigit())"
    investigate:
      - kind: mcq
        id: i-next
        prompt: "Why does `chr(ord(\"a\") + 2)` give `c`?"
        options:
          - text: "The letters have codes in a row"
            correct: true
            why: "a 97, b 98, c 99. So adding to a code moves through the alphabet."
          - text: "Python knows the alphabet"
            why: "Python only adds numbers. The codes are in order."
          - text: "It is a coincidence"
            why: "ASCII put the letters in order on purpose."
      - kind: mcq
        id: i-apple
        prompt: "In the sorted list, why does `Apple` come before `apple`?"
        options:
          - text: "`A` (65) has a smaller code than `a` (97)"
            correct: true
            why: "Text is compared code by code. For an order without case: `sorted(words, key=str.lower)`."
          - text: "Apple is a name"
            why: "Python does not know names. It compares codes."
          - text: "The first one in the list comes first"
            why: "`sorted` changes the order."

  # 3. EXERCISE: completion --------------------------------------------------
  - id: ex-shift
    type: exercise
    fade: completion
    objective: O1
    title: A secret message
    prompt: |
      Julius Caesar hid messages by moving each letter `k` places on in the
      alphabet: with `k = 3`, `a` becomes `d`, and `z` goes round to `c`.

      **Complete `shift(text, k)`** for small letters. Other characters
      stay as they are.

      ```text
      khoor, crh
      hello, zoe
      ```
    starter: |
      def shift(text, k):
          out = ""
          for ch in text:
              if "a" <= ch <= "z":
                  place = ord(ch) - ord("a")        # 0 for a, 25 for z
                  new_place = ___                    # move k places, go round after z
                  out += ___
              else:
                  out += ch
          return out


      secret = shift("hello, zoe", 3)
      print(secret)
      print(shift(secret, -3))
    solution: |
      def shift(text, k):
          out = ""
          for ch in text:
              if "a" <= ch <= "z":
                  place = ord(ch) - ord("a")        # 0 for a, 25 for z
                  new_place = (place + k) % 26       # move k places, go round after z
                  out += chr(new_place + ord("a"))
              else:
                  out += ch
          return out


      secret = shift("hello, zoe", 3)
      print(secret)
      print(shift(secret, -3))
    after: >-
      `% 26` makes the places go round: 25 + 3 is 28, and 28 % 26 is 2,
      the place of `c`. This is not safe encryption today (only 25 keys to
      try), but it is the same idea as the codes behind every letter.
    checks:
      - expr: "callable(ns.get('shift')) and shift('abc', 1) == 'bcd' and shift('hello', 3) == 'khoor'"
        pass: "Letters move k places"
        hint: "`new_place = (place + k) % 26`, then `chr(new_place + ord(\"a\"))`."
      - expr: "callable(ns.get('shift')) and shift('xyz', 3) == 'abc' and shift('abc', -1) == 'zab'"
        pass: "They go round after z, and back before a"
        hint: "`% 26` brings the place back into 0 to 25."
        misconceptions:
          - when: "callable(ns.get('shift')) and shift('z', 1) == '{'"
            say: "After z comes `{`, the next code. Use `% 26` to go round to `a`."
      - expr: "callable(ns.get('shift')) and shift('Hi, 2 you!', 1) == 'Hj, 2 zpv!'"
        pass: "Other characters stay"
        hint: "Keep the `else` part."
      - expr: "err is None and lines == ['khoor, crh', 'hello, zoe']"
        pass: "It hides the message and gets it back"
        hint: "Keep the two prints."
    hints:
      - "`place` is 0 to 25. Add `k`."
      - "After 25 it must go round to 0: `(place + k) % 26`."
      - "Back to a character: `chr(new_place + ord(\"a\"))`."

  # 4. THEORY ----------------------------------------------------------------
  - id: utf8
    type: theory
    objective: O2
    title: From characters to bytes
    body: |
      A byte holds 0 to 255, but codes go up to more than 100 000. So text
      is stored with an **encoding**: rules that turn each code into bytes.
      Almost everyone uses **UTF-8**:

      - ASCII characters (codes below 128) take **1 byte**.
      - `é` takes 2 bytes, `€` 3 bytes, an emoji 4 bytes.

      ```python
      data = "café".encode("utf-8")
      print(data)          # b'caf\xc3\xa9'
      print(len("café"))   # 4 characters
      print(len(data))     # 5 bytes
      print(data.decode("utf-8"))    # café
      ```

      `encode` gives **bytes**: a row of numbers 0 to 255. `b'...'` shows
      them; a byte that is not a plain character shows as `\x` and two
      hex digits. `decode` turns bytes into text again.

      Read bytes with the **wrong** encoding, and you get rubbish:
      `b'caf\xc3\xa9'.decode("latin-1")` gives `cafÃ©`. You have seen this on
      web pages. That is why you write `encoding="utf-8"` when you open
      files.
    keys:
      - code: "text.encode(\"utf-8\")"
        means: "Text to bytes."
      - code: "data.decode(\"utf-8\")"
        means: "Bytes to text."
      - code: "len(text) / len(data)"
        means: "Characters / bytes: not always the same."

  # 5. EXERCISE: debug -------------------------------------------------------
  - id: ex-bytes
    type: exercise
    fade: debug
    objective: O2
    title: Too long for the field
    prompt: |
      A database field takes at most **6 bytes**. `fits(text)` should say if
      a text fits. It says `True` for `"€€€"`, but those are 9 bytes. **Fix
      it**:

      ```text
      hello True
      café True
      €€€ False
      ```
    starter: |
      LIMIT = 6


      def fits(text):
          return len(text) <= LIMIT


      for text in ["hello", "café", "€€€"]:
          print(text, fits(text))
    solution: |
      LIMIT = 6


      def fits(text):
          return len(text.encode("utf-8")) <= LIMIT


      for text in ["hello", "café", "€€€"]:
          print(text, fits(text))
    after: >-
      `len(text)` counts characters, the database counts bytes. With
      English text they are the same, so this bug often hides until the
      first name with an accent.
    checks:
      - expr: "callable(ns.get('fits')) and fits('€€€') is False and fits('😀😀') is False and fits('ééé') is True and fits('éééé') is False"
        pass: "It counts bytes, not characters"
        hint: "`len(text.encode(\"utf-8\"))`."
      - expr: "callable(ns.get('fits')) and fits('abcdef') is True and fits('abcdefg') is False and fits('') is True"
        pass: "Plain text still works"
        hint: "Keep `<= LIMIT`."
      - expr: "err is None and lines == ['hello True', 'café True', '€€€ False']"
        pass: "It prints the three lines"
        hint: "Keep the loop."
    hints:
      - "What does the database count: characters or bytes?"
      - "`text.encode(\"utf-8\")` gives the bytes."
      - "`return len(text.encode(\"utf-8\")) <= LIMIT`."

  # 6. THEORY ----------------------------------------------------------------
  - id: hex
    type: theory
    objective: O3
    title: Hexadecimal
    body: |
      Binary is long: `11111111`. **Hexadecimal** (hex) has 16 digits:
      `0`-`9`, then `a`=10 up to `f`=15. One hex digit is exactly 4 bits,
      so **two hex digits are one byte**:

      ```text
      binary   1111 1111    0001 1110
      hex         f    f       1    e
      decimal       255           30
      ```

      ```python
      hex(255)               # '0xff'
      int("ff", 16)          # 255
      format(30, "02x")      # '1e'  (2 digits, small letters)
      format(30, "02X")      # '1E'  (capitals)
      ```

      You meet hex in colours: `#1E90FF` is three bytes, **red** `1E`
      (30), **green** `90` (144) and **blue** `FF` (255). Each from 0 to
      255: `#000000` is black, `#FFFFFF` white, `#FF0000` red.
    keys:
      - code: "int(\"ff\", 16)"
        means: "Hex text to a number: 255."
      - code: "format(n, \"02X\")"
        means: "A number as two hex digits."
      - code: "#RRGGBB"
        means: "A colour: red, green, blue, one byte each."

  # 7. EXERCISE: independent -------------------------------------------------
  - id: ex-colour
    type: exercise
    fade: independent
    objective: O3
    title: Colours both ways
    prompt: |
      **Write two functions:**

      - `to_rgb(colour)`: from `"#1E90FF"` to the tuple `(30, 144, 255)`.
      - `to_hex(r, g, b)`: from `30, 144, 255` to `"#1E90FF"` (capitals).

      ```text
      (30, 144, 255)
      #1E90FF
      #FF8000
      ```
    starter: |
      # Your functions here


      print(to_rgb("#1E90FF"))
      print(to_hex(30, 144, 255))
      print(to_hex(255, 128, 0))
    solution: |
      def to_rgb(colour):
          return int(colour[1:3], 16), int(colour[3:5], 16), int(colour[5:7], 16)


      def to_hex(r, g, b):
          return f"#{r:02X}{g:02X}{b:02X}"


      print(to_rgb("#1E90FF"))
      print(to_hex(30, 144, 255))
      print(to_hex(255, 128, 0))
    after: >-
      Two hex digits for each byte, always: that is why `02` matters. Without
      it, `to_hex(0, 0, 255)` would give `#00FF`, which is not a colour.
    checks:
      - expr: "callable(ns.get('to_rgb')) and to_rgb('#1E90FF') == (30, 144, 255) and to_rgb('#000000') == (0, 0, 0) and to_rgb('#ff8000') == (255, 128, 0)"
        pass: "to_rgb reads the three bytes"
        hint: "`int(colour[1:3], 16)` is the red byte. Then `[3:5]` and `[5:7]`."
      - expr: "callable(ns.get('to_hex')) and to_hex(30, 144, 255) == '#1E90FF' and to_hex(255, 255, 255) == '#FFFFFF'"
        pass: "to_hex writes the colour"
        hint: "`f\"#{r:02X}{g:02X}{b:02X}\"`."
        misconceptions:
          - when: "callable(ns.get('to_hex')) and to_hex(30, 144, 255) == '#1e90ff'"
            say: "Small letters. Use `X` (capital) in the format: `02X`."
      - expr: "callable(ns.get('to_hex')) and to_hex(0, 0, 255) == '#0000FF' and to_hex(1, 2, 3) == '#010203'"
        pass: "Always two digits per byte"
        hint: "`02X`: two places, with a zero in front."
      - expr: "callable(ns.get('to_rgb')) and callable(ns.get('to_hex')) and all(to_rgb(to_hex(*c)) == c for c in [(12, 200, 7), (0, 255, 128)])"
        pass: "There and back gives the same colour"
        hint: "Check both functions with the same colour."
    hints:
      - "A colour text has `#` at place 0, then two characters per byte."
      - "`to_rgb`: `int(colour[1:3], 16)`, `int(colour[3:5], 16)`, `int(colour[5:7], 16)`."
      - "`to_hex`: `return f\"#{r:02X}{g:02X}{b:02X}\"`."

  # 8. QUIZ -----------------------------------------------------------------
  - id: quiz
    type: quiz
    objective: O2
    title: Check yourself
    items:
      - kind: predict
        id: q-len
        objective: O2
        code: |
          word = "café"
          print(len(word))
          print(len(word.encode("utf-8")))
          print(ord("é") > 127)
        explain: "4 characters, but é needs 2 bytes in UTF-8: 5 bytes. Its code, 233, is above the 128 ASCII codes."
      - kind: mcq
        id: q-sort
        objective: O1
        prompt: "Why is `\"Zebra\" < \"apple\"` True?"
        options:
          - text: "Capitals have smaller codes"
            correct: true
            why: "Z is 90, a is 97: all capitals come before the small letters. Text is compared code by code."
          - text: "Z is the last letter"
            why: "By code, all capitals come before all small letters."
          - text: "Shorter words come first"
            why: "\"apple\" and \"Zebra\" have the same length."
      - kind: mcq
        id: q-mojibake
        objective: O2
        prompt: "A web page shows `cafÃ©` instead of `café`. What went wrong?"
        options:
          - text: "UTF-8 bytes were read with another encoding"
            correct: true
            why: "The 2 bytes of é became 2 wrong characters."
          - text: "The word was typed with a wrong key"
            why: "The bytes are right, the reading is wrong."
          - text: "The font of the page has no letter é"
            why: "A missing font shows boxes, not other letters."
      - kind: mcq
        id: q-hex
        objective: O3
        prompt: "What is the colour `#00FF00`?"
        options:
          - text: "Green"
            correct: true
            why: "Red 0, green 255, blue 0: two hex digits per colour, 00, FF, 00."
          - text: "Red"
            why: "Red would be `#FF0000`."
          - text: "White"
            why: "White is `#FFFFFF`: all three at 255."

  # 9. REVIEW ---------------------------------------------------------------
  - id: review
    type: review
    objective: O1
    title: From memory
    count: 5

review:
  - kind: mcq
    id: r-ord
    objective: O1
    prompt: "What does `ord(\"B\")` give?"
    options:
      - text: "66, the code of B"
        correct: true
        why: "A is 65, B is 66."
      - text: "2, its place in the alphabet"
        why: "`ord` gives the code."
      - text: "\"b\""
        why: "That is `\"B\".lower()`."
  - kind: mcq
    id: r-utf8
    objective: O2
    prompt: "How many bytes does `€` take in UTF-8?"
    options:
      - text: "3"
        correct: true
        why: "ASCII 1, é 2, € 3, emoji 4."
      - text: "1"
        why: "Only codes below 128 take 1 byte."
      - text: "8"
        why: "8 is bits in one byte."
  - kind: mcq
    id: r-encode
    objective: O2
    prompt: "What does `\"hi\".encode(\"utf-8\")` give?"
    options:
      - text: "The bytes `b'hi'`"
        correct: true
        why: "`decode` turns them back into text."
      - text: "A secret code"
        why: "It is not secret: only the bytes of the text."
      - text: "The text \"hi\" again"
        why: "It gives bytes, not text."
  - kind: mcq
    id: r-hexbyte
    objective: O3
    prompt: "Why do two hex digits make one byte?"
    options:
      - text: "One hex digit is 4 bits; a byte is 8 bits"
        correct: true
        why: "16 values per digit: 16 × 16 = 256."
      - text: "Because hex has two letters per digit"
        why: "Hex has 16 digits, 0-9 and a-f."
      - text: "It is a rule of colours"
        why: "It is true for every byte."
  - kind: mcq
    id: r-int16
    objective: O3
    prompt: "What is `int(\"1a\", 16)`?"
    options:
      - text: "26"
        correct: true
        why: "1 × 16 + 10 (a is 10)."
      - text: "11"
        why: "The first digit is worth 16, not 10."
      - text: "An error"
        why: "a is a hex digit."

# "Practice more": extra exercises, not shown in the lesson (practice page).
extra:
  - id: x-place
    type: exercise
    fade: completion
    objective: O1
    title: Place in the alphabet
    prompt: |
      **Replace `___`** so that `place(ch)` gives the place of a small
      letter in the alphabet: 1 for `a`, 26 for `z`.

      ```text
      1
      26
      ```
    starter: |
      def place(ch):
          return ord(ch) - ___ + 1


      print(place("a"))
      print(place("z"))
    solution: |
      def place(ch):
          return ord(ch) - ord("a") + 1


      print(place("a"))
      print(place("z"))
    after: >-
      The small letters have codes one after the other, from 97 to 122. So
      the distance to `ord("a")` tells the place, without a table of 26.
    checks:
      - expr: "callable(ns.get('place')) and [place(c) for c in 'abcdefghijklmnopqrstuvwxyz'] == list(range(1, 27))"
        pass: "It gives the place of every small letter"
        hint: "Subtract the code of `a`: `ord(\"a\")`."
      - expr: "'97' not in src"
        pass: "It uses ord(\"a\"), not the number 97"
        hint: "`ord(\"a\")` says what it means. 97 is a magic number."
      - expr: "lines == ['1', '26']"
        pass: "It prints 1 and 26"
        hint: "Keep the prints."
    hints:
      - "`ord(\"a\")` is the code of `a`."
      - "`ord(\"c\") - ord(\"a\")` is 2, so add 1 for the place."
      - "`return ord(ch) - ord(\"a\") + 1`."
  - id: x-byte-sizes
    type: exercise
    fade: independent
    objective: O2
    title: Bytes for each character
    prompt: |
      **Write `byte_sizes(text)`**: a list with the number of UTF-8 bytes of
      each character of `text`.

      ```text
      [1, 2, 3]
      [1, 1]
      ```
    starter: |
      # Your function here.


      print(byte_sizes("aé€"))
      print(byte_sizes("hi"))
    solution: |
      def byte_sizes(text):
          return [len(ch.encode("utf-8")) for ch in text]


      print(byte_sizes("aé€"))
      print(byte_sizes("hi"))
    after: >-
      English letters need one byte, accents two, the euro sign three, and
      most emoji four. That is why `len(text)` and the size of a file can
      differ.
    checks:
      - expr: "callable(ns.get('byte_sizes')) and byte_sizes('aé€') == [1, 2, 3] and byte_sizes('') == [] and byte_sizes('ñ1🙂') == [2, 1, 4]"
        pass: "It gives the bytes of each character"
        hint: "For each character: `len(ch.encode(\"utf-8\"))`."
        misconceptions:
          - when: "callable(ns.get('byte_sizes')) and raises(byte_sizes, 'aé') is None and byte_sizes('aé') == [1, 1]"
            say: "That is the length of each character as text: always 1. Encode it first, then count the bytes."
      - expr: "lines == ['[1, 2, 3]', '[1, 1]']"
        pass: "It prints [1, 2, 3] and [1, 1]"
        hint: "Keep the prints."
    hints:
      - "Loop over the characters of the text."
      - "`ch.encode(\"utf-8\")` gives the bytes of one character."
      - "`[len(ch.encode(\"utf-8\")) for ch in text]`."
