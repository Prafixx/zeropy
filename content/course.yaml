# Curriculum map. The home page renders this file. Reasoning: docs/curriculum.md
title: Python from zero
outcomes:
  - Write, run and debug your own programs
  - Read error messages and the official documentation
  - Use the standard library and third-party packages
  - Work with files, JSON and web APIs
  - Model problems with functions and classes
  - Write basic tests
  - Use git to save and share your work
  - Package a small desktop app

modules:
  - title: Start
    goal: Run your first code. Store and use values.
    lessons:
      - { id: first-program, title: Your first program }
      - { id: variables, title: Variables }
      - { id: numbers-and-text, title: Numbers and text }
      - { id: input-and-conversion, title: Input and conversion }

  - title: Decisions and loops
    goal: Make the program choose and repeat.
    lessons:
      - { id: booleans, title: True and False }
      - { id: if-else, title: "if, elif, else" }
      - { id: while-loops, title: while loops }
      - { id: for-loops, title: for and range }
      - { id: debugging-1, title: Reading error messages }
      - { id: project-guessing-game, title: "Project: guessing game", kind: project }

  - title: Collections
    goal: Work with many values at once.
    lessons:
      - { id: lists, title: Lists }
      - { id: loop-patterns, title: Loop patterns }
      - { id: names-and-objects, title: Names and objects }
      - { id: dictionaries, title: Dictionaries }
      - { id: tuples-and-sets, title: Tuples and sets }
      - { id: strings, title: Text in depth }
      - { id: match-case, title: match and case }
      - { id: project-word-counter, title: "Project: word counter", kind: project }

  - title: Functions
    goal: Give names to actions. Split big problems.
    lessons:
      - { id: functions, title: Define and call }
      - { id: parameters-and-return, title: "Parameters, return, scope" }
      - { id: flexible-calls, title: "zip, *args and **kwargs" }
      - { id: functions-as-values, title: Functions as values }
      - { id: decomposition, title: Split a problem }
      - { id: recursion, title: Recursion }
      - { id: type-hints, title: Type hints }
      - { id: reading-docs, title: Reading the docs }
      - { id: standard-library, title: Modules and the standard library }
      - { id: own-modules, title: Your own modules and packages }
      - { id: project-text-adventure, title: "Project: text adventure", kind: project }

  - title: Files, data and errors
    goal: Keep data between runs. Handle things that fail.
    lessons:
      - { id: files, title: Files and paths }
      - { id: json, title: JSON }
      - { id: exceptions, title: Exceptions }
      - { id: csv-and-comprehensions, title: CSV and comprehensions }
      - { id: generators, title: Iterators and generators }
      - { id: regex, title: Patterns with regular expressions }
      - { id: decorators, title: Decorators and context managers }
      - { id: project-expense-tracker, title: "Project: expense tracker", kind: project }

  - title: Your own machine
    goal: Leave the browser. Work like a developer.
    lessons:
      - { id: local-setup, title: Install Python and an editor }
      - { id: venv-and-pip, title: Packages with venv and pip }
      - { id: git, title: Git }
      - { id: web-apis, title: Web APIs }
      - { id: project-weather-tool, title: "Project: weather tool", kind: project }

  - title: Classes and tests
    goal: Model things. Prove that your code works.
    lessons:
      - { id: classes-and-objects, title: Classes and objects }
      - { id: methods-and-state, title: Methods and state }
      - { id: composition-and-dataclasses, title: Composition and dataclasses }
      - { id: inheritance, title: "Inheritance and super()" }
      - { id: classes-in-depth, title: Classes in depth }
      - { id: special-methods, title: Properties and special methods }
      - { id: exceptions-in-depth, title: Exceptions in depth }
      - { id: pytest, title: Tests with pytest }
      - { id: debugging-2, title: The debugger }
      - { id: ai-assistant, title: Working with an AI assistant }

  - title: Desktop app
    goal: Build, test and package your own app.
    lessons:
      - { id: tkinter, title: Windows and buttons }
      - { id: app-structure, title: Structure of an app }
      - { id: packaging, title: Package with PyInstaller }
      - { id: capstone, title: "Capstone: your own app", kind: project }

# Paths after Python. A path opens when its `needs` are done and not weak
# (src/engine/paths.ts), or when the learner opens it by hand.
paths:
  - id: linux
    title: Linux and the command line
    short: Linux
    goal: Work in the terminal, like on a Raspberry Pi or a server.
    needs: [functions, files]
    modules:
      - title: The command line
        goal: Move around, make and change files, find what you need, run scripts.
        lessons:
          - { id: linux-terminal, title: The terminal }
          - { id: linux-files, title: Files and folders }
          - { id: linux-text, title: Read and search text }
          - { id: linux-scripts, title: "Permissions, scripts and sudo" }
          - { id: linux-bash, title: Scripts that decide }
          - { id: linux-services, title: "Processes, services and logs" }
          - { id: linux-archives, title: "Archives, links and special files" }
          - { id: linux-users, title: Network and users }
          - { id: linux-project, title: "Project: tidy up a Pi", kind: project }
  - id: pi
    title: Raspberry Pi and electronics
    short: Pi
    goal: Light LEDs, read buttons and sensors, and build small machines with Python.
    needs: [classes-and-objects, linux-terminal]
    modules:
      - title: Physical computing
        goal: Wire parts safely and control them from Python with gpiozero.
        lessons:
          - { id: pi-meet, title: Meet the Raspberry Pi }
          - { id: pi-led, title: Light an LED }
          - { id: pi-button, title: Buttons and events }
          - { id: pi-sensors, title: "Brightness, sound and distance" }
          - { id: pi-light, title: "Light, motion and knobs" }
          - { id: pi-motors, title: Motors and a robot }
          - { id: pi-project, title: "Project: a pedestrian crossing", kind: project }
      - title: A real Raspberry Pi
        goal: Set up a real Pi, keep it healthy, and work on it from your PC.
        lessons:
          - { id: pi-setup, title: Set up a real Pi }
          - { id: pi-remote, title: A Pi without a screen }
  - id: data
    title: Data and AI basics
    short: Data
    goal: Describe data, draw charts, and build your first AI models, with numpy.
    needs: [csv-and-comprehensions]
    modules:
      - title: Data
        goal: Describe a table of data, calculate with numpy, and show it in charts.
        lessons:
          - { id: data-basics, title: Describe data }
          - { id: data-numpy, title: Arrays with numpy }
          - { id: data-charts, title: Charts }
      - title: First models
        goal: Let the computer learn a rule from examples, measure it, and test it on new data.
        lessons:
          - { id: data-line, title: "A first model: a straight line" }
          - { id: data-neighbours, title: "Sort into classes: nearest neighbours" }
          - { id: data-real, title: "The real tools: pandas and scikit-learn" }
  - id: web
    title: Networks and the web
    short: Web
    goal: Know how the web works, and build your own web server and API with Flask.
    needs: [web-apis]
    modules:
      - title: Your own web server
        goal: Read URLs and HTTP messages, and answer them with Flask.
        lessons:
          - { id: web-how, title: How the web works }
          - { id: web-flask, title: Your first web server }
          - { id: web-forms, title: Forms and questions }
          - { id: web-templates, title: Pages from templates }
          - { id: web-api, title: Your own JSON API }
          - { id: web-project, title: "Project: a reading list", kind: project }
          - { id: web-real, title: A real server on your computer and your Pi }
  - id: computer
    title: How computers work
    short: Computer
    goal: See what is inside - bits, text as numbers, logic gates, memory and a tiny CPU that you build yourself.
    needs: [functions, dictionaries]
    modules:
      - title: Inside the computer
        goal: From single bits to a working CPU, all in Python.
        lessons:
          - { id: computer-bits, title: Bits and bytes }
          - { id: computer-text, title: "Text, colours and hex" }
          - { id: computer-logic, title: Logic gates }
          - { id: computer-numbers, title: The limits of numbers }
          - { id: computer-memory, title: Memory }
          - { id: computer-cpu, title: "Project: a tiny CPU", kind: project }
